name: Build Owlyshield Predict DLL

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - 'OpenEDR/owlyshield_predict/**'
      - '.github/workflows/owlyshield-predict.yml'
  pull_request:
    branches: ["**"]
    paths:
      - 'OpenEDR/owlyshield_predict/**'
      - '.github/workflows/owlyshield-predict.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  pull-requests: write

jobs:
  build-windows:
    name: Build Windows x64 DLL
    runs-on: windows-latest
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "OpenEDR/owlyshield_predict -> target"

      - name: Build owlyshield_predict (Release)
        working-directory: OpenEDR/owlyshield_predict
        run: cargo build --release --verbose

      - name: Copy owlyshield_ransom.dll to edrgui
        shell: pwsh
        run: |
          Copy-Item OpenEDR/owlyshield_predict/target/release/owlyshield_ransom.dll -Destination OpenEDR/edrgui/owlyshield_ransom.dll -Force

      - name: Create Pull Request with owlyshield_ransom.dll
        if: github.event_name != 'pull_request' && !startsWith(github.ref_name, 'auto-update-')
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(owlyshield): update owlyshield_ransom.dll in edrgui"
          title: "Update owlyshield_ransom.dll in edrgui"
          body: "Automated build of owlyshield_ransom.dll placed into OpenEDR/edrgui folder."
          add-paths: OpenEDR/edrgui/owlyshield_ransom.dll
          branch: "auto-update-owlyshield-predict"
          base: ${{ github.ref_name }}
          delete-branch: true
          labels: binaries, automated-pr, owlyshield, development-version
