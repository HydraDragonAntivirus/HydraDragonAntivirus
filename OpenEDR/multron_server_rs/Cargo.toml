[package]
name = "multron_server_rs"
version = "0.1.0"
edition = "2024"
authors = ["Emirhan Ucan"]
description = "Native Rust scan server for Multron Win Cleaner with embedded dashboard and direct OpenEDR static engine integration"

[[bin]]
name = "multron_server"
path = "src/main.rs"

[features]
# analyzer::analyze_light, for tlsh_builder (it includes src/analyzer.rs by path and turns
# this on in its own Cargo.toml). Off for the server.
analyze-light = []

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
tower-http = { version = "0.5", features = ["cors"] }

openedr_static = { path = "../openedr_static" }
# Analyst signature room: ClamAV-format and HydraDragonSig rules kept apart from the
# shipped databases (same crates openedr_static already builds).
hydradragonclamav = { path = "../owlyshield_predict/hydradragonclamav" }
hydradragonsig = { path = "../../hydradragonsig", default-features = false }
# TLSH (Trend Micro similarity digest), output verified identical to the reference
# C++ implementation. Pinned: the crate is pre-1.0.
fast-tlsh = "=0.1.10"
# APK classes.dex extraction for the DEX TLSH (already in the dependency tree).
flate2 = "1"
lzma-rust2 = "0.21"
url = "2.5"
