name: webdemo
on:
  push:
    branches: [development-version]
    paths:
      - "OpenEDR/openedr_web/**"
      - "docs/**"
      - ".github/workflows/webdemo.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build WASM (release)
        working-directory: OpenEDR/openedr_web
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Assemble site
        run: |
          WASM=OpenEDR/openedr_web/target/wasm32-unknown-unknown/release/openedr_web.wasm
          test -f "$WASM" || { echo "missing $WASM"; find OpenEDR/openedr_web/target -name '*.wasm' 2>/dev/null; exit 1; }
          rm -rf _site && mkdir -p _site
          cp -r docs/* _site/
          mkdir -p _site/webdemo/models _site/webdemo/hash_rules _site/webdemo/vendor
          cp OpenEDR/openedr_web/www/index.html OpenEDR/openedr_web/www/app.js _site/webdemo/
          cp OpenEDR/openedr_web/www/vendor/README.txt _site/webdemo/vendor/
          cp "$WASM" _site/webdemo/openedr_web.wasm
          # Optional runtime data: copy whatever is tracked, never fail the deploy.
          for f in pe_trees.bin js_trees.bin url_trees.bin; do
            if [ -f "OpenMalwareScannerPortable/models/$f" ]; then
              cp "OpenMalwareScannerPortable/models/$f" _site/webdemo/models/
            else
              echo "skip missing models/$f"
            fi
          done
          if [ ! -f _site/webdemo/models/url_trees.bin ] && [ -f hydradragon_ml_models/url_trees.bin ]; then
            cp hydradragon_ml_models/url_trees.bin _site/webdemo/models/
            echo "url_trees.bin from hydradragon_ml_models/"
          fi
          if [ -f OpenMalwareScannerPortable/hash_rules/benign_sha256.txt ]; then
            cp OpenMalwareScannerPortable/hash_rules/benign_sha256.txt _site/webdemo/hash_rules/
          else
            echo "skip missing benign list"
          fi
          for v in capstone.js unicorn_x86.js; do
            if [ -f "OpenEDR/openedr_web/www/vendor/$v" ]; then
              cp "OpenEDR/openedr_web/www/vendor/$v" _site/webdemo/vendor/
              echo "vendor $v included from local"
            else
              pkg=$([ "$v" = "capstone.js" ] && echo "@alexaltea/capstone-js" || echo "@alexaltea/unicorn-js")
              curl -sSLf "https://cdn.jsdelivr.net/npm/${pkg}/dist/${v}" -o "_site/webdemo/vendor/$v" && echo "vendor $v downloaded from CDN" || echo "skip missing vendor/$v"
            fi
          done
          mkdir -p _site/webdemo/yara_rules
          if [ -d hydradragon/yara-x/rules ]; then
            echo "Compiling YARA-X rules with matching yara-x..."
            cargo run --manifest-path hydradragon_yara_x_compile/Cargo.toml -- hydradragon/yara-x/rules _site/webdemo/yara_rules || true
          fi
          if [ -f OpenMalwareScannerPortable/yara_rules/valhalla-rules.yrc ] && [ ! -f _site/webdemo/yara_rules/valhalla-rules.yrc ]; then
            cp OpenMalwareScannerPortable/yara_rules/*.yrc _site/webdemo/yara_rules/ 2>/dev/null || true
          fi
          # NOTE: benign_sha256.txt (16MB) intentionally skipped — optional in the demo.
          # NOTE: vendor/*.js (capstone/unicorn) and valhalla .yrc are NOT in git;
          # the demo degrades gracefully without them (built-in demo rules apply).
          ls -la _site _site/webdemo

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
