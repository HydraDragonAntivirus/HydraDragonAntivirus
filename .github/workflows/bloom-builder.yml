name: Bloom Builder

on:
  push:
    branches: ["**"]
    paths:
      - 'bloom_builder/**'
      - '.github/workflows/bloom-builder.yml'
  pull_request:
    branches: ["**"]
    paths:
      - 'bloom_builder/**'
      - '.github/workflows/bloom-builder.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bloom_builder
    steps:
      - uses: actions/checkout@v6
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Cargo check
        run: cargo check
      - name: Build
        run: cargo build --verbose
