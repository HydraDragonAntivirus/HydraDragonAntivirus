name: Sanctum PPL Runner

on:
  push:
    branches: ["**"]
    paths:
      - 'Sanctum/sanctum_ppl_runner/**'
      - 'Sanctum/shared_std/**'
      - 'Sanctum/shared_no_std/**'
      - 'Sanctum/Cargo.toml'
      - 'Sanctum/Cargo.lock'
      - '.github/workflows/sanctum-ppl-runner.yml'
  pull_request:
    branches: ["**"]
    paths:
      - 'Sanctum/sanctum_ppl_runner/**'
      - 'Sanctum/shared_std/**'
      - 'Sanctum/shared_no_std/**'
      - 'Sanctum/Cargo.toml'
      - 'Sanctum/Cargo.lock'
      - '.github/workflows/sanctum-ppl-runner.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Set up Rust (Nightly)
        uses: dtolnay/rust-toolchain@nightly
      - name: Cargo check
        working-directory: Sanctum
        run: cargo check -p sanctum_ppl_runner

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/development-version' && !startsWith(github.ref_name, 'auto-update-')
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
      - name: Update Cargo.lock
        working-directory: Sanctum
        run: cargo update
      - name: Format Rust sources
        working-directory: Sanctum
        run: |
          rustup component add rustfmt
          cargo fmt --all
      - name: Setup Windows SDK (for signtool)
        shell: pwsh
        run: |
          $sdkSetupPath = "$Env:TEMP\sdksetup.exe"
          (New-Object Net.WebClient).DownloadFile('https://go.microsoft.com/fwlink/?linkid=2272610', $sdkSetupPath)
          Start-Process -FilePath $sdkSetupPath -ArgumentList "/quiet", "/norestart", "/features", "OptionId.SigningTools" -NoNewWindow -Wait
          $kitsPath = "C:\Program Files (x86)\Windows Kits\10\bin"
          if (Test-Path $kitsPath) {
            $latestSdk = Get-ChildItem $kitsPath | Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } | Sort-Object Name -Descending | Select-Object -First 1
            if ($latestSdk) {
              $sdkPath = Join-Path $latestSdk.FullName "x64"
              echo "$sdkPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }
      - name: Build sanctum_ppl_runner
        working-directory: Sanctum
        run: cargo build --release -p sanctum_ppl_runner
      - name: Stage
        shell: pwsh
        run: |
          $dist = "hydradragon/Sanctum/AppData"
          New-Item -ItemType Directory -Force -Path $dist
          Copy-Item "Sanctum/target/release/sanctum_ppl_runner.exe" "$dist/" -Force
      - name: Sign sanctum_ppl_runner
        working-directory: Sanctum
        run: .\sign_ppl_runner.bat
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: sanctum-ppl-runner
          path: hydradragon/Sanctum/AppData/sanctum_ppl_runner.exe
          if-no-files-found: error
      - name: Check for publishable changes
        id: check_changes
        uses: ./.github/actions/check-publishable-changes
        with:
          paths: |
            hydradragon/Sanctum/AppData/sanctum_ppl_runner.exe
            Sanctum/Cargo.lock
            Sanctum
      - name: Create PR
        if: steps.check_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(sanctum): update ppl runner binary"
          title: "Update Sanctum PPL Runner Binary"
          add-paths: ${{ steps.check_changes.outputs.publishable_files }}
          branch: "auto-update-sanctum-ppl-runner"
          base: ${{ github.ref_name }}
          delete-branch: true
          labels: binaries, automated-pr, sanctum, ppl-runner, development-version
