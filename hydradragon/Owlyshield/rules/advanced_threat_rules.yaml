  enabled: true
  severity: 95
  level: critical
  tags:
    - injection
    - stealth
  mitre_attack:
    - T1620
  stages:
    - name: Allocate RWX Memory
      conditions:
        - type: Api
          functions:
            - NtAllocateVirtualMemory
          arguments:
            - name: protection
              value: '0x40'
    - name: Write to Allocated Memory
      conditions:
        - type: Api
          functions:
            - NtWriteVirtualMemory
