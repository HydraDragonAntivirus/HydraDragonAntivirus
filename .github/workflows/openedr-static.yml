name: Build OpenEDR Static DLL

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - 'OpenEDR/openedr_static/**'
      - 'OpenEDR/owlyshield_predict/hydradragonclamav/**'
      - 'OpenEDR/owlyshield_predict/hydradragonextractor/**'
      - 'hydradragonsig/**'
      - 'hydradragonunicorn/**'
      - 'hydradragondecompiler/**'
      - 'pefile-rs/**'
      - 'hayabusa/**'
      - '.github/workflows/openedr-static.yml'
  pull_request:
    branches: ["**"]
    paths:
      - 'OpenEDR/openedr_static/**'
      - 'OpenEDR/owlyshield_predict/hydradragonclamav/**'
      - 'OpenEDR/owlyshield_predict/hydradragonextractor/**'
      - 'hydradragonsig/**'
      - 'hydradragonunicorn/**'
      - 'hydradragondecompiler/**'
      - 'pefile-rs/**'
      - 'hayabusa/**'
      - '.github/workflows/openedr-static.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  pull-requests: write

jobs:
  build-windows:
    name: Build Windows x64 DLL
    runs-on: windows-latest
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "OpenEDR/openedr_static -> target"

      - name: Build openedr_static (Release)
        working-directory: OpenEDR/openedr_static
        run: cargo build --release --verbose

      - name: Copy openedr_static.dll to OpenMalwareScannerPortable
        shell: pwsh
        run: |
          Copy-Item OpenEDR/openedr_static/target/release/openedr_static.dll -Destination OpenMalwareScannerPortable/openedr_static.dll -Force

      - name: Create Pull Request with openedr_static.dll
        if: github.event_name != 'pull_request' && !startsWith(github.ref_name, 'auto-update-')
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(openedr): update openedr_static.dll in OpenMalwareScannerPortable"
          title: "Update openedr_static.dll in OpenMalwareScannerPortable"
          body: "Automated build of openedr_static.dll placed into OpenMalwareScannerPortable folder."
          add-paths: OpenMalwareScannerPortable/openedr_static.dll
          branch: "auto-update-openedr-static"
          base: ${{ github.ref_name }}
          delete-branch: true
          labels: binaries, automated-pr, openedr, development-version

