name: Publish HydraDragonLauncher

on:
  push:
    branches: [development-version]
    paths:
      - 'HydraDragonLauncher/**'
      - '!HydraDragonLauncher/README.md'
      - '.github/workflows/publish-hydradragonlauncher.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-stage:
    if: (!startsWith(github.ref_name, 'auto-update-'))
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      
      - uses: actions/checkout@v6
      
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, wasm32-unknown-unknown
          
      - name: Set up MSVC Developer Command Prompt
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Update Launcher lockfile
        shell: pwsh
        run: |
          cargo generate-lockfile --manifest-path HydraDragonLauncher/Cargo.toml
          cargo update --manifest-path HydraDragonLauncher/Cargo.toml
          cargo update --manifest-path HydraDragonLauncher/ui/Cargo.toml

      - name: Format Rust sources
        shell: pwsh
        run: |
          rustup component add rustfmt
          cargo fmt --manifest-path HydraDragonLauncher/Cargo.toml --all
          cargo fmt --manifest-path HydraDragonLauncher/ui/Cargo.toml --all

      - name: Build UI
        working-directory: HydraDragonLauncher/ui
        run: trunk build --release -d ../dist
      
      - name: Build Launcher
        working-directory: HydraDragonLauncher
        run: cargo build --release
      
      - name: Stage
        shell: pwsh
        run: |
          $distLauncher = "hydradragon/HydraDragonLauncher"

          # Sync the whole folder first
          if (Test-Path $distLauncher) { Remove-Item $distLauncher -Recurse -Force }
          New-Item -ItemType Directory -Path $distLauncher -Force | Out-Null
          Copy-Item -Path "HydraDragonLauncher/target/release/hydradragonlauncher.exe" -Destination $distLauncher -Force
          
      - name: Check for publishable changes
        id: check_changes
        uses: ./.github/actions/check-publishable-changes
        with:
          paths: |
            hydradragon/HydraDragonLauncher
            HydraDragonLauncher/target/release
            HydraDragonLauncher/build.rs
            HydraDragonLauncher/src
            HydraDragonLauncher/ui/src
      
      - name: Create PR
        if: steps.check_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(launcher): update binaries"
          title: "Update HydraDragonLauncher Binaries"
          add-paths: |
            ${{ steps.check_changes.outputs.publishable_files }}
          branch: "auto-update-launcher"
          base: ${{ github.ref_name }}
          delete-branch: true
          labels: binaries, automated-pr, launcher
