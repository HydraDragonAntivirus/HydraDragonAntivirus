# Generic file infectors (appenders), written with pe_section only: no family,
# no byte pattern. Polymorphic bodies change per file; these structural traits do not.
rules:
- id: VK-VIRUS-APPENDER-RELOC-64
  title: Appender keeps the relocation table in its encrypted last section (64-bit)
  description: 'The base relocation directory points into a large, encrypted last section that is not marked as code. Linkers put relocations in their own small .reloc section; an infector that appends
    its body there moves them. Retrohunt: 0 of ~34000 clean PE. Excludes a last section that also holds the resource directory (genuine UPX keeps relocations behind compressed resources).'
  severity: critical
  verdict: malware
  confidence: 90
  score: 100
  family: Virus.Win64.Appender.RELOC
  tags:
  - analyst
  - virus
  - infector
  - polymorphic
  - generic
  logic: all
  conditions:
  - type: native_signature
    expression: PE64
  - type: pe_section
    select: last
    flags_none:
    - code
    entropy_min: 7.8
    raw_size_min: 32768
    directories_any:
    - basereloc
    directories_none:
    - resource
- id: VK-VIRUS-APPENDER-RELOC-32
  title: Appender keeps the relocation table in its encrypted last section (32-bit)
  description: 32-bit form of VK-VIRUS-APPENDER-RELOC-64. Excludes a last section that also holds the resource directory (genuine UPX keeps relocations behind compressed resources).
  severity: critical
  verdict: malware
  confidence: 90
  score: 100
  family: Virus.Win32.Appender.RELOC
  tags:
  - analyst
  - virus
  - infector
  - polymorphic
  - generic
  logic: all
  conditions:
  - type: native_signature
    expression: PE32
  - type: pe_section
    select: last
    flags_none:
    - code
    entropy_min: 7.8
    raw_size_min: 32768
    directories_any:
    - basereloc
    directories_none:
    - resource
- id: VK-VIRUS-APPENDER-EP-64
