name: Publish Binaries (Multi-Job)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to create/update PR on"
        required: true
        default: "auto-update-binaries"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: publish-binaries-${{ github.event.inputs.branch || 'auto-update-binaries' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  WDK_URL: https://go.microsoft.com/fwlink/?linkid=2335869

jobs:
  # --- GROUP 1: MSBuild Projects (Separated) ---
  
  build-tinyantivirus:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up MSVC Developer Command Prompt
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: Build TinyAntivirus
        run: msbuild TinyAntivirus/TinyAntivirus.sln /p:Configuration=Release /p:Platform=x64
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: bin-tinyantivirus
          path: TinyAntivirus/x64/Release/TinyAvConsole.exe

  build-hydradragonav:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Set up MSVC Developer Command Prompt
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: Build HydraDragonAV
        run: msbuild HydraDragonAV/HydraDragonAV.sln /p:Configuration=Release /p:Platform=x64
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: bin-hydradragonav
          path: HydraDragonAV/x64/Release/HydraDragonAV.exe

  build-mbrfilter:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Set up MSVC Developer Command Prompt
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: Setup WDK
        shell: pwsh
        run: |
          $wdkSetupPath = "$Env:TEMP\wdksetup.exe"
          (New-Object Net.WebClient).DownloadFile('${{env.WDK_URL}}', $wdkSetupPath)
          Start-Process -FilePath $wdkSetupPath -ArgumentList "/quiet" -NoNewWindow -Wait
          # Install the WDK Visual Studio Extension so InfVerif.dll is available to MSBuild
          $vsixPath = "C:\Program Files (x86)\Windows Kits\10\Vsix\VS2022\10.0.26100.0\WDK.vsix"
          if (Test-Path $vsixPath) {
            $vsInstaller = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property enginePath
            $vsixInstaller = Join-Path $vsInstaller "VSIXInstaller.exe"
            Start-Process -FilePath $vsixInstaller -ArgumentList "/q `"$vsixPath`"" -NoNewWindow -Wait
          }
      - name: Build MBRFilter
        run: msbuild "MBRFilter/MBRFilter Driver.sln" /p:Configuration=Release /p:Platform=x64
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: bin-mbrfilter
          path: |
            MBRFilter/x64/Win8Release/MBRFilter/*.sys
            MBRFilter/x64/Win8Release/MBRFilter/*.inf
            MBRFilter/x64/Win8Release/MBRFilter/*.cat

  build-pyasprotection:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Set up MSVC Developer Command Prompt
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: Setup WDK
        shell: pwsh
        run: |
          $wdkSetupPath = "$Env:TEMP\wdksetup.exe"
          (New-Object Net.WebClient).DownloadFile('${{env.WDK_URL}}', $wdkSetupPath)
          Start-Process -FilePath $wdkSetupPath -ArgumentList "/quiet" -NoNewWindow -Wait
      - name: Build PYAS Protection
        run: msbuild PYAS_Protection/SimplePYASProtection.sln /p:Configuration=Release /p:Platform=x64
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: bin-pyasprotection
          path: |
            PYAS_Protection/x64/Release/SimplePYASProtection/*.sys
            PYAS_Protection/x64/Release/SimplePYASProtection/*.inf
            PYAS_Protection/x64/Release/SimplePYASProtection/*.cat

  build-owlyshield-minifilter:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Set up MSVC Developer Command Prompt
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: Setup WDK
        shell: pwsh
        run: |
          $wdkSetupPath = "$Env:TEMP\wdksetup.exe"
          (New-Object Net.WebClient).DownloadFile('${{env.WDK_URL}}', $wdkSetupPath)
          Start-Process -FilePath $wdkSetupPath -ArgumentList "/quiet" -NoNewWindow -Wait
      - name: Build Owlyshield Minifilter
        run: msbuild Owlyshield/owlyshield_minifilter/RWatch.sln /p:Configuration=Release /p:Platform=x64
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: bin-owlyshield-minifilter
          path: |
            Owlyshield/owlyshield_minifilter/x64/Release/OwlyshieldRansomFilter/*.sys
            Owlyshield/owlyshield_minifilter/x64/Release/OwlyshieldRansomFilter/*.inf
            Owlyshield/owlyshield_minifilter/x64/Release/OwlyshieldRansomFilter/*.cat

  build-reddbg:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Set up MSVC Developer Command Prompt
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: Build RedDbg
        run: msbuild Owlyshield/RedDbg/RedDbg/RedDbg.sln /p:Configuration=Release /p:Platform=x64
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: bin-reddbg
          path: |
            Owlyshield/RedDbg/RedDbg/x64/ReleaseX64Kernel/RedDbgDrv/*.sys
            Owlyshield/RedDbg/RedDbg/x64/ReleaseX64Kernel/RedDbgDrv/*.inf
            Owlyshield/RedDbg/RedDbg/x64/ReleaseX64Kernel/RedDbgDrv/*.cat

  # --- GROUP 2: Dotnet Projects (Separated) ---

  build-megadumper:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Publish MegaDumper
        run: dotnet publish MegaDumper/MegaDumper/MegaDumper.csproj -c Release -r win-x64 --self-contained false -o publish/
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: bin-megadumper
          path: publish/



  build-launcher:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build Launcher
        working-directory: HydraDragonLauncher
        run: cargo build --release
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: bin-launcher
          path: HydraDragonLauncher/target/release/hydradragonlauncher.exe

  # --- GROUP 3: Rust Projects (Separated) ---

  build-owlyshield-rust:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install yasm
        run: choco install nasm
      - name: Build Owlyshield Rust
        working-directory: Owlyshield/owlyshield_predict
        run: cargo build --release --features novelty,malware,hydradragon,behavior_engine,firewall,sanctum
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: bin-owlyshield-rust
          path: Owlyshield/owlyshield_predict/target/release/owlyshield_ransom.exe

  build-tensorflowlite:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: bin-tensorflowlite
          path: Owlyshield/owlyshield_predict/moonfire-tflite/lib/tensorflowlite_c.dll

  build-firewall-rust:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install Assembly Tools (yasm)
        run: choco install nasm
      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk
      
      - name: Update Firewall lockfiles
        shell: pwsh
        run: |
          # Generate lockfile for shared crate first (it's a dependency)
          cargo generate-lockfile --manifest-path HydraDragonFirewall/hydradragon-shared/Cargo.toml
          cargo update --manifest-path HydraDragonFirewall/hydradragon-shared/Cargo.toml
          # Then update dependent crates
          cargo generate-lockfile --manifest-path HydraDragonFirewall/http-mitm-proxy/Cargo.toml
          cargo update --manifest-path HydraDragonFirewall/http-mitm-proxy/Cargo.toml
          cargo update --manifest-path HydraDragonFirewall/hydradragonfirewall/Cargo.toml
          cargo update --manifest-path HydraDragonFirewall/hydradragonfirewall/ui/Cargo.toml
      
      - name: Build UI (Leptos)
        working-directory: HydraDragonFirewall/hydradragonfirewall/ui
        run: trunk build --release -d ../dist
      - name: Build Firewall Rust
        working-directory: HydraDragonFirewall/hydradragonfirewall
        run: cargo build --release
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: bin-firewall-rust
          path: |
            HydraDragonFirewall/hydradragonfirewall/target/release/hydradragonfirewall.exe
            HydraDragonFirewall/hydradragonfirewall/target/release/hydradragonfirewall.dll
            HydraDragonFirewall/hydradragonfirewall/target/release/WinDivert.dll

  build-sanctum:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Set up MSVC Developer Command Prompt
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
      - name: Update Sanctum Cargo.lock
        working-directory: Sanctum
        run: cargo update
      - name: Update Sanctum driver Cargo.lock
        working-directory: Sanctum/driver
        run: cargo update
      - name: Install Cargo Make
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-make
      - name: Install rust-script
        run: cargo install rust-script --version 0.30.0
      - name: Setup WDK
        shell: pwsh
        run: |
          $wdkSetupPath = "$Env:TEMP\wdksetup.exe"
          (New-Object Net.WebClient).DownloadFile('${{env.WDK_URL}}', $wdkSetupPath)
          Start-Process -FilePath $wdkSetupPath -ArgumentList "/quiet" -NoNewWindow -Wait
      - name: Prepare Driver Build Environment
        working-directory: Sanctum/driver
        shell: pwsh
        run: |
          # Create target directory if it doesn't exist
          New-Item -ItemType Directory -Force -Path "target" | Out-Null
          
          # Fetch dependencies to ensure wdk-build is available
          cargo fetch
          
          # Copy rust-driver-makefile.toml from wdk-build crate to target directory
          $wdkBuildPath = (cargo metadata --format-version 1 | ConvertFrom-Json).packages | Where-Object { $_.name -eq "wdk-build" } | Select-Object -First 1 -ExpandProperty manifest_path | Split-Path
          $sourceFile = Join-Path $wdkBuildPath "rust-driver-makefile.toml"
          $destFile = "target\rust-driver-makefile.toml"
          
          if (Test-Path $sourceFile) {
            Write-Host "Copying $sourceFile to $destFile"
            Copy-Item $sourceFile $destFile -Force
          } else {
            Write-Host "Warning: Could not find rust-driver-makefile.toml at $sourceFile"
          }
      - name: Setup Windows SDK (for signtool)
        shell: pwsh
        run: |
          $sdkSetupPath = "$Env:TEMP\sdksetup.exe"
          Write-Host "Downloading Windows SDK..."
          (New-Object Net.WebClient).DownloadFile('https://go.microsoft.com/fwlink/?linkid=2272610', $sdkSetupPath)
          Write-Host "Installing Windows SDK..."
          Start-Process -FilePath $sdkSetupPath -ArgumentList "/quiet", "/norestart", "/features", "OptionId.SigningTools" -NoNewWindow -Wait
          Write-Host "Windows SDK installed successfully"
      - name: Build Sanctum (with ELAM Hash Sync)
        working-directory: Sanctum/driver
        shell: pwsh
        run: |
          ./update_hash.ps1 -Profile release
          $hash = Get-Content "sanctum_elam_hash.txt" -Raw
          Write-Host "Sanctum ELAM hash: $hash"
          echo "elam_hash=$hash" >> $env:GITHUB_OUTPUT
          
          cd ..
          # === USERMODE COMPONENTS ===
          Write-Host "`n=== Building usermode components ==="
          cargo make release
          
          Write-Host "`n=== Signing PPL runner ==="
          .\sign_ppl_runner.bat

      - name: Stage Sanctum Artifact
        shell: pwsh
        run: |
          $artifact = "artifact/bin-sanctum"
          Remove-Item -LiteralPath $artifact -Recurse -Force -ErrorAction SilentlyContinue
          $paths = @(
            "Sanctum/driver/target/release/sanctum_package",
            "Sanctum/driver",
            "Sanctum/target/release",
            "Sanctum"
          )
          foreach ($path in $paths) {
            New-Item -ItemType Directory -Force -Path (Join-Path $artifact $path) | Out-Null
          }

          Copy-Item "Sanctum/driver/target/release/sanctum_package/*.sys" "$artifact/Sanctum/driver/target/release/sanctum_package/" -Force -ErrorAction Stop
          Copy-Item "Sanctum/driver/build.rs" "$artifact/Sanctum/driver/" -Force -ErrorAction Stop
          Copy-Item "Sanctum/target/release/sanctum_ppl_runner.exe" "$artifact/Sanctum/target/release/" -Force -ErrorAction Stop
          Copy-Item "Sanctum/target/release/elam_installer.exe" "$artifact/Sanctum/target/release/" -Force -ErrorAction Stop
          Copy-Item "Sanctum/target/release/um_engine.exe" "$artifact/Sanctum/target/release/" -Force -ErrorAction Stop
          Copy-Item "Sanctum/target/release/malware.exe" "$artifact/Sanctum/target/release/" -Force -ErrorAction Stop
          Copy-Item "Sanctum/target/release/app.exe" "$artifact/Sanctum/target/release/" -Force -ErrorAction Stop
          Copy-Item "Sanctum/target/release/sanctum.dll" "$artifact/Sanctum/target/release/" -Force -ErrorAction Stop
          Copy-Item "Sanctum/Cargo.lock" "$artifact/Sanctum/" -Force -ErrorAction Stop
          Copy-Item "Sanctum/driver/Cargo.lock" "$artifact/Sanctum/driver/" -Force -ErrorAction Stop

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: bin-sanctum
          path: artifact/bin-sanctum/
          if-no-files-found: error

  build-owlyshield-tools:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build Owlyshield Tools
        working-directory: Owlyshield/tools/rust_win_toast
        run: cargo build --release
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: bin-owlyshield-tools
          path: Owlyshield/tools/rust_win_toast/target/release/RustWindowsToast.exe

  # --- FINAL STAGE: Collect and PR ---

  stage-and-pr:
    needs:
      - build-tinyantivirus
      - build-hydradragonav
      - build-mbrfilter
      - build-pyasprotection
      - build-owlyshield-minifilter
      - build-reddbg
      - build-megadumper
      - build-launcher
      - build-owlyshield-rust
      - build-tensorflowlite
      - build-firewall-rust
      - build-sanctum
      - build-owlyshield-tools
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: .

      - name: Set up MSVC Developer Command Prompt
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Organize Binaries
        id: organize
        shell: pwsh
        run: |
          $distRoot = "hydradragon"
          $elamHash = "not found"
          
          # Ensure distribution root and subfolders exist
          $folders = @(
            "$distRoot/TinyAntivirus",
            "$distRoot/HydraDragonAV",
            "$distRoot/MBRFilter",
            "$distRoot/SimplePYASProtection",
            "$distRoot/Owlyshield/OwlyshieldRansomFilter",
            "$distRoot/Owlyshield/Owlyshield Service",
            "$distRoot/Owlyshield/RedDbg",
            "$distRoot/HydraDragonDumper",
            "$distRoot/HydraDragonLauncher",
            "$distRoot/Sanctum/AppData",
            "$distRoot/Sanctum/System32",
            "$distRoot/sanctum_test_malware",
            "$distRoot/Owlyshield/tools"
          )
          foreach ($folder in $folders) {
            if (-not (Test-Path $folder)) {
              New-Item -ItemType Directory -Force -Path $folder
            }
          }

          function Get-PublishRoot {
            param(
              [Parameter(Mandatory = $true)][string]$ArtifactDir,
              [Parameter(Mandatory = $true)][string]$RequiredFile
            )

            if (-not (Test-Path -LiteralPath $ArtifactDir -PathType Container)) {
              throw "Missing artifact directory: $ArtifactDir"
            }

            $directFile = Join-Path $ArtifactDir $RequiredFile
            if (Test-Path -LiteralPath $directFile -PathType Leaf) {
              return (Resolve-Path -LiteralPath $ArtifactDir).Path
            }

            $nestedFile = Get-ChildItem -LiteralPath $ArtifactDir -Filter $RequiredFile -Recurse -File | Select-Object -First 1
            if (-not $nestedFile) {
              throw "Could not find $RequiredFile under $ArtifactDir"
            }

            return $nestedFile.Directory.FullName
          }

          function Sync-PublishTree {
            param(
              [Parameter(Mandatory = $true)][string]$Source,
              [Parameter(Mandatory = $true)][string]$Destination
            )

            if (-not (Test-Path -LiteralPath $Source -PathType Container)) {
              throw "Missing publish source: $Source"
            }

            if (Test-Path -LiteralPath $Destination) {
              Remove-Item -LiteralPath $Destination -Recurse -Force
            }

            New-Item -ItemType Directory -Force -Path $Destination | Out-Null
            # Wildcard path is the most reliable way to copy full folder contents in PowerShell
            Copy-Item -Path "$Source\*" -Destination $Destination -Recurse -Force
          }

          # --- TinyAntivirus ---
          $tinyAV = Get-ChildItem "bin-tinyantivirus/" -Filter "TinyAvConsole.exe" -Recurse
          $tinyAV | Copy-Item -Destination "$distRoot/TinyAntivirus/" -Force
          New-Item -ItemType Directory -Force -Path "TinyAntivirus/x64/Release"
          $tinyAV | Copy-Item -Destination "TinyAntivirus/x64/Release/" -Force

          # --- HydraDragonAV ---
          $av = Get-ChildItem "bin-hydradragonav/" -Filter "HydraDragonAV.exe" -Recurse
          $av | Copy-Item -Destination "$distRoot/HydraDragonAV/" -Force
          New-Item -ItemType Directory -Force -Path "HydraDragonAV/x64/Release"
          $av | Copy-Item -Destination "HydraDragonAV/x64/Release/" -Force

          # --- MBRFilter ---
          $mbrSource = Get-ChildItem "bin-mbrfilter/" -Directory -Filter "MBRFilter" -Recurse | Select-Object -First 1
          if ($mbrSource) {
            Copy-Item -Path "$($mbrSource.FullName)/*" -Destination "$distRoot/MBRFilter/" -Recurse -Force
          }

          # --- SimplePYASProtection ---
          $pyasSource = Get-ChildItem "bin-pyasprotection/" -Directory -Filter "SimplePYASProtection" -Recurse | Select-Object -First 1
          if ($pyasSource) {
            Copy-Item -Path "$($pyasSource.FullName)/*" -Destination "$distRoot/SimplePYASProtection/" -Recurse -Force
          }

          # --- Owlyshield ---
          $owlyMinifilterSource = Get-ChildItem "bin-owlyshield-minifilter/" -Directory -Filter "OwlyshieldRansomFilter" -Recurse | Select-Object -First 1
          if ($owlyMinifilterSource) {
            Copy-Item -Path "$($owlyMinifilterSource.FullName)/*" -Destination "$distRoot/Owlyshield/OwlyshieldRansomFilter/" -Recurse -Force
          }
          
          $owlyRust = Get-ChildItem "bin-owlyshield-rust/" -Filter "owlyshield_ransom.exe" -Recurse
          $owlyRust | Copy-Item -Destination "$distRoot/Owlyshield/Owlyshield Service/" -Force
          New-Item -ItemType Directory -Force -Path "Owlyshield/owlyshield_predict/target/release"
          $owlyRust | Copy-Item -Destination "Owlyshield/owlyshield_predict/target/release/" -Force

          $tflite = Get-ChildItem "bin-tensorflowlite/" -Filter "tensorflowlite*.dll" -Recurse
          $tflite | Copy-Item -Destination "$distRoot/Owlyshield/Owlyshield Service/" -Force

          # --- RedDbg ---
          $reddbgDrvSource = Get-ChildItem "bin-reddbg/" -Directory -Filter "RedDbgDrv" -Recurse | Select-Object -First 1
          if ($reddbgDrvSource) {
            Copy-Item -Path "$($reddbgDrvSource.FullName)/*" -Destination "$distRoot/Owlyshield/RedDbg/" -Recurse -Force
          }

          # --- Owlyshield Tools ---
          $owlyTools = Get-ChildItem "bin-owlyshield-tools/" -Filter "RustWindowsToast.exe" -Recurse
          $owlyTools | Copy-Item -Destination "$distRoot/Owlyshield/utils/" -Force
          New-Item -ItemType Directory -Force -Path "Owlyshield/utils/rust_win_toast/target/release"
          $owlyTools | Copy-Item -Destination "Owlyshield/utils/rust_win_toast/target/release/" -Force

          # --- Dumper ---
          $dumperRoot = Get-PublishRoot -ArtifactDir "bin-megadumper" -RequiredFile "MegaDumper.exe"
          Sync-PublishTree -Source $dumperRoot -Destination "$distRoot/HydraDragonDumper"
          Sync-PublishTree -Source $dumperRoot -Destination "MegaDumper/MegaDumper/bin/Release/net8.0-windows/publish"
          if (Test-Path "$distRoot/HydraDragonDumper/MegaDumper.exe") {
            Move-Item "$distRoot/HydraDragonDumper/MegaDumper.exe" "$distRoot/HydraDragonDumper/HydraDragonDumper.exe" -Force
          }

          # --- Firewall ---
          $fwRust = Get-ChildItem "bin-firewall-rust/" -Filter "hydradragonfirewall.*" -Recurse
          $fwRust | Copy-Item -Destination "$distRoot/HydraDragonFirewall/" -Force
          New-Item -ItemType Directory -Force -Path "HydraDragonFirewall/hydradragonfirewall/target/release"
          $fwRust | Copy-Item -Destination "HydraDragonFirewall/hydradragonfirewall/target/release/" -Force

          # --- Launcher (Rust) ---
          $launcher = Get-ChildItem "bin-launcher/" -Filter "hydradragonlauncher.exe" -Recurse
          $launcher | Copy-Item -Destination "$distRoot/HydraDragonLauncher/" -Force
          New-Item -ItemType Directory -Force -Path "HydraDragonLauncher/target/release"
          $launcher | Copy-Item -Destination "HydraDragonLauncher/target/release/" -Force

          # --- Sanctum Stack ---
          # System/Kernel Files (to AppData)
          Get-ChildItem "bin-sanctum/" -Filter "sanctum.sys" -Recurse | Select-Object -First 1 | Copy-Item -Destination "$distRoot/Sanctum/AppData/" -Force
          Get-ChildItem "bin-sanctum/" -Filter "sanctum_ppl_runner.exe" -Recurse | Select-Object -First 1 | Copy-Item -Destination "$distRoot/Sanctum/AppData/" -Force
          
          # DLLs (to System32)
          Get-ChildItem "bin-sanctum/" -Filter "sanctum.dll" -Recurse | Select-Object -First 1 | Copy-Item -Destination "$distRoot/Sanctum/System32/" -Force
          
          # Root Modules
          Get-ChildItem "bin-sanctum/" -Filter "elam_installer.exe" -Recurse | Select-Object -First 1 | Copy-Item -Destination "$distRoot/Sanctum/" -Force
          Get-ChildItem "bin-sanctum/" -Filter "um_engine.exe" -Recurse | Select-Object -First 1 | Copy-Item -Destination "$distRoot/Sanctum/" -Force
          Get-ChildItem "bin-sanctum/" -Filter "app.exe" -Recurse | Select-Object -First 1 | Copy-Item -Destination "$distRoot/Sanctum/" -Force
          
          # Source Tree Sync (Full Workspace)
          New-Item -ItemType Directory -Force -Path "Sanctum/target/release"
          Get-ChildItem "bin-sanctum/" -Filter "*" -Include "*.exe", "*.dll" -Recurse | Copy-Item -Destination "Sanctum/target/release/" -Force
          New-Item -ItemType Directory -Force -Path "Sanctum/driver/target/release"
          Get-ChildItem "bin-sanctum/" -Filter "sanctum.sys" -Recurse | Copy-Item -Destination "Sanctum/driver/target/release/" -Force

          # Malware Simulation (Test folder)
          $sanctumMalware = Get-ChildItem "bin-sanctum/" -Filter "malware.exe" -Recurse
          $sanctumMalware | Copy-Item -Destination "$distRoot/sanctum_test_malware/" -Force

          $elamHashFile = Get-ChildItem "bin-sanctum/" -Filter "sanctum_elam_hash.txt" -Recurse | Select-Object -First 1
          if ($elamHashFile) {
            $elamHash = (Get-Content $elamHashFile.FullName -Raw).Trim()
            Write-Host "Sanctum ELAM hash: $elamHash"
          }

          $sanctumLocks = Get-ChildItem "bin-sanctum/" -Filter "Cargo.lock" -Recurse
          $sanctumRootLock = $sanctumLocks | Where-Object { $_.FullName -notmatch '[\\/]driver[\\/]' } | Select-Object -First 1
          if ($sanctumRootLock) {
            Copy-Item $sanctumRootLock.FullName -Destination "Sanctum/Cargo.lock" -Force
          }

          $sanctumDriverLock = $sanctumLocks | Where-Object { $_.FullName -match '[\\/]driver[\\/]' } | Select-Object -First 1
          if ($sanctumDriverLock) {
            Copy-Item $sanctumDriverLock.FullName -Destination "Sanctum/driver/Cargo.lock" -Force
          }

          $sanctumBuildRs = Get-ChildItem "bin-sanctum/" -Filter "build.rs" -Recurse | Where-Object { $_.FullName -match '[\\/]driver[\\/]' } | Select-Object -First 1
          if (-not $sanctumBuildRs) {
            $sanctumBuildRs = Get-ChildItem "bin-sanctum/" -Filter "build.rs" -Recurse | Select-Object -First 1
          }
          if ($sanctumBuildRs) {
            Copy-Item $sanctumBuildRs.FullName -Destination "Sanctum/driver/build.rs" -Force
          }
          echo "elam_hash=$elamHash" >> $env:GITHUB_OUTPUT

          Write-Host "`n=== Distributed binaries are ready for mass signing workflow ==="

          # Clean up artifact directories
          Write-Host "`n=== Cleaning up artifact directories ==="
          $artifactDirs = @(
            "bin-firewall-rust",
            "bin-hydradragonav",
            "bin-mbrfilter",
            "bin-megadumper",
            "bin-owlyshield-minifilter",
            "bin-owlyshield-rust",
            "bin-pyasprotection",
            "bin-reddbg",
            "bin-launcher",
            "bin-tinyantivirus",
            "bin-owlyshield-tools",
            "bin-sanctum"
          )
          foreach ($dir in $artifactDirs) {
            if (Test-Path $dir) {
              Remove-Item -Path $dir -Recurse -Force
              Write-Host "Removed directory: $dir"
            }
          }

      - name: Check for publishable changes
        id: check_changes
        uses: ./.github/actions/check-publishable-changes
        with:
          paths: |
            hydradragon
            TinyAntivirus/x64/Release
            HydraDragonAV/x64/Release
            MBRFilter/x64/Release
            PYAS_Protection/x64/Release
            Owlyshield/owlyshield_minifilter/x64/Release
            Owlyshield/owlyshield_predict/target/release
            Owlyshield/tools/rust_win_toast/target/release
            Owlyshield/RedDbg/RedDbg/x64/ReleaseX64Kernel
            MegaDumper/MegaDumper/bin/Release/net8.0
            HydraDragonFirewall/hydradragonfirewall/target/release
            HydraDragonLauncher/target/release
            Sanctum/target/release
            Sanctum/driver/target/release
            Sanctum/Cargo.lock
            Sanctum/driver/Cargo.lock
            Sanctum/driver/build.rs

      - name: Clean up artifact branches
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $branches = @(
            "bin-firewall-rust",
            "bin-hydradragonav",
            "bin-mbrfilter",
            "bin-megadumper",
            "bin-owlyshield-minifilter",
            "bin-owlyshield-rust",
            "bin-owlyshield-tools",
            "bin-tensorflowlite",
            "bin-pyasprotection",
            "bin-reddbg",
            "bin-launcher",
            "bin-tinyantivirus",
            "bin-sanctum"
          )
          foreach ($branch in $branches) {
            git push origin --delete $branch 2>$null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Deleted branch: $branch"
            }
          }

      - name: Cleanup temporary files
        if: always()
        shell: pwsh
        run: |
          Remove-Item -Path "Sanctum/driver/sanctum_elam_hash.txt" -Force -ErrorAction SilentlyContinue

      - name: Create PR
        if: steps.check_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            chore(binaries): automated binary update
            
            Sanctum ELAM Hash: ${{ steps.organize.outputs.elam_hash }}
          title: "Automated Global Binary Update"
          body: |
            Automated binary update from multi-job build pipeline.
            **Sanctum ELAM Hash**: `${{ steps.organize.outputs.elam_hash }}`
          add-paths: |
            ${{ steps.check_changes.outputs.publishable_files }}
          branch: "auto-update-all-binaries"
          base: ${{ github.ref_name }}
          delete-branch: true
          labels: binaries, automated-pr
