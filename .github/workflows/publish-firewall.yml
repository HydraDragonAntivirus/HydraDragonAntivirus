name: Publish Firewall

on:
  push:
    branches: ["**"]
    paths:
      - 'HydraDragonFirewall/**'
      - '.github/workflows/publish-firewall.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-stage:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk
          
      - name: Build UI
        working-directory: HydraDragonFirewall/hydradragonfirewall/ui
        run: trunk build --release -d ../dist
        
      - name: Build Rust Core
        working-directory: HydraDragonFirewall/hydradragonfirewall
        run: cargo build --release
        
      - name: Stage
        shell: pwsh
        run: |
          $dist = "hydradragon/HydraDragonFirewall"
          New-Item -ItemType Directory -Force -Path $dist
          Copy-Item "HydraDragonFirewall/hydradragonfirewall/target/release/hydradragonfirewall.exe" "$dist/" -Force
          Copy-Item "HydraDragonFirewall/hydradragonfirewall/target/release/hydradragonfirewall.dll" "$dist/" -Force
          
      - name: Check for publishable changes
        id: check_changes
        uses: ./.github/actions/check-publishable-changes
        with:
          paths: |
            hydradragon/HydraDragonFirewall
      - name: Create PR
        if: steps.check_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(firewall): update binaries"
          title: "Update Firewall Binaries"
          add-paths: |
            ${{ steps.check_changes.outputs.publishable_files }}
          branch: "auto-update-firewall"
          base: ${{ github.ref_name }}
          delete-branch: true
