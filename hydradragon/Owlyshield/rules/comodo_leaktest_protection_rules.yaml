# TEST #30: Hijacking:SupersedeServiceDll — Block service DLL replacement
- name: "HEUR:Win.Hijacking.ServiceDLLSupersede.gen"
  author: "HydraDragon"
  date: "2026-03-26"
  status: production
  level: critical
  severity: 100
  description: |
    Detects modification of service DLL paths (ServiceDll, Parameters registry).
    Threat actors replace legitimate service DLLs with malicious versions
    to maintain persistence and execute with SYSTEM privileges.
    COMODO Test #30: Hijacking:SupersedeServiceDll
    Blocks service DLL path modification.
  debug: false

  named_conditions:
    service_dll_modification:
      orderless: true
      registry_keys:
        - "HKLM\\SYSTEM\\CurrentControlSet\\Services\\*\\Parameters"
        - "HKLM\\SYSTEM\\ControlSet[0-9]\\Services\\*\\Parameters"
        - "HKLM\\SYSTEM\\CurrentControlSet\\Services\\*"
      registry_values:
        - "ServiceDll"
        - "ImagePath"
        - "ImagePathValue"
      registry_operations: ["set", "create"]
      value_change_detected: true
      min_matches: 1

    service_dll_not_system32:
      orderless: true
      registry_values_not_contain:
        - "System32"
        - "systemroot"
      min_matches: 1

    caller_not_system:
      orderless: true
      calling_process_privilege_level: "user"
      calling_process_name_exclude:
        - "msiexec.exe"
        - "svchost.exe"
        - "services.exe"
      min_matches: 1

  detection_logic:
    and:
      - condition: "service_dll_modification"
      - or:
          - condition: "service_dll_not_system32"
          - condition: "caller_not_system"

  response:
    notify_user: true
    ask_user: true
    terminate_process: true
    status_access_denied: true
    record: true
    auto_revert: true

  tags: ["hijacking", "services", "persistence", "dll-replacement"]
  mitre_attack: ["T1547.001"]

