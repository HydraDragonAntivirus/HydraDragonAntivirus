name: vs2022tinyantivirus-ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: "TinyAntivirus/TinyAntivirus.sln"

  BUILD_BIN_DIR: "./TinyAntivirus/x64/"

permissions:
  contents: read

jobs:
  win-build:
    runs-on: windows-2022
    strategy:
      matrix:
        BUILD_CONFIGURATION: [Release, Debug]
        PLATFORM: [x64, x86]

    steps:
    - name: Enable long paths
      run: git config --global core.longpaths true

    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Checkout submodules recursively
      run: git submodule update --init --recursive --remote
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3
      
    - name: Build dependencies (googletest and zlib)
      working-directory: TinyAntivirus
      run: |
        .\ci\windows\build_appveyor.bat ${{matrix.PLATFORM}} ${{matrix.BUILD_CONFIGURATION}}
      shell: cmd

    - name: Upload build directory 
      if: matrix.BUILD_CONFIGURATION == 'Release'
      uses: actions/upload-artifact@v7
      with:
        name: tinyantivirus_release_binaries_${{matrix.PLATFORM}}
        path: |
          ./TinyAntivirus/x64/${{matrix.BUILD_CONFIGURATION}}/
          ./TinyAntivirus/${{matrix.BUILD_CONFIGURATION}}/
