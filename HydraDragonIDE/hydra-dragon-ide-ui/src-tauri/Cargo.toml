[package]
name = "hydra-dragon-ide"
version = "0.1.0"
edition = "2021"
default-run = "hydra-dragon-ide"

[lib]
name = "hydra_dragon_ide"
path = "src/lib.rs"
crate-type = ["lib"]

[[bin]]
name = "hydra-dragon-ide"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
tauri = { version = "2.10.3", features = [] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
capstone = "0.14.0"
yara-x = "1.14.0"
base64 = { version = "0.22.1", features = ["std"] }
sha2 = "0.11.0"
hex = "0.4.3"
rfd = "0.17.2"
goblin = { version = "0.10.5", default-features = false, features = ["pe32", "pe64", "elf32", "elf64"] }
regex = "1.12.3"
memchr = "2.8.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
