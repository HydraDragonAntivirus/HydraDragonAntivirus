# TEST #30: Hijacking:SupersedeServiceDll — Block service DLL replacement
- name: "HEUR:Win.Hijacking.ServiceDLLSupersede.gen"
  author: "HydraDragon"
  date: "2026-03-26"
  status: production
  level: critical
  severity: 100
  description: |
    Detects modification of service DLL paths (ServiceDll, Parameters registry).
    Threat actors replace legitimate service DLLs with malicious versions
    to maintain persistence and execute with SYSTEM privileges.
    COMODO Test #30: Hijacking:SupersedeServiceDll
    Blocks service DLL path modification.
  debug: false

  allowlisted_apps:
    - pattern: "C:/Windows/System32/msiexec.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "C:/Windows/System32/svchost.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "C:/Windows/System32/services.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "%SystemRoot%/servicing/TrustedInstaller.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "%SystemRoot%/WinSxS/*/TiWorker.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "%SystemRoot%/UUS/*/MoUsoCoreWorker.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "%SystemRoot%/WinSxS/*/MoUsoCoreWorker.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "%SystemRoot%/System32/poqexec.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "%SystemRoot%/System32/wusa.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "%SystemRoot%/System32/Dism/DismHost.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]

  named_conditions:
    service_dll_modification:
      orderless: true
      registry_keys:
        - "HKLM\\SYSTEM\\CurrentControlSet\\Services"
        - "HKLM\\SYSTEM\\ControlSet001\\Services"
        - "HKLM\\SYSTEM\\ControlSet002\\Services"
      registry_values:
        - "ServiceDll"
        - "ImagePath"
        - "ImagePathValue"
        - "ServiceDllUnloadOnStop"
        - "FailureCommand"
        - "DllName"
      registry_operations: ["set", "create", "delete"]
      min_matches: 1

    service_reconfigure_api:
      orderless: true
      apis:
        - "*ChangeServiceConfig*"
        - "*ChangeServiceConfig2*"
        - "*OpenSCManager*"
        - "*OpenService*"
        - "*CreateService*"
        - "*RegCreateKey*"
        - "*RegCreateKeyEx*"
        - "*RegSetValue*"
        - "*RegSetValueEx*"
        - "*RegSetKeyValue*"
        - "*NtCreateKey*"
        - "*ZwCreateKey*"
        - "*NtSetValueKey*"
        - "*ZwSetValueKey*"
      api_threshold: 1
      min_matches: 1

    suspicious_service_dll_payload:
      orderless: true
      registry_value_data_patterns:
        - "*.dll*"
        - "*.sys*"
        - "*\\users\\*"
        - "*\\appdata\\*"
        - "*\\temp\\*"
        - "*\\public\\*"
        - "*\\downloads\\*"
      min_matches: 1

    caller_unsigned:
      orderless: true
      is_signed: false
      min_matches: 1

  detection_logic:
    or:
      - condition: "service_dll_modification"
      - condition: "service_reconfigure_api"
      - condition: "suspicious_service_dll_payload"

  response:
    notify_user: true
    ask_user: false
    terminate_process: true
    status_access_denied: true
    record: true
    auto_revert: true

  tags: ["hijacking", "services", "persistence", "dll-replacement"]
  mitre_attack: ["T1547.001"]

