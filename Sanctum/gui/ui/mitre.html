<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css">
    <script src="nav.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sanctum - MITRE ATT&amp;CK</title>

    <style>
      .mitre-shell {
        display: grid;
        gap: 18px;
      }

      .mitre-status {
        min-height: 22px;
        color: var(--t-muted);
        font-family: 'IBM Plex Mono', monospace;
        font-size: 12px;
        word-break: break-word;
      }

      .mitre-kpis {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
        gap: 12px;
      }

      .mitre-kpi,
      .mitre-panel,
      .tactic-lane,
      .network-item,
      .event-row {
        border: 1px solid var(--border-main);
        border-radius: 8px;
        background: rgba(3, 4, 8, 0.42);
      }

      .mitre-kpi {
        min-height: 92px;
        padding: 14px;
      }

      .mitre-kpi span {
        display: block;
        color: var(--t-muted);
        font-family: 'IBM Plex Mono', monospace;
        font-size: 11px;
        text-transform: uppercase;
      }

      .mitre-kpi strong {
        display: block;
        margin-top: 8px;
        color: var(--t-primary);
        font-size: 28px;
        line-height: 1.1;
      }

      .mitre-panel {
        padding: 18px;
      }

      .mitre-panel h2 {
        margin: 0 0 14px 0;
        color: var(--t-primary);
        font-size: 18px;
      }

      .tactic-graph {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
      }

      .tactic-lane {
        min-height: 150px;
        padding: 12px;
      }

      .tactic-lane h3 {
        margin: 0 0 10px 0;
        color: var(--accent-blue);
        font-family: 'IBM Plex Mono', monospace;
        font-size: 12px;
        text-transform: uppercase;
      }

      .tech-node {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 8px;
        min-height: 38px;
        margin-bottom: 8px;
        padding: 8px;
        border-left: 3px solid var(--accent-red);
        background: rgba(255, 255, 255, 0.04);
        color: var(--t-secondary);
        font-size: 12px;
      }

      .tech-node code,
      .archive-path {
        color: var(--accent-amber);
        font-family: 'IBM Plex Mono', monospace;
        font-size: 11px;
      }

      .tech-node b {
        color: var(--t-primary);
        font-size: 12px;
        overflow-wrap: anywhere;
      }

      .tech-node span:last-child {
        color: var(--accent-green);
        font-family: 'IBM Plex Mono', monospace;
        font-size: 12px;
      }

      .network-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 10px;
      }

      .network-item {
        min-height: 48px;
        padding: 10px;
        color: var(--t-secondary);
        font-family: 'IBM Plex Mono', monospace;
        font-size: 12px;
        overflow-wrap: anywhere;
      }

      .event-stream {
        display: grid;
        gap: 10px;
      }

      .event-row {
        display: grid;
        grid-template-columns: 92px 1fr;
        gap: 12px;
        padding: 12px;
      }

      .event-sev {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 11px;
        text-transform: uppercase;
      }

      .event-main strong {
        display: block;
        margin-bottom: 4px;
        color: var(--t-primary);
      }

      .event-main span {
        color: var(--t-secondary);
        font-size: 13px;
        overflow-wrap: anywhere;
      }

      .event-main code {
        display: block;
        margin-top: 8px;
        color: var(--t-muted);
        font-family: 'IBM Plex Mono', monospace;
        font-size: 11px;
        white-space: normal;
        overflow-wrap: anywhere;
      }

      .timeline-source {
        color: var(--t-primary);
      }

      .timeline-source .owlyshield-cache-entry {
        margin: 16px 0;
      }

      .timeline-source .cache-source {
        margin-bottom: 8px;
        color: var(--t-muted);
        font-family: 'IBM Plex Mono', monospace;
        font-size: 11px;
        overflow-wrap: anywhere;
      }

      .timeline-source .cache-separator {
        border: 0;
        border-top: 1px solid var(--border-main);
        margin: 22px 0;
      }

      .timeline-source .attack-timeline,
      .timeline-source .sanctum-timeline {
        max-width: none;
        margin: 0;
        padding: 16px;
        border: 1px solid var(--border-main);
        border-radius: 8px;
        background: rgba(3, 4, 8, 0.48);
        color: var(--t-primary);
      }

      .timeline-source .timeline-summary,
      .timeline-source .timeline-event,
      .timeline-source .event-content,
      .timeline-source .event-details {
        background: rgba(255, 255, 255, 0.04);
        color: var(--t-secondary);
      }

      .timeline-source .timeline-header h2,
      .timeline-source .timeline-header h3,
      .timeline-source .event-type,
      .timeline-source .event-details strong {
        color: var(--t-primary);
      }

      .timeline-source .event-description {
        color: var(--t-secondary);
      }

      .timeline-source .technique-badge,
      .timeline-source .technique-tag,
      .timeline-source .tactic-badge {
        border-radius: 6px;
      }

      .mitre-empty-state {
        padding: 18px;
        border: 1px solid var(--border-main);
        border-radius: 8px;
        background: rgba(3, 4, 8, 0.42);
      }

      .mitre-empty-state h2 {
        margin-top: 0;
      }

      @media (max-width: 760px) {
        .event-row {
          grid-template-columns: 1fr;
        }
      }
    </style>

    <script>
      document.addEventListener("DOMContentLoaded", function() {
        const status = document.getElementById("mitre_status");
        const source = document.getElementById("timeline_source");
        const graph = document.getElementById("tactic_graph");
        const networkList = document.getElementById("network_list");
        const detectionList = document.getElementById("detection_list");

        const tacticOrder = [
          "Reconnaissance",
          "Resource Development",
          "Initial Access",
          "Execution",
          "Persistence",
          "Privilege Escalation",
          "Defense Evasion",
          "Credential Access",
          "Discovery",
          "Lateral Movement",
          "Collection",
          "Command and Control",
          "Exfiltration",
          "Impact",
          "Unmapped"
        ];

        function setMetric(id, value) {
          document.getElementById(id).textContent = String(value);
        }

        function text(node, selector) {
          const target = selector ? node.querySelector(selector) : node;
          return target ? target.textContent.trim() : "";
        }

        function clear(node) {
          while (node.firstChild) {
            node.removeChild(node.firstChild);
          }
        }

        function addText(parent, tag, className, value) {
          const node = document.createElement(tag);
          if (className) {
            node.className = className;
          }
          node.textContent = value;
          parent.appendChild(node);
          return node;
        }

        function normalizeTactic(value) {
          const lower = value.toLowerCase();
          if (lower.includes("command") && lower.includes("control")) return "Command and Control";
          return tacticOrder.find((name) => lower.includes(name.toLowerCase())) || value || "Unmapped";
        }

        function severityColor(severity) {
          const value = severity.toLowerCase();
          if (value.includes("critical")) return "#ff3e3e";
          if (value.includes("high")) return "#f97316";
          if (value.includes("medium")) return "#f59e0b";
          if (value.includes("low")) return "#10b981";
          return "#3b82f6";
        }

        function renderTimelineHtml(html) {
          const holder = document.createElement("div");
          holder.innerHTML = html;
          holder.querySelectorAll("script, style").forEach((node) => node.remove());
          clear(source);
          while (holder.firstChild) {
            source.appendChild(holder.firstChild);
          }
        }

        function collectTechniqueData() {
          const techniques = new Map();
          source.querySelectorAll(".technique-badge, .technique-tag").forEach((node) => {
            const raw = text(node);
            const idMatch = raw.match(/T\d{4}(?:\.\d{3})?/);
            const id = text(node, ".technique-id") || (idMatch ? idMatch[0] : raw.slice(0, 16));
            const name = text(node, ".technique-name") || raw.replace(id, "").trim() || "Technique";
            const tactic = normalizeTactic(text(node, ".technique-tactic") || "Unmapped");
            const key = id + "|" + tactic + "|" + name;
            const current = techniques.get(key) || { id, name, tactic, count: 0 };
            current.count += 1;
            techniques.set(key, current);
          });
          return Array.from(techniques.values());
        }

        function collectEventDetails(events) {
          const network = new Map();
          const detections = [];

          events.forEach((event) => {
            const severity = event.getAttribute("data-severity") || text(event, ".event-severity") || "Info";
            const eventType = text(event, ".event-type") || "Detection";
            const description = text(event, ".event-description") || text(event);
            const details = Array.from(event.querySelectorAll(".event-details div"))
              .map((node) => text(node))
              .filter(Boolean);

            details.forEach((line) => {
              if (/network|destination|remote|domain|dns|ip|host|url|mitm/i.test(line)) {
                const value = line.replace(/^\s*(network|destination|remote|domain|dns|ip|host|url)\s*:\s*/i, "").trim();
                if (value) {
                  network.set(value, (network.get(value) || 0) + 1);
                }
              }
            });

            if (/mitm|detection|attack|rule|behavior|network|domain|ip|firewall|registry|file|process/i.test(eventType + " " + description + " " + details.join(" "))) {
              detections.push({ severity, eventType, description, details });
            }
          });

          return { network, detections };
        }

        function renderGraph(techniques, events) {
          clear(graph);
          const grouped = new Map();
          tacticOrder.forEach((name) => grouped.set(name, []));

          techniques.forEach((technique) => {
            const tactic = grouped.has(technique.tactic) ? technique.tactic : "Unmapped";
            grouped.get(tactic).push(technique);
          });

          if (techniques.length === 0 && events.length > 0) {
            events.forEach((event) => {
              const severity = event.getAttribute("data-severity") || text(event, ".event-severity") || "Info";
              grouped.get("Unmapped").push({
                id: severity,
                name: text(event, ".event-type") || "Detection",
                tactic: "Unmapped",
                count: 1
              });
            });
          }

          grouped.forEach((items, tactic) => {
            if (!items.length) {
              return;
            }
            const lane = document.createElement("section");
            lane.className = "tactic-lane";
            addText(lane, "h3", "", tactic);
            items
              .sort((a, b) => b.count - a.count || a.id.localeCompare(b.id))
              .slice(0, 8)
              .forEach((item) => {
                const node = document.createElement("div");
                node.className = "tech-node";
                addText(node, "code", "", item.id);
                addText(node, "b", "", item.name);
                addText(node, "span", "", item.count + "x");
                lane.appendChild(node);
              });
            graph.appendChild(lane);
          });

          if (!graph.children.length) {
            addText(graph, "div", "network-item", "Waiting for archived MITRE ATT&CK detections.");
          }
        }

        function renderNetwork(network) {
          clear(networkList);
          Array.from(network.entries())
            .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
            .slice(0, 40)
            .forEach(([value, count]) => {
              const item = document.createElement("div");
              item.className = "network-item";
              item.textContent = value + "  [" + count + "]";
              networkList.appendChild(item);
            });

          if (!networkList.children.length) {
            addText(networkList, "div", "network-item", "No network, IP, domain, or MITM evidence in the archive yet.");
          }
        }

        function renderDetections(detections) {
          clear(detectionList);
          detections.slice(0, 80).forEach((event) => {
            const row = document.createElement("div");
            row.className = "event-row";
            const sev = addText(row, "div", "event-sev", event.severity);
            sev.style.color = severityColor(event.severity);
            const main = document.createElement("div");
            main.className = "event-main";
            addText(main, "strong", "", event.eventType);
            addText(main, "span", "", event.description);
            if (event.details.length) {
              addText(main, "code", "", event.details.slice(0, 6).join(" | "));
            }
            row.appendChild(main);
            detectionList.appendChild(row);
          });

          if (!detectionList.children.length) {
            addText(detectionList, "div", "event-row", "No detections have been archived yet.");
          }
        }

        function buildOverview(data) {
          const events = Array.from(source.querySelectorAll(".timeline-event"));
          const techniques = collectTechniqueData();
          const details = collectEventDetails(events);
          const highEvents = events.filter((event) => {
            const severity = event.getAttribute("data-severity") || text(event, ".event-severity");
            return /critical|high/i.test(severity);
          }).length;

          setMetric("metric_timelines", data.timeline_count || source.querySelectorAll(".owlyshield-cache-entry, .attack-timeline, .sanctum-timeline").length);
          setMetric("metric_events", events.length);
          setMetric("metric_techniques", techniques.length);
          setMetric("metric_high", highEvents);
          setMetric("metric_network", details.network.size);
          setMetric("metric_archived", data.archived_files || 0);

          document.getElementById("archive_path").textContent = data.archive_dir || "C:\\ProgramData\\HydraDragonAntivirus\\Sanctum\\mitre_attack";
          renderGraph(techniques, events);
          renderNetwork(details.network);
          renderDetections(details.detections);
        }

        async function loadOverview() {
          status.textContent = "Loading MITRE ATT&CK archive...";
          try {
            if (!window.__TAURI__ || !window.__TAURI__.core) {
              throw new Error("Tauri API is not available in this preview.");
            }
            const { invoke } = window.__TAURI__.core;
            const response = await invoke("mitre_attack_overview");
            const data = JSON.parse(response);
            renderTimelineHtml(data.timeline || "");
            buildOverview(data);
            const archiveErrors = Array.isArray(data.archive_errors) && data.archive_errors.length
              ? " Archive warning: " + data.archive_errors.join(" | ")
              : "";
            status.textContent = (data.message || "MITRE ATT&CK archive loaded.") + archiveErrors;
          } catch (error) {
            status.textContent = String(error);
            renderTimelineHtml("<section class='mitre-empty-state'><h2>MITRE ATT&CK archive unavailable</h2><p>" + String(error) + "</p></section>");
            buildOverview({});
          }
        }

        loadOverview();
      });
    </script>
  </head>
  <body>
    <header id="header"><p>Sanctum Home EDR</p></header>

    <div id="container">
      <main id="center" class="column">
        <article class="mitre-shell">
          <h1>MITRE ATT&amp;CK</h1>

          <div class="full_callout">
            <b>Persistent Attack Timeline</b>
            <div id="mitre_status" class="mitre-status"></div>
            <div class="archive-path" id="archive_path"></div>
          </div>

          <section class="mitre-kpis">
            <div class="mitre-kpi"><span>Timelines</span><strong id="metric_timelines">0</strong></div>
            <div class="mitre-kpi"><span>Events</span><strong id="metric_events">0</strong></div>
            <div class="mitre-kpi"><span>Techniques</span><strong id="metric_techniques">0</strong></div>
            <div class="mitre-kpi"><span>High/Critical</span><strong id="metric_high">0</strong></div>
            <div class="mitre-kpi"><span>IPs/Domains</span><strong id="metric_network">0</strong></div>
            <div class="mitre-kpi"><span>Archived</span><strong id="metric_archived">0</strong></div>
          </section>

          <section class="mitre-panel">
            <h2>ATT&amp;CK Graph</h2>
            <div id="tactic_graph" class="tactic-graph"></div>
          </section>

          <section class="mitre-panel">
            <h2>Network, Domain, IP, MITM Evidence</h2>
            <div id="network_list" class="network-grid"></div>
          </section>

          <section class="mitre-panel">
            <h2>Detection Timeline</h2>
            <div id="detection_list" class="event-stream"></div>
          </section>

          <section class="mitre-panel">
            <h2>Raw Timelines</h2>
            <div id="timeline_source" class="timeline-source"></div>
          </section>
        </article>
      </main>

      <div id="nav-placeholder"></div>
    </div>
  </body>
</html>
