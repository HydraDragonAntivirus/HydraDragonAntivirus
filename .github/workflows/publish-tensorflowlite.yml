name: Publish TensorFlow Lite

on:
  push:
    branches: [development-version]
    paths:
      - "Owlyshield/owlyshield_predict/**/*.dll"
      - ".github/workflows/publish-tensorflowlite.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    if: |
      !startsWith(github.ref_name, 'auto-update-') &&
      !contains(github.event.head_commit.message, 'chore(tensorflow): update tensorflowlite_c.dll') &&
      github.event.head_commit.author.name != 'github-actions[bot]'
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true

      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up MSVC Developer Command Prompt
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Update Owlyshield Predict lockfile
        working-directory: Owlyshield/owlyshield_predict
        run: cargo update

      - name: Format Rust sources
        shell: pwsh
        run: |
          rustup component add rustfmt
          cargo fmt --manifest-path Owlyshield/owlyshield_predict/Cargo.toml --all
          cargo fmt --manifest-path Owlyshield/owlyshield_predict/moonfire-tflite/Cargo.toml --all

      - name: Stage TensorFlow Lite
        shell: pwsh
        run: |
          $serviceDir = "hydradragon/Owlyshield/Owlyshield Service"
          New-Item -ItemType Directory -Force -Path $serviceDir | Out-Null
          
          Copy-Item "Owlyshield/owlyshield_predict/moonfire-tflite/lib/tensorflowlite_c.dll" $serviceDir -Force

      - name: Check for publishable changes
        id: check_changes
        uses: ./.github/actions/check-publishable-changes
        with:
          paths: |
            hydradragon/Owlyshield/Owlyshield Service/tensorflowlite_c.dll
            Owlyshield/owlyshield_predict/Cargo.lock
            Owlyshield/owlyshield_predict
            
      - name: Create PR
        if: steps.check_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(tensorflow): update tensorflowlite_c.dll"
          title: "Update TensorFlow Lite DLL"
          body: "Automated TensorFlow Lite DLL update."
          add-paths: |
            ${{ steps.check_changes.outputs.publishable_files }}
          branch: "auto-update-tensorflowlite"
          base: ${{ github.ref_name }}
          delete-branch: true
          labels: binaries, automated-pr, owlyshield
