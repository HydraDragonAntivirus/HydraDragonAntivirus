- id: VK-VIRUS-APPENDER-RWX-64
  title: Writable, executable, encrypted last section the entry point does not use (64-bit)
  description: 'Entry-point-obscuring appender: the body is a large encrypted RWX last section, but the entry point stays in the host and the body is reached from patched host code. Packers keep their entry
    point in the packed section, so it is excluded (has_entry false). Retrohunt 0 of ~34000 clean PE.'
  severity: critical
  verdict: malware
  confidence: 85
  score: 100
  family: Virus.Win64.Appender.RWX
  tags:
  - analyst
  - virus
  - infector
  - polymorphic
