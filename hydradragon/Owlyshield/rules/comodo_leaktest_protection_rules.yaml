# TEST #8: Invasion:FileDrop — Prevent suspicious file creation in critical paths
- name: "HEUR:Win.Invasion.MaliciousFileDrop.gen"
  author: "HydraDragon"
  date: "2026-03-26"
  status: production
  level: critical
  severity: 100
  description: |
    Detects creation or write operations targeting critical system directories
    from non-System32 or non-trusted processes.
    COMODO Test #8: Invasion:FileDrop
    Blocks file writes to protected system locations.
  debug: false

  named_conditions:
    protected_directory_write:
      orderless: true
      file_paths:
        - "C:\\Windows\\System32\\*"
        - "C:\\Windows\\SysWOW64\\*"
        - "C:\\Windows\\System\\*"
        - "C:\\Program Files\\*"
        - "C:\\Program Files (x86)\\*"
      file_operations: ["create", "write"]
      exclude_processes:
        - "msiexec.exe"
        - "wusa.exe"
        - "rundll32.exe"
        - "svchost.exe"
        - "csrss.exe"
        - "explorer.exe"
      min_matches: 1

    process_not_trusted:
      orderless: true
      process_signature_status: "unsigned"
      process_path_contains:
        - "AppData"
        - "Temp"
        - "Public"
        - "Downloads"
      min_matches: 1

  detection_logic:
    and:
      - condition: "protected_directory_write"
      - condition: "process_not_trusted"

  response:
    notify_user: true
    ask_user: true
    terminate_process: true
    status_access_denied: true
    record: true

  tags: ["invasion", "file-drop", "persistence"]
  mitre_attack: ["T1105"]

