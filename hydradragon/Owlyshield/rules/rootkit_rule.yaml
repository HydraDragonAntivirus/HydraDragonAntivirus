# additions.txt - Supplementary Rootkit Detection Rules
# This file is loaded by Owlyshield's behavior engine to supplement kernel-mode detection.

- name: "Classic Rootkit: Shadow Driver Load"
  description: "Detects attempts to load drivers from common rootkit locations or with suspicious names."
  severity: 3
  conditions:
    - type: "irp_operation"
      operation: "WRITE"
      path_contains: "\\System32\\drivers\\"
      extension_is: "sys"
    - type: "condition_match_count"
      condition_name: "irp_operation"
      min_count: 1
  actions:
    terminate: true
    notify_user: true

- name: "Classic Rootkit: Hidden File Access Attempt"
  description: "Detects processes attempting to access files typically used by rootkits for persistence."
  severity: 2
  conditions:
    - type: "irp_operation"
      operation: "READ"
      path_contains: "\\SystemVolumeInformation\\_restore{"
  actions:
    notify_user: true
