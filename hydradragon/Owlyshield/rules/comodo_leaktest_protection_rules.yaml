# TEST #32: Hijacking:ChangeDebuggerPath — Prevent Image File Execution Options tampering
- name: "HEUR:Win.Hijacking.ImageFileExecutionOptions.gen"
  author: "HydraDragon"
  date: "2026-03-26"
  status: production
  level: high
  severity: 90
  description: |
    Detects modification of Image File Execution Options registry to redirect
    process execution or inject debuggers. Threat actors use this to:
    - Redirect exe execution to malicious payloads
    - Inject malware via debugger launch
    - Bypass UAC/Code Integrity checks
    COMODO Test #32: Hijacking:ChangeDebuggerPath
    Blocks debugger path and exec redirection.
  debug: false

  named_conditions:
    ifeo_registry_modification:
      orderless: true
      registry_keys:
        - "HKLM\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Image File Execution Options"
        - "HKCU\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Image File Execution Options"
      registry_values:
        - "Debugger"
        - "GlobalFlag"
        - "PageHeapFlags"
      registry_operations: ["set", "create"]
      min_matches: 1

    debugger_path_suspicious:
      orderless: true
      cmdline_keywords:
        - "cmd.exe"
        - "powershell.exe"
        - "AppData"
        - "Temp"
      min_matches: 1

  detection_logic:
    and:
      - condition: "ifeo_registry_modification"
      - or:
          - condition: "debugger_path_suspicious"

  response:
    notify_user: true
    ask_user: true
    terminate_process: true
    status_access_denied: true
    record: true
    auto_revert: true

  tags: ["hijacking", "ifeo", "debugger", "execution-redirection"]
  mitre_attack: ["T1547.012"]

