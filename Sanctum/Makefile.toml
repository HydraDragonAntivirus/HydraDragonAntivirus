[env]
CARGO_MAKE_EXTEND_WORKSPACE_MAKEFILE = true

[tasks.release]
description = "Build release version"
command = "cargo"
args = ["build", "--release"]

[tasks.build-client]
description = "Build the usermode client for Sanctum."
command = "cargo"
args = ["build", "-p", "um_engine"]

[tasks.build-client-release]
description = "Build the usermode client for Sanctum."
command = "cargo"
args = ["build", "--release", "-p", "um_engine"]

[tasks.build-driver]
description = "Build and package the Sanctum kernel driver."
workspace = false
cwd = "driver"
command = "cargo"
args = ["make", "default"]

[tasks.build-driver-release]
description = "Build and package the Sanctum kernel driver in release mode."
workspace = false
cwd = "driver"
command = "cargo"
args = ["make", "release"]

[tasks.clean-client]
description = "Clean the usermode client for Sanctum."
command = "cargo"
args = ["clean", "-p", "um_engine"]
