# TEST #13: Injection:Services — Block malicious service installation from non-System processes
- name: "HEUR:Win.Injection.MaliciousServiceCreation.gen"
  author: "HydraDragon"
  date: "2026-03-26"
  status: production
  level: critical
  severity: 100
  description: |
    Detects service creation (via Services registry key or CreateService API)
    from non-privileged processes. Service DLL injection allows code execution
    with SYSTEM privileges across reboots.
    COMODO Test #13: Injection:Services
    Blocks unauthorized service installation.
  debug: false

  named_conditions:
    service_registry_create:
      orderless: true
      registry_keys:
        - "HKLM\\SYSTEM\\CurrentControlSet\\Services\\*"
        - "HKLM\\SYSTEM\\ControlSet[0-9]\\Services\\*"
      registry_operations: ["create"]
      registry_values:
        - "ImagePath"
      min_matches: 1

    createservice_api:
      orderless: true
      kernel_api_calls:
        - "advapi32.dll!CreateServiceA"
        - "advapi32.dll!CreateServiceW"
      api_threshold: 1

    non_system_caller:
      orderless: true
      calling_process_privilege_level: "user"
      calling_process_signature_status: ["unsigned", "untrusted"]
      min_matches: 1

    service_dll_suspicious:
      orderless: true
      registry_values_contain:
        - "AppData"
        - "Temp"
        - "ProgramData"
      min_matches: 1

  detection_logic:
    and:
      - or:
          - condition: "service_registry_create"
          - condition: "createservice_api"
      - condition: "non_system_caller"

  response:
    notify_user: true
    ask_user: true
    terminate_process: true
    status_access_denied: true
    record: true
    auto_revert: true

  tags: ["injection", "services", "persistence", "privilege-escalation"]
  mitre_attack: ["T1543.003"]

