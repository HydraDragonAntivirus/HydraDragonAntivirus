name: Rust Lockfile Auto Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-lockfiles:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Update lockfiles
        shell: pwsh
        run: |
          cargo update --manifest-path HydraDragonFirewall/hydradragonfirewall/Cargo.toml
          cargo update --manifest-path HydraDragonFirewall/hydradragonfirewall/ui/Cargo.toml
          cargo update --manifest-path HydraDragonFirewall/windivert-rust-master/Cargo.toml

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(deps): auto-update rust lockfiles"
          title: "chore(deps): auto-update rust lockfiles"
          body: |
            Automated Rust dependency update for:
            - `HydraDragonFirewall/hydradragonfirewall/Cargo.lock`
            - `HydraDragonFirewall/hydradragonfirewall/ui/Cargo.lock`
            - `HydraDragonFirewall/windivert-rust-master/Cargo.lock`
          branch: "chore/rust-lockfile-autoupdate"
          labels: |
            dependencies
            rust
          delete-branch: true
