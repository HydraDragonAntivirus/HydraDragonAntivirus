name: Sanctum EDR CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  WDK_URL: https://go.microsoft.com/fwlink/?linkid=2335869

jobs:
  build-sanctum-driver:
    name: Build Sanctum Driver
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
      - name: Set up Rust (Nightly)
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Cargo Make
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-make
      - name: Install rust-script
        run: cargo install rust-script --version 0.30.0
      - name: Setup WDK
        shell: pwsh
        run: |
          $wdkSetupPath = "$Env:TEMP\wdksetup.exe"
          (New-Object Net.WebClient).DownloadFile('${{ env.WDK_URL }}', $wdkSetupPath)
          Start-Process -FilePath $wdkSetupPath -ArgumentList "/quiet" -NoNewWindow -Wait

      - name: Prepare Driver Build Environment
        working-directory: Sanctum/driver
        shell: pwsh
        run: |
          # Create target directory if it doesn't exist
          New-Item -ItemType Directory -Force -Path "target" | Out-Null
          
          # Fetch dependencies to ensure wdk-build is available
          cargo fetch
          
          # Copy rust-driver-makefile.toml from wdk-build crate to target directory
          $wdkBuildPath = (cargo metadata --format-version 1 | ConvertFrom-Json).packages | Where-Object { $_.name -eq "wdk-build" } | Select-Object -First 1 -ExpandProperty manifest_path | Split-Path
          $sourceFile = Join-Path $wdkBuildPath "rust-driver-makefile.toml"
          $destFile = "target\rust-driver-makefile.toml"
          
          if (Test-Path $sourceFile) {
            Write-Host "Copying $sourceFile to $destFile"
            Copy-Item $sourceFile $destFile -Force
          } else {
            Write-Host "Warning: Could not find rust-driver-makefile.toml at $sourceFile"
          }

      - name: Build Driver (Debug)
        working-directory: Sanctum
        run: cargo make build-driver

      - name: Build Driver (Release)
        working-directory: Sanctum
        run: cargo make build-driver-release

  build-sanctum-um:
    name: Build Sanctum Usermode Components
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Cargo Make
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-make

      - name: Build Usermode Components (Release)
        working-directory: Sanctum
        run: cargo make release

  sanctum-lint:
    name: Sanctum Lint and Check
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Set up Rust (Nightly)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt

      - name: Cargo Check (Workspace)
        working-directory: Sanctum
        run: cargo check

      - name: Cargo Clippy (Workspace)
        working-directory: Sanctum
        run: cargo clippy -- -D warnings
