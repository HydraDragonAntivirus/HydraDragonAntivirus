# ---------------------------------------------------------------------------
# Rule 7: Rootkit on NtCreateFile hook specifically
# Low-false-positive: hooking NtCreateFile outside ntoskrnl is almost always
# malicious (legitimate products use minifilters instead).
# ---------------------------------------------------------------------------
- name: "HEUR:Win64.Rootkit.NtCreateFileHook"
  description: >
    NtCreateFile has been inline-hooked by code outside ntoskrnl.
    Legitimate security products use minifilters; direct SSDT/inline hooks
    on file I/O functions are characteristic of rootkits.
  author: "HydraDragon"
  severity: 5
  tags:
    - rootkit
    - kernel_hook
    - file_hook

  named_conditions:
    createfile_hook:
      rootkit_event_types: ["kernel_hook"]
      rootkit_description_contains:
