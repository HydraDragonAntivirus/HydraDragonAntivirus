  stages:
    - name: Get Thread Context
      conditions:
        - type: Api
          functions:
            - NtGetContextThread
    - name: Set Thread Context
      conditions:
        - type: Api
          functions:
            - NtSetContextThread
    - name: Resume Thread
      conditions:
        - type: Api
