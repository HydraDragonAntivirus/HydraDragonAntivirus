# TEST #8: Invasion:FileDrop — Prevent suspicious file creation in critical paths
- name: "HEUR:Win.Invasion.MaliciousFileDrop.gen"
  author: "HydraDragon"
  date: "2026-03-26"
  status: production
  level: critical
  severity: 100
  description: |
    Detects creation or write of executable/DLL/driver files into core OS
    directories (System32, SysWOW64, drivers) by an unsigned process that
    also originates from a user-writable location.
    COMODO Test #8: Invasion:FileDrop
  debug: false

  allowlisted_apps:
    - pattern: "C:/Windows/System32/msiexec.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "C:/Windows/System32/wusa.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "C:/Windows/System32/svchost.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "C:/Windows/System32/services.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "%SystemRoot%/servicing/TrustedInstaller.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "%SystemRoot%/WinSxS/*/TiWorker.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "%SystemRoot%/UUS/*/MoUsoCoreWorker.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "%SystemRoot%/WinSxS/*/MoUsoCoreWorker.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "%SystemRoot%/System32/poqexec.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "%SystemRoot%/System32/Dism/DismHost.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "%SystemRoot%/System32/drvinst.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "C:/Windows/System32/csrss.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "C:/Program Files/HydraDragonAntivirus/HydraDragonFirewall/hydradragonfirewall.exe"
      is_absolute: true

  named_conditions:
    # ── Condition 1: Write to SPECIFIC sensitive OS directories only ─────────
    # Anchored to System32\, SysWOW64\, and System32\drivers\ only.
    # Extension globs are tied to these paths via compound patterns.
    sensitive_os_dir_write:
      orderless: true
      file_paths:
        # Anchored to System32 — only .exe/.dll/.sys/.drv drops here are dangerous
        - "C:\\Windows\\System32\\*.exe"
        - "C:\\Windows\\System32\\*.dll"
        - "C:\\Windows\\System32\\*.sys"
        - "C:\\Windows\\System32\\*.drv"
        # Drivers subdirectory
        - "C:\\Windows\\System32\\drivers\\*.sys"
        - "C:\\Windows\\System32\\drivers\\*.dll"
        # 32-bit compat layer
        - "C:\\Windows\\SysWOW64\\*.exe"
        - "C:\\Windows\\SysWOW64\\*.dll"
        - "C:\\Windows\\SysWOW64\\*.sys"
      file_operations: ["create", "write"]
      min_matches: 1

    # ── Condition 2: Caller is unsigned ──────────────────────────────────────
    unsigned_caller:
      orderless: true
      is_signed: false
      min_matches: 1

    # ── Condition 3: Caller binary lives in a user-writable location ─────────
    # Requires BOTH unsigned AND user-space origin to reduce false positives.
    user_space_origin:
      orderless: true
      file_paths:
        - "*\\AppData\\*"
        - "*\\Downloads\\*"
        - "*\\Public\\*"
        - "*\\Temp\\*"
        - "C:\\Temp\\*"
        - "%TEMP%\\*"
      min_matches: 1

    # ── Condition 4: Exclude Prefetch writes (known benign pattern) ───────────
    prefetch_artifact_write:
      orderless: true
      file_paths:
        - "C:\\Windows\\Prefetch\\"
        - "*.pf"
      file_operations: ["create", "write", "setinfo"]
      min_matches: 1

  detection_logic:
    and:
      - condition: "sensitive_os_dir_write"
      - condition: "unsigned_caller"
      - condition: "user_space_origin"    # ← both unsigned AND from user-space
      - not:
          condition: "prefetch_artifact_write"

  response:
    notify_user: true
    ask_user: false
    terminate_process: true
    status_access_denied: true
    record: true

  tags:
    - invasion
    - file-drop
    - persistence
  mitre_attack:
    - T1105

