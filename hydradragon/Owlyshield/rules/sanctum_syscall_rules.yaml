- rule_id: HD-SAN-HIGH-0045
  name: '[HIGH] Compiler or temp builder launches ghosted child'
  description: 'Detects process-tree context often observed around Process Ghosting or Herpaderping: compiler or temp builder
    launches ghosted child.'
  enabled: true
  should_trust_comodo_cloud: false
  severity_score: 86
  severity: 86
  level: high
  status: experimental
  author: Emirhan Ucan
  date: '2026-05-15'
  tags:
  - category:high
  - process-tree
  - process-ghosting
  - process-herpaderping
  mitre_attack:
  - T1055.012
  - T1036
  references:
  - https://www.elastic.co/blog/process-ghosting-a-new-executable-image-tampering-attack
  - https://jxy-s.github.io/herpaderping/
  - https://detection.fyi/elastic/detection-rules/_deprecated/defense_evasion_potential_processherpaderping/
  false_positives:
  - Security tools, debuggers, profilers, EDR sensors, and malware-analysis sandboxes may produce similar low-level telemetry.
  stages:
  - name: ProcessTree ghost/herpaderp context
    conditions:
    - type: ProcessTree
      parent_patterns:
      - '*\cmd.exe'
      - '*\powershell.exe'
      - '*\pwsh.exe'
      - '*\csc.exe'
      - '*\msbuild.exe'
      child_patterns:
      - '*.tmp'
      - '*.dat'
      - '*.bin'
      - '*.log'
      command_line_patterns:
      - pattern: (?i).*(delete_pending|ghost|herp|section|NtCreateProcessEx).*
        is_regex: true
  min_stages_satisfied: 1
  response:
    ask_user: true
    deny_while_ask: false
    terminate_process: false
    quarantine: false
    status_access_denied: false
    notify_user: true
    record: true
