name: Python Lint

on:
  push:
    branches: ["**"]
    paths:
      - 'hydradragon/**'
      - '.github/workflows/python-lint.yml'
  pull_request:
    branches: ["**"]
    paths:
      - 'hydradragon/**'
      - '.github/workflows/python-lint.yml'
  workflow_dispatch:

jobs:
  flake8:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: |
          flake8 hydradragon/ --count --statistics --max-line-length=240 \
            --exclude=.git,.tox,.venv,venv,node_modules,build,dist,site-packages,__pycache__
