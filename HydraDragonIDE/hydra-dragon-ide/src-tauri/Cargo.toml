[package]
name = "hydradragonide"
version = "0.1.0"
description = "HydraDragonIDE Static Analysis Engine"
authors = ["Antigravity"]
edition = "2021"

[lib]
name = "hydradragonide"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.3", features = [] }

[dependencies]
tauri = { version = "2.1.1", features = [] }
serde = { version = "1.0.211", features = ["derive"] }
serde_json = "1.0.128"
capstone = "0.14.0"
goblin = "0.8"
yara-x = "1.14.0"
base64 = "0.22.1"
sha2 = "0.11.0"
hex = "0.4.3"
tauri-plugin-shell = "2.2.0"
tauri-plugin-opener = "2.2.0"
rfd = "0.17.2"
