name: Check publishable changes
description: Skip PRs for no-op, empty-file, or zero-byte binary-size changes.

inputs:
  paths:
    description: Newline-separated paths to inspect.
    required: false
    default: "."

outputs:
  changed:
    description: true when changed files are safe to publish.
    value: ${{ steps.check.outputs.changed }}
  zero_byte_files:
    description: Newline-separated zero-byte files found in changed files.
    value: ${{ steps.check.outputs.zero_byte_files }}
  zero_byte_delta_files:
    description: Newline-separated binary files whose before/after size did not change.
    value: ${{ steps.check.outputs.zero_byte_delta_files }}

runs:
  using: composite
  steps:
    - name: Check changes
      id: check
      shell: pwsh
      run: |
        $paths = @'
        ${{ inputs.paths }}
        '@ -split "`r?`n" | ForEach-Object { $_.Trim() } | Where-Object { $_ }

        $changedFiles = @()
        foreach ($path in $paths) {
          $changedFiles += @(git diff --name-only --diff-filter=ACDMR -- $path)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $changedFiles += @(git diff --cached --name-only --diff-filter=ACDMR -- $path)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $changedFiles += @(git ls-files --others --exclude-standard -- $path)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }

        $changedFiles = @($changedFiles | Where-Object { $_ } | Sort-Object -Unique)
        if ($changedFiles.Count -eq 0) {
          "changed=false" >> $env:GITHUB_OUTPUT
          "zero_byte_files=" >> $env:GITHUB_OUTPUT
          "zero_byte_delta_files=" >> $env:GITHUB_OUTPUT
          Write-Host "No publishable changes detected."
          exit 0
        }

        $zeroByteFiles = @()
        foreach ($file in $changedFiles) {
          if ((Test-Path -LiteralPath $file -PathType Leaf) -and ((Get-Item -LiteralPath $file).Length -eq 0)) {
            $zeroByteFiles += $file
          }
        }

        if ($zeroByteFiles.Count -gt 0) {
          "changed=false" >> $env:GITHUB_OUTPUT
          "zero_byte_files<<EOF" >> $env:GITHUB_OUTPUT
          $zeroByteFiles >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT
          "zero_byte_delta_files=" >> $env:GITHUB_OUTPUT
          Write-Host "Skipping PR because these changed files are zero bytes:"
          $zeroByteFiles | ForEach-Object { Write-Host " - $_" }
          exit 0
        }

        $binaryZeroDeltaFiles = @()
        $binarySizeChangedFiles = @()
        $textOrNewFiles = @()

        foreach ($file in $changedFiles) {
          $numstat = @()
          $numstat += @(git diff --numstat -- $file)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $numstat += @(git diff --cached --numstat -- $file)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $isBinaryDiff = $false
          foreach ($line in $numstat) {
            if ($line -match '^-\s+-\s+') {
              $isBinaryDiff = $true
            } elseif ($line) {
              $textOrNewFiles += $file
            }
          }

          if (-not $isBinaryDiff) {
            if ($numstat.Count -eq 0) {
              $textOrNewFiles += $file
            }
            continue
          }

          $newSize = 0
          if (Test-Path -LiteralPath $file -PathType Leaf) {
            $newSize = [int64](Get-Item -LiteralPath $file).Length
          }

          $oldSize = 0
          $headSpec = "HEAD:$file"
          git cat-file -e $headSpec 2>$null
          if ($LASTEXITCODE -eq 0) {
            $oldSize = [int64](git cat-file -s $headSpec)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          if ($oldSize -eq $newSize) {
            $binaryZeroDeltaFiles += $file
          } else {
            $binarySizeChangedFiles += $file
          }
        }

        if ($binaryZeroDeltaFiles.Count -gt 0 -and $binarySizeChangedFiles.Count -eq 0 -and $textOrNewFiles.Count -eq 0) {
          "changed=false" >> $env:GITHUB_OUTPUT
          "zero_byte_files=" >> $env:GITHUB_OUTPUT
          "zero_byte_delta_files<<EOF" >> $env:GITHUB_OUTPUT
          $binaryZeroDeltaFiles >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT
          Write-Host "Skipping PR because these binary changes have 0 bytes of size delta:"
          $binaryZeroDeltaFiles | ForEach-Object { Write-Host " - $_" }
          exit 0
        }

        "changed=true" >> $env:GITHUB_OUTPUT
        "zero_byte_files=" >> $env:GITHUB_OUTPUT
        "zero_byte_delta_files=" >> $env:GITHUB_OUTPUT
        Write-Host "Publishable changes detected:"
        $changedFiles | ForEach-Object { Write-Host " - $_" }
