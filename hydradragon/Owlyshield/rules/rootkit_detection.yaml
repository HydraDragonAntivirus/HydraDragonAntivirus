# ---------------------------------------------------------------------------
# Rule 6: Multiple rootkit finding types — full rootkit toolkit
# Fires when more than one finding category is triggered (e.g., hidden driver
# AND SSDT hook). Strong indicator of a sophisticated rootkit.
# ---------------------------------------------------------------------------
- name: "HEUR:Win64.Rootkit.MultiVector"
  description: >
    Multiple distinct rootkit detection categories triggered for the same
    process context. Indicative of a sophisticated, multi-component rootkit.
  author: "HydraDragon"
  severity: 5
  tags:
    - rootkit
    - multi_vector
    - kernel
  mitre_attack:
    - "T1014"

  named_conditions:
    ssdt_finding:
      rootkit_event_types: ["ssdt_hook"]

    driver_finding:
      rootkit_event_types: ["hidden_driver"]

    hook_finding:
      rootkit_event_types: ["kernel_hook"]

    proc_finding:
      rootkit_event_types: ["hidden_process"]

  detection_logic:
    # At least two distinct rootkit categories.
    count:
      - "ssdt_finding"
      - "driver_finding"
      - "hook_finding"
      - "proc_finding"
    comparison: gte
    threshold: 2

  response:
    ask_user: false
    terminate_process: false
    quarantine: false
    notify_user: true
    record: true

  allowlisted_apps:
    - pattern: "C:/Windows/System32/svchost.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "C:/Windows/System32/services.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "C:/Windows/System32/lsass.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "C:/Windows/System32/wininit.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "C:/Windows/System32/smss.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "C:/Windows/System32/csrss.exe"
