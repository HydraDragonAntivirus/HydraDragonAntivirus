        - "*NtSetValueKey*"
        - "*ZwSetValueKey*"
      registry_keys:
        - "HKLM\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Windows"
        - "HKCU\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Windows"
        - "HKLM\\SOFTWARE\\Wow6432Node\\Microsoft\\Windows NT\\CurrentVersion\\Windows"
      registry_values:
        - "AppInit_DLLs"
        - "LoadAppInit_DLLs"
