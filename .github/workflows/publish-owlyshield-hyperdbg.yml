name: Publish Owlyshield HyperDbg

on:
  push:
    branches: ["**"]
    paths:
      - "Owlyshield/HyperDbg/**"
      - ".github/workflows/publish-owlyshield-hyperdbg.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  WDK_URL: https://go.microsoft.com/fwlink/?linkid=2335869

jobs:
  publish:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true

      - uses: actions/checkout@v6

      - name: Set up MSVC Developer Command Prompt
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Setup WDK
        shell: pwsh
        run: |
          $wdkSetupPath = "$Env:TEMP\wdksetup.exe"
          (New-Object Net.WebClient).DownloadFile("${{ env.WDK_URL }}", $wdkSetupPath)
          Start-Process -FilePath $wdkSetupPath -ArgumentList "/quiet" -NoNewWindow -Wait

      - name: Build HyperDbg
        run: msbuild Owlyshield/HyperDbg/hyperdbg/hyperdbg.sln /p:Configuration=release /p:Platform=x64

      - name: Stage HyperDbg Files
        shell: pwsh
        run: |
          $source = "Owlyshield/HyperDbg/hyperdbg/build/bin/release/hyperhv"
          $destination = "hydradragon/Owlyshield/HyperDbg"
          
          if (Test-Path $source) {
            New-Item -ItemType Directory -Force -Path $destination | Out-Null
            Copy-Item -Path "$source/*" -Destination "$destination/" -Recurse -Force
          }

      - name: Check for publishable changes
        id: check_changes
        uses: ./.github/actions/check-publishable-changes
        with:
          paths: |
            hydradragon/Owlyshield/HyperDbg
      - name: Create PR
        if: steps.check_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(owlyshield): update hyperdbg binaries"
          title: "Update Owlyshield HyperDbg binaries"
          body: "Automated HyperDbg driver build output update."
          add-paths: |
            ${{ steps.check_changes.outputs.publishable_files }}
          branch: "auto-update-owlyshield-hyperdbg"
          base: ${{ github.ref_name }}
          delete-branch: true
          labels: binaries, automated-pr, owlyshield
