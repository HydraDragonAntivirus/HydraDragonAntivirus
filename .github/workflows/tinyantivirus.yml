name: TinyAntivirus

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - 'TinyAntivirus/**'
      - '.github/workflows/tinyantivirus.yml'
  pull_request:
    branches: ["**"]
    paths:
      - 'TinyAntivirus/**'
      - '.github/workflows/tinyantivirus.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  SOLUTION_FILE_PATH: "TinyAntivirus/TinyAntivirus.sln"
  BUILD_BIN_DIR: "./TinyAntivirus/x64/"

jobs:
  ci:
    runs-on: windows-2022
    strategy:
      matrix:
        BUILD_CONFIGURATION: [Release, Debug]
        PLATFORM: [x64, x86]
    steps:
      - name: Enable long paths
        run: git config --global core.longpaths true
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Checkout submodules recursively
        run: git submodule update --init --recursive --remote
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
      - name: Build dependencies (googletest and zlib)
        working-directory: TinyAntivirus
        run: .\ci\windows\build_appveyor.bat ${{matrix.PLATFORM}} ${{matrix.BUILD_CONFIGURATION}}
        shell: cmd
      - name: Upload build directory 
        if: matrix.BUILD_CONFIGURATION == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: tinyantivirus_release_binaries_${{matrix.PLATFORM}}
          path: |
            ./TinyAntivirus/x64/${{matrix.BUILD_CONFIGURATION}}/**
            !./TinyAntivirus/x64/${{matrix.BUILD_CONFIGURATION}}/**/*.cer
            ./TinyAntivirus/${{matrix.BUILD_CONFIGURATION}}/**
            !./TinyAntivirus/${{matrix.BUILD_CONFIGURATION}}/**/*.cer

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/development-version' && !startsWith(github.ref_name, 'auto-update-')
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
      - name: Build
        run: msbuild TinyAntivirus/TinyAntivirus.sln /p:Configuration=Release /p:Platform=x64
      - name: Stage
        shell: pwsh
        run: |
          $dist = "hydradragon/TinyAntivirus"
          New-Item -ItemType Directory -Force -Path $dist
          Copy-Item "TinyAntivirus/x64/Release/TinyAvConsole.exe" "$dist/" -Force
      - name: Check for publishable changes
        id: check_changes
        uses: ./.github/actions/check-publishable-changes
        with:
          paths: hydradragon/TinyAntivirus
      - name: Create PR
        if: steps.check_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(tinyav): update binaries"
          title: "Update TinyAntivirus Binaries"
          add-paths: ${{ steps.check_changes.outputs.publishable_files }}
          branch: "auto-update-tinyav"
          base: ${{ github.ref_name }}
          delete-branch: true
          labels: binaries, automated-pr, tinyantivirus, development-version
