<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css">
    <script src="nav.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sanctum - MITRE ATT&amp;CK</title>

    <style>
      .mitre-shell {
        display: grid;
        gap: 18px;
      }

      .mitre-status {
        min-height: 22px;
        color: var(--t-muted);
        font-family: 'IBM Plex Mono', monospace;
        font-size: 12px;
        word-break: break-word;
      }

      .mitre-kpis {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
        gap: 12px;
      }

      .mitre-kpi,
      .mitre-panel,
      .tactic-lane,
      .network-item,
      .event-row {
        border: 1px solid var(--border-main);
        border-radius: 8px;
        background: rgba(3, 4, 8, 0.42);
      }

      .mitre-kpi {
        min-height: 92px;
        padding: 14px;
      }

      .mitre-kpi span {
        display: block;
        color: var(--t-muted);
        font-family: 'IBM Plex Mono', monospace;
        font-size: 11px;
        text-transform: uppercase;
      }

      .mitre-kpi strong {
        display: block;
        margin-top: 8px;
        color: var(--t-primary);
        font-size: 28px;
        line-height: 1.1;
      }

      .mitre-panel {
        padding: 18px;
      }

      .mitre-panel h2 {
        margin: 0 0 14px 0;
        color: var(--t-primary);
        font-size: 18px;
      }

      .tactic-graph {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
      }

      .tactic-lane {
        min-height: 150px;
        padding: 12px;
      }

      .tactic-lane h3 {
        margin: 0 0 10px 0;
        color: var(--accent-blue);
        font-family: 'IBM Plex Mono', monospace;
        font-size: 12px;
        text-transform: uppercase;
      }

      .tech-node {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 8px;
        min-height: 38px;
        margin-bottom: 8px;
        padding: 8px;
        border-left: 3px solid var(--accent-red);
        background: rgba(255, 255, 255, 0.04);
        color: var(--t-secondary);
        font-size: 12px;
      }

      .tech-node code,
      .archive-path {
        color: var(--accent-amber);
        font-family: 'IBM Plex Mono', monospace;
        font-size: 11px;
      }

      .tech-node b {
        color: var(--t-primary);
        font-size: 12px;
        overflow-wrap: anywhere;
      }

      .tech-node span:last-child {
        color: var(--accent-green);
        font-family: 'IBM Plex Mono', monospace;
        font-size: 12px;
      }

      .network-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 10px;
      }

      .network-item {
        min-height: 48px;
        padding: 10px;
        color: var(--t-secondary);
        font-family: 'IBM Plex Mono', monospace;
        font-size: 12px;
        overflow-wrap: anywhere;
      }

      .event-stream {
        display: grid;
        gap: 10px;
      }

      .live-graph-wrap {
        position: relative;
        min-height: 360px;
        overflow: hidden;
        border: 1px solid var(--border-main);
        border-radius: 8px;
        background:
          radial-gradient(circle at 18% 22%, rgba(59, 130, 246, 0.18), transparent 26%),
          radial-gradient(circle at 82% 72%, rgba(16, 185, 129, 0.14), transparent 28%),
          rgba(3, 4, 8, 0.62);
      }

      #live_graph_canvas {
        display: block;
        width: 100%;
        height: 360px;
      }

      .live-graph-hud {
        position: absolute;
        left: 12px;
        top: 12px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        border: 1px solid var(--border-main);
        border-radius: 8px;
        background: rgba(3, 4, 8, 0.74);
        color: var(--t-secondary);
        font-family: 'IBM Plex Mono', monospace;
        font-size: 11px;
      }

      .live-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent-green);
        box-shadow: 0 0 14px var(--accent-green);
      }

      .event-row {
        display: grid;
        grid-template-columns: 92px 1fr;
        gap: 12px;
        padding: 12px;
      }

      .event-sev {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 11px;
        text-transform: uppercase;
      }

      .event-main strong {
        display: block;
        margin-bottom: 4px;
        color: var(--t-primary);
      }

      .event-main span {
        color: var(--t-secondary);
        font-size: 13px;
        overflow-wrap: anywhere;
      }

      .event-main code {
        display: block;
        margin-top: 8px;
        color: var(--t-muted);
        font-family: 'IBM Plex Mono', monospace;
        font-size: 11px;
        white-space: normal;
        overflow-wrap: anywhere;
      }

      .event-details-full {
        margin-top: 10px;
        color: var(--t-secondary);
        font-family: 'IBM Plex Mono', monospace;
        font-size: 11px;
      }

      .event-details-full summary {
        cursor: pointer;
        color: var(--accent-amber);
      }

      .event-detail-line {
        margin-top: 6px;
        padding: 7px 8px;
        border-left: 2px solid var(--border-main);
        background: rgba(255, 255, 255, 0.04);
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      .timeline-source {
        color: var(--t-primary);
      }

      .timeline-source .owlyshield-cache-entry {
        margin: 16px 0;
      }

      .timeline-source .cache-source {
        margin-bottom: 8px;
        color: var(--t-muted);
        font-family: 'IBM Plex Mono', monospace;
        font-size: 11px;
        overflow-wrap: anywhere;
      }

      .timeline-source .cache-separator {
        border: 0;
        border-top: 1px solid var(--border-main);
        margin: 22px 0;
      }

      .timeline-source .attack-timeline,
      .timeline-source .sanctum-timeline {
        max-width: none;
        margin: 0;
        padding: 16px;
        border: 1px solid var(--border-main);
        border-radius: 8px;
        background: rgba(3, 4, 8, 0.48);
        color: var(--t-primary);
      }

      .timeline-source .timeline-summary,
      .timeline-source .timeline-event,
      .timeline-source .event-content,
      .timeline-source .event-details {
        background: rgba(255, 255, 255, 0.04);
        color: var(--t-secondary);
      }

      .timeline-source .timeline-header h2,
      .timeline-source .timeline-header h3,
      .timeline-source .event-type,
      .timeline-source .event-details strong {
        color: var(--t-primary);
      }

      .timeline-source .event-description {
        color: var(--t-secondary);
      }

      .timeline-source .technique-badge,
      .timeline-source .technique-tag,
      .timeline-source .tactic-badge {
        border-radius: 6px;
      }

      .mitre-empty-state {
        padding: 18px;
        border: 1px solid var(--border-main);
        border-radius: 8px;
        background: rgba(3, 4, 8, 0.42);
      }

      .mitre-empty-state h2 {
        margin-top: 0;
      }

      @media (max-width: 760px) {
        .event-row {
          grid-template-columns: 1fr;
        }
      }
    </style>

    <script>
      document.addEventListener("DOMContentLoaded", function() {
        const status = document.getElementById("mitre_status");
        const source = document.getElementById("timeline_source");
        const graph = document.getElementById("tactic_graph");
        const networkList = document.getElementById("network_list");
        const detectionList = document.getElementById("detection_list");
        const liveCanvas = document.getElementById("live_graph_canvas");
        const liveCtx = liveCanvas.getContext("2d");
        const liveGraphLabel = document.getElementById("live_graph_label");
        const liveGraph = {
          nodes: [],
          edges: [],
          pulses: [],
          signature: "",
          eventCount: 0,
          lastUpdated: 0,
          rotation: 0
        };
        let lastTimelineSignature = "";
        let livePollTimer = null;

        const tacticOrder = [
          "Reconnaissance",
          "Resource Development",
          "Initial Access",
          "Execution",
          "Persistence",
          "Privilege Escalation",
          "Defense Evasion",
          "Credential Access",
          "Discovery",
          "Lateral Movement",
          "Collection",
          "Command and Control",
          "Exfiltration",
          "Impact",
          "Unmapped"
        ];

        function setMetric(id, value) {
          document.getElementById(id).textContent = String(value);
        }

        function text(node, selector) {
          const target = selector ? node.querySelector(selector) : node;
          return target ? target.textContent.trim() : "";
        }

        function clear(node) {
          while (node.firstChild) {
            node.removeChild(node.firstChild);
          }
        }

        function addText(parent, tag, className, value) {
          const node = document.createElement(tag);
          if (className) {
            node.className = className;
          }
          node.textContent = value;
          parent.appendChild(node);
          return node;
        }

        function normalizeTactic(value) {
          const lower = value.toLowerCase();
          if (lower.includes("command") && lower.includes("control")) return "Command and Control";
          return tacticOrder.find((name) => lower.includes(name.toLowerCase())) || value || "Unmapped";
        }

        function severityColor(severity) {
          const value = severity.toLowerCase();
          if (value.includes("critical")) return "#ff3e3e";
          if (value.includes("high")) return "#f97316";
          if (value.includes("medium")) return "#f59e0b";
          if (value.includes("low")) return "#10b981";
          return "#3b82f6";
        }

        function hashString(value) {
          let hash = 2166136261;
          for (let i = 0; i < value.length; i += 1) {
            hash ^= value.charCodeAt(i);
            hash = Math.imul(hash, 16777619);
          }
          return String(hash >>> 0);
        }

        function clamp(value, min, max) {
          return Math.max(min, Math.min(max, value));
        }

        function resizeLiveGraph() {
          const ratio = window.devicePixelRatio || 1;
          const rect = liveCanvas.getBoundingClientRect();
          const width = Math.max(320, Math.floor(rect.width));
          const height = Math.max(280, Math.floor(rect.height));
          const pixelWidth = Math.floor(width * ratio);
          const pixelHeight = Math.floor(height * ratio);
          if (liveCanvas.width !== pixelWidth || liveCanvas.height !== pixelHeight) {
            liveCanvas.width = pixelWidth;
            liveCanvas.height = pixelHeight;
          }
          liveCtx.setTransform(ratio, 0, 0, ratio, 0, 0);
        }

        function eventSignature(event) {
          const details = Array.from(event.querySelectorAll(".event-details div"))
            .map((node) => text(node))
            .join("|");
          return [
            text(event, ".event-type"),
            text(event, ".event-description"),
            event.getAttribute("data-severity") || text(event, ".event-severity"),
            details
          ].join("::");
        }

        function shortLabel(value, fallback) {
          const clean = (value || fallback || "event").replace(/\s+/g, " ").trim();
          if (clean.length <= 28) {
            return clean;
          }
          return clean.slice(0, 25) + "...";
        }

        function syncLiveGraph(events, techniques, details) {
          const nextSignature = hashString(events.map(eventSignature).join("\n"));
          const isNewTimeline = nextSignature !== liveGraph.signature;
          const nodes = [];
          const edges = [];
          const techniqueByKey = new Map();
          const eventLimit = 72;
          const visibleEvents = events.slice(-eventLimit);

          techniques.slice(0, 36).forEach((technique, index) => {
            const laneIndex = Math.max(0, tacticOrder.indexOf(technique.tactic));
            const angle = (laneIndex / tacticOrder.length) * Math.PI * 2;
            const radius = 150 + (index % 4) * 28;
            const node = {
              id: "tech:" + technique.id + ":" + technique.tactic,
              label: technique.id,
              sub: technique.name,
              type: "technique",
              color: "#f59e0b",
              size: clamp(7 + technique.count * 1.5, 8, 22),
              x: Math.cos(angle) * radius,
              y: -90 + (index % 6) * 34,
              z: Math.sin(angle) * radius
            };
            nodes.push(node);
            techniqueByKey.set(technique.id, node.id);
          });

          visibleEvents.forEach((event, index) => {
            const severity = event.getAttribute("data-severity") || text(event, ".event-severity") || "Info";
            const eventType = text(event, ".event-type") || "Detection";
            const description = text(event, ".event-description") || text(event);
            const angle = (index / Math.max(1, visibleEvents.length)) * Math.PI * 2;
            const shell = 68 + (index % 7) * 24;
            const node = {
              id: "event:" + hashString(eventSignature(event)),
              label: shortLabel(eventType, "event"),
              sub: shortLabel(description, ""),
              type: "event",
              color: severityColor(severity),
              size: /critical|high/i.test(severity) ? 13 : 9,
              x: Math.cos(angle) * shell,
              y: -28 + ((index % 9) - 4) * 18,
              z: Math.sin(angle) * shell
            };
            nodes.push(node);

            const techText = text(event, ".technique-id") || text(event, ".technique-badge");
            const techId = (techText.match(/T\d{4}(?:\.\d{3})?/) || [])[0];
            if (techId && techniqueByKey.has(techId)) {
              edges.push({ from: node.id, to: techniqueByKey.get(techId), color: node.color });
            }
            if (index > 0) {
              edges.push({ from: "event:" + hashString(eventSignature(visibleEvents[index - 1])), to: node.id, color: "#3b82f6" });
            }
          });

          Array.from(details.network.entries()).slice(0, 20).forEach(([value, count], index) => {
            const angle = (index / Math.max(1, details.network.size)) * Math.PI * 2;
            const node = {
              id: "net:" + hashString(value),
              label: shortLabel(value, "network"),
              sub: count + "x",
              type: "network",
              color: "#10b981",
              size: clamp(7 + count, 8, 18),
              x: Math.cos(angle) * 230,
              y: 108 + (index % 5) * 18,
              z: Math.sin(angle) * 230
            };
            nodes.push(node);
            if (nodes.length > 1) {
              edges.push({ from: nodes[Math.max(0, nodes.length - 2)].id, to: node.id, color: "#10b981" });
            }
          });

          if (isNewTimeline && events.length > liveGraph.eventCount) {
            const newIds = nodes.filter((node) => node.type === "event").slice(-(events.length - liveGraph.eventCount));
            newIds.forEach((node) => liveGraph.pulses.push({ id: node.id, age: 0, color: node.color }));
          }

          liveGraph.nodes = nodes;
          liveGraph.edges = edges;
          liveGraph.signature = nextSignature;
          liveGraph.eventCount = events.length;
          liveGraph.lastUpdated = Date.now();
          liveGraphLabel.textContent = events.length + " events / " + techniques.length + " techniques / " + details.network.size + " network";
        }

        function projectNode(node, width, height, rotation) {
          const cos = Math.cos(rotation);
          const sin = Math.sin(rotation);
          const x = node.x * cos - node.z * sin;
          const z = node.x * sin + node.z * cos + 420;
          const scale = 360 / (360 + z);
          return {
            x: width / 2 + x * scale,
            y: height / 2 + node.y * scale,
            z,
            scale,
            radius: node.size * scale
          };
        }

        function drawLiveGraphFrame() {
          resizeLiveGraph();
          const width = liveCanvas.clientWidth;
          const height = liveCanvas.clientHeight;
          liveGraph.rotation += 0.004;
          liveCtx.clearRect(0, 0, width, height);
          liveCtx.save();
          liveCtx.globalCompositeOperation = "lighter";

          const projected = new Map();
          liveGraph.nodes.forEach((node) => {
            projected.set(node.id, projectNode(node, width, height, liveGraph.rotation));
          });

          liveGraph.edges.forEach((edge) => {
            const from = projected.get(edge.from);
            const to = projected.get(edge.to);
            if (!from || !to) {
              return;
            }
            const alpha = clamp(0.12 + (from.scale + to.scale) * 0.18, 0.12, 0.5);
            liveCtx.strokeStyle = edge.color || "#3b82f6";
            liveCtx.globalAlpha = alpha;
            liveCtx.lineWidth = clamp((from.scale + to.scale) * 1.2, 0.8, 2.4);
            liveCtx.beginPath();
            liveCtx.moveTo(from.x, from.y);
            liveCtx.lineTo(to.x, to.y);
            liveCtx.stroke();
          });

          liveGraph.pulses = liveGraph.pulses.filter((pulse) => pulse.age < 1);
          liveGraph.pulses.forEach((pulse) => {
            const point = projected.get(pulse.id);
            if (!point) {
              pulse.age = 1;
              return;
            }
            liveCtx.globalAlpha = 1 - pulse.age;
            liveCtx.strokeStyle = pulse.color;
            liveCtx.lineWidth = 2;
            liveCtx.beginPath();
            liveCtx.arc(point.x, point.y, point.radius + pulse.age * 34, 0, Math.PI * 2);
            liveCtx.stroke();
            pulse.age += 0.018;
          });

          liveGraph.nodes
            .slice()
            .sort((a, b) => projectNode(b, width, height, liveGraph.rotation).z - projectNode(a, width, height, liveGraph.rotation).z)
            .forEach((node) => {
              const point = projected.get(node.id);
              liveCtx.globalAlpha = clamp(0.42 + point.scale, 0.42, 1);
              liveCtx.fillStyle = node.color;
              liveCtx.shadowColor = node.color;
              liveCtx.shadowBlur = node.type === "event" ? 18 : 10;
              liveCtx.beginPath();
              liveCtx.arc(point.x, point.y, Math.max(3, point.radius), 0, Math.PI * 2);
              liveCtx.fill();
              liveCtx.shadowBlur = 0;
              if (point.scale > 0.58) {
                liveCtx.globalAlpha = 0.82;
                liveCtx.fillStyle = "#e5e7eb";
                liveCtx.font = "11px IBM Plex Mono, monospace";
                liveCtx.fillText(node.label, point.x + point.radius + 5, point.y + 4);
              }
            });

          liveCtx.restore();
          window.requestAnimationFrame(drawLiveGraphFrame);
        }

        function renderTimelineHtml(html) {
          const holder = document.createElement("div");
          holder.innerHTML = html;
          holder.querySelectorAll("script, style").forEach((node) => node.remove());
          clear(source);
          while (holder.firstChild) {
            source.appendChild(holder.firstChild);
          }
        }

        function collectTechniqueData() {
          const techniques = new Map();
          source.querySelectorAll(".technique-badge, .technique-tag").forEach((node) => {
            const raw = text(node);
            const idMatch = raw.match(/T\d{4}(?:\.\d{3})?/);
            const id = text(node, ".technique-id") || (idMatch ? idMatch[0] : raw.slice(0, 16));
            const name = text(node, ".technique-name") || raw.replace(id, "").trim() || "Technique";
            const tactic = normalizeTactic(text(node, ".technique-tactic") || "Unmapped");
            const key = id + "|" + tactic + "|" + name;
            const current = techniques.get(key) || { id, name, tactic, count: 0 };
            current.count += 1;
            techniques.set(key, current);
          });
          return Array.from(techniques.values());
        }

        function collectEventDetails(events) {
          const network = new Map();
          const detections = [];

          events.forEach((event) => {
            const severity = event.getAttribute("data-severity") || text(event, ".event-severity") || "Info";
            const eventType = text(event, ".event-type") || "Detection";
            const description = text(event, ".event-description") || text(event);
            const details = Array.from(event.querySelectorAll(".event-details div"))
              .map((node) => text(node))
              .filter(Boolean);

            details.forEach((line) => {
              if (/network|destination|remote|domain|dns|ip|host|url|mitm/i.test(line)) {
                const value = line.replace(/^\s*(network|destination|remote|domain|dns|ip|host|url)\s*:\s*/i, "").trim();
                if (value) {
                  network.set(value, (network.get(value) || 0) + 1);
                }
              }
            });

            if (/mitm|detection|attack|rule|behavior|network|domain|ip|firewall|registry|file|process/i.test(eventType + " " + description + " " + details.join(" "))) {
              detections.push({ severity, eventType, description, details });
            }
          });

          return { network, detections };
        }

        function renderGraph(techniques, events) {
          clear(graph);
          const grouped = new Map();
          tacticOrder.forEach((name) => grouped.set(name, []));

          techniques.forEach((technique) => {
            const tactic = grouped.has(technique.tactic) ? technique.tactic : "Unmapped";
            grouped.get(tactic).push(technique);
          });

          if (techniques.length === 0 && events.length > 0) {
            events.forEach((event) => {
              const severity = event.getAttribute("data-severity") || text(event, ".event-severity") || "Info";
              grouped.get("Unmapped").push({
                id: severity,
                name: text(event, ".event-type") || "Detection",
                tactic: "Unmapped",
                count: 1
              });
            });
          }

          grouped.forEach((items, tactic) => {
            if (!items.length) {
              return;
            }
            const lane = document.createElement("section");
            lane.className = "tactic-lane";
            addText(lane, "h3", "", tactic);
            items
              .sort((a, b) => b.count - a.count || a.id.localeCompare(b.id))
              .slice(0, 8)
              .forEach((item) => {
                const node = document.createElement("div");
                node.className = "tech-node";
                addText(node, "code", "", item.id);
                addText(node, "b", "", item.name);
                addText(node, "span", "", item.count + "x");
                lane.appendChild(node);
              });
            graph.appendChild(lane);
          });

          if (!graph.children.length) {
            addText(graph, "div", "network-item", "Waiting for archived MITRE ATT&CK detections.");
          }
        }

        function renderNetwork(network) {
          clear(networkList);
          Array.from(network.entries())
            .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
            .slice(0, 40)
            .forEach(([value, count]) => {
              const item = document.createElement("div");
              item.className = "network-item";
              item.textContent = value + "  [" + count + "]";
              networkList.appendChild(item);
            });

          if (!networkList.children.length) {
            addText(networkList, "div", "network-item", "No network, IP, domain, or MITM evidence in the archive yet.");
          }
        }

        function renderDetections(detections) {
          clear(detectionList);
          detections.slice(0, 80).forEach((event) => {
            const row = document.createElement("div");
            row.className = "event-row";
            const sev = addText(row, "div", "event-sev", event.severity);
            sev.style.color = severityColor(event.severity);
            const main = document.createElement("div");
            main.className = "event-main";
            addText(main, "strong", "", event.eventType);
            addText(main, "span", "", event.description);
            if (event.details.length) {
              const details = document.createElement("details");
              details.className = "event-details-full";
              details.open = true;
              const summary = document.createElement("summary");
              summary.textContent = "Evidence details (" + event.details.length + ")";
              details.appendChild(summary);
              event.details.forEach((detail) => {
                addText(details, "div", "event-detail-line", detail);
              });
              main.appendChild(details);
            }
            row.appendChild(main);
            detectionList.appendChild(row);
          });

          if (!detectionList.children.length) {
            addText(detectionList, "div", "event-row", "No detections have been archived yet.");
          }
        }

        function buildOverview(data) {
          const events = Array.from(source.querySelectorAll(".timeline-event"));
          const techniques = collectTechniqueData();
          const details = collectEventDetails(events);
          const highEvents = events.filter((event) => {
            const severity = event.getAttribute("data-severity") || text(event, ".event-severity");
            return /critical|high/i.test(severity);
          }).length;

          setMetric("metric_timelines", data.timeline_count || source.querySelectorAll(".owlyshield-cache-entry, .attack-timeline, .sanctum-timeline").length);
          setMetric("metric_events", events.length);
          setMetric("metric_techniques", techniques.length);
          setMetric("metric_high", highEvents);
          setMetric("metric_network", details.network.size);
          setMetric("metric_archived", data.archived_files || 0);

          document.getElementById("archive_path").textContent = data.archive_dir || "C:\\ProgramData\\HydraDragonAntivirus\\Sanctum\\mitre_attack";
          syncLiveGraph(events, techniques, details);
          renderGraph(techniques, events);
          renderNetwork(details.network);
          renderDetections(details.detections);
        }

        async function loadOverview() {
          status.textContent = liveGraph.eventCount ? "Refreshing live MITRE ATT&CK events..." : "Loading live MITRE ATT&CK events...";
          try {
            if (!window.__TAURI__ || !window.__TAURI__.core) {
              throw new Error("Tauri API is not available in this preview.");
            }
            const { invoke } = window.__TAURI__.core;
            const response = await invoke("mitre_attack_live_overview");
            const data = JSON.parse(response);
            const timeline = data.timeline || "";
            const timelineSignature = hashString(timeline);
            if (timelineSignature !== lastTimelineSignature) {
              lastTimelineSignature = timelineSignature;
              renderTimelineHtml(timeline);
              buildOverview(data);
            }
            const archiveErrors = Array.isArray(data.archive_errors) && data.archive_errors.length
              ? " Archive warning: " + data.archive_errors.join(" | ")
              : "";
            const updated = data.updated_unix_ms ? " Updated " + new Date(Number(data.updated_unix_ms)).toLocaleTimeString() + "." : "";
            status.textContent = (data.message || "Live MITRE ATT&CK events loaded.") + updated + archiveErrors;
          } catch (error) {
            status.textContent = String(error);
            renderTimelineHtml("<section class='mitre-empty-state'><h2>MITRE ATT&CK archive unavailable</h2><p>" + String(error) + "</p></section>");
            buildOverview({});
          }
        }

        window.addEventListener("resize", resizeLiveGraph);
        drawLiveGraphFrame();
        loadOverview();
        livePollTimer = window.setInterval(loadOverview, 1500);
        window.addEventListener("beforeunload", () => {
          if (livePollTimer) {
            window.clearInterval(livePollTimer);
          }
        });
      });
    </script>
  </head>
  <body>
    <header id="header"><p>Sanctum Home EDR</p></header>

    <div id="container">
      <main id="center" class="column">
        <article class="mitre-shell">
          <h1>MITRE ATT&amp;CK</h1>

          <div class="full_callout">
            <b>Persistent Attack Timeline</b>
            <div id="mitre_status" class="mitre-status"></div>
            <div class="archive-path" id="archive_path"></div>
          </div>

          <section class="mitre-kpis">
            <div class="mitre-kpi"><span>Timelines</span><strong id="metric_timelines">0</strong></div>
            <div class="mitre-kpi"><span>Events</span><strong id="metric_events">0</strong></div>
            <div class="mitre-kpi"><span>Techniques</span><strong id="metric_techniques">0</strong></div>
            <div class="mitre-kpi"><span>High/Critical</span><strong id="metric_high">0</strong></div>

            <div class="mitre-kpi"><span>Archived</span><strong id="metric_archived">0</strong></div>

          <section class="mitre-panel">

            <div class="live-graph-wrap">
              <canvas id="live_graph_canvas"></canvas>
              <div class="live-graph-hud"><span class="live-dot"></span><span id="live_graph_label">0 events / 0 techniques / 0 network</span></div>
            </div>
          </section>

          <section class="mitre-panel">

          </section>

          <section class="mitre-panel">

            <div id="network_list" class="network-grid"></div>
          </section>

          <section class="mitre-panel">
            <h2>Detection Timeline</h2>
            <div id="detection_list" class="event-stream"></div>
          </section>

          <section class="mitre-panel">
            <h2>Raw Timelines</h2>
            <div id="timeline_source" class="timeline-source"></div>
          </section>
        </article>
      </main>

      <div id="nav-placeholder"></div>
    </div>
