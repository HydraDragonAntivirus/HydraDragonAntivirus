name: vs2022hydradragonstatic-ci

on:
  push:
    branches: [ "**" ]
    paths:
      - 'Owlyshield/hydradragonstatic/**'
      - '.github/workflows/vs2022hydradragonstatic.yml'
  pull_request:
    branches: [ "**" ]
    paths:
      - 'Owlyshield/hydradragonstatic/**'
      - '.github/workflows/vs2022hydradragonstatic.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  win-build:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: hydradragonstatic

    steps:
    - name: Enable Git long paths
      run: git config --global core.longpaths true
      working-directory: .

    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Cargo
      uses: Swatinem/rust-cache@v2
      with:
        key: vs2022-hydradragonstatic

    - name: Cargo check
      run: cargo check --verbose

    - name: Build release binary
      run: cargo build --release --verbose

    - name: Run tests
      run: cargo test --verbose

    - name: Upload build directory
      uses: actions/upload-artifact@v7
      with:
        name: hydradragonstatic_release_binaries
        path: |
          hydradragonstatic/target/release/hydradragonstatic.exe
