stages:
  - test
  - lint
  - maintenance
  - build-check

include:
  - template: Security/SAST.gitlab-ci.yml

sast:
  stage: test

python-lint:
  stage: lint
  image: python:3.12
  script:
    - pip install ruff
    - ruff check .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

rust-check-firewall:
  stage: build-check
  image: rust:latest
  script:
    - cd HydraDragonFirewall/hydradragonfirewall
    - cargo check
  rules:
    - changes:
        - HydraDragonFirewall/**/*
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

linux-check-owlyshield:
  stage: build-check
  image: rust:latest
  variables:
    CARGO_TERM_COLOR: always
  script:
    - cd Owlyshield/owlyshield_predict
    - cargo check
  rules:
    - changes:
        - Owlyshield/**/*
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

vs2022-windows-builds:
  stage: build-check
  tags:
    - windows
  variables:
    WDK_URL: "https://go.microsoft.com/fwlink/?linkid=2335869"
  parallel:
    matrix:
      - PROJECT_NAME: "hyperdbg"
        SOLUTION_FILE_PATH: "Owlyshield/HyperDbg/hyperdbg/hyperdbg.sln"
        BUILD_BIN_DIR: "Owlyshield/HyperDbg/hyperdbg/build/bin/"
        BUILD_CONFIGURATION: ["release", "debug"]
        PLATFORM: "x64"
      - PROJECT_NAME: "mbrfilter"
        SOLUTION_FILE_PATH: "MBRFilter/MBRFilter Driver.sln"
        BUILD_BIN_DIR: "MBRFilter/x64/"
        BUILD_CONFIGURATION: ["Release", "Debug"]
        PLATFORM: "x64"
      - PROJECT_NAME: "owlyshield"
        SOLUTION_FILE_PATH: "Owlyshield/owlyshield_minifilter/RWatch.sln"
        BUILD_BIN_DIR: "Owlyshield/owlyshield_minifilter/x64/"
        BUILD_CONFIGURATION: ["Release", "Debug"]
        PLATFORM: "x64"
      - PROJECT_NAME: "pyasprotection"
        SOLUTION_FILE_PATH: "PYAS_Protection/PYAS_Protection/SimplePYASProtection.sln"
        BUILD_BIN_DIR: "PYAS_Protection/PYAS_Protection/x64/"
        BUILD_CONFIGURATION: ["Release", "Debug"]
        PLATFORM: "x64"
      - PROJECT_NAME: "reddbg"
        SOLUTION_FILE_PATH: "Owlyshield/RedDbg/RedDbg/RedDbg.sln"
        BUILD_BIN_DIR: "Owlyshield/RedDbg/RedDbg/x64/"
        BUILD_CONFIGURATION: ["Release", "Debug"]
        PLATFORM: "x64"
  before_script:
    - git config --global core.longpaths true
    - git submodule update --init --recursive --remote
    - |
      $wdkSetupPath = Join-Path $env:TEMP "wdksetup.exe"
      (New-Object Net.WebClient).DownloadFile($env:WDK_URL, $wdkSetupPath)
      Start-Process -FilePath $wdkSetupPath -ArgumentList "/quiet" -NoNewWindow -Wait
    - |
      $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
      if (-not (Test-Path $vswhere)) {
        throw "vswhere.exe not found. Install Visual Studio 2022 Build Tools on the Windows runner."
      }
      $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
      if (-not $msbuild) {
        throw "MSBuild.exe not found. Install Visual Studio 2022 Build Tools on the Windows runner."
      }
      $env:MSBUILD_EXE = $msbuild
  script:
    - '& $env:MSBUILD_EXE /m "/p:Configuration=$env:BUILD_CONFIGURATION" "/p:Platform=$env:PLATFORM" "$env:SOLUTION_FILE_PATH"'
  artifacts:
    when: on_success
    expire_in: 1 week
    name: "${PROJECT_NAME}_build_files_${BUILD_CONFIGURATION}"
    paths:
      - $BUILD_BIN_DIR
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - MBRFilter/**/*
        - Owlyshield/HyperDbg/**/*
        - Owlyshield/RedDbg/**/*
        - Owlyshield/owlyshield_minifilter/**/*
        - PYAS_Protection/**/*
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - MBRFilter/**/*
        - Owlyshield/HyperDbg/**/*
        - Owlyshield/RedDbg/**/*
        - Owlyshield/owlyshield_minifilter/**/*
        - PYAS_Protection/**/*
    - when: never

hydradragonav-windows-build:
  stage: build-check
  tags:
    - windows
  parallel:
    matrix:
      - BUILD_CONFIGURATION: ["Release", "Debug"]
        PLATFORM: ["x64", "x86"]
  before_script:
    - git config --global core.longpaths true
    - git submodule update --init --recursive
    - |
      $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
      if (-not (Test-Path $vswhere)) {
        throw "vswhere.exe not found. Install Visual Studio 2022 Build Tools on the Windows runner."
      }
      $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
      if (-not $msbuild) {
        throw "MSBuild.exe not found. Install Visual Studio 2022 Build Tools on the Windows runner."
      }
      $env:MSBUILD_EXE = $msbuild
  script:
    - '& $env:MSBUILD_EXE /m /nologo /v:minimal "/p:Configuration=$env:BUILD_CONFIGURATION" "/p:Platform=$env:PLATFORM" "HydraDragonAV/HydraDragonAV.sln"'
  artifacts:
    when: on_success
    expire_in: 1 week
    name: "hydradragonav_${PLATFORM}_${BUILD_CONFIGURATION}"
    paths:
      - HydraDragonAV/$PLATFORM/$BUILD_CONFIGURATION/
      - HydraDragonAV/$BUILD_CONFIGURATION/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - HydraDragonAV/**/*
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - HydraDragonAV/**/*
    - when: never

tinyantivirus-windows-build:
  stage: build-check
  tags:
    - windows
  parallel:
    matrix:
      - BUILD_CONFIGURATION: ["Release", "Debug"]
        PLATFORM: ["x64", "x86"]
  variables:
    SAMPLE_DIR: "$CI_PROJECT_DIR\\TinyAntivirus\\tests\\samples"
  before_script:
    - git config --global core.longpaths true
    - git submodule update --init --recursive
  script:
    - Set-Location TinyAntivirus
    - cmd /c "ci\windows\build_appveyor.bat %PLATFORM% %BUILD_CONFIGURATION%"
  artifacts:
    when: on_success
    expire_in: 1 week
    name: "tinyantivirus_${PLATFORM}_${BUILD_CONFIGURATION}"
    paths:
      - TinyAntivirus/$PLATFORM/$BUILD_CONFIGURATION/
      - TinyAntivirus/$BUILD_CONFIGURATION/
      - TinyAntivirus/libs/googletest/googletest/build/$BUILD_CONFIGURATION/
      - TinyAntivirus/libs/zlib/build/$BUILD_CONFIGURATION/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - TinyAntivirus/**/*
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - TinyAntivirus/**/*
    - when: never

poetry-lock-rebuild:
  stage: maintenance
  image: python:3.12
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git ca-certificates
    - python -m pip install "poetry>=2.0.0"
    - git config user.name "${GITLAB_USER_NAME:-gitlab-ci}"
    - git config user.email "${GITLAB_USER_EMAIL:-gitlab-ci@users.noreply.gitlab.com}"
  script:
    - poetry config virtualenvs.create false
    - poetry --version
    - poetry lock --regenerate
    - poetry check --lock
    - |
      if git diff --quiet -- poetry.lock; then
        echo "poetry.lock is already up to date."
        exit 0
      fi
    - |
      SOURCE_BRANCH="automation/rebuild-poetry-lock-${CI_COMMIT_REF_SLUG}"
      export SOURCE_BRANCH
      git checkout -B "$SOURCE_BRANCH"
      git add poetry.lock
      git commit -m "Rebuild poetry.lock (auto)"
      git push "https://oauth2:${LOCKFILE_BOT_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "$SOURCE_BRANCH" --force-with-lease
      python - <<'PY'
      import json
      import os
      import urllib.parse
      import urllib.request

      api_url = os.environ["CI_API_V4_URL"]
      project_id = os.environ["CI_PROJECT_ID"]
      token = os.environ["LOCKFILE_BOT_TOKEN"]
      source_branch = os.environ["SOURCE_BRANCH"]
      target_branch = os.environ["CI_DEFAULT_BRANCH"]

      headers = {"PRIVATE-TOKEN": token}
      query = urllib.parse.urlencode({
          "state": "opened",
          "source_branch": source_branch,
          "target_branch": target_branch,
      })
      list_url = f"{api_url}/projects/{project_id}/merge_requests?{query}"
      with urllib.request.urlopen(urllib.request.Request(list_url, headers=headers)) as response:
          existing = json.loads(response.read().decode())

      if existing:
          print(f"Merge request already exists: {existing[0].get('web_url')}")
          raise SystemExit(0)

      payload = urllib.parse.urlencode({
          "source_branch": source_branch,
          "target_branch": target_branch,
          "title": "Rebuild poetry.lock",
          "description": (
              "This MR regenerates `poetry.lock` automatically after changes to "
              "`pyproject.toml` or on a scheduled/manual CI run."
          ),
          "remove_source_branch": "false",
      }).encode()
      request = urllib.request.Request(
          f"{api_url}/projects/{project_id}/merge_requests",
          data=payload,
          headers={**headers, "Content-Type": "application/x-www-form-urlencoded"},
          method="POST",
      )
      with urllib.request.urlopen(request) as response:
          created = json.loads(response.read().decode())
          print(f"Created merge request: {created.get('web_url')}")
      PY
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $LOCKFILE_BOT_TOKEN'
    - if: '$CI_PIPELINE_SOURCE == "web" && $LOCKFILE_BOT_TOKEN'
    - if: '$CI_PIPELINE_SOURCE == "push" && $LOCKFILE_BOT_TOKEN'
      changes:
        - pyproject.toml
    - when: never

renovate:
  stage: maintenance
  image: renovate/renovate:latest
  resource_group: renovate
  variables:
    LOG_LEVEL: info
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: "$CI_API_V4_URL"
    RENOVATE_REPOSITORIES: "$CI_PROJECT_PATH"
  script:
    - renovate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RENOVATE_TOKEN'
    - when: never
