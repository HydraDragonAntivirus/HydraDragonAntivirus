- name: "RegSeek Registry HIPS - System Modifications"
  description: "Prompts before broad system reconfiguration touching hostname, boot, Windows Update, servicing, power, VSS, memory management, device restrictions, and related modification surfaces documented by RegSeek."
  author: "Emirhan Ucan"
  status: experimental
  level: high
  severity: 88
  tags:
    - regseek
    - hips
    - registry
    - system-modifications
  mitre_attack:
    - T1112
    - T1490
    - T1562.001
  detection_logic:
    any_of: [system_identity, boot_and_servicing, system_controls, storage_and_devices]
  named_conditions:
    system_identity:
      orderless: true
      registry_keys:
        - HKLM\SYSTEM\CurrentControlSet\Control\ComputerName\ComputerName*
        - HKLM\SYSTEM\CurrentControlSet\Control\TimeZoneInformation*
        - HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\SoftwareProtectionPlatform*
      registry_operations:
        - reg_create_key
        - reg_set_value
        - reg_delete_value
        - reg_delete_key
        - reg_rename_key
      min_matches: 1
    boot_and_servicing:
      orderless: true
      registry_keys:
        - HKLM\SYSTEM\CurrentControlSet\Control\SafeBoot*
        - HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Component Based Servicing*
        - HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\WindowsUpdate*
        - HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting*
      registry_keys_exclude:
        - "*\\Windows Error Reporting\\PreviousRing*"
      registry_operations:
        - reg_create_key
        - reg_set_value
        - reg_delete_value
        - reg_delete_key
        - reg_rename_key
      min_matches: 1
    system_controls:
      orderless: true
      registry_keys:
        - HKLM\SOFTWARE\Policies\Microsoft\Windows\Safer\CodeIdentifiers*
        - HKLM\SOFTWARE\Policies\Microsoft\Windows\SrpV2*
        - HKLM\SYSTEM\CurrentControlSet\Control\Power*
        - HKLM\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Restrictions*
        - HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\location*
      registry_operations:
        - reg_create_key
        - reg_set_value
        - reg_delete_value
        - reg_delete_key
        - reg_rename_key
      min_matches: 1
    storage_and_devices:
      orderless: true
      registry_keys:
        - HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall*
        - HKLM\SYSTEM\CurrentControlSet\Enum*
        - HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management*
        - HKLM\SYSTEM\CurrentControlSet\Services\VSS*
        - HKCU\Software\Microsoft\Windows\CurrentVersion\CDP*
        - HKCU\Software\Apple Computer, Inc.\iTunes*
      registry_keys_exclude:
        - "*\\\\Services\\\\*\\\\Diag\\\\*"
        - "*\\\\Services\\\\*\\\\State\\\\*"
        - "*\\\\Services\\\\*\\\\Enum\\\\*"
        - "*\\\\Services\\\\*\\\\Performance\\\\*"
        - "*\\\\Services\\\\*\\\\TriggerInfo\\\\*"
      registry_operations:
        - reg_create_key
        - reg_set_value
        - reg_delete_value
        - reg_delete_key
        - reg_rename_key
      min_matches: 1
  response:
    ask_user: true
    deny_while_ask: true
    terminate_process: true
    notify_user: true
    auto_revert: true
    record: true
  allowlisted_apps:
    - pattern: "C:/Windows/System32/msiexec.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "C:/Windows/System32/svchost.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "C:/Windows/System32/services.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "C:/Windows/System32/SrTasks.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "C:/Windows/servicing/TrustedInstaller.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "C:/Windows/WinSxS/*/TiWorker.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "C:/Windows/UUS/*/MoUsoCoreWorker.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "C:/Windows/WinSxS/*/MoUsoCoreWorker.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "C:/Windows/System32/poqexec.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "C:/Windows/System32/wusa.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "C:/Windows/System32/Dism/DismHost.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]

