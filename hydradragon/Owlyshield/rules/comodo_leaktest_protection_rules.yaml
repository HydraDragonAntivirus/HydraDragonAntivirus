# TEST #13: Injection:Services — Block malicious service installation from non-System processes
- name: "HEUR:Win.Injection.MaliciousServiceCreation.gen"
  author: "HydraDragon"
  date: "2026-03-26"
  status: production
  level: critical
  severity: 100
  description: |
    Detects service creation (via Services registry key or CreateService API)
    from non-privileged processes. Service DLL injection allows code execution
    with SYSTEM privileges across reboots.
    COMODO Test #13: Injection:Services
    Blocks unauthorized service installation.
  debug: false

  allowlisted_apps:
    - pattern: "C:/Windows/System32/msiexec.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "C:/Windows/System32/svchost.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "C:/Windows/System32/services.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "%SystemRoot%/servicing/TrustedInstaller.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "%SystemRoot%/WinSxS/*/TiWorker.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "%SystemRoot%/UUS/*/MoUsoCoreWorker.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "%SystemRoot%/WinSxS/*/MoUsoCoreWorker.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "%SystemRoot%/System32/poqexec.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "%SystemRoot%/System32/wusa.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "%SystemRoot%/System32/Dism/DismHost.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]

  named_conditions:
    service_key_create:
      orderless: true
      registry_keys:
        - "HKLM\\SYSTEM\\CurrentControlSet\\Services"
        - "HKLM\\SYSTEM\\ControlSet001\\Services"
        - "HKLM\\SYSTEM\\ControlSet002\\Services"
      registry_operations: ["create"]
      min_matches: 1

    service_registry_create:
      orderless: true
      registry_keys:
        - "HKLM\\SYSTEM\\CurrentControlSet\\Services"
        - "HKLM\\SYSTEM\\ControlSet001\\Services"
        - "HKLM\\SYSTEM\\ControlSet002\\Services"
      registry_operations: ["create", "set"]
      registry_values:
        - "ImagePath"
        - "ServiceDll"
        - "ServiceDllUnloadOnStop"
        - "Parameters"
        - "Type"
        - "Start"
        - "ObjectName"
      min_matches: 1

    createservice_api:
      orderless: true
      apis:
        - "advapi32.dll!CreateServiceA"
        - "advapi32.dll!CreateServiceW"
        - "advapi32.dll!CreateServiceExA"
        - "advapi32.dll!CreateServiceExW"
        - "CreateServiceA"
        - "CreateServiceW"
        - "CreateService"
        - "CreateServiceExA"
        - "CreateServiceExW"
      api_threshold: 1
      min_matches: 1

    service_control_api:
      orderless: true
      apis:
        - "*OpenSCManager*"
        - "*OpenService*"
        - "*CreateService*"
        - "*ChangeServiceConfig*"
        - "*ChangeServiceConfig2*"
        - "*StartService*"
        - "*RegCreateKey*"
        - "*RegCreateKeyEx*"
        - "*RegSetValue*"
        - "*RegSetValueEx*"
        - "*RegSetKeyValue*"
        - "*NtLoadDriver*"
        - "*ZwLoadDriver*"
        - "*NtCreateKey*"
        - "*ZwCreateKey*"
        - "*NtSetValueKey*"
        - "*ZwSetValueKey*"
      api_threshold: 1
      min_matches: 1

    suspicious_service_payload:
      orderless: true
      registry_value_data_patterns:
        - "*.sys*"
        - "*.dll*"
        - "*\\users\\*"
        - "*\\appdata\\*"
        - "*\\temp\\*"
        - "*\\public\\*"
        - "*\\downloads\\*"
        - "*rundll32*"
      min_matches: 1

    non_system_caller:
      orderless: true
      is_signed: false
      min_matches: 1

  detection_logic:
    or:
      - condition: "service_key_create"
      - condition: "service_registry_create"
      - condition: "createservice_api"
      - condition: "service_control_api"
      - condition: "suspicious_service_payload"

  response:
    notify_user: true
    ask_user: false
    terminate_process: true
    status_access_denied: true
    record: true
    auto_revert: true

  tags: ["injection", "services", "persistence", "privilege-escalation"]
  mitre_attack: ["T1543.003"]

