- name: "RegSeek Registry HIPS - Security Monitoring"
  description: "Prompts before disabling or weakening Defender, firewall, UAC, BitLocker, certificates, logging, explorer restrictions, or related security-monitoring surfaces."
  author: "Codex"
  status: experimental
  level: critical
  severity: 98
  tags:
    - regseek
    - hips
    - registry
    - security-monitoring
  mitre_attack:
    - T1112
    - T1562.001
    - T1562.004
  detection_logic:
    any_of: [defender_and_firewall, policy_controls, trust_and_logging, privacy_and_capabilities]
  named_conditions:
    defender_and_firewall:
      orderless: true
      registry_keys:
        - HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\WindowsApplicationGuard*
        - HKLM\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy*
        - HKLM\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy\FirewallRules*
        - HKLM\SOFTWARE\Microsoft\Windows Defender*
      registry_operations:
        - reg_create_key
        - reg_set_value
        - reg_delete_value
        - reg_delete_key
        - reg_rename_key
        - reg_query_value
        - reg_query_key
        - reg_open_key
        - reg_enum_key
        - reg_enum_value
      min_matches: 1
    policy_controls:
      orderless: true
      registry_keys:
