# TEST #6: Invasion:RawDisk — Block raw disk device access entirely
- name: "HEUR:Win.Invasion.RawDiskAccess.gen"
  author: "HydraDragon"
  date: "2026-03-26"
  status: production
  level: critical
  severity: 100
  description: |
    Detects attempts to open raw disk devices (\Device\HarddiskVolume*,
    \Device\Harddisk*) with WRITE or DELETE access. Commonly used for:
    - Bootkit installation
    - MBR/VBR tampering
    - Direct partition modification
    - Ransomware encryption bypass
    COMODO Test #6: Invasion:RawDisk
    Blocks raw disk access with kernel enforcement.
  debug: false

  named_conditions:
    raw_disk_write_access:
      orderless: true
      kernel_api_calls:
        - "ZwOpenFile"
        - "NtOpenFile"
        - "ZwCreateFile"
        - "NtCreateFile"
        - "IoCreateFile"
      api_args_contain:
        - "\\Device\\HarddiskVolume"
        - "\\Device\\HarddiskVolumeShadowCopy"
        - "\\Device\\Harddisk"
      access_mask_include:
          - "WRITE"
          - "DELETE"
          - "SYNCHRONIZE_WRITE"
      min_matches: 1

  detection_logic:
    condition: "raw_disk_write_access"

  response:
    notify_user: true
    ask_user: true
    status_access_denied: true
    record: true
    block_operation: true

  kernel_enforcement: true
  kernel_blocking_level: "PRE_DISPATCH"

  tags: ["invasion", "raw-disk", "bootkit", "bootloader"]
  mitre_attack: ["T1014", "T1561.001"]

