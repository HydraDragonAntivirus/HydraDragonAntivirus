[package]
name = "bloom_builder"
version = "0.1.0"
edition = "2021"
description = "Builds bloom filters from hash databases and MalwareBazaar CSV"

[dependencies]
fastbloom = { version = "0.17", features = ["serde"] }
bincode-next = { version = "2.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
csv = "1.3"
