name: Publish Sanctum

on:
  push:
    branches: ["**"]
    paths:
      - 'Sanctum/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  # Detect which Sanctum components changed
  detect-changes:
    runs-on: windows-2022
    outputs:
      driver: ${{ steps.filter.outputs.driver }}
      usermode: ${{ steps.filter.outputs.usermode }}
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            driver:
              - 'Sanctum/driver/**'
            usermode:
              - 'Sanctum/**'
              - '!Sanctum/driver/**'

  # Build Driver (only if changed)
  build-driver:
    needs: detect-changes
    if: needs.detect-changes.outputs.driver == 'true'
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
      - name: Install Cargo Make
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-make
      - name: Setup WDK
        shell: pwsh
        run: |
          $wdkSetupPath = "$Env:TEMP\wdksetup.exe"
          (New-Object Net.WebClient).DownloadFile('https://go.microsoft.com/fwlink/?linkid=2335869', $wdkSetupPath)
          Start-Process -FilePath $wdkSetupPath -ArgumentList "/quiet" -NoNewWindow -Wait
      - name: Build and Sign Driver (with hash auto-update)
        working-directory: Sanctum/driver
        shell: pwsh
        run: |
          # Step 1: Generate ELAM certificate
          Write-Host "=== Step 1: Generating ELAM certificate ==="
          .\cert.ps1
          
          # Step 2: Initial build
          Write-Host "`n=== Step 2: Initial driver build ==="
          cargo make release
          
          # Step 3: Sign the driver
          Write-Host "`n=== Step 3: Signing driver ==="
          .\sign.bat release
          
          # Step 4: Extract the To-Be-Signed Hash
          Write-Host "`n=== Step 4: Extracting To-Be-Signed Hash ==="
          $certOutput = certmgr.exe -v target\release\sanctum_package\sanctum.sys
          $hashLines = $certOutput | Select-String -Pattern "Content Hash \(To-Be-Signed Hash\)::" -Context 0,3
          
          if ($hashLines) {
              $hashText = $hashLines[0].Context.PostContext -join ""
              $hash = $hashText -replace '\s+', '' -replace '0x', ''
              Write-Host "Extracted hash: $hash"
              
              # Step 5: Update build.rs with the new hash
              Write-Host "`n=== Step 5: Updating build.rs with extracted hash ==="
              $buildRsPath = "build.rs"
              $buildRsContent = Get-Content $buildRsPath -Raw
              $buildRsContent = $buildRsContent -replace 'L"[0-9A-F]+\\0"', "L`"$hash\0`""
              Set-Content $buildRsPath $buildRsContent
              Write-Host "Updated build.rs with hash: $hash"
              
              # Step 6: Clean and rebuild with correct hash
              Write-Host "`n=== Step 6: Rebuilding with correct hash ==="
              cargo clean
              cargo make release
              
              # Step 7: Sign again
              Write-Host "`n=== Step 7: Final signing ==="
              .\sign.bat release
              
              Write-Host "`n=== SUCCESS: Driver built and signed with matching hash ==="
          } else {
              Write-Host "ERROR: Could not extract hash from certificate"
              exit 1
          }
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: sanctum-driver
          path: Sanctum/driver/target/release/sanctum_package/*.sys

  # Build Usermode Components (only if changed)
  build-usermode:
    needs: detect-changes
    if: needs.detect-changes.outputs.usermode == 'true'
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
      - name: Install Cargo Make
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-make
      - name: Install rust-script
        run: cargo install rust-script
      - name: Setup Windows SDK (for signtool)
        shell: pwsh
        run: |
          $sdkSetupPath = "$Env:TEMP\sdksetup.exe"
          Write-Host "Downloading Windows SDK..."
          (New-Object Net.WebClient).DownloadFile('https://go.microsoft.com/fwlink/?linkid=2272610', $sdkSetupPath)
          Write-Host "Installing Windows SDK..."
          Start-Process -FilePath $sdkSetupPath -ArgumentList "/quiet", "/norestart", "/features", "OptionId.SigningTools" -NoNewWindow -Wait
          Write-Host "Windows SDK installed successfully"
      - name: Build Usermode Components
        working-directory: Sanctum
        run: |
          cargo make release
          .\sign_ppl_runner.bat
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: sanctum-usermode
          path: |
            Sanctum/target/release/sanctum_ppl_runner.exe
            Sanctum/target/release/elam_installer.exe
            Sanctum/target/release/um_engine.exe
            Sanctum/target/release/sanctum.dll

  # Stage and create PR (only with changed components)
  stage-and-pr:
    needs:
      - detect-changes
      - build-driver
      - build-usermode
    if: always() && (needs.build-driver.result == 'success' || needs.build-usermode.result == 'success' || needs.build-driver.result == 'skipped' || needs.build-usermode.result == 'skipped')
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
        continue-on-error: true
      
      - name: Stage (Conditional)
        shell: pwsh
        run: |
          $dist = "hydradragon/Sanctum"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $componentsBuilt = @()
          
          # Driver
          if (Test-Path "artifacts/sanctum-driver") {
            Write-Host "✓ Processing Sanctum Driver"
            Get-ChildItem "artifacts/sanctum-driver/" -Filter "sanctum.sys" -Recurse | 
              Select-Object -First 1 | 
              Copy-Item -Destination "$dist/" -Force
            $componentsBuilt += "Sanctum Driver (sanctum.sys)"
          } else {
            Write-Host "⊘ Skipping Driver (not built)"
          }
          
          # Usermode Components
          if (Test-Path "artifacts/sanctum-usermode") {
            Write-Host "✓ Processing Sanctum Usermode Components"
            Get-ChildItem "artifacts/sanctum-usermode/" -Filter "sanctum_ppl_runner.exe" -Recurse | 
              Select-Object -First 1 | 
              Copy-Item -Destination "$dist/" -Force
            Get-ChildItem "artifacts/sanctum-usermode/" -Filter "elam_installer.exe" -Recurse | 
              Select-Object -First 1 | 
              Copy-Item -Destination "$dist/" -Force
            Get-ChildItem "artifacts/sanctum-usermode/" -Filter "um_engine.exe" -Recurse | 
              Select-Object -First 1 | 
              Copy-Item -Destination "$dist/" -Force
            Get-ChildItem "artifacts/sanctum-usermode/" -Filter "sanctum.dll" -Recurse | 
              Select-Object -First 1 | 
              Copy-Item -Destination "$dist/" -Force
            $componentsBuilt += "Usermode Components (um_engine.exe, sanctum_ppl_runner.exe, etc.)"
          } else {
            Write-Host "⊘ Skipping Usermode Components (not built)"
          }
          
          Write-Host "`n=== Components Built: $($componentsBuilt.Count) ==="
          $componentsBuilt | ForEach-Object { Write-Host "  - $_" }
      
      - name: Check for Changes
        id: check_changes
        shell: pwsh
        run: |
          git add -A
          $status = git status --porcelain
          if ($null -eq $status -or $status -eq "") {
            echo "changed=false" >> $env:GITHUB_OUTPUT
          } else {
            echo "changed=true" >> $env:GITHUB_OUTPUT
          }
      
      - name: Create PR
        if: steps.check_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(sanctum): update binaries (selective build)"
          title: "🚀 Update Sanctum Binaries"
          body: |
            Automated selective build for Sanctum components.
            
            **Components Updated:**
            - Driver: ${{ needs.detect-changes.outputs.driver }}
            - Usermode: ${{ needs.detect-changes.outputs.usermode }}
            
            Only changed components were rebuilt.
          branch: "auto-update-sanctum"
          base: ${{ github.ref_name }}
          delete-branch: true
          labels: binaries, automated-pr, selective-build
