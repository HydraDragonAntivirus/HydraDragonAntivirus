name: Firewall

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      update_lockfiles:
        description: "Update Rust lockfiles and open PR"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-release:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.update_lockfiles != 'true' }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: HydraDragonFirewall/hydradragonfirewall
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
        working-directory: .

      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: 'latest'

      - name: Add WASM target
        run: rustup target add wasm32-unknown-unknown
        working-directory: .

      - name: Build UI (Leptos)
        working-directory: HydraDragonFirewall/hydradragonfirewall/ui
        run: trunk build --release -d ../dist

      - name: Verify UI build
        shell: pwsh
        run: |
          if (-not (Test-Path "dist")) {
            Write-Error "UI build failed: dist not found!"
            exit 1
          }

      - name: Set up WinDivert
        shell: pwsh
        run: |
          # The windivert-bin folder is in the parent directory relative to hydradragonfirewall
          $path = Join-Path (Get-Location) "..\windivert-bin"
          $path = Resolve-Path $path
          echo "WINDIVERT_PATH=$path" >> $env:GITHUB_ENV
          echo "WINDIVERT_LIB_DIR=$path" >> $env:GITHUB_ENV

      - name: Cargo check (firewall)
        run: cargo check

      - name: Cargo build release (firewall)
        run: cargo build --release --locked

      - name: Package release zip
        shell: pwsh
        run: |
          $releaseDir = "target/release"
          $bundleDir = "$releaseDir/hydradragonfirewall-windows-x64"
          $zipPath = "$releaseDir/hydradragonfirewall-windows-x64.zip"

          New-Item -ItemType Directory -Force -Path $bundleDir | Out-Null
          Copy-Item "$releaseDir/hydradragonfirewall.exe" $bundleDir -Force
          Copy-Item "../windivert-bin/WinDivert.dll" $bundleDir -Force
          Copy-Item "../windivert-bin/WinDivert64.sys" $bundleDir -Force
          Copy-Item "rules/rules.yaml" $bundleDir -Force

          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }
          Compress-Archive -Path "$bundleDir/*" -DestinationPath $zipPath -CompressionLevel Optimal

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: hydradragonfirewall-windows-x64
          path: HydraDragonFirewall/hydradragonfirewall/target/release/hydradragonfirewall-windows-x64.zip
          if-no-files-found: error

  update-lockfiles:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.update_lockfiles == 'true' }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true

      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Update lockfiles
        shell: pwsh
        run: |
          cargo update --manifest-path HydraDragonFirewall/hydradragonfirewall/Cargo.toml
          cargo update --manifest-path HydraDragonFirewall/hydradragonfirewall/ui/Cargo.toml
          cargo update --manifest-path HydraDragonFirewall/windivert-rust-master/Cargo.toml

      - name: Commit and push lockfile updates
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HydraDragonFirewall/hydradragonfirewall/Cargo.lock
          git add HydraDragonFirewall/hydradragonfirewall/ui/Cargo.lock
          git add HydraDragonFirewall/windivert-rust-master/Cargo.lock
          if (git diff --cached --quiet) {
            Write-Host "No lockfile changes to commit."
            exit 0
          }
          git commit -m "chore(deps): update firewall rust lockfiles"
          git push origin "HEAD:${{ github.ref_name }}"
