name: Publish TensorFlow Lite

on:
  push:
    branches: ["**"]
    paths:
      - "Owlyshield/owlyshield_predict/**/*.dll"
      - ".github/workflows/publish-tensorflowlite.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true

      - uses: actions/checkout@v6

      - name: Stage TensorFlow Lite
        shell: pwsh
        run: |
          $serviceDir = "hydradragon/Owlyshield/Owlyshield Service"
          New-Item -ItemType Directory -Force -Path $serviceDir | Out-Null
          
          Copy-Item "Owlyshield/owlyshield_predict/moonfire-tflite/lib/tensorflowlite_c.dll" $serviceDir -Force

          Write-Host "Signing..."
          Push-Location Sanctum
          .\sign_owlyshield_predict.bat
          Pop-Location

      - name: Check for publishable changes
        id: check_changes
        uses: ./.github/actions/check-publishable-changes
        with:
          paths: |
            hydradragon/Owlyshield/Owlyshield Service/tensorflowlite_c.dll
            
      - name: Create PR
        if: steps.check_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(tensorflow): update tensorflowlite_c.dll"
          title: "Update TensorFlow Lite DLL"
          body: "Automated TensorFlow Lite DLL update."
          add-paths: |
            ${{ steps.check_changes.outputs.publishable_files }}
          branch: "auto-update-tensorflowlite"
          base: ${{ github.ref_name }}
          delete-branch: true
          labels: binaries, automated-pr, owlyshield
