[package]
name = "hydradragoncontroller"
version = "1.0.0"
edition = "2021"
authors = ["Emirhan Ucan"]
description = "HydraDragon Antivirus Component Controller"
build = "build.rs"

[dependencies]
tokio = { version = "1.44", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.1", features = ["tray-icon"] }

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }
embed-resource = "3.0.9"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Diagnostics_ToolHelp",
]

[[bin]]
name = "hydradragoncontroller"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
