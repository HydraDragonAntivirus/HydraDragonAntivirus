# `private: true` helper rules produce no finding of their own; a later rule
# combines them with `rule_match`.
rules:
  - id: PRIVATE-INJECT-APIS
    title: "Helper - process injection imports"
    severity: info
    private: true
    conditions:
      - type: import_all
        names: ["!VirtualAllocEx", "!WriteProcessMemory", "!CreateRemoteThread"]

  - id: PRIVATE-SMALL-PE
    title: "Helper - small PE"
    severity: info
    private: true
    conditions:
      - type: native_signature
        expression: "PE and filesize < 200KB"

  - id: PRIV-INJECTOR-001
    title: "Small PE with process injection imports"
    description: "Both helper rules matched"
    severity: high
    verdict: malware
    family: "Trojan.Win32.Injector.Example"
    conditions:
      - type: rule_match
        ids: [PRIVATE-INJECT-APIS, PRIVATE-SMALL-PE]
