[package]
name = "openedr_web"
version = "0.1.0"
edition = "2021"
description = "Web/WASM edition of the OpenEDR static engine: ML trees, PE string rules, URL scoring. No fs, no Win32, no native disassembler, no Hayabusa."

[lib]
name = "openedr_web"
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.11"
hex = "0.4"
regex = "1.12"
url = "2.5"
yara-x = "1.20"
oxc_parser = "0.135"
oxc_ast = "0.135"
oxc_allocator = "0.135"
oxc_span = "0.135"
