rules:
- id: VK-ADW-SEARCHERBAR-HTA
  title: SearcherBar HTA adware
  description: C:\SearcherBar\run.hta / settings.hta started via mshta from start.cmd
  severity: medium
  verdict: pua
  confidence: 90
  score: 60
  family: Adware.HTML.SearcherBar
  tags:
  - analyst
  - adware
  - hta
  - driverpack
  logic: all
  conditions:
  - type: string_contains
    value: HTA:APPLICATION
    nocase: true
  - type: string_set
    min: 1
    nocase: true
    values:
    - searcherbar.tilda.ws
    - applicationName="SearcherBar
