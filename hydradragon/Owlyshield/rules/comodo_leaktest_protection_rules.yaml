# TEST #6: Invasion:RawDisk — Block raw disk device access entirely
- name: "HEUR:Win.Invasion.RawDiskAccess.gen"
  author: "HydraDragon"
  date: "2026-03-26"
  status: production
  level: critical
  severity: 100
  description: |
    Detects attempts to open raw disk devices (\Device\HarddiskVolume*,
    \Device\Harddisk*) with WRITE or DELETE access. Commonly used for:
    - Bootkit installation
    - MBR/VBR tampering
    - Direct partition modification
    - Ransomware encryption bypass
    COMODO Test #6: Invasion:RawDisk
    Blocks raw disk access.
  debug: false

  allowlisted_apps:
    - pattern: "%SystemRoot%/System32/diskpart.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "%SystemRoot%/System32/bcdboot.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "%SystemRoot%/System32/reagentc.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "%SystemRoot%/System32/dism.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "%SystemRoot%/servicing/TrustedInstaller.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "%SystemRoot%/WinSxS/*/TiWorker.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]

  named_conditions:
    raw_disk_write_access:
      orderless: true
      apis:
        - "*CreateFile*"
        - "*ReadFile*"
        - "*WriteFile*"
        - "*DeviceIoControl*"
        - "*NtCreateFile*"
        - "*ZwCreateFile*"
        - "*NtSetInformationFile*"
        - "*ZwSetInformationFile*"
        - "*NtFsControlFile*"
        - "*ZwFsControlFile*"
      file_paths:
        - "*\\\\Device\\\\Harddisk*"
        - "*\\\\Device\\\\HarddiskVolume*"
        - "*\\\\Device\\\\Harddisk0\\\\DR0*"
        - "*\\\\Device\\\\Harddisk0\\\\Partition*"
        - "*\\\\Device\\\\HarddiskVolumeShadowCopy*"
        - "*\\\\Device\\\\RawDisk*"
        - "*\\\\??\\\\PhysicalDrive*"
        - "*\\\\?\\\\PhysicalDrive*"
        - "*\\\\\\\\.\\\\PhysicalDrive*"
        - "*\\\\.\\\\PhysicalDrive*"
        - "*\\\\PhysicalDrive*"
        - "*physicaldrive*"
        - "*\\\\GLOBALROOT\\\\Device\\\\Harddisk*"
        - "*\\\\DosDevices\\\\PhysicalDrive*"
        - "*\\\\DosDevices\\\\ElRawDisk*"
        - "*\\\\?\\\\ElRawDisk*"
        - "*\\\\.\\\\ElRawDisk*"
        - "*ElRawDisk*"
        - "*RawDisk*"
        - "\\\\.\\\\PhysicalDrive*"
        - "\\\\.\\\\C:"
        - "\\\\.\\\\D:"
        - "\\\\.\\\\*:"
        - "\\\\Device\\\\Harddisk*"
        - "\\\\Device\\\\HarddiskVolume*"
        - "\\REGISTRY\\MACHINE\\SYSTEM\\CurrentControlSet\\Services\\*\\Parameters\\RegistryDeviceName"
        - "\\Device\\RawDisk"
        - "\\??\\PhysicalDrive*"
        - "\\\\.\\PhysicalDrive*"
      file_operations:
        - read
        - write
        - create
        - setinfo
        - delete
      min_matches: 1

  detection_logic:
    condition: "raw_disk_write_access"

  response:
    notify_user: true
    ask_user: false
    terminate_process: true
    status_access_denied: true
    record: true

  tags:
    - invasion
    - raw-disk
    - bootkit
    - bootloader
  mitre_attack:
    - T1014
    - T1561.001

