rules:
- id: VK-VIRUS-UPX1TAIL-DECRYPTED
  title: UPX1-tail EPO infector (decrypted body)
  description: Polymorphic EPO infector. A jump-chained decryptor in host code cavities decrypts the appended "UPX1" section and calls into it. Matches the body after emulation (Emulation:Decrypted object), identical across infected copies (32-bit and 64-bit hosts).
  severity: critical
  verdict: malware
  confidence: 95
  score: 100
  family: Virus.Win.UPX1Tail
  tags:
  - analyst
  - virus
  - epo
  - polymorphic
  - decrypted
  logic: all
  conditions:
  - type: byte_pattern
    pattern: 44 F7 87 92 36 18 1B 45 21 7A 85 00 84 40 12 85 40 D7 1F 23 C8 10 8D 04 B2 2D 1E DF 39 3F 79 A9
  - type: byte_pattern
    pattern: D8 75 99 F2 05 29 1B 45 0C 6A CB 34 8A D5 0E C5 E7 4B 88 EB BD 2C B3 21 51 F6 F5 05 C7 D6 C6 B4
  - type: byte_pattern
    pattern: 3B 55 F5 F9 39 85 B4 7C 6F ED 2E 90 FC 2D E6 36 2C 0C C0 F8 81 B9 35 C5 57 27 7E BF BB CA 8F 0F
