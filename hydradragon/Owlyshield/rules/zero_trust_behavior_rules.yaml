  name: '[HIGH] Credential Dumping - credential API memory read chain'
  description: Detects OpenProcess plus memory-read or minidump behavior often used against LSASS.
  enabled: true
  should_trust_cloud: false
  severity_score: 90
  severity: 90
  level: high
  status: stable
  author: Emirhan Ucan
  date: '2026-05-15'
  tags:
  - category:high
  - credential-access
  - lsass
  - multi-condition
  mitre_attack:
  - T1003.001
  references:
  - https://www.elastic.co/docs/reference/integrations/endpoint
  - https://attack.mitre.org/techniques/T1003/001/
  false_positives:
  - Security tools, debuggers, profilers, EDR sensors, and malware-analysis sandboxes may produce similar low-level telemetry.
  stages:
  - name: Credential API chain
    conditions:
    - type: MultiCondition
      operator: at_least
      require_same_source_pid: true
      conditions:
      - type: Api
        name_pattern: OpenProcess
        module_pattern: '*'
      - type: Api
        name_pattern: ReadProcessMemory
        module_pattern: '*'
      - type: Api
        name_pattern: MiniDumpWriteDump
        module_pattern: '*'
      within_ms: 1500
      min_matches: 2
  min_stages_satisfied: 1
  response:
    ask_user: true
    deny_while_ask: true
    terminate_process: true
    notify_user: true
    record: true
    quarantine: false
