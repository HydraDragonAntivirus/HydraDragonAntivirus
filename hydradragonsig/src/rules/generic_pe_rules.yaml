name: Generic PE static rules (crypter + capability scoring)
version: "0.1"
# Logic:
#   1) Obfuscation (packer / hidden embedded PE) alone is NOT a verdict.
#   2) A single capability (injection, ransom, stealer, AV tampering ...) is rarely a verdict alone.
#   3) Obfuscation + capability, or several capabilities together => verdict.
#   4) Unpacked / extracted children are compared with their parent (section D):
#      a thin packed shell whose dump suddenly imports injection APIs is a crypter.
# Tested against 1157 clean Windows PEs (OBS, PowerShell, KeePassXC, System Informer,
# AutoHotkey, Notepad++, rclone, UPX, 7-Zip ...) with zero detections.
rules:

  # ================================================================
  # A) OBFUSCATION SIGNALS (private: no finding on their own)
  # ================================================================

  # Note: .rsrc (PNG icons) and compressed data give one high-entropy section in clean
  # files, so plain section_entropy is not used: packed_pe + known protector section names.
  - id: HG-OBF-PACKED
    title: "Helper: packed PE (packer heuristic or known protector sections)"
    severity: info
    private: true
    logic: any
    conditions:
      - type: packed_pe
      - type: section_name_regex
        pattern: '(?i)^(\.themida|\.winlice|\.vmp[0-9]|\.enigma[0-9]?|\.aspack|\.adata|mpress[12]|\.petite|\.nsp[0-2]|\.boom|\.ccg|\.yp|\.maskpe|\.mew|pec2|\.perplex|\.spack|\.svkp|\.taz|\.vlizer|\.y0da|\.packed)$'

  # WEAK: the MSVC CRT puts these three imports in almost every program. Used only next
  # to a hidden PE in the crypter rule; never counted as obfuscation on its own.
  - id: HG-OBF-DYNRESOLVE
    title: "Helper: dynamic API resolution + memory permission change"
    severity: info
    private: true
    logic: all
    conditions:
      - type: import_any
        names: ["!GetProcAddress", "!LdrGetProcedureAddress"]
      - type: import_any
        names: ["!LoadLibraryA", "!LoadLibraryW", "!LoadLibraryExA", "!LoadLibraryExW", "!LdrLoadDll"]
      - type: import_any
        names: ["!VirtualProtect", "!VirtualAlloc", "!NtProtectVirtualMemory", "!NtAllocateVirtualMemory"]

  # DOS stub text hidden with single-byte XOR or base64 (a second, encoded PE).
  # The engine searches only the encoded forms (xor keys 1-255, base64 at the three
  # alignments): the plain stub of the file's own header never matches.
  - id: HG-OBF-ENCODED-DOS-STUB
    title: "Helper: XOR / base64 encoded DOS stub (hidden PE)"
    severity: info
    private: true
    conditions:
      - type: native_signature
        expression: "any of them"
        atoms:
          - id: stub_xor
            value: "This program cannot be run in DOS mode"
            ascii: true
            xor: true
            xor_min: 1
            xor_max: 255
          - id: stub_b64
            value: "This program cannot be run in DOS mode"
            base64: true
            base64wide: true

  # Encoded (xor / base64 / reversed / hex) second PE: the clearest crypter trace.
  - id: HG-OBF-HIDDEN-PE
    title: "Helper: encoded embedded PE"
    severity: info
    private: true
    logic: any
    conditions:
      - type: rule_match
        ids: [HG-OBF-ENCODED-DOS-STUB]
      - type: native_signature
        expression: "any of them"
        atoms:
          - id: mz_b64
            value: "TVqQAAMAAAAEAAAA"
            ascii: true
            wide: true
          - id: mz_b64_rev
            value: "AAAAEAAAAMAAQqVT"
            ascii: true
            wide: true
          - id: mz_hex
            value: "4D5A90000300000004000000"
            ascii: true
            wide: true
            nocase: true
          - id: mz_hex_dash
            value: "4D-5A-90-00-03-00-00-00"
            ascii: true
            wide: true
            nocase: true

  # Plain second PE after the header. Installers have it too: never a verdict alone.
  - id: HG-OBF-PLAIN-PE
    title: "Helper: plain embedded PE after the header"
    severity: info
    private: true
    conditions:
      - type: native_signature
        expression: "$dos in (0x400..0x7FFFFFFF) or $w32 in (0x400..0x7FFFFFFF)"
        atoms:
          - id: dos
            value: "This program cannot be run in DOS mode"
            ascii: true
          - id: w32
            value: "This program must be run under Win32"
            ascii: true

  # ================================================================
  # B) CAPABILITY SIGNALS (private)
  # API names are searched in imports AND strings: crypters / loaders resolve
  # APIs by name with GetProcAddress, so they never show in the import table.
  # ================================================================

  - id: HG-CAP-INJECT
    title: "Helper: process injection / hollowing"
    severity: info
    private: true
    logic: any
    conditions:
      - type: import_set
        min: 3
        names: ["!VirtualAllocEx", "!WriteProcessMemory", "!NtWriteVirtualMemory",
                "!SetThreadContext", "!Wow64SetThreadContext", "!NtUnmapViewOfSection",
                "!ZwUnmapViewOfSection", "!CreateRemoteThread", "!NtCreateThreadEx",
                "!QueueUserAPC", "!NtQueueApcThread", "!RtlCreateUserThread"]
      - type: string_set
        min: 4
        ascii: true
        wide: true
        values: ["VirtualAllocEx", "WriteProcessMemory", "NtWriteVirtualMemory",
                 "SetThreadContext", "Wow64SetThreadContext", "NtUnmapViewOfSection",
                 "ZwUnmapViewOfSection", "CreateRemoteThread", "NtCreateThreadEx",
                 "NtResumeThread", "QueueUserAPC"]

  # HG-CAP-RANSOM (recovery inhibition) lives in ransomware_rules.yaml with the other
  # ransomware steps; file_rules.yaml includes that file first.

  # ---- Stealer: target categories (one private rule each) ----
  # A category is never enough alone: browsers carry their own (and importer) store
  # names, Bitcoin Core carries wallet.dat, Steam carries loginusers.vdf.

  - id: HG-STL-BROWSER
    title: "Helper: credential / cookie stores of several browsers"
    severity: info
    private: true
    logic: all
    conditions:
      - type: string_set
        min: 2
        nocase: true
        ascii: true
        wide: true
        decoded: true
        values: ["Login Data", "Web Data", 'Network\Cookies', "logins.json", "key4.db",
                 "key3.db", "cookies.sqlite", "signons.sqlite", "formhistory.sqlite",
                 "Login Data For Account"]
      - type: string_set
        min: 2
        nocase: true
        ascii: true
        wide: true
        decoded: true
        values: ['Google\Chrome', 'Microsoft\Edge', 'BraveSoftware\Brave-Browser',
                 'Opera Software\Opera', 'Yandex\YandexBrowser', 'Mozilla\Firefox',
                 'Vivaldi\User Data', 'Chromium\User Data', 'Epic Privacy Browser',
                 'CentBrowser', 'Comodo\Dragon', 'Torch\User Data', 'Kometa\User Data',
                 'Orbitum\User Data', 'Amigo\User Data', '7Star\7Star', 'Sputnik\Sputnik',
                 'uCozMedia\Uran', 'Waterfox', 'CocCoc\Browser',
                 'Iridium\User Data']

  - id: HG-STL-WALLET
    title: "Helper: crypto wallet files / wallet extension ids"
    severity: info
    private: true
    conditions:
      - type: string_set
        min: 2
        nocase: true
        ascii: true
        wide: true
        decoded: true
        values: ["wallet.dat", 'Exodus\exodus.wallet', 'Electrum\wallets', 'atomic\Local Storage',
                 'Ethereum\keystore', 'Coinomi\Coinomi', 'com.liberty.jaxx', 'Guarda\Local Storage',
                 'Bitcoin\wallets', 'Monero\wallets', 'Electrum-LTC', 'WalletWasabi',
                 'Ledger Live', 'Local Extension Settings\',
                 "nkbihfbeogaeaoehlefnkodbefgpgknn", "ejbalbakoplchlghecdalmeeeajnimhm",
                 "bfnaelmomeimhlpmgjnjophhpkkoljpa", "fhbohimaelbohpjbbldcngcnapndodjp",
                 "hnfanknocfeofbddgcijnmhnfnkdnaad", "ibnejdfjmmkpcnlpebklmnkoeoihofec",
                 "fnjhmkhhmkbjkkabndcnnogagogbneec", "dmkamcknogkgcdfhhbddcghachkejeap",
                 "egjidjbpglichdcondbcbdnbeeppgdph", "aholpfdialjgjfhomihkjbmgjidlcdno",
                 "ffnbelfdoeiohenkjibnmadjiehjhajb", "hpglfhgfnhbgpjdenjgmdgoeiappafln",
                 "aiifbnbfobpmeekipheeijimdpnlpgpp", "cjelfplplebdjjenllpjcblmjkfcffne"]

  - id: HG-STL-MESSENGER
    title: "Helper: messenger / game / FTP session and token stores"
    severity: info
    private: true
    conditions:
      - type: string_set
        min: 2
        nocase: true
        ascii: true
        wide: true
        decoded: true
        values: ['discord\Local Storage\leveldb', 'discordcanary', 'discordptb', 'Lightcord',
                 "dQw4w9WgXcQ:", '[\w-]{24}\.[\w-]{6}\.[\w-]{27}', 'mfa\.[\w-]{84}',
                 'Telegram Desktop\tdata', 'tdata\key_datas', "loginusers.vdf",
                 'Steam\config', "ssfn*", 'Growtopia\save.dat',
                 '.minecraft\launcher_accounts', 'Battle.net\Battle.net.config']

  - id: HG-STL-MAILFTP
    title: "Helper: mail / FTP / VPN client credential stores"
    severity: info
    private: true
    conditions:
      - type: string_set
        min: 2
        nocase: true
        ascii: true
        wide: true
        decoded: true
        values: ['Aerofox\Foxmail', 'Foxmail\V3.1', "IncrediMail", 'Thunderbird\Profiles',
                 'Mailbird\Store', 'The Bat!', 'Claws-mail', "ClawsMail", 'Pocomail',
                 'Windows Mail\Local Folders', 'Outlook\Profiles', 'eM Client',
                 'FileZilla\recentservers.xml', 'FileZilla\sitemanager.xml', "CoreFTP",
                 "FTP Navigator", "FTPGetter", "FtpCommander", 'SmartFTP\Client 2.0',
                 'Martin Prikryl\WinSCP 2\Sessions', 'Pidgin\accounts.xml',
                 'OpenVPN Connect\profiles', 'NordVPN\NordVPN.exe']

  # Two target categories: the credential-collection part of a stealer.
  - id: HG-CAP-STEALER
    title: "Helper: credential stores of two different kinds (browser / wallet / messenger / mail-FTP)"
    severity: info
    private: true
    conditions:
      - type: rule_match
        min: 2
        ids: [HG-STL-BROWSER, HG-STL-WALLET, HG-STL-MESSENGER, HG-STL-MAILFTP]

  - id: HG-STL-DECRYPT
    title: "Helper: browser secret decryption (DPAPI / os_crypt key / sqlite queries)"
    severity: info
    private: true
    logic: any
    conditions:
      - type: import_any
        names: ["!CryptUnprotectData"]
      - type: string_set
        min: 1
        nocase: true
        ascii: true
        wide: true
        decoded: true
        values: ["CryptUnprotectData", "encrypted_key", "app_bound_encrypted_key", "os_crypt",
                 "password_value", "encrypted_value", "FROM moz_cookies", "FROM logins",
                 "sqlite3_prepare_v2", "PK11SDR_Decrypt", "BCRYPT_CHAIN_MODE_GCM",
                 "ChainingModeGCM", "crypt32.dll"]

  - id: HG-CAP-EXFIL
    title: "Helper: bot / webhook exfiltration endpoints"
    severity: info
    private: true
    conditions:
      - type: string_set
        min: 1
        nocase: true
        ascii: true
        wide: true
        decoded: true
        values: ["api.telegram.org/bot", "discord.com/api/webhooks",
                 "discordapp.com/api/webhooks", "pastebin.com/raw/"]

  - id: HG-STL-EXFIL
    title: "Helper: a way out (bot / webhook endpoint, HTTP / SMTP / FTP / socket send)"
    severity: info
    private: true
    logic: any
    conditions:
      - type: rule_match
        ids: [HG-CAP-EXFIL]
      - type: import_any
        names: ["!WinHttpSendRequest", "!WinHttpConnect", "!HttpSendRequestA", "!HttpSendRequestW",
                "!InternetConnectA", "!InternetConnectW", "!InternetOpenUrlA", "!InternetOpenUrlW",
                "ws2_32.dll!send", "ws2_32.dll!connect", "ws2_32.dll!WSASend",
                "ws2_32.dll!ord4", "ws2_32.dll!ord19", "wsock32.dll!ord4", "wsock32.dll!ord19"]
      # .NET / dynamically resolved upload.
      - type: string_set
        min: 1
        ascii: true
        wide: true
        values: ["MultipartFormDataContent", "UploadData", "UploadFile", "UploadValues",
                 "WinHttpSendRequest", "HttpSendRequestA", "HttpSendRequestW",
                 "multipart/form-data; boundary=", "SmtpClient", "FtpWebRequest",
                 "winhttp.dll", "wininet.dll"]

  - id: HG-CAP-DEFENSE-OFF
    title: "Helper: disables Defender / security tools"
    severity: info
    private: true
    conditions:
      - type: string_set
        min: 1
        nocase: true
        ascii: true
        wide: true
        decoded: true
        values: ["Set-MpPreference -DisableRealtimeMonitoring",
                 "Add-MpPreference -ExclusionPath", "Add-MpPreference -ExclusionProcess",
                 "DisableAntiSpyware", "DisableRealtimeMonitoring",
                 "netsh advfirewall set allprofiles state off"]

  # Keyboard APIs are in every GUI program; keystroke log markers give a keylogger away.
  - id: HG-CAP-KEYLOG
    title: "Helper: keyboard capture with keystroke log markers"
    severity: info
    private: true
    logic: all
    conditions:
      - type: import_any
        names: ["!SetWindowsHookExA", "!SetWindowsHookExW", "!GetAsyncKeyState",
                "!GetKeyboardState", "!RegisterRawInputDevices", "!GetRawInputData"]
      - type: string_set
        min: 4
        nocase: true
        ascii: true
        wide: true
        values: ["[ENTER]", "[BACKSPACE]", "[BACK]", "[TAB]", "[CAPSLOCK]", "[SHIFT]",
                 "[CTRL]", "[ESC]", "[DEL]", "[WIN]", "[ALT]", "[UP]", "[DOWN]"]

  - id: HG-CAP-DOWNLOAD-EXEC
    title: "Helper: download and execute"
    severity: info
    private: true
    logic: all
    conditions:
      - type: import_any
        names: ["!URLDownloadToFileA", "!URLDownloadToFileW"]
      - type: import_any
        names: ["!WinExec", "!ShellExecuteA", "!ShellExecuteW", "!ShellExecuteExW",
                "!CreateProcessA", "!CreateProcessW"]

  - id: HG-CAP-ANTI-ANALYSIS
    title: "Helper: sandbox / VM / analysis-tool checks"
    severity: info
    private: true
    conditions:
      - type: string_set
        min: 4
        nocase: true
        ascii: true
        wide: true
        values: ["SbieDll.dll", "VBoxService", "VBoxTray", "vmtoolsd", "vmwaretray",
                 "wine_get_unix_file_name", "x64dbg", "ollydbg", "ProcessHacker",
                 "Wireshark", "procmon", "cuckoomon", "dbghelp.dll", "qemu-ga"]

  - id: HG-CAP-PERSIST
    title: "Helper: autostart persistence"
    severity: info
    private: true
    conditions:
      - type: string_set
        min: 1
        nocase: true
        ascii: true
        wide: true
        decoded: true
        values: ['Software\Microsoft\Windows\CurrentVersion\Run',
                 "schtasks /create", "schtasks.exe /create",
                 '\Start Menu\Programs\Startup']

  # ================================================================
  # C) VERDICT RULES
  # ================================================================

  # Ransomware verdicts: RANSOM_0001 / RANSOM_0002 in ransomware_rules.yaml.

  # Crypter: encoded second PE + (packer / dynamic resolution / injection / anti-analysis)
  - id: HDS-GEN-CRYPTER-001
    title: "Crypter shell carrying an encoded PE"
    severity: high
    verdict: malware
    confidence: 90
    score: 85
    family: "Trojan.Win32.Crypter.A"
    logic: all
    conditions:
      - type: rule_match
        ids: [HG-OBF-HIDDEN-PE]
      - type: rule_match
        min: 1
        ids: [HG-OBF-PACKED, HG-OBF-DYNRESOLVE, HG-CAP-INJECT, HG-CAP-ANTI-ANALYSIS]

  # Dropper: plain embedded PE + packer + at least one malicious capability
  - id: HDS-GEN-DROPPER-001
    title: "Obfuscated dropper with embedded PE and malicious capability"
    severity: high
    verdict: malware
    confidence: 85
    score: 80
    family: "Trojan.Win32.Dropper.Gen"
    logic: all
    conditions:
      - type: rule_match
        ids: [HG-OBF-PLAIN-PE]
      - type: rule_match
        ids: [HG-OBF-PACKED]
      - type: rule_match
        min: 1
        ids: [HG-CAP-INJECT, HG-CAP-DEFENSE-OFF, HG-CAP-ANTI-ANALYSIS, HG-CAP-DOWNLOAD-EXEC]

  # Stealer: two kinds of credential store + secret decryption + a way out.
  # One category, or paths alone, never match.
  - id: HDS-GEN-STEALER-001
    title: "Generic info stealer"
    severity: high
    verdict: malware
    confidence: 90
    score: 85
    family: "Stealer.Win32.Generic"
    tags: [stealer, credential-access]
    mitre:
      - id: T1555.003
        name: "Credentials from Password Stores: Credentials from Web Browsers"
        tactic: Credential Access
      - id: T1041
        name: "Exfiltration Over C2 Channel"
        tactic: Exfiltration
    logic: all
    conditions:
      - type: rule_match
        ids: [HG-CAP-STEALER, HG-STL-DECRYPT, HG-STL-EXFIL]

  # Emulation (Unicorn trace mode, ScanReport::behavior): a browser / wallet /
  # messenger store opened and then something sent out. Extra score only: never
  # malware on its own; a packed stealer's unpacked dump is scanned with the static
  # rule above as well. Without a trace this rule never matches.
  - id: HDS-GEN-STEALER-EMU-001
    title: "Emulation: credential store read, then data sent"
    severity: medium
    verdict: suspicious
    confidence: 70
    score: 40
    family: "Generic.Win32.StealerBehavior"
    tags: [stealer, emulation]
    mitre:
      - id: T1555.003
        name: "Credentials from Password Stores: Credentials from Web Browsers"
        tactic: Credential Access
    conditions:
      - type: emulated_sequence
        steps:
          - api: "CreateFileW|CreateFileA|CopyFileW|CopyFileA|CopyFileExW|NtCreateFile"
            pattern: '(?i)(\\Login Data|\\Web Data|\\Cookies|logins\.json|key[34]\.db|cookies\.sqlite|wallet\.dat|\\tdata\\|\\Local Storage\\leveldb|\\Local Extension Settings\\|loginusers\.vdf|recentservers\.xml)'
          - api: "WinHttpSendRequest|WinHttpWriteData|HttpSendRequestW|HttpSendRequestA|InternetWriteFile|InternetOpenUrlW|InternetOpenUrlA|send|WSASend"

  # The core generic rule: obfuscation + at least 2 different malicious capabilities
  - id: HDS-GEN-PE-001
    title: "Obfuscated PE with multiple malicious capabilities"
    severity: high
    verdict: malware
    confidence: 85
    score: 75
    family: "Trojan.Win32.Generic.HDS"
    logic: all
    conditions:
      - type: rule_match
        min: 1
        ids: [HG-OBF-PACKED, HG-OBF-HIDDEN-PE]
      - type: rule_match
        min: 2
        ids: [HG-CAP-INJECT, HG-CAP-DEFENSE-OFF, HG-CAP-KEYLOG, HG-CAP-DOWNLOAD-EXEC,
              HG-CAP-ANTI-ANALYSIS, HG-CAP-PERSIST, HG-CAP-EXFIL]

  # 3+ capabilities without obfuscation (unpacked payloads land here)
  - id: HDS-GEN-PE-002
    title: "PE with three or more malicious capabilities"
    severity: high
    verdict: malware
    confidence: 80
    score: 70
    family: "Trojan.Win32.Generic.HDS"
    conditions:
      - type: rule_match
        min: 3
        ids: [HG-CAP-INJECT, HG-CAP-DEFENSE-OFF, HG-CAP-KEYLOG, HG-CAP-DOWNLOAD-EXEC,
              HG-CAP-ANTI-ANALYSIS, HG-CAP-PERSIST, HG-CAP-EXFIL]

  # Obfuscation + one capability: suspicious (cloud ML / analyst decides)
  - id: HDS-GEN-PE-SUSP-001
    title: "Obfuscated PE with a malicious capability"
    severity: medium
    verdict: suspicious
    confidence: 60
    score: 30
    family: "HEUR.Win32.Suspicious.Gen"
    logic: all
    conditions:
      - type: rule_match
        min: 1
        ids: [HG-OBF-PACKED, HG-OBF-HIDDEN-PE]
      - type: rule_match
        min: 1
        ids: [HG-CAP-INJECT, HG-CAP-DEFENSE-OFF, HG-CAP-KEYLOG, HG-CAP-DOWNLOAD-EXEC,
              HG-CAP-ANTI-ANALYSIS, HG-CAP-EXFIL, HG-CAP-RANSOM]

  # ================================================================
  # D) PARENT COMPARISON (unpacked dumps / extracted payloads)
  # These only match when the scan carries a parent summary: HydraDragonAV passes
  # the packed original to the Unicorn dump scan, the CLI takes --parent FILE,
  # and zip members get their archive automatically.
  # ================================================================

  # The original was a thin shell: few imports (a stub that resolves the rest at runtime).
  - id: HG-PARENT-THIN-SHELL
    title: "Helper: child of a thin PE shell"
    severity: info
    private: true
    logic: all
    conditions:
      - type: has_parent
      - type: parent_feature_lte
        name: pe_import_count
        value: 30

  # Injection / hollowing APIs that the shell did not import but the dump does.
  - id: HG-PARENT-NEW-INJECT
    title: "Helper: injection imports that appear only after unpacking"
    severity: info
    private: true
    conditions:
      - type: new_import_set
        min: 3
        names: ["!VirtualAllocEx", "!WriteProcessMemory", "!NtWriteVirtualMemory",
                "!SetThreadContext", "!Wow64SetThreadContext", "!NtUnmapViewOfSection",
                "!ZwUnmapViewOfSection", "!CreateRemoteThread", "!NtCreateThreadEx",
                "!QueueUserAPC", "!NtQueueApcThread", "!RtlCreateUserThread"]

  # Crypter by diff: thin shell -> dump with hidden injection + another malicious capability.
  - id: HDS-GEN-UNPACKED-CRYPTER-001
    title: "Crypter: unpacked payload reveals hidden injection and malicious capability"
    severity: high
    verdict: malware
    confidence: 90
    score: 90
    family: "Trojan.Win32.Crypter.B"
    logic: all
    conditions:
      - type: rule_match
        ids: [HG-PARENT-THIN-SHELL, HG-PARENT-NEW-INJECT]
      - type: rule_match
        min: 1
        ids: [HG-CAP-DEFENSE-OFF, HG-CAP-ANTI-ANALYSIS, HG-CAP-KEYLOG, HG-CAP-EXFIL,
              HG-CAP-STEALER, HG-CAP-RANSOM, HG-CAP-DOWNLOAD-EXEC]

  # Many suspicious APIs appear after unpacking + 2 capabilities. Injection is not counted
  # here: the import delta already is that signal (a UPX-packed System Informer gains
  # injection imports and a Run-key string and must stay suspicious, not malware).
  - id: HDS-GEN-UNPACKED-CAPS-001
    title: "Unpacked payload gains many suspicious APIs and malicious capabilities"
    severity: high
    verdict: malware
    confidence: 85
    score: 80
    family: "Trojan.Win32.Generic.HDS.B"
    logic: all
    conditions:
      - type: rule_match
        ids: [HG-PARENT-THIN-SHELL]
      - type: feature_delta_gte
        name: pe_suspicious_import_count
        value: 5
      - type: rule_match
        min: 2
        ids: [HG-CAP-DEFENSE-OFF, HG-CAP-KEYLOG, HG-CAP-DOWNLOAD-EXEC, HG-CAP-ANTI-ANALYSIS,
              HG-CAP-PERSIST, HG-CAP-EXFIL, HG-CAP-STEALER, HG-CAP-RANSOM]

  # The diff alone: suspicious (legit UPX-packed tools also gain imports when unpacked).
  - id: HDS-GEN-UNPACKED-SUSP-001
    title: "Unpacked payload gains suspicious APIs hidden by its shell"
    severity: medium
    verdict: suspicious
    confidence: 60
    score: 30
    family: "HEUR.Win32.Crypter.Gen"
    logic: all
    conditions:
      - type: rule_match
        ids: [HG-PARENT-THIN-SHELL]
      - type: rule_match
        min: 1
        ids: [HG-PARENT-NEW-INJECT]
