name: Re-sign All Binaries on Certificate Change

on:
  push:
    branches: ["**"]
    paths:
      - 'Sanctum/driver/sanctum.pfx'
      - '.github/workflows/resign-all-on-cert-change.yml'
      - 'Sanctum/sign_ppl_runner.bat'
      - 'Sanctum/sign_firewall.bat'
      - 'Sanctum/sign_owlyshield_predict.bat'
      - 'Sanctum/sign_etw_consumer.bat'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  resign-all:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
        
      - uses: actions/checkout@v6
      
      - name: Setup Windows SDK
        shell: pwsh
        run: |
          $sdkSetupPath = "$Env:TEMP\sdksetup.exe"
          Write-Host "Downloading Windows SDK..."
          (New-Object Net.WebClient).DownloadFile('https://go.microsoft.com/fwlink/?linkid=2272610', $sdkSetupPath)
          Write-Host "Installing Windows SDK..."
          Start-Process -FilePath $sdkSetupPath -ArgumentList "/quiet", "/norestart", "/features", "OptionId.SigningTools" -NoNewWindow -Wait
          Write-Host "Windows SDK installed successfully"

          $sdkPath = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64"
          if (Test-Path $sdkPath) {
            Write-Host "Adding $sdkPath to PATH"
            echo "$sdkPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            $kitsPath = "C:\Program Files (x86)\Windows Kits\10\bin"
            if (Test-Path $kitsPath) {
              $latestSdk = Get-ChildItem $kitsPath | Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } | Sort-Object Name -Descending | Select-Object -First 1
              if ($latestSdk) {
                $sdkPath = Join-Path $latestSdk.FullName "x64"
                Write-Host "Adding $sdkPath to PATH"
                echo "$sdkPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              }
            }
          }
          
      - name: Re-sign All Binaries
        shell: pwsh
        run: |
          Write-Host "=== Re-signing all binaries with updated certificate ==="
          
          # Re-sign PPL Runner
          if (Test-Path "hydradragon\Sanctum\AppData\sanctum_ppl_runner.exe") {
            Write-Host "`n[1/4] Re-signing PPL Runner..."
            Push-Location Sanctum
            .\sign_ppl_runner.bat
            Pop-Location
          } else {
            Write-Host "`n[1/4] SKIP: PPL Runner binary not found at hydradragon\Sanctum\AppData\sanctum_ppl_runner.exe"
          }
          
          # Re-sign Firewall
          if (Test-Path "hydradragon\HydraDragonFirewall\hydradragonfirewall.exe") {
            Write-Host "`n[2/4] Re-signing Firewall..."
            Push-Location Sanctum
            .\sign_firewall.bat
            Pop-Location
          } else {
            Write-Host "`n[2/4] SKIP: Firewall binary not found at hydradragon\HydraDragonFirewall\hydradragonfirewall.exe"
          }
          
          # Re-sign Owlyshield Predict
          if (Test-Path "hydradragon\Owlyshield\Owlyshield Service\owlyshield_ransom.exe") {
            Write-Host "`n[3/4] Re-signing Owlyshield Predict..."
            Push-Location Sanctum
            .\sign_owlyshield_predict.bat
            Pop-Location
          } else {
            Write-Host "`n[3/4] SKIP: Owlyshield Predict binary not found at hydradragon\Owlyshield\Owlyshield Service\owlyshield_ransom.exe"
          }
          
          # Re-sign ETW Consumer (if exists)
          if (Test-Path "hydradragon\Sanctum\etw_consumer.exe") {
            Write-Host "`n[4/4] Re-signing ETW Consumer..."
            Push-Location Sanctum
            .\sign_etw_consumer.bat
            Pop-Location
          } else {
            Write-Host "`n[4/4] SKIP: ETW Consumer binary not found at hydradragon\Sanctum\etw_consumer.exe"
          }
          
          Write-Host "`n=== All available binaries re-signed with new certificate ==="
          
      - name: Prepare Re-signed Binaries for PR
        shell: pwsh
        run: |
          Write-Host "=== Preparing re-signed binaries for PR ==="
          
          # Touch files to ensure git detects changes (signatures changed but size might not have)
          if (Test-Path "hydradragon\Sanctum\AppData\sanctum_ppl_runner.exe") {
            (Get-Item "hydradragon\Sanctum\AppData\sanctum_ppl_runner.exe").LastWriteTime = Get-Date
            Write-Host "Touched: hydradragon/Sanctum/AppData/sanctum_ppl_runner.exe"
          }
          
          if (Test-Path "hydradragon\HydraDragonFirewall\hydradragonfirewall.exe") {
            (Get-Item "hydradragon\HydraDragonFirewall\hydradragonfirewall.exe").LastWriteTime = Get-Date
            (Get-Item "hydradragon\HydraDragonFirewall\hydradragonfirewall.dll").LastWriteTime = Get-Date
            (Get-Item "hydradragon\HydraDragonFirewall\WinDivert.dll").LastWriteTime = Get-Date
            Write-Host "Touched: hydradragon/HydraDragonFirewall/*.exe, *.dll"
          }
          
          if (Test-Path "hydradragon\Owlyshield\Owlyshield Service\owlyshield_ransom.exe") {
            (Get-Item "hydradragon\Owlyshield\Owlyshield Service\owlyshield_ransom.exe").LastWriteTime = Get-Date
            (Get-Item "hydradragon\Owlyshield\Owlyshield Service\tensorflowlite_c.dll").LastWriteTime = Get-Date
            Write-Host "Touched: hydradragon/Owlyshield/Owlyshield Service/*.exe, *.dll"
          }
          
          Write-Host "`n=== Re-signed binaries prepared for PR ==="
      
      - name: Get Certificate Hash
        id: cert_hash
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $certInfo = & signtool verify /pa /v "hydradragon\Sanctum\AppData\sanctum_ppl_runner.exe" 2>&1
          $hashLine = $certInfo | Select-String "SHA1 hash:"
          if ($hashLine) {
            $hash = ($hashLine -split "SHA1 hash:")[1].Trim()
            echo "hash=$hash" >> $env:GITHUB_OUTPUT
            Write-Host "Certificate SHA1: $hash"
          } else {
            echo "hash=Unknown" >> $env:GITHUB_OUTPUT
            Write-Host "Could not extract certificate hash"
          }
          exit 0
          
      - name: Create PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(sanctum): re-sign all binaries with updated certificate"
          title: "Re-sign All Binaries with Updated Certificate"
          body: |
            Automated re-signing of all binaries after certificate change.
            
            This ensures all components (driver, PPL runner, firewall, owlyshield) are signed with the same certificate to prevent error 577 (driver signature invalid).
            
            Certificate SHA1: ${{ steps.cert_hash.outputs.hash }}
          add-paths: |
            hydradragon/Sanctum/AppData/*
            hydradragon/HydraDragonFirewall/*
            hydradragon/Owlyshield/Owlyshield Service/*
          branch: "auto-resign-binaries"
          base: ${{ github.ref_name }}
          delete-branch: true
          labels: binaries, automated-pr, sanctum, signing
          author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
