# ─── CREDENTIAL ACCESS ───────────────────────────────────────────────────────
# Rules detecting credential theft, dumping, and harvesting techniques.
# ─────────────────────────────────────────────────────────────────────────────

- name: "HEUR:Win.CredAccess.LSASSMemoryDump.gen"
  should_trust_comodo_cloud: false
  author: "Emirhan Ucan"
  date: "2026-03-22"
  status: test
  level: critical
  severity: 98
  description: |
    Detects attempts to dump LSASS process memory for credential extraction.
    Tools like Mimikatz, ProcDump, comsvcs.dll MiniDump, and direct NtReadVirtualMemory
    calls on LSASS are the primary means attackers extract plaintext passwords
    and NTLM hashes from Windows.
    Equivalent to Sigma: LSASS Memory Dump File Creation (T1003.001).
  debug: false

  named_conditions:
    procdump_lsass:
      orderless: false
      created_processes:
        - "procdump.exe"
        - "procdump64.exe"
      cmdline_keywords:
        - "lsass"
      min_matches: 1

    comsvcs_minidump:
      orderless: false
      created_processes:
        - "rundll32.exe"
      cmdline_keywords:
        - "comsvcs.dll"
        - "MiniDump"
      min_matches: 1

    sqldumper_lsass:
      orderless: false
      created_processes:
        - "sqldumper.exe"
      cmdline_keywords:
        - "lsass"
      min_matches: 1

    dump_file_creation:
      orderless: true
      file_paths:
        - \Temp\
        - \AppData\
        - \Desktop\
        - \Downloads\
        - :\Windows\Temp\
      file_extensions:
        - ".dmp"
        - ".dump"
        - ".mdmp"
      file_operations:
        - create
        - write
      min_matches: 1

    lsass_memory_read_api:
      orderless: true
      apis:
        - "ntdll.dll!NtReadVirtualMemory"
        - "kernel32.dll!ReadProcessMemory"
      api_threshold: 1

    adplus_lsass:
      orderless: false
      created_processes:
        - "adplus.exe"
        - "adplus.vbs"
      cmdline_keywords:
        - "-hang"
        - "-crash"
      min_matches: 1

  detection_logic:
    or:
      - condition: "procdump_lsass"
      - condition: "comsvcs_minidump"
      - condition: "sqldumper_lsass"
      - condition: "adplus_lsass"
      - and:
          - condition: "lsass_memory_read_api"
          - condition: "dump_file_creation"

  response:
    notify_user: true
    ask_user: true
    deny_while_ask: true
    terminate_process: false
    record: true

  tags:
    - credential-access
    - lsass
    - memory-dump
    - mimikatz
  mitre_attack:
    - T1003.001
  false_positives:
    - "Windows Error Reporting generating LSASS crash dumps"
    - "Security tools performing memory inspection (must be signed)"
    - "Legitimate debugging by system administrators"


- name: "HEUR:Win.CredAccess.CredentialManagerDump.gen"
  should_trust_comodo_cloud: false
  author: "Emirhan Ucan"
  date: "2026-03-22"
  status: test
  level: high
  severity: 85
  description: |
    Detects access to Windows Credential Manager via cmdkey.exe /list,
    PowerShell Get-StoredCredential, or vaultcmd.exe enumeration.
    Attackers enumerate stored credentials (RDP, network, web) before
    lateral movement.
    Equivalent to Sigma: Credential Manager Access (T1555.004).
  debug: false

  named_conditions:
    cmdkey_list:
      orderless: false
      created_processes:
        - "cmdkey.exe"
      cmdline_keywords:
        - "/list"
      min_matches: 1

    vaultcmd_list:
      orderless: false
      created_processes:
        - "vaultcmd.exe"
      cmdline_keywords:
        - "/listcreds"
        - "/listschema"
      min_matches: 1

    powershell_cred_enum:
      orderless: true
      created_processes:
        - "powershell.exe"
        - "pwsh.exe"
      cmdline_keywords:
        - "Get-StoredCredential"
        - "CredEnumerate"
        - "Windows.Security.Credentials"
      min_matches: 1

    cred_api_enum:
      orderless: true
      apis:
        - "advapi32.dll!CredReadW"
        - "advapi32.dll!CredEnumerateW"
        - "advapi32.dll!CredReadDomainCredentialsW"
      api_threshold: 1

  detection_logic:
    or:
      - condition: "cmdkey_list"
      - condition: "vaultcmd_list"
      - condition: "powershell_cred_enum"
      - condition: "cred_api_enum"

  response:
    notify_user: true
    ask_user: false
    terminate_process: false
    record: true

  tags:
    - credential-access
    - credential-manager
    - info
  mitre_attack:
    - T1555.004
    - T1555.003
  false_positives:
    - "Password manager applications"
    - "IT tools checking stored credentials"


- name: "HEUR:Win.CredAccess.NTDSAccessAttempt.gen"
  should_trust_comodo_cloud: false
  author: "Emirhan Ucan"
  date: "2026-03-22"
  status: test
  level: critical
  severity: 97
  description: |
    Detects attempts to access NTDS.dit (Active Directory database) directly.
    NTDS.dit contains all domain password hashes; exfiltrating it with
    ntdsutil, vssadmin snapshot, or direct file access enables offline
    cracking of all domain accounts.
    Equivalent to Sigma: NTDS.DIT File Access (T1003.003).
  debug: false

  named_conditions:
    ntds_file_access:
      orderless: true
      file_paths:
        - \Windows\NTDS\ntds.dit
        - \NTDS\ntds.dit
        - ntds.dit
      file_operations:
        - read
        - copy
      min_matches: 1

    ntdsutil_ifm:
      orderless: false
      created_processes:
        - "ntdsutil.exe"
      cmdline_keywords:
        - "ifm"
        - "create full"
        - "activate instance ntds"
      min_matches: 1

    shadow_ntds_copy:
      orderless: true
      created_processes:
        - "vssadmin.exe"
        - "diskshadow.exe"
      cmdline_keywords:
        - "ntds"
      min_matches: 1

  detection_logic:
    or:
      - condition: "ntds_file_access"
      - condition: "ntdsutil_ifm"
      - condition: "shadow_ntds_copy"

  response:
    terminate_process: true
    quarantine: true
    notify_user: true
    record: true

  tags:
    - credential-access
    - active-directory
    - ntds
    - critical
  mitre_attack:
    - T1003.003
    - T1003.002
  false_positives:
    - "Domain Controller backup software (must be signed and authorized)"
    - "Active Directory migration tools"


- name: "INFO:Win.CredAccess.SAMHiveAccess.gen"
  should_trust_comodo_cloud: false
  author: "Emirhan Ucan"
  date: "2026-03-22"
  status: test
  level: high
  severity: 88
  description: |
    Detects access to the SAM registry hive or SAM backup file.
    The SAM hive stores local account password hashes; reading it
    (via reg save, regedit export, or direct file access) enables
    offline hash extraction and Pass-the-Hash attacks.
    Equivalent to Sigma: SAM Registry Hive Handle Request (T1003.002).
  debug: false

  named_conditions:
    sam_registry_read:
      orderless: true
      registry_keys:
        - HKLM\SAM\SAM
        - HKLM\SAM
      registry_operations:
        - reg_create_key
        - reg_set_value
        - reg_delete_value
        - reg_delete_key
        - reg_rename_key
        - reg_query_value
        - reg_query_key
        - reg_open_key
        - reg_enum_key
        - reg_enum_value
      min_matches: 1

    reg_save_sam:
      orderless: false
      created_processes:
        - "reg.exe"
      cmdline_keywords:
        - "save"
        - "SAM"
      min_matches: 1

    sam_file_access:
      orderless: true
      file_paths:
        - \Windows\System32\config\SAM
        - \System32\config\SAM
        - \config\SAM
      file_operations:
        - read
        - copy
      min_matches: 1

  detection_logic:
    or:
      - condition: "sam_registry_read"
      - condition: "reg_save_sam"
      - condition: "sam_file_access"

  response:
    notify_user: true
    ask_user: true
    deny_while_ask: true
    terminate_process: false
    record: true

  tags:
    - credential-access
    - sam-hive
    - local-accounts
  mitre_attack:
    - T1003.002
  false_positives:
    - "System backup tools copying config hives"
    - "Registry repair utilities"


- name: "INFO:Win.CredAccess.BruteForceLocal.gen"
  should_trust_comodo_cloud: false
  author: "Emirhan Ucan"
  date: "2026-03-22"
  status: test
  level: medium
  severity: 55
  description: |
    Informational: potential local brute-force — net use or runas with
    multiple failures, or hydra/medusa/ncrack tools being executed.
    Logged for correlation with account lockout events.
    Equivalent to Sigma: Multiple Failed Logon Attempts (T1110).
  debug: false

  named_conditions:
    brute_force_tools:
      orderless: true
      created_processes:
        - "hydra.exe"
        - "medusa.exe"
        - "ncrack.exe"
        - "hashcat.exe"
        - "john.exe"
      min_matches: 1

    net_use_auth:
      orderless: false
      created_processes:
        - "net.exe"
        - "net1.exe"
      cmdline_keywords:
        - "use"
        - "/user"
      min_matches: 1

  detection_logic:
    or:
      - condition: "brute_force_tools"
      - condition: "net_use_auth"

  response:
    notify_user: true
    ask_user: false
    terminate_process: false
    record: true

  tags:
    - credential-access
    - brute-force
    - info
  mitre_attack:
    - T1110
    - T1110.001
  false_positives:
    - "Legitimate network path mapping with net use"
    - "Password auditing during authorized penetration testing"


- name: "INFO:Win.CredAccess.DPAPIKeyExport.gen"
  should_trust_comodo_cloud: false
  author: "Emirhan Ucan"
  date: "2026-03-22"
  status: test
  level: high
  severity: 78
  description: |
    Informational: DPAPI master key or protected data accessed via
    CryptUnprotectData or PFX certificate export. Attackers use DPAPI
    to decrypt stored browser passwords, RDP credentials, and certificates
    without needing the user's plaintext password.
    Equivalent to Sigma: DPAPI Domain Backup Key Extraction (T1555).
  debug: false

  named_conditions:
    dpapi_unprotect:
      orderless: true
      apis:
        - "crypt32.dll!CryptUnprotectData"
        - "crypt32.dll!CryptUnprotectMemory"
      api_threshold: 1

    pfx_export:
      orderless: true
      apis:
        - "crypt32.dll!PFXExportCertStoreEx"
      api_threshold: 1

    dpapi_file_access:
      orderless: true
      file_paths:
        - \Microsoft\Protect\
        - \AppData\Roaming\Microsoft\Protect\
      file_operations:
        - read
      min_matches: 1

  detection_logic:
    or:
      - and:
          - condition: "dpapi_unprotect"
          - condition: "dpapi_file_access"
      - condition: "pfx_export"

  response:
    notify_user: true
    ask_user: false
    terminate_process: false
    record: true

  allowlisted_apps:
    - pattern: "chrome.exe"
      must_be_signed: true
      signers:
        - "google"
    - pattern: "msedge.exe"
      must_be_signed: true
      signers:
        - "microsoft"
    - pattern: "msedgewebview2.exe"
      must_be_signed: true
      signers:
        - "microsoft"
    - pattern: "firefox.exe"
      must_be_signed: true
      signers:
        - "mozilla"
    - pattern: "brave.exe"
      must_be_signed: true
      signers:
        - "brave software"

  tags:
    - credential-access
    - dpapi
    - certificate
    - info
  mitre_attack:
    - T1555
    - T1552.004
  false_positives:
    - "Browsers decrypting their own saved credentials (covered by allowlist)"
    - "Certificate management tools"
    - "Backup software exporting certificates"
