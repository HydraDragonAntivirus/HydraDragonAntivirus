- name: "HEUR:Win.Ransom.BehavesLike.FileEncryptor.gen"
  author: "Emirhan Ucan"
  date: "2026-02-08"
  status: test
  level: critical
  severity: 99
  description: |
    Detects ransomware-like encryption behavior across the full disk scope.
    Uses bulk file modifications, encryption-oriented APIs, and extension-change activity
    without restricting detection to user-profile folders only.
  debug: true

  named_conditions:
    mass_disk_writes:
      file_operations: ["write", "create", "setinfo", "rename"]
      min_matches: 8

    suspicious_encryption_apis:
      apis:
        - "CryptEncrypt"
        - "BCryptEncrypt"
        - "NCryptEncrypt"
        - "RtlEncrypt*"
      api_threshold: 1

    ransomware_extension_activity:
      file_operations: ["write", "rename", "create", "delete"]
      detect_extension_changes: true
      detect_known_to_unknown_extension_change: true
      min_matches: 1

  detection_logic:
    and:
      - condition: "ransomware_extension_activity"
      - any_of:
          - "mass_disk_writes"
          - "suspicious_encryption_apis"

  response:
    terminate_process: true
    quarantine: true
    auto_revert: true
    record: true

  allowlisted_apps:
    - pattern: "7z.exe"
      must_be_signed: true
      signers:
        - "igor pavlov"
    - pattern: "winrar.exe"
      must_be_signed: true
      signers:
        - "rarlab"
    - pattern: "robocopy.exe"
      must_be_signed: true
      signers:
        - "microsoft"
    - pattern: "onedrive.exe"
      must_be_signed: true
      signers:
        - "microsoft"

  tags:
    - "ransomware"
    - "file-encryption"
    - "bulk-modification"
    - "poc-detection"

  false_positives:
    - "Bulk backup/archiver jobs with custom extensions"
    - "Mass file migration tools"
