name: Publish MBRFilter

on:
  push:
    branches: ["**"]
    paths:
      - 'MBRFilter/**'
      - '.github/workflows/publish-mbrfilter.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-stage:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
      - name: Setup WDK
        shell: pwsh
        run: |
          $wdkSetupPath = "$Env:TEMP\wdksetup.exe"
          (New-Object Net.WebClient).DownloadFile('https://go.microsoft.com/fwlink/?linkid=2335869', $wdkSetupPath)
          Start-Process -FilePath $wdkSetupPath -ArgumentList "/quiet" -NoNewWindow -Wait
      - name: Build
        run: msbuild "MBRFilter/MBRFilter Driver.sln" /p:Configuration=Release /p:Platform=x64
      
      - name: Stage
        shell: pwsh
        run: |
          $dist = "hydradragon/MBRFilter"
          New-Item -ItemType Directory -Force -Path $dist
          Copy-Item "MBRFilter/x64/Win8Release/*.sys" "$dist/" -Force
          Copy-Item "MBRFilter/x64/Win8Release/*.inf" "$dist/" -Force
          Copy-Item "MBRFilter/x64/Win8Release/*.cat" "$dist/" -Force
          
      - name: Check for publishable changes
        id: check_changes
        uses: ./.github/actions/check-publishable-changes
        with:
          paths: |
            hydradragon/MBRFilter
      - name: Create PR
        if: steps.check_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(mbrfilter): update binaries"
          title: "Update MBRFilter Binaries"
          add-paths: |
            ${{ steps.check_changes.outputs.publishable_files }}
          branch: "auto-update-mbrfilter"
          base: ${{ github.ref_name }}
          delete-branch: true
