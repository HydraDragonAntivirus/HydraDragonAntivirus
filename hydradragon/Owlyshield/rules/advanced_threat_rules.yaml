- rule_id: HD-EVASION-MOCKINGJAY-RWX
  name: '[EVASION] Mockingjay RWX Hijacking'
  description: 'Detects the Mockingjay technique where an attacker exploits existing RWX sections in trusted DLLs to avoid memory allocation telemetry.'
  enabled: true
  severity: 95
  level: critical
  tags:
    - mockingjay
    - evasion
    - injection
  mitre_attack:
    - T1055
  stages:
    - name: RWX Section Access
      conditions:
        - type: Api
          functions:
            - NtWriteVirtualMemory
            - NtProtectVirtualMemory
          arguments:
            - name: protection
              value: '0x40'
    - name: Target Trusted Module
      conditions:
        - type: Process
          op: contains
          pattern: '(?i)(ntdll|kernel32|kernelbase|user32|gdi32)\.dll'
  response:
    ask_user: true
    terminate_process: false
    suspend_while_ask: true
    notify_user: true
    record: true

- rule_id: HD-EVASION-HERPADERPING-SEQ
  name: '[EVASION] Process Herpaderping Sequence'
  description: 'Detects Process Herpaderping by monitoring the sequence of mapping a file, modifying it, and then creating a thread.'
  enabled: true
  severity: 100
  level: critical
  tags:
    - herpaderping
    - evasion
  mitre_attack:
    - T1364
  stages:
    - name: Initial Image Mapping
      conditions:
        - type: Api
          functions:
            - NtCreateSection
          arguments:
            - name: AllocationAttributes
              value: '0x1000000'
    - name: Post-Mapping Modification
      conditions:
        - type: File
          op: write
          path_pattern: '.*'
    - name: Thread Execution from Mismatched Image
      conditions:
        - type: Api
          functions:
            - NtCreateThreadEx
  response:
    ask_user: true
    terminate_process: false
    suspend_while_ask: true
    notify_user: true
    record: true

- rule_id: HD-THREAT-RANSOMWARE-HEADER-ENC
  name: '[THREAT] Ransomware Canary - Rapid Header Encryption'
  description: 'Detects rapid-fire write operations to the first 4KB of multiple files, a common pattern for header-only encryption.'
  enabled: true
  severity: 90
  level: critical
  tags:
    - ransomware
    - encryption
  mitre_attack:
    - T1486
  stages:
    - name: Ransomware Behavior Chain
      conditions:
        - type: MultiCondition
          op: and
          conditions:
            - type: ByteThreshold
              direction: write
              comparison: gte
              threshold: 4096
            - type: EntropyThreshold
              metric: file_write
              comparison: gte
              threshold: 7.5
            - type: MultiCondition
              op: or
              conditions:
                - type: File
                  op: create
                  path_pattern: '(?i).*(README|DECRYPT|HELP_RESTORE).*'
                - type: Process
                  op: contains
                  pattern: '(?i)(vssadmin|wmic|wbadmin|bcdedit)\.exe'
  response:
    ask_user: true
    terminate_process: false
    suspend_while_ask: true
    notify_user: true
    record: true

- rule_id: HD-EVASION-GHOST-DIRECT-SYSCALL
  name: '[EVASION] Ghost Hunting - Direct Syscall via JMP/CALL'
  description: 'Detects direct syscalls made via JMP or CALL gadgets outside of ntdll, specifically targeting stealthy shellcode.'
  enabled: true
  severity: 100
  level: critical
  tags:
    - ghost-hunting
    - syscall
    - evasion
  mitre_attack:
    - T1055
  stages:
    - name: SanctumGhost Telemetry
      conditions:
        - type: MultiCondition
          op: and
          conditions:
            - type: SanctumGhost
              functions:
                - NtAllocateVirtualMemory
                - NtProtectVirtualMemory
                - NtWriteVirtualMemory
              caller_address_patterns:
                - 'unknown'
              min_matches: 5
            - type: MultiCondition
              op: and
              conditions:
                - type: ProcessTree
                  parent_patterns: ['(?i)(cmd|powershell|wscript|explorer|temp.*)\.exe']
                - type: Process
                  op: not_contains
                  pattern: '(?i)(chrome|msedge|brave|firefox|devenv|code|discord|steam)\.exe'
  response:
    ask_user: true
    terminate_process: false
    suspend_while_ask: true
    notify_user: true
    record: true
  allowlisted_apps:
    - pattern: '(?i)svchost\.exe'
      signers:
        - 'Microsoft*'
      must_be_signed: true

- rule_id: HD-STEALTH-ETW-NTTRACECONTROL-BLIND
  name: '[STEALTH] ETW Blinding via NtTraceControl'
  description: 'Detects attempts to disable Event Tracing for Windows (ETW) sessions, a common technique to blind EDR/AV solutions.'
  enabled: true
  severity: 85
  level: high
  tags:
    - blinding
    - etw
    - evasion
  mitre_attack:
    - T1562.006
  stages:
    - name: Stop Security ETW Session
      conditions:
        - type: MultiCondition
          op: and
          conditions:
            - type: Api
              functions:
                - NtTraceControl
              arguments:
                - name: ControlCode
                  value: '1'
            - type: CommandLineMatch
              patterns:
                - pattern: '(?i)(EventLog-Security|Microsoft-Windows-Threat-Intelligence|EtwRTMS-Antimalware-Service)'
  response:
    notify_user: true
    record: true
    ask_user: true

- rule_id: HD-INJECTION-REMOTE-THREAD-SYSPROC
