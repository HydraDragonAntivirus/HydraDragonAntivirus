# Generic Stealer.Win32.Generic: steps the malware class has to take, no family strings.
# Helpers are private; the verdict rule is the last one(s). Tested on the benign corpus with hydradragonsig/tools/corpus_eval.py.
rules:
- id: VK-STL-BROWSER
  title: 'Helper: credential / cookie stores of several browsers'
  severity: info
  private: true
  logic: all
  conditions:
  - type: string_set
    min: 2
    nocase: true
    ascii: true
    wide: true
    decoded: true
    values:
    - Login Data
    - Web Data
    - Network\Cookies
    - logins.json
    - key4.db
    - key3.db
    - cookies.sqlite
    - signons.sqlite
    - formhistory.sqlite
    - Login Data For Account
  - type: string_set
    min: 2
    nocase: true
    ascii: true
    wide: true
    decoded: true
    values:
    - Google\Chrome
    - Microsoft\Edge
    - BraveSoftware\Brave-Browser
    - Opera Software\Opera
    - Yandex\YandexBrowser
    - Mozilla\Firefox
    - Vivaldi\User Data
    - Chromium\User Data
    - Epic Privacy Browser
    - CentBrowser
    - Comodo\Dragon
    - Torch\User Data
    - Kometa\User Data
    - Orbitum\User Data
    - Amigo\User Data
    - 7Star\7Star
    - Sputnik\Sputnik
    - uCozMedia\Uran
    - Waterfox
    - CocCoc\Browser
    - Iridium\User Data
  family: Stealer.Win32.Generic
  tags:
  - analyst
  - helper
