[package]
name = "hydradragonstatic"
version = "0.1.6"
edition = "2021"
rust-version = "1.88"
description = "HydraDragonStatic deterministic static scanner with external Yamdle/YAML rules"
license = "MIT OR Apache-2.0"
authors = ["HydraDragon"]

[[bin]]
name = "hydradragonstatic"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
colored = "3.1.1"
digest = "0.11.2"
env_logger = "0.11.10"
goblin = "0.10.5"
hex = "0.4.3"
indicatif = "0.18.4"
log = "0.4.29"
md-5 = "0.11.0"
once_cell = "1.21.4"
rayon = "1.12.0"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
yaml_serde = "0.10.4"
sha2 = "0.11.0"
thiserror = "2.0.18"
walkdir = "2.5.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
