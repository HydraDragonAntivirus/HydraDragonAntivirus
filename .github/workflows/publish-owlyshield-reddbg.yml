name: Publish Owlyshield RedDbg

on:
  push:
    branches: ["**"]
    paths:
      - "Owlyshield/RedDbg/**"
      - ".github/workflows/publish-owlyshield-reddbg.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  WDK_URL: https://go.microsoft.com/fwlink/?linkid=2335869

jobs:
  publish:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true

      - uses: actions/checkout@v6

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup WDK
        shell: pwsh
        run: |
          $wdkSetupPath = "$Env:TEMP\wdksetup.exe"
          (New-Object Net.WebClient).DownloadFile("${{ env.WDK_URL }}", $wdkSetupPath)
          Start-Process -FilePath $wdkSetupPath -ArgumentList "/quiet" -NoNewWindow -Wait

      - name: Build RedDbg
        run: msbuild Owlyshield/RedDbg/RedDbg/RedDbg.sln /p:Configuration=Release /p:Platform=x64

      - name: Stage RedDbg Files
        shell: pwsh
        run: |
          $source = "Owlyshield/RedDbg/RedDbg/x64/ReleaseX64Kernel/RedDbgDrv"
          $destination = "hydradragon/Owlyshield/RedDbg"
          
          if (Test-Path $source) {
            New-Item -ItemType Directory -Force -Path $destination | Out-Null
            Copy-Item -Path "$source/*" -Destination "$destination/" -Recurse -Force
          }

      - name: Check for publishable changes
        id: check_changes
        uses: ./.github/actions/check-publishable-changes
        with:
          paths: |
            hydradragon/Owlyshield/RedDbg
      - name: Create PR
        if: steps.check_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(owlyshield): update reddbg binaries"
          title: "Update Owlyshield RedDbg binaries"
          body: "Automated RedDbg driver build output update."
          add-paths: |
            ${{ steps.check_changes.outputs.publishable_files }}
          branch: "auto-update-owlyshield-reddbg"
          base: ${{ github.ref_name }}
          delete-branch: true
          labels: binaries, automated-pr, owlyshield
