# TEST #31: Hijacking:StartupPrograms — Block suspicious startup registry modification
- name: "HEUR:Win.Hijacking.StartupProgramsModification.gen"
  author: "HydraDragon"
  date: "2026-03-26"
  status: production
  level: high
  severity: 90
  description: |
    Detects modification of Windows startup registry locations to point to
    unsigned or non-Microsoft executables. Common startup hijacking points:
    - Run/RunOnce (HKCU, HKLM)
    - Startup folders
    - Image File Execution Options
    COMODO Test #31: Hijacking:StartupPrograms
    Blocks suspicious startup program registration.
  debug: false

  named_conditions:
    startup_registry_modification:
      orderless: true
      registry_keys:
        - "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run"
        - "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\RunOnce"
        - "HKLM\\Software\\Microsoft\\Windows\\CurrentVersion\\Run"
        - "HKLM\\Software\\Microsoft\\Windows\\CurrentVersion\\RunOnce"
        - "HKLM\\Software\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Run"
        - "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\RunServices"
      registry_operations: ["set", "create"]
      min_matches: 1

    startup_path_suspicious:
      orderless: true
      registry_values_contain:
        - "AppData"
        - "Temp"
        - "ProgramData"
        - "Public"
      min_matches: 1

    executable_unsigned:
      orderless: true
      registry_values_signatures: "unsigned"
      min_matches: 1

  detection_logic:
    and:
      - condition: "startup_registry_modification"
      - or:
          - condition: "startup_path_suspicious"
          - condition: "executable_unsigned"

  response:
    notify_user: true
    ask_user: true
    terminate_process: true
    record: true
    auto_revert: true

  tags: ["hijacking", "startup", "persistence"]
  mitre_attack: ["T1547.001", "T1547.008"]

