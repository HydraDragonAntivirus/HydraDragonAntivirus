    - pattern: "C:/Windows/System32/msiexec.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "C:/Windows/System32/svchost.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "C:/Windows/System32/services.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "%SystemRoot%/servicing/TrustedInstaller.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "%SystemRoot%/WinSxS/*/TiWorker.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "%SystemRoot%/UUS/*/MoUsoCoreWorker.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "%SystemRoot%/WinSxS/*/MoUsoCoreWorker.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "%SystemRoot%/System32/poqexec.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "%SystemRoot%/System32/wusa.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "%SystemRoot%/System32/Dism/DismHost.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]

  named_conditions:
    service_dll_modification:
      orderless: true
      registry_keys:
        - HKLM\SYSTEM\CurrentControlSet\Services
        - HKLM\SYSTEM\ControlSet001\Services
        - HKLM\SYSTEM\ControlSet002\Services
        - \REGISTRY\MACHINE\SYSTEM\CurrentControlSet\Services
        - \REGISTRY\MACHINE\SYSTEM\ControlSet001\Services
        - \REGISTRY\MACHINE\SYSTEM\ControlSet002\Services
      registry_values:
        - ServiceDll
        - ImagePath
        - ImagePathValue
        - ServiceDllUnloadOnStop
        - FailureCommand
        - DllName
      registry_operations:
