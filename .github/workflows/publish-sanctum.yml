name: Publish Sanctum

on:
  push:
    branches: ["**"]
    paths:
      - 'Sanctum/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  # Detect which Sanctum components changed
  detect-changes:
    runs-on: windows-2022
    outputs:
      driver: ${{ steps.filter.outputs.driver }}
      um_engine: ${{ steps.filter.outputs.um_engine }}
      sanctum_ppl_runner: ${{ steps.filter.outputs.sanctum_ppl_runner }}
      elam_installer: ${{ steps.filter.outputs.elam_installer }}
      injected_dll: ${{ steps.filter.outputs.injected_dll }}
      malware: ${{ steps.filter.outputs.malware }}
      server: ${{ steps.filter.outputs.server }}
      gui: ${{ steps.filter.outputs.gui }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            driver:
              - 'Sanctum/driver/**'
            um_engine:
              - 'Sanctum/um_engine/**'
              - 'Sanctum/shared_std/**'
              - 'Sanctum/shared_no_std/**'
            sanctum_ppl_runner:
              - 'Sanctum/sanctum_ppl_runner/**'
              - 'Sanctum/shared_std/**'
              - 'Sanctum/shared_no_std/**'
            elam_installer:
              - 'Sanctum/elam_installer/**'
              - 'Sanctum/shared_std/**'
            injected_dll:
              - 'Sanctum/injected_dll/**'
              - 'Sanctum/shared_no_std/**'
            malware:
              - 'Sanctum/malware/**'
            server:
              - 'Sanctum/server/**'
            gui:
              - 'Sanctum/gui/**'
            shared:
              - 'Sanctum/shared_std/**'
              - 'Sanctum/shared_no_std/**'

  # Build Driver (only if changed)
  build-driver:
    needs: detect-changes
    if: needs.detect-changes.outputs.driver == 'true'
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
      - name: Install Cargo Make
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-make
      - name: Setup WDK
        shell: pwsh
        run: |
          $wdkSetupPath = "$Env:TEMP\wdksetup.exe"
          (New-Object Net.WebClient).DownloadFile('https://go.microsoft.com/fwlink/?linkid=2335869', $wdkSetupPath)
          Start-Process -FilePath $wdkSetupPath -ArgumentList "/quiet" -NoNewWindow -Wait
      - name: Build and Sign Driver (with hash auto-update)
        working-directory: Sanctum/driver
        shell: pwsh
        run: |
          # Step 1: Generate ELAM certificate
          Write-Host "=== Step 1: Generating ELAM certificate ==="
          .\cert.ps1
          
          # Step 2: Initial build
          Write-Host "`n=== Step 2: Initial driver build ==="
          cargo make release
          
          # Step 3: Sign the driver
          Write-Host "`n=== Step 3: Signing driver ==="
          .\sign.bat release
          
          # Step 4: Extract the To-Be-Signed Hash
          Write-Host "`n=== Step 4: Extracting To-Be-Signed Hash ==="
          $certOutput = certmgr.exe -v target\release\sanctum_package\sanctum.sys
          $hashLines = $certOutput | Select-String -Pattern "Content Hash \(To-Be-Signed Hash\)::" -Context 0,3
          
          if ($hashLines) {
              $hashText = $hashLines[0].Context.PostContext -join ""
              $hash = $hashText -replace '\s+', '' -replace '0x', ''
              Write-Host "Extracted hash: $hash"
              
              # Step 5: Update build.rs with the new hash
              Write-Host "`n=== Step 5: Updating build.rs with extracted hash ==="
              $buildRsPath = "build.rs"
              $buildRsContent = Get-Content $buildRsPath -Raw
              $buildRsContent = $buildRsContent -replace 'L"[0-9A-F]+\\0"', "L`"$hash\0`""
              Set-Content $buildRsPath $buildRsContent
              Write-Host "Updated build.rs with hash: $hash"
              
              # Step 6: Clean and rebuild with correct hash
              Write-Host "`n=== Step 6: Rebuilding with correct hash ==="
              cargo clean
              cargo make release
              
              # Step 7: Sign again
              Write-Host "`n=== Step 7: Final signing ==="
              .\sign.bat release
              
              Write-Host "`n=== SUCCESS: Driver built and signed with matching hash ==="
          } else {
              Write-Host "ERROR: Could not extract hash from certificate"
              exit 1
          }
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: sanctum-driver
          path: Sanctum/driver/target/release/sanctum_package/*.sys

  # Build um_engine (only if changed)
  build-um-engine:
    needs: detect-changes
    if: needs.detect-changes.outputs.um_engine == 'true' || needs.detect-changes.outputs.shared == 'true'
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
      - name: Build um_engine
        working-directory: Sanctum
        run: cargo build --release -p um_engine
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: sanctum-um-engine
          path: Sanctum/target/release/um_engine.exe

  # Build sanctum_ppl_runner (only if changed)
  build-ppl-runner:
    needs: detect-changes
    if: needs.detect-changes.outputs.sanctum_ppl_runner == 'true' || needs.detect-changes.outputs.shared == 'true'
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
      - name: Setup Windows SDK (for signtool)
        shell: pwsh
        run: |
          $sdkSetupPath = "$Env:TEMP\sdksetup.exe"
          Write-Host "Downloading Windows SDK..."
          (New-Object Net.WebClient).DownloadFile('https://go.microsoft.com/fwlink/?linkid=2272610', $sdkSetupPath)
          Write-Host "Installing Windows SDK..."
          Start-Process -FilePath $sdkSetupPath -ArgumentList "/quiet", "/norestart", "/features", "OptionId.SigningTools" -NoNewWindow -Wait
          Write-Host "Windows SDK installed successfully"
      - name: Build and Sign sanctum_ppl_runner
        working-directory: Sanctum
        run: |
          cargo build --release -p sanctum_ppl_runner
          .\sign_ppl_runner.bat
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: sanctum-ppl-runner
          path: Sanctum/target/release/sanctum_ppl_runner.exe

  # Build elam_installer (only if changed)
  build-elam-installer:
    needs: detect-changes
    if: needs.detect-changes.outputs.elam_installer == 'true' || needs.detect-changes.outputs.shared == 'true'
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
      - name: Build elam_installer
        working-directory: Sanctum
        run: cargo build --release -p elam_installer
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: sanctum-elam-installer
          path: Sanctum/target/release/elam_installer.exe

  # Build injected_dll (only if changed)
  build-injected-dll:
    needs: detect-changes
    if: needs.detect-changes.outputs.injected_dll == 'true' || needs.detect-changes.outputs.shared == 'true'
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
      - name: Build injected_dll
        working-directory: Sanctum
        run: cargo build --release -p injected_dll
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: sanctum-injected-dll
          path: Sanctum/target/release/sanctum.dll

  # Build malware test (only if changed)
  build-malware:
    needs: detect-changes
    if: needs.detect-changes.outputs.malware == 'true'
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
      - name: Build malware
        working-directory: Sanctum
        run: cargo build --release -p malware
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: sanctum-malware
          path: Sanctum/target/release/malware.exe

  # Build server (only if changed)
  build-server:
    needs: detect-changes
    if: needs.detect-changes.outputs.server == 'true'
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
      - name: Build server
        working-directory: Sanctum
        run: cargo build --release -p server
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: sanctum-server
          path: Sanctum/target/release/server.exe

  # Stage and create PR (only with changed components)
  stage-and-pr:
    needs:
      - detect-changes
      - build-driver
      - build-um-engine
      - build-ppl-runner
      - build-elam-installer
      - build-injected-dll
      - build-malware
      - build-server
    if: always()
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
        continue-on-error: true
      
      - name: Stage (Conditional)
        shell: pwsh
        run: |
          $dist = "hydradragon/Sanctum"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $componentsBuilt = @()
          
          # Driver
          if (Test-Path "artifacts/sanctum-driver") {
            Write-Host "✓ Processing Sanctum Driver"
            Get-ChildItem "artifacts/sanctum-driver/" -Filter "sanctum.sys" -Recurse |
              Select-Object -First 1 |
              Copy-Item -Destination "$dist/" -Force
            $componentsBuilt += "Sanctum Driver (sanctum.sys)"
          } else {
            Write-Host "⊘ Skipping Driver (not built)"
          }
          
          # um_engine
          if (Test-Path "artifacts/sanctum-um-engine") {
            Write-Host "✓ Processing um_engine"
            Get-ChildItem "artifacts/sanctum-um-engine/" -Filter "um_engine.exe" -Recurse |
              Select-Object -First 1 |
              Copy-Item -Destination "$dist/" -Force
            $componentsBuilt += "um_engine.exe"
          } else {
            Write-Host "⊘ Skipping um_engine (not built)"
          }
          
          # sanctum_ppl_runner
          if (Test-Path "artifacts/sanctum-ppl-runner") {
            Write-Host "✓ Processing sanctum_ppl_runner"
            Get-ChildItem "artifacts/sanctum-ppl-runner/" -Filter "sanctum_ppl_runner.exe" -Recurse |
              Select-Object -First 1 |
              Copy-Item -Destination "$dist/" -Force
            $componentsBuilt += "sanctum_ppl_runner.exe"
          } else {
            Write-Host "⊘ Skipping sanctum_ppl_runner (not built)"
          }
          
          # elam_installer
          if (Test-Path "artifacts/sanctum-elam-installer") {
            Write-Host "✓ Processing elam_installer"
            Get-ChildItem "artifacts/sanctum-elam-installer/" -Filter "elam_installer.exe" -Recurse |
              Select-Object -First 1 |
              Copy-Item -Destination "$dist/" -Force
            $componentsBuilt += "elam_installer.exe"
          } else {
            Write-Host "⊘ Skipping elam_installer (not built)"
          }
          
          # injected_dll
          if (Test-Path "artifacts/sanctum-injected-dll") {
            Write-Host "✓ Processing injected_dll"
            Get-ChildItem "artifacts/sanctum-injected-dll/" -Filter "sanctum.dll" -Recurse |
              Select-Object -First 1 |
              Copy-Item -Destination "$dist/" -Force
            $componentsBuilt += "sanctum.dll"
          } else {
            Write-Host "⊘ Skipping injected_dll (not built)"
          }
          
          # malware (test binary)
          if (Test-Path "artifacts/sanctum-malware") {
            Write-Host "✓ Processing malware test binary"
            Get-ChildItem "artifacts/sanctum-malware/" -Filter "malware.exe" -Recurse |
              Select-Object -First 1 |
              Copy-Item -Destination "$dist/" -Force
            $componentsBuilt += "malware.exe (test)"
          } else {
            Write-Host "⊘ Skipping malware test (not built)"
          }
          
          # server
          if (Test-Path "artifacts/sanctum-server") {
            Write-Host "✓ Processing server"
            Get-ChildItem "artifacts/sanctum-server/" -Filter "server.exe" -Recurse |
              Select-Object -First 1 |
              Copy-Item -Destination "$dist/" -Force
            $componentsBuilt += "server.exe"
          } else {
            Write-Host "⊘ Skipping server (not built)"
          }
          
          Write-Host "`n=== Components Built: $($componentsBuilt.Count) ==="
          $componentsBuilt | ForEach-Object { Write-Host "  - $_" }
      
      - name: Check for Changes
        id: check_changes
        shell: pwsh
        run: |
          git add -A
          $status = git status --porcelain
          if ($null -eq $status -or $status -eq "") {
            echo "changed=false" >> $env:GITHUB_OUTPUT
          } else {
            echo "changed=true" >> $env:GITHUB_OUTPUT
          }
      
      - name: Create PR
        if: steps.check_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(sanctum): update binaries (selective build)"
          title: "🚀 Update Sanctum Binaries"
          body: |
            Automated selective build for Sanctum components.
            
            **Components Updated:**
            - Driver: ${{ needs.detect-changes.outputs.driver }}
            - um_engine: ${{ needs.detect-changes.outputs.um_engine }}
            - sanctum_ppl_runner: ${{ needs.detect-changes.outputs.sanctum_ppl_runner }}
            - elam_installer: ${{ needs.detect-changes.outputs.elam_installer }}
            - injected_dll: ${{ needs.detect-changes.outputs.injected_dll }}
            - malware: ${{ needs.detect-changes.outputs.malware }}
            - server: ${{ needs.detect-changes.outputs.server }}
            
            Only changed components were rebuilt.
          branch: "auto-update-sanctum"
          base: ${{ github.ref_name }}
          delete-branch: true
          labels: binaries, automated-pr, selective-build
