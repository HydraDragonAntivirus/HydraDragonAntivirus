- name: "Process Hollowing"
  should_trust_comodo_cloud: false
  description: "Detects a classic process hollowing chain: suspended process creation, remote image unmap or memory replacement, thread context manipulation, and thread resumption. Requires a genuinely remote (cross-process) primitive — kernel IRP telemetry (section create/map, APC queue) or an unmap/context-takeover API — so normal self-process loader and thread-pool activity is not flagged."
  author: "Emirhan Ucan"
  status: experimental
  level: critical
  severity: 99
  tags:
    - process-hollowing
    - code-injection
    - defense-evasion
    - process-injection
  mitre_attack:
    - "T1055"
    - "T1055.012"
  references:
    - "MITRE ATT&CK T1055.012 - Process Hollowing"
  false_positives:
    - "Some debuggers, packers, EDRs, sandbox agents, and software updaters can manipulate remote process memory."
    - "Debuggers and security tooling that unmap a target image, create/map a section into another process, or set a remote thread context are still flagged — allowlist by exact path if trusted."
    - "Review trusted development or security tools before enforcing automatic removal."

  detection_logic:
    and:
      - condition: hollowing_bootstrap
      - condition: remote_memory_replacement
      - condition: thread_takeover_and_resume
      - at_least: 1
        conditions:
          - kernel_hollowing_telemetry
          - image_unmap
          - context_takeover

  named_conditions:
    hollowing_bootstrap:
      apis:
        - "CreateProcessA"
        - "CreateProcessW"
        - "CreateProcessAsUserA"
        - "CreateProcessAsUserW"
        - "CreateProcessWithLogonW"
        - "CreateProcessWithTokenW"
        - "CreateProcessInternalW"
        - "NtCreateUserProcess"
        - "ZwCreateUserProcess"
      api_threshold: 1
      min_matches: 1

    remote_memory_replacement:
      apis:
        - "NtUnmapViewOfSection"
        - "ZwUnmapViewOfSection"
        - "VirtualAllocEx"
        - "NtAllocateVirtualMemory"
        - "ZwAllocateVirtualMemory"
        - "WriteProcessMemory"
        - "NtWriteVirtualMemory"
        - "ZwWriteVirtualMemory"
      api_threshold: 2
      min_matches: 1

    thread_takeover_and_resume:
      apis:
        - "GetThreadContext"
        - "Wow64GetThreadContext"
        - "SetThreadContext"
        - "Wow64SetThreadContext"
        - "NtSetContextThread"
        - "ZwSetContextThread"
        - "ResumeThread"
        - "NtResumeThread"
        - "ZwResumeThread"
      api_threshold: 2
      min_matches: 1

    # Cross-process kernel IRP telemetry. These raw sub-types (17/18/19 =
    # IRP_KERNEL_QUEUE_APC / IRP_KERNEL_CREATE_SECTION / IRP_KERNEL_MAP_SECTION)
    # are emitted only for remote, kernel-observed operations, so self-process
    # loader/thread-pool noise can never satisfy this condition.
    kernel_hollowing_telemetry:
      irp_operations:
        - "kernel_queue_apc"
        - "kernel_create_section"
        - "kernel_map_section"
      min_matches: 1

    # Classic delete-and-replace hollowing unmaps the victim's original image.
    image_unmap:
      apis:
        - "NtUnmapViewOfSection"
        - "ZwUnmapViewOfSection"
      api_threshold: 1
      min_matches: 1

    # Thread-context hijack: redirect the victim thread to attacker code.
    context_takeover:
      apis:
        - "SetThreadContext"
        - "Wow64SetThreadContext"
        - "NtSetContextThread"
        - "ZwSetContextThread"
      api_threshold: 1
      min_matches: 1

  response:
    ask_user: true
    deny_while_ask: true
    terminate_process: true
    quarantine: true
    notify_user: true
    record: true
