name: dotnet-hydradragonservice-ci

on:
  push:
    branches: ["**"]
    paths:
      - 'HydraDragonService/**'
      - '.github/workflows/dotnet-service.yml'
  pull_request:
    branches: ["**"]
    paths:
      - 'HydraDragonService/**'
      - '.github/workflows/dotnet-service.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
    - name: Enable long paths
      run: git config --global core.longpaths true

    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore HydraDragonService/HydraDragonService.sln

    - name: Publish Service
      run: dotnet publish HydraDragonService/HydraDragonService/HydraDragonService.csproj -c Release -r win-x64 --self-contained false

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: service-release
        path: HydraDragonService/HydraDragonService/bin/Release/net8.0-windows/publish/
