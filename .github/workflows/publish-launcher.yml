name: Publish Launcher

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'HydraDragonLauncher/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'HydraDragonLauncher/**'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        targets: x86_64-pc-windows-msvc
    
    - name: Build Release
      working-directory: HydraDragonLauncher
      run: cargo build --release --verbose
    
    - name: Run tests
      working-directory: HydraDragonLauncher
      run: cargo test --release --verbose
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: hydradragonlauncher-windows-x64
        path: HydraDragonLauncher/target/release/hydradragonlauncher.exe
        retention-days: 30
    
    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: HydraDragonLauncher/target/release/hydradragonlauncher.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
