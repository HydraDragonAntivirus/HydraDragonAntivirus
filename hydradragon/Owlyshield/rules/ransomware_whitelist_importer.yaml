- name: "HEUR:Win.Ransom.BehavesLike.FileEncryptor.gen"
  author: "Emirhan Ucan"
  date: "2026-02-09"
  status: test
  level: critical
  severity: 99
  description: |
    Detects ransomware-like encryption behavior across the full disk scope.
    Uses bulk file modifications, encryption-oriented APIs, and extension-change activity
    without restricting detection to user-profile folders only.
    Correlation policy:
    - same-file prerequisites are declared per condition in YAML
    - rename branch requires read+write on the same file
    - delete branch requires read on the same file
  debug: true

  named_conditions:
    ransomware_read_activity:
      file_operations: ["read"]
      min_matches: 1

    mass_disk_writes:
      file_operations: ["write", "create", "setinfo", "rename"]
      min_matches: 8

    suspicious_encryption_apis:
      # Threshold is intentionally 2, not 1.
      # A single crypto API call is normal for browsers (TLS), .NET runtimes,
      # DPAPI, and system services.  Ransomware must assemble a full encryption
      # pipeline (acquire/open + key-setup + encrypt/export), so it always
      # produces at least 2 distinct API types from this list.
      apis:
        # WinCrypt (CryptoAPI) — context + key setup
        - "advapi32!CryptAcquireContextA"
        - "advapi32!CryptAcquireContextW"
        - "advapi32!CryptGenKey"
        - "advapi32!CryptDeriveKey"
        - "advapi32!CryptImportKey"
        - "advapi32!CryptExportKey"
        - "advapi32!CryptSetKeyParam"
        - "advapi32!CryptGetKeyParam"
        # WinCrypt (CryptoAPI) — hashing (used for password-based key derivation)
        - "advapi32!CryptCreateHash"
        - "advapi32!CryptHashData"
        - "advapi32!CryptGetHashParam"
        # WinCrypt (CryptoAPI) — encryption
        - "advapi32!CryptEncrypt"
        # BCrypt / CNG — algorithm provider + key setup
        - "bcrypt!BCryptOpenAlgorithmProvider"
        - "bcrypt!BCryptCloseAlgorithmProvider"
        - "bcrypt!BCryptGenerateSymmetricKey"
        - "bcrypt!BCryptGenerateKeyPair"
        - "bcrypt!BCryptFinalizeKeyPair"
        - "bcrypt!BCryptImportKey"
        - "bcrypt!BCryptImportKeyPair"
        - "bcrypt!BCryptExportKey"
        - "bcrypt!BCryptSetProperty"
        # BCrypt / CNG — encryption + key agreement
        - "bcrypt!BCryptEncrypt"
        - "bcrypt!BCryptSecretAgreement"
        - "bcrypt!BCryptDeriveKey"
        # NCrypt / CNG key storage — key setup, export, encryption
        - "ncrypt!NCryptCreatePersistedKey"
        - "ncrypt!NCryptFinalizeKey"
        - "ncrypt!NCryptImportKey"
        - "ncrypt!NCryptExportKey"
        - "ncrypt!NCryptEncrypt"
        - "ncrypt!NCryptSignHash"
        - "ncrypt!NCryptSecretAgreement"
        - "ncrypt!NCryptDeriveKey"
        # Random number generation (key/IV material)
        - "advapi32!SystemFunction036"
        # In-memory key protection (ransomware hides DEK/KEK in process memory)
        - "ntdll!RtlEncryptMemory"
      api_threshold: 2

    ransomware_write_activity:
      file_operations: ["write"]
      min_matches: 1

    ransomware_rename_activity:
      file_operations: ["rename"]
      require_same_file_read: true
      require_same_file_write: true
      detect_extension_changes: true
      detect_known_to_unknown_extension_change: true
      min_matches: 1

    ransomware_create_activity:
      # Evaluated with read and delete branch.
      # Requires the created file to have an unknown (non-whitelisted) extension so
      # that ordinary file creation (e.g. temp files, documents) does not satisfy
      # this condition — only the encrypted output file (.winball, .encrypted, etc.)
      file_operations: ["create"]
      detect_non_whitelisted_extensions: true
      min_matches: 1

    ransomware_delete_activity:
      file_operations: ["delete"]
      require_same_file_read: true
      min_matches: 1

  detection_logic:
    or:
      # Branches A / B / C — file-operation evidence AND encryption APIs (both required).
      - and:
          - or:
              # Branch A: read + write + rename with extension change (same-file prerequisites).
              - and:
                  - condition: "ransomware_read_activity"
                  - condition: "ransomware_write_activity"
                  - condition: "ransomware_rename_activity"
              # Branch B: read + create + delete (shadow-copy / replace style).
              - and:
                  - condition: "ransomware_read_activity"
                  - condition: "ransomware_create_activity"
                  - condition: "ransomware_delete_activity"
              # Branch C: mass disk writes (bulk file modification).
              - condition: "mass_disk_writes"
          # Encryption APIs required for A / B / C.
          - condition: "suspicious_encryption_apis"
      # Branch D: 3+ distinct crypto API types alone (no file-op evidence needed).
      # Same condition as above, standalone — catches MapViewOfFile-based ransomware
      # where no IRP_MJ_READ / IRP_MJ_WRITE reaches the minifilter.
      - condition: "suspicious_encryption_apis"

  response:
    terminate_process: true
    quarantine: true
    auto_revert: true
    record: true

  allowlisted_apps:
    # Archivers / compression tools
    - pattern: "7z.exe"
      must_be_signed: true
      signers:
        - "igor pavlov"
    - pattern: "7zg.exe"
      must_be_signed: true
      signers:
        - "igor pavlov"
    - pattern: "winrar.exe"
      must_be_signed: true
      signers:
        - "rarlab"
    # Microsoft bulk-file tools
    - pattern: "robocopy.exe"
      must_be_signed: true
      signers:
        - "microsoft"
    - pattern: "onedrive.exe"
      must_be_signed: true
      signers:
        - "microsoft"
    - pattern: "msmpeng.exe"
      must_be_signed: true
      signers:
        - "microsoft"
    - pattern: "mssense.exe"
      must_be_signed: true
      signers:
        - "microsoft"
    - pattern: "searchindexer.exe"
      must_be_signed: true
      signers:
        - "microsoft"
    - pattern: "srtasks.exe"
      must_be_signed: true
      signers:
        - "microsoft"
    # Backup / imaging tools
    - pattern: "backup*.exe"
      must_be_signed: true
      signers:
        - "microsoft"
    - pattern: "wbengine.exe"
      must_be_signed: true
      signers:
        - "microsoft"

  tags:
    - "ransomware"
    - "file-encryption"
    - "bulk-modification"
    - "poc-detection"

  false_positives:
    - "Third-party backup suites (Acronis, Veeam, Macrium) — add signed binary to allowlisted_apps"
    - "Mass file migration / conversion tools writing many files rapidly"
    - "Encryption-at-rest agents that rename files after encrypting in-place"
