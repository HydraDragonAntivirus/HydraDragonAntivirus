name: HydraDragonLauncher CI Check

on:
  push:
    branches: ["**"]
    paths:
      - 'HydraDragonLauncher/**'
      - '!HydraDragonLauncher/README.md'
      - '.github/workflows/launcher-check.yml'
      - '.github/workflows/publish-binaries.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Set up MSVC Developer Command Prompt
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Update Launcher lockfile
        shell: pwsh
        run: |
          cargo generate-lockfile --manifest-path HydraDragonLauncher/Cargo.toml
          cargo update --manifest-path HydraDragonLauncher/Cargo.toml
          cargo update --manifest-path HydraDragonLauncher/ui/Cargo.toml

      - name: Build UI
        working-directory: HydraDragonLauncher/ui
        run: trunk build --release -d ../dist

      - name: Check formatting
        working-directory: HydraDragonLauncher
        run: cargo fmt --all -- --check

      - name: Run cargo check
        working-directory: HydraDragonLauncher
        run: cargo check --verbose

      - name: Run clippy
        working-directory: HydraDragonLauncher
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        working-directory: HydraDragonLauncher
        run: cargo build --verbose

      - name: Build Release
        working-directory: HydraDragonLauncher
        run: cargo build --release --verbose

      - name: Run tests
        working-directory: HydraDragonLauncher
        run: cargo test --verbose
