name: Rebuild Poetry Lock

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches:
      - "**"
    paths:
      - "pyproject.toml"

jobs:
  rebuild-lock:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install "poetry>=2.0.0"

      - name: Configure Poetry
        run: |
          poetry config virtualenvs.create false
          poetry --version

      - name: Rebuild lockfile
        run: poetry lock --regenerate

      - name: Validate lockfile
        run: poetry check --lock

      - name: Create pull request for lockfile changes
        if: github.ref_name != github.event.repository.default_branch
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "Rebuild poetry.lock (auto)"
          author: "github-actions <41898282+github-actions[bot]@users.noreply.github.com>"
          committer: "github-actions <41898282+github-actions[bot]@users.noreply.github.com>"
          branch: "${{ github.ref_name }}"
          base: "${{ github.event.repository.default_branch }}"
          delete-branch: false
          title: "Rebuild poetry.lock"
          body: |
            This PR regenerates `poetry.lock` automatically after changes to `pyproject.toml`
            or on the scheduled/manual workflow run.
          add-paths: |
            poetry.lock
