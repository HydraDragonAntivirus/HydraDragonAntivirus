# Combined rule file: the included files are loaded first, in this order,
# then the rules of this file.

- !include private_rules.yaml
- !include open_rules.yaml

rules:
  - id: COMBINED-001
    title: "Combined Rule Example"
    description: "PE that imports CreateRemoteThread and matched the open downloader rule"
    severity: high
    verdict: malware
    family: "Trojan.Win32.Combined.Example"
    logic: all
    conditions:
      - type: import_any
        names: ["!CreateRemoteThread"]
      - type: rule_match
        ids: [OPEN-001]
