name: Build Multron Server

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - 'OpenEDR/multron_server_rs/**'
      - 'OpenEDR/openedr_static/**'
      - 'OpenEDR/owlyshield_predict/hydradragonclamav/**'
      - 'OpenEDR/owlyshield_predict/hydradragonextractor/**'
      - 'hydradragonsig/**'
      - 'hydradragonunicorn/**'
      - 'hydradragondecompiler/**'
      - 'pefile-rs/**'
      - 'hayabusa/**'
      - '.github/workflows/multron-server.yml'
  pull_request:
    branches: ["**"]
    paths:
      - 'OpenEDR/multron_server_rs/**'
      - 'OpenEDR/openedr_static/**'
      - 'OpenEDR/owlyshield_predict/hydradragonclamav/**'
      - 'OpenEDR/owlyshield_predict/hydradragonextractor/**'
      - 'hydradragonsig/**'
      - 'hydradragonunicorn/**'
      - 'hydradragondecompiler/**'
      - 'pefile-rs/**'
      - 'hayabusa/**'
      - '.github/workflows/multron-server.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  pull-requests: write

jobs:
  build-windows:
    name: Build Windows x64 Binary
    runs-on: windows-latest
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "OpenEDR/multron_server_rs -> target"

      - name: Build multron_server (Release)
        working-directory: OpenEDR/multron_server_rs
        run: cargo build --release --verbose

      - name: Copy multron_server.exe to OpenMalwareScannerPortable
        shell: pwsh
        run: |
          Copy-Item OpenEDR/multron_server_rs/target/release/multron_server.exe -Destination OpenMalwareScannerPortable/multron_server.exe -Force

      - name: Upload OpenMalwareScannerPortable
        uses: actions/upload-artifact@v4
        with:
          name: OpenMalwareScannerPortable
          path: OpenMalwareScannerPortable
          if-no-files-found: error
          retention-days: 30

      - name: Create Pull Request with multron_server.exe
        if: github.event_name != 'pull_request' && !startsWith(github.ref_name, 'auto-update-')
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(multron): update multron_server.exe in OpenMalwareScannerPortable"
          title: "Update multron_server.exe in OpenMalwareScannerPortable"
          body: "Automated build of native Rust multron_server.exe placed into OpenMalwareScannerPortable folder."
          add-paths: OpenMalwareScannerPortable/multron_server.exe
          branch: "auto-update-multron-server"
          base: ${{ github.ref_name }}
          delete-branch: true
          labels: binaries, automated-pr, multron, development-version


