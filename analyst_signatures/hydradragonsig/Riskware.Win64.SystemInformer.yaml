rules:
- id: VK-RISK-SYSTEMINFORMER
  title: System Informer (Process Hacker) - process/kernel inspection tool
  description: Legitimate open-source tool; can terminate protected processes and load a kernel driver, so it is often abused to disable security software
  severity: low
  verdict: suspicious
  confidence: 90
  score: 40
  family: Riskware.Win64.SystemInformer
  tags: [analyst, riskware, process-tool]
  logic: all
  conditions:
  - type: file_type
    values: [pe]
  - type: string_set
    min: 2
    nocase: true
    values:
    - "github.com/winsiderss/systeminformer"
    - "https://github.com/wj32"
    - "https://github.com/dmex"
    - "SystemInformer"
