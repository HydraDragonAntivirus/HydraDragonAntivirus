name: Build Exorcism-PowershellEdition

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - 'Exorcism-PowershellEdition/**'
      - '!Exorcism-PowershellEdition/**/*.dll'
      - '.github/workflows/build-exorcism.yml'
  pull_request:
    branches: ["**"]
    paths:
      - 'Exorcism-PowershellEdition/**'
      - '.github/workflows/build-exorcism.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  EXORCISM_SOLUTION: 'Exorcism-PowershellEdition\Exorcism-PowershellEdition.sln'
  EXORCISM_DLL: 'Exorcism-PowershellEdition\Exorcism-PowershellEdition\bin\Release\Exorcism-PowershellEdition.dll'
  EXORCISM_OUTPUT_DIR: 'hydradragon\exorcism'

jobs:
  ci-windows:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Set up MSVC Developer Command Prompt
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: Install NuGet CLI
        shell: pwsh
        run: choco install nuget.commandline -y --no-progress
      - name: Restore NuGet packages
        shell: pwsh
        run: nuget restore $env:EXORCISM_SOLUTION -NonInteractive
      - name: Build Solution
        shell: pwsh
        run: msbuild $env:EXORCISM_SOLUTION /p:Configuration=Release /p:Platform="Any CPU" /m /restore:false

  publish:
    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/development-version' &&
      !startsWith(github.ref_name, 'auto-update-') &&
      !contains(github.event.head_commit.message, 'chore(exorcism): update PowerShell edition binary') &&
      github.event.head_commit.author.name != 'github-actions[bot]'
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Set up MSVC Developer Command Prompt
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: Install NuGet CLI
        shell: pwsh
        run: choco install nuget.commandline -y --no-progress
      - name: Restore NuGet packages
        shell: pwsh
        run: nuget restore $env:EXORCISM_SOLUTION -NonInteractive
      - name: Build Solution
        shell: pwsh
        run: msbuild $env:EXORCISM_SOLUTION /p:Configuration=Release /p:Platform="Any CPU" /m /restore:false
      - name: Stage Exorcism DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:EXORCISM_OUTPUT_DIR | Out-Null
          Copy-Item -Path $env:EXORCISM_DLL -Destination "$env:EXORCISM_OUTPUT_DIR\Exorcism-PowershellEdition.dll" -Force
      - name: Check for publishable changes
        id: check_changes
        uses: ./.github/actions/check-publishable-changes
        with:
          paths: |
            hydradragon/exorcism/Exorcism-PowershellEdition.dll
      - name: Create PR
        if: steps.check_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(exorcism): update PowerShell edition binary"
          title: "Update Exorcism PowerShell edition binary"
          body: "Automated Exorcism PowerShell edition DLL build."
          add-paths: ${{ steps.check_changes.outputs.publishable_files }}
          branch: "auto-update-exorcism-powershell"
          base: ${{ github.ref_name }}
          delete-branch: true
          labels: binaries, automated-pr, exorcism, development-version
