[package]
name = "hydradragonfreshclam"
version = "0.1.0"
edition = "2024"
description = "Developer tool: update ClamAV databases via libfreshclam.dll, then filter them with ClamJuice (Windows-only, no hash signatures). Not part of the portable HydraDragon build."
license = "GPL-2.0-or-later"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
thiserror = "2"

# CVD unpacking + filtering (ClamJuice)
flate2 = "1"
tar = "0.4"
tempfile = "3"
