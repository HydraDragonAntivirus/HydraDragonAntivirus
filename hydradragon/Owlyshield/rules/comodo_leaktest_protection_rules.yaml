# MASTER ENFORCEMENT: All rules require kernel-level enforcement
# for real-time blocking and rollback capabilities

kernel_enforcement_policy:
  enabled: true
  blocking_level: "PRE_DISPATCH"
  logging_level: "DEBUG"
  rollback_on_termination: true
  audit_trail_retention_days: 90

# Response template for consistency
global_response_defaults:
  notify_user: true
  record: true
  alert_edr: true
  send_telemetry: true

# Reporting and alerting
reporting:
  enabled: true
  include_kernel_events: true
  include_api_calls: true
  include_registry_changes: true
  include_network_traffic: true
  comodo_test_report: true
