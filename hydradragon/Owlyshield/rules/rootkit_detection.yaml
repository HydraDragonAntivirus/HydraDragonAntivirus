# ---------------------------------------------------------------------------
# Kernel-origin UEFI and boot tamper signals
# ---------------------------------------------------------------------------
- name: "HEUR:Win64.Rootkit.UefiRawDeviceWrite"
  description: >
    A process opened a raw disk or volume device with write or delete intent.
    This is a common precursor to low-level UEFI or bootloader tampering and is
    recorded for rule-driven response.
  author: "HydraDragon"
  severity: 4
  tags:
    - rootkit
    - bootkit
    - uefi
    - raw_device
    - kernel
  mitre_attack:
    - "T1014"
    - "T1542.001"

  named_conditions:
    raw_device_write:
      rootkit_event_types: ["generic"]
      rootkit_description_contains:
        - "uefi raw device write access:"

  detection_logic:
    condition: "raw_device_write"

  response:
    terminate_process: false
    notify_user: true
    record: true

  allowlisted_apps:
    - pattern: "C:/Windows/System32/diskpart.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "C:/Windows/System32/SetupHost.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "C:/Windows/WinSxS/*/TiWorker.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "C:/Windows/servicing/TrustedInstaller.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "C:/Windows/System32/Dism.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "C:/Windows/System32/reagentc.exe"
