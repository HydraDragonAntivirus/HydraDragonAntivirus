# ---------------------------------------------------------------------------
# Rule 5: Rootkit + Process Injection combo
# A process that both performs kernel-level injection AND triggers a rootkit
# finding is almost certainly malware. Terminate + quarantine.
# ---------------------------------------------------------------------------
- name: "HEUR:Win64.Rootkit.PlusInjection"
  description: >
    Process triggered both a kernel rootkit finding (SSDT hook or inline hook)
    AND performed memory injection (WriteVirtualMemory / CreateRemoteThread).
    High-confidence rootkit dropper / loader.
  author: "HydraDragon"
  severity: 5
  tags:
    - rootkit
    - injection
    - kernel
  mitre_attack:
    - "T1014"
    - "T1055"

  named_conditions:
    any_rootkit:
      rootkit_total_min: 1

    injection_apis:
      apis:
        - "ntdll!NtWriteVirtualMemory"
        - "ntdll!NtCreateThreadEx"
        - "ntdll!NtQueueApcThread"
      api_threshold: 1
      # Also catch raw kernel-path events
      detect_hypervisor_event: true
      hypervisor_event_labels:
        - "IrpKernelWriteMemory"
        - "IrpKernelRemoteThread"
        - "IrpKernelQueueApc"
      hypervisor_event_threshold: 1

  detection_logic:
    and:
      - condition: "any_rootkit"
      - condition: "injection_apis"

  response:
    ask_user: false
    terminate_process: false
    quarantine: false
    notify_user: true
    record: true

  allowlisted_apps:
    - pattern: "C:/Windows/System32/svchost.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "C:/Windows/System32/services.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "C:/Windows/System32/lsass.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "C:/Windows/System32/wininit.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "C:/Windows/System32/smss.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "C:/Windows/System32/csrss.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "C:/Windows/System32/winlogon.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "C:/Windows/explorer.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]

