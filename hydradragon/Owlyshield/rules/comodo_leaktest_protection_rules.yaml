# TEST #10: Injection:SetWinEventHook — Detect and block hook-based DLL injection
- name: "HEUR:Win.Injection.WinEventHook.gen"
  author: "HydraDragon"
  date: "2026-03-26"
  status: production
  level: high
  severity: 90
  description: |
    Detects SetWinEventHook() calls with remote DLL paths to inject code into
    target processes. Threat actors use this to execute code in processes
    running with higher privileges.
    COMODO Test #10: Injection:SetWinEventHook
    Blocks hook-based injection.
  debug: false

  named_conditions:
    setwineventhook_call:
      orderless: true
      apis:
        - "user32.dll!SetWinEventHook"
        - "user32.dll!SetWinEventHookA"
        - "user32.dll!SetWinEventHookW"
        - "win32u.dll!NtUserSetWinEventHook"
        - "SetWinEventHook"
        - "SetWinEventHookA"
        - "SetWinEventHookW"
        - "NtUserSetWinEventHook"
        - "*SetWinEventHook*"
      api_threshold: 1
      min_matches: 1

    unsigned_caller:
      orderless: true
      is_signed: false
      min_matches: 1

  detection_logic:
    condition: "setwineventhook_call"

  response:
    notify_user: true
    ask_user: false
    terminate_process: true
    status_access_denied: true
    record: true

  tags: ["injection", "hook", "code-injection"]
  mitre_attack: ["T1547.015", "T1179"]

