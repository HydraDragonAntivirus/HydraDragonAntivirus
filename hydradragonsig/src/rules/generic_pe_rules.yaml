name: Generic PE static rules (crypter + capability scoring)
version: "0.1"
# Logic:
#   1) Obfuscation (packer / hidden embedded PE) alone is NOT a verdict.
#   2) A single capability (injection, ransom, stealer, AV tampering ...) is rarely a verdict alone.
#   3) Obfuscation + capability, or several capabilities together => verdict.
#   4) Unpacked / extracted children are compared with their parent (section D):
#      a thin packed shell whose dump suddenly imports injection APIs is a crypter.
# Tested against 1157 clean Windows PEs (OBS, PowerShell, KeePassXC, System Informer,
# AutoHotkey, Notepad++, rclone, UPX, 7-Zip ...) with zero detections.
rules:

  # ================================================================
  # A) OBFUSCATION SIGNALS (private: no finding on their own)
  # ================================================================

  # Note: .rsrc (PNG icons) and compressed data give one high-entropy section in clean
  # files, so plain section_entropy is not used: packed_pe + known protector section names.
  - id: HG-OBF-PACKED
    title: "Helper: packed PE (packer heuristic or known protector sections)"
    severity: info
    private: true
    logic: any
    conditions:
      - type: packed_pe
      - type: section_name_regex
        pattern: '(?i)^(\.themida|\.winlice|\.vmp[0-9]|\.enigma[0-9]?|\.aspack|\.adata|mpress[12]|\.petite|\.nsp[0-2]|\.boom|\.ccg|\.yp|\.maskpe|\.mew|pec2|\.perplex|\.spack|\.svkp|\.taz|\.vlizer|\.y0da|\.packed)$'

  # WEAK: the MSVC CRT puts these three imports in almost every program. Used only next
  # to a hidden PE in the crypter rule; never counted as obfuscation on its own.
  - id: HG-OBF-DYNRESOLVE
    title: "Helper: dynamic API resolution + memory permission change"
    severity: info
    private: true
    logic: all
    conditions:
      - type: import_any
        names: ["!GetProcAddress", "!LdrGetProcedureAddress"]
      - type: import_any
        names: ["!LoadLibraryA", "!LoadLibraryW", "!LoadLibraryExA", "!LoadLibraryExW", "!LdrLoadDll"]
      - type: import_any
        names: ["!VirtualProtect", "!VirtualAlloc", "!NtProtectVirtualMemory", "!NtAllocateVirtualMemory"]

  # DOS stub text hidden with single-byte XOR or base64 (a second, encoded PE).
  # The engine searches only the encoded forms (xor keys 1-255, base64 at the three
  # alignments): the plain stub of the file's own header never matches.
  - id: HG-OBF-ENCODED-DOS-STUB
    title: "Helper: XOR / base64 encoded DOS stub (hidden PE)"
    severity: info
    private: true
    conditions:
      - type: native_signature
        expression: "any of them"
        atoms:
          - id: stub_xor
            value: "This program cannot be run in DOS mode"
            ascii: true
            xor: true
            xor_min: 1
            xor_max: 255
          - id: stub_b64
            value: "This program cannot be run in DOS mode"
            base64: true
            base64wide: true

  # Encoded (xor / base64 / reversed / hex) second PE: the clearest crypter trace.
  - id: HG-OBF-HIDDEN-PE
    title: "Helper: encoded embedded PE"
    severity: info
    private: true
    logic: any
    conditions:
      - type: rule_match
        ids: [HG-OBF-ENCODED-DOS-STUB]
      - type: native_signature
        expression: "any of them"
        atoms:
          - id: mz_b64
            value: "TVqQAAMAAAAEAAAA"
            ascii: true
            wide: true
          - id: mz_b64_rev
            value: "AAAAEAAAAMAAQqVT"
            ascii: true
            wide: true
          - id: mz_hex
            value: "4D5A90000300000004000000"
            ascii: true
            wide: true
            nocase: true
          - id: mz_hex_dash
            value: "4D-5A-90-00-03-00-00-00"
            ascii: true
            wide: true
            nocase: true

  # Plain second PE after the header. Installers have it too: never a verdict alone.
  - id: HG-OBF-PLAIN-PE
    title: "Helper: plain embedded PE after the header"
    severity: info
    private: true
    conditions:
      - type: native_signature
        expression: "$dos in (0x400..0x7FFFFFFF) or $w32 in (0x400..0x7FFFFFFF)"
        atoms:
          - id: dos
            value: "This program cannot be run in DOS mode"
            ascii: true
          - id: w32
            value: "This program must be run under Win32"
            ascii: true

  # ================================================================
  # B) CAPABILITY SIGNALS (private)
  # API names are searched in imports AND strings: crypters / loaders resolve
  # APIs by name with GetProcAddress, so they never show in the import table.
  # ================================================================

  - id: HG-CAP-INJECT
    title: "Helper: process injection / hollowing"
    severity: info
    private: true
    logic: any
    conditions:
      - type: import_set
        min: 3
        names: ["!VirtualAllocEx", "!WriteProcessMemory", "!NtWriteVirtualMemory",
                "!SetThreadContext", "!Wow64SetThreadContext", "!NtUnmapViewOfSection",
                "!ZwUnmapViewOfSection", "!CreateRemoteThread", "!NtCreateThreadEx",
                "!QueueUserAPC", "!NtQueueApcThread", "!RtlCreateUserThread"]
      - type: string_set
        min: 4
        ascii: true
        wide: true
        values: ["VirtualAllocEx", "WriteProcessMemory", "NtWriteVirtualMemory",
                 "SetThreadContext", "Wow64SetThreadContext", "NtUnmapViewOfSection",
                 "ZwUnmapViewOfSection", "CreateRemoteThread", "NtCreateThreadEx",
                 "NtResumeThread", "QueueUserAPC"]

  - id: HG-CAP-RANSOM
    title: "Helper: recovery destruction commands"
    severity: info
    private: true
    conditions:
      - type: string_set
        min: 1
        nocase: true
        ascii: true
        wide: true
        decoded: true
        values: ["vssadmin delete shadows", "vssadmin.exe delete shadows",
                 "shadowcopy delete", "wbadmin delete catalog",
                 "recoveryenabled no", "bootstatuspolicy ignoreallfailures",
                 "resize shadowstorage"]

  - id: HG-CAP-CRYPTO-WALK
    title: "Helper: file encryption primitives + directory walk"
    severity: info
    private: true
    logic: all
    conditions:
      - type: import_any
        names: ["!CryptEncrypt", "!BCryptEncrypt", "!CryptGenKey", "!CryptImportKey",
                "!BCryptGenerateSymmetricKey"]
      - type: import_any
        names: ["!FindFirstFileW", "!FindFirstFileExW", "!FindFirstFileA"]
      - type: import_any
        names: ["!MoveFileExW", "!MoveFileW", "!SetFileInformationByHandle", "!WriteFile"]

  - id: HG-CAP-STEALER
    title: "Helper: browser / wallet / messenger credential paths"
    severity: info
    private: true
    conditions:
      - type: string_set
        min: 4
        nocase: true
        ascii: true
        wide: true
        decoded: true
        values: ['\Google\Chrome\User Data', '\Microsoft\Edge\User Data',
                 '\BraveSoftware\Brave-Browser', '\Mozilla\Firefox\Profiles',
                 "Login Data", "Local State", "encrypted_key", "logins.json", "key4.db",
                 "wallet.dat", '\Exodus\', '\Electrum\wallets', '\atomic\Local Storage',
                 '\Telegram Desktop\tdata', '\discord\Local Storage\leveldb',
                 "nkbihfbeogaeaoehlefnkodbefgpgknn"]

  - id: HG-CAP-EXFIL
    title: "Helper: bot / webhook exfiltration endpoints"
    severity: info
    private: true
    conditions:
      - type: string_set
        min: 1
        nocase: true
        ascii: true
        wide: true
        decoded: true
        values: ["api.telegram.org/bot", "discord.com/api/webhooks",
                 "discordapp.com/api/webhooks", "pastebin.com/raw/"]

  - id: HG-CAP-DEFENSE-OFF
    title: "Helper: disables Defender / security tools"
    severity: info
    private: true
    conditions:
      - type: string_set
        min: 1
        nocase: true
        ascii: true
        wide: true
        decoded: true
        values: ["Set-MpPreference -DisableRealtimeMonitoring",
                 "Add-MpPreference -ExclusionPath", "Add-MpPreference -ExclusionProcess",
                 "DisableAntiSpyware", "DisableRealtimeMonitoring",
                 "netsh advfirewall set allprofiles state off"]

  # Keyboard APIs are in every GUI program; keystroke log markers give a keylogger away.
  - id: HG-CAP-KEYLOG
    title: "Helper: keyboard capture with keystroke log markers"
    severity: info
    private: true
    logic: all
    conditions:
      - type: import_any
        names: ["!SetWindowsHookExA", "!SetWindowsHookExW", "!GetAsyncKeyState",
                "!GetKeyboardState", "!RegisterRawInputDevices", "!GetRawInputData"]
      - type: string_set
        min: 4
        nocase: true
        ascii: true
        wide: true
        values: ["[ENTER]", "[BACKSPACE]", "[BACK]", "[TAB]", "[CAPSLOCK]", "[SHIFT]",
                 "[CTRL]", "[ESC]", "[DEL]", "[WIN]", "[ALT]", "[UP]", "[DOWN]"]

  - id: HG-CAP-DOWNLOAD-EXEC
    title: "Helper: download and execute"
    severity: info
    private: true
    logic: all
    conditions:
      - type: import_any
        names: ["!URLDownloadToFileA", "!URLDownloadToFileW"]
      - type: import_any
        names: ["!WinExec", "!ShellExecuteA", "!ShellExecuteW", "!ShellExecuteExW",
                "!CreateProcessA", "!CreateProcessW"]

  - id: HG-CAP-ANTI-ANALYSIS
    title: "Helper: sandbox / VM / analysis-tool checks"
    severity: info
    private: true
    conditions:
      - type: string_set
        min: 4
        nocase: true
        ascii: true
        wide: true
        values: ["SbieDll.dll", "VBoxService", "VBoxTray", "vmtoolsd", "vmwaretray",
                 "wine_get_unix_file_name", "x64dbg", "ollydbg", "ProcessHacker",
                 "Wireshark", "procmon", "cuckoomon", "dbghelp.dll", "qemu-ga"]

  - id: HG-CAP-PERSIST
    title: "Helper: autostart persistence"
    severity: info
    private: true
    conditions:
      - type: string_set
        min: 1
        nocase: true
        ascii: true
        wide: true
        decoded: true
        values: ['Software\Microsoft\Windows\CurrentVersion\Run',
                 "schtasks /create", "schtasks.exe /create",
                 '\Start Menu\Programs\Startup']

  # ================================================================
  # C) VERDICT RULES
  # ================================================================

  # Ransom: recovery destruction + encryption / directory walk. No obfuscation needed.
  - id: HDS-GEN-RANSOM-001
    title: "Generic ransomware (recovery wipe + file encryption)"
    severity: critical
    verdict: malware
    confidence: 95
    score: 95
    family: "Ransom.Win32.Generic.A"
    logic: all
    conditions:
      - type: rule_match
        ids: [HG-CAP-RANSOM, HG-CAP-CRYPTO-WALK]

  # Crypter: encoded second PE + (packer / dynamic resolution / injection / anti-analysis)
  - id: HDS-GEN-CRYPTER-001
    title: "Crypter shell carrying an encoded PE"
    severity: high
    verdict: malware
    confidence: 90
    score: 85
    family: "Trojan.Win32.Crypter.A"
    logic: all
    conditions:
      - type: rule_match
        ids: [HG-OBF-HIDDEN-PE]
      - type: rule_match
        min: 1
        ids: [HG-OBF-PACKED, HG-OBF-DYNRESOLVE, HG-CAP-INJECT, HG-CAP-ANTI-ANALYSIS]

  # Dropper: plain embedded PE + packer + at least one malicious capability
  - id: HDS-GEN-DROPPER-001
    title: "Obfuscated dropper with embedded PE and malicious capability"
    severity: high
    verdict: malware
    confidence: 85
    score: 80
    family: "Trojan.Win32.Dropper.Gen"
    logic: all
    conditions:
      - type: rule_match
        ids: [HG-OBF-PLAIN-PE]
      - type: rule_match
        ids: [HG-OBF-PACKED]
      - type: rule_match
        min: 1
        ids: [HG-CAP-INJECT, HG-CAP-DEFENSE-OFF, HG-CAP-ANTI-ANALYSIS, HG-CAP-DOWNLOAD-EXEC]

  # Stealer: credential paths + exfiltration endpoint, packer or anti-analysis
  - id: HDS-GEN-STEALER-001
    title: "Generic info stealer"
    severity: high
    verdict: malware
    confidence: 90
    score: 85
    family: "Trojan-PSW.Win32.Stealer.Gen"
    logic: all
    conditions:
      - type: rule_match
        ids: [HG-CAP-STEALER]
      - type: rule_match
        min: 1
        ids: [HG-CAP-EXFIL, HG-OBF-PACKED, HG-CAP-ANTI-ANALYSIS]

  # The core generic rule: obfuscation + at least 2 different malicious capabilities
  - id: HDS-GEN-PE-001
    title: "Obfuscated PE with multiple malicious capabilities"
    severity: high
    verdict: malware
    confidence: 85
    score: 75
    family: "Trojan.Win32.Generic.HDS"
    logic: all
    conditions:
      - type: rule_match
        min: 1
        ids: [HG-OBF-PACKED, HG-OBF-HIDDEN-PE]
      - type: rule_match
        min: 2
        ids: [HG-CAP-INJECT, HG-CAP-DEFENSE-OFF, HG-CAP-KEYLOG, HG-CAP-DOWNLOAD-EXEC,
              HG-CAP-ANTI-ANALYSIS, HG-CAP-PERSIST, HG-CAP-EXFIL]

  # 3+ capabilities without obfuscation (unpacked payloads land here)
  - id: HDS-GEN-PE-002
    title: "PE with three or more malicious capabilities"
    severity: high
    verdict: malware
    confidence: 80
    score: 70
    family: "Trojan.Win32.Generic.HDS"
    conditions:
      - type: rule_match
        min: 3
        ids: [HG-CAP-INJECT, HG-CAP-DEFENSE-OFF, HG-CAP-KEYLOG, HG-CAP-DOWNLOAD-EXEC,
              HG-CAP-ANTI-ANALYSIS, HG-CAP-PERSIST, HG-CAP-EXFIL]

  # Obfuscation + one capability: suspicious (cloud ML / analyst decides)
  - id: HDS-GEN-PE-SUSP-001
    title: "Obfuscated PE with a malicious capability"
    severity: medium
    verdict: suspicious
    confidence: 60
    score: 30
    family: "HEUR.Win32.Suspicious.Gen"
    logic: all
    conditions:
      - type: rule_match
        min: 1
        ids: [HG-OBF-PACKED, HG-OBF-HIDDEN-PE]
      - type: rule_match
        min: 1
        ids: [HG-CAP-INJECT, HG-CAP-DEFENSE-OFF, HG-CAP-KEYLOG, HG-CAP-DOWNLOAD-EXEC,
              HG-CAP-ANTI-ANALYSIS, HG-CAP-EXFIL, HG-CAP-RANSOM]

  # ================================================================
  # D) PARENT COMPARISON (unpacked dumps / extracted payloads)
  # These only match when the scan carries a parent summary: HydraDragonAV passes
  # the packed original to the Unicorn dump scan, the CLI takes --parent FILE,
  # and zip members get their archive automatically.
  # ================================================================

  # The original was a thin shell: few imports (a stub that resolves the rest at runtime).
  - id: HG-PARENT-THIN-SHELL
    title: "Helper: child of a thin PE shell"
    severity: info
    private: true
    logic: all
    conditions:
      - type: has_parent
      - type: parent_feature_lte
        name: pe_import_count
        value: 30

  # Injection / hollowing APIs that the shell did not import but the dump does.
  - id: HG-PARENT-NEW-INJECT
    title: "Helper: injection imports that appear only after unpacking"
    severity: info
    private: true
    conditions:
      - type: new_import_set
        min: 3
        names: ["!VirtualAllocEx", "!WriteProcessMemory", "!NtWriteVirtualMemory",
                "!SetThreadContext", "!Wow64SetThreadContext", "!NtUnmapViewOfSection",
                "!ZwUnmapViewOfSection", "!CreateRemoteThread", "!NtCreateThreadEx",
                "!QueueUserAPC", "!NtQueueApcThread", "!RtlCreateUserThread"]

  # Crypter by diff: thin shell -> dump with hidden injection + another malicious capability.
  - id: HDS-GEN-UNPACKED-CRYPTER-001
    title: "Crypter: unpacked payload reveals hidden injection and malicious capability"
    severity: high
    verdict: malware
    confidence: 90
    score: 90
    family: "Trojan.Win32.Crypter.B"
    logic: all
    conditions:
      - type: rule_match
        ids: [HG-PARENT-THIN-SHELL, HG-PARENT-NEW-INJECT]
      - type: rule_match
        min: 1
        ids: [HG-CAP-DEFENSE-OFF, HG-CAP-ANTI-ANALYSIS, HG-CAP-KEYLOG, HG-CAP-EXFIL,
              HG-CAP-STEALER, HG-CAP-RANSOM, HG-CAP-DOWNLOAD-EXEC]

  # Many suspicious APIs appear after unpacking + 2 capabilities. Injection is not counted
  # here: the import delta already is that signal (a UPX-packed System Informer gains
  # injection imports and a Run-key string and must stay suspicious, not malware).
  - id: HDS-GEN-UNPACKED-CAPS-001
    title: "Unpacked payload gains many suspicious APIs and malicious capabilities"
    severity: high
    verdict: malware
    confidence: 85
    score: 80
    family: "Trojan.Win32.Generic.HDS.B"
    logic: all
    conditions:
      - type: rule_match
        ids: [HG-PARENT-THIN-SHELL]
      - type: feature_delta_gte
        name: pe_suspicious_import_count
        value: 5
      - type: rule_match
        min: 2
        ids: [HG-CAP-DEFENSE-OFF, HG-CAP-KEYLOG, HG-CAP-DOWNLOAD-EXEC, HG-CAP-ANTI-ANALYSIS,
              HG-CAP-PERSIST, HG-CAP-EXFIL, HG-CAP-STEALER, HG-CAP-RANSOM]

  # The diff alone: suspicious (legit UPX-packed tools also gain imports when unpacked).
  - id: HDS-GEN-UNPACKED-SUSP-001
    title: "Unpacked payload gains suspicious APIs hidden by its shell"
    severity: medium
    verdict: suspicious
    confidence: 60
    score: 30
    family: "HEUR.Win32.Crypter.Gen"
    logic: all
    conditions:
      - type: rule_match
        ids: [HG-PARENT-THIN-SHELL]
      - type: rule_match
        min: 1
        ids: [HG-PARENT-NEW-INJECT]
