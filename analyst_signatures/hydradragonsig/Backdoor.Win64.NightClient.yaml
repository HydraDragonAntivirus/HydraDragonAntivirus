name: NightClient RAT (MMEngine)
version: "1.0"
# NightClient: a C++ (MinGW, x64) remote access trojan built around "MMEngine",
# a self-mutating engine: indirect syscalls through a `syscall; ret` gadget in
# ntdll, a hook check on the syscall stubs, syscall numbers by sorting the
# exports, a manual-mapping loader for plugins, call-stack spoofing, encrypted
# strings and sleep, random section names per build.
#
# Each technique is its own private rule. The family rule needs 3 of the 10, so a
# build that changes or drops some of them (new strings, stripped symbols, other
# compiler flags) is still found by the rest. The code checks use
# opcode_pattern, which compares instructions, not bytes: another register or
# encoding of the same instruction still matches.
#
# Written against a builder that tries to get past it. Two kinds of helpers:
#   code (compiled logic; survives strip, renamed classes, removed log lines,
#   encrypted strings, a new config magic): SYSCALL-GADGET-SCAN,
#   SYSCALL-STUB-CHECK, CONFIG-ROUTINE, OWN-CRYPTO.
#   build traces (one builder option or `strip` removes each): NAMES,
#   LOG-TAGS, RANDOM-SECTIONS, PERSIST-SELFDELETE, MANUAL-MAP, CONFIG.
# Any three of the four code helpers reach the threshold: a stripped build with
# encrypted strings, a new config magic and even a new config layout is still
# the family. To get under it two of the engine's own techniques have to be
# rewritten (hook check, gadget search, config routine, crypto). Each code helper accepts more than
# one way to write the same check (compare / constants in registers / masked
# dword), so a compiler or a small source change does not remove it.
#
# Sample: purnogram.exe
#   sha256 fa1eda0d6c35d1cb226f9217429e05d3e4d2330e75d24e82e25d26089b9f19ce
#   config: C2 127.0.0.1:1337 (a test build), install C:\ProgramData\svc_host.exe
rules:
  # ------------------------------------------------------------ techniques

  # Looks for `syscall; ret` (0F 05 C3) byte by byte in a module's code, to jump
  # to it with its own syscall number (indirect syscall).
  - id: VK-BKD-NIGHTCLIENT-H-SYSCALL-GADGET-SCAN
    title: "Helper: searches code for a syscall; ret gadget"
    severity: info
    private: true
    logic: all
    conditions:
      # Cheap gate before disassembling the code: every form below has one of
      # these encodings (`cmp byte [reg+2], 0xC3` with disp8 / SIB / disp32, or
      # the masked dword compare against 0xC3050F).
      - type: byte_pattern
        pattern: "( 80 7? 02 C3 | 80 7C ?? 02 C3 | 80 B? 02 00 00 00 C3 | 3D 0F 05 C3 00 | 81 F? 0F 05 C3 00 )"
      - type: opcode_pattern
        region: code
        min: 1
        patterns:
          - "cmp byte ptr [*], 0xf; jne *; cmp byte ptr [*+0x1], 0x5; jne *; cmp byte ptr [*+0x2], 0xc3"
          - "cmp byte ptr [*], 0xf; jne *; cmp byte ptr [*+0x1], 0x5; jne *; cmp byte ptr [*+0x2], 0xc3; jne *"
          - "cmp word ptr [*], 0x50f; jne *; cmp byte ptr [*+0x2], 0xc3"
          - "cmp byte ptr [*+0x2], 0xc3; jne *; cmp word ptr [*], 0x50f"
          # The three bytes read at once and masked: `and reg, 0xffffff; cmp reg, 0xc3050f`.
          - "and *, 0xffffff; [0-2]; cmp *, 0xc3050f"

  # Checks that an ntdll syscall stub is not hooked: its first bytes must be
  # `mov r10, rcx; mov eax, SSN` in either encoding (4C 8B D1 B8 / 49 89 CA B8).
  - id: VK-BKD-NIGHTCLIENT-H-SYSCALL-STUB-CHECK
    title: "Helper: compares syscall stubs with both mov r10, rcx encodings"
    severity: info
    private: true
    conditions:
      # Both stub prefixes as immediates close together, whatever the instruction
      # (`cmp eax, imm` / `cmp dword [reg], imm` up to 8 instructions apart, or
      # loaded into registers first: `mov ebp, 0xB8CA8949; mov edi, 0xB8D18B4C`,
      # as this sample does at a second place). Bytes, not disassembly: an
      # immediate is in the instruction bytes whatever the encoding.
      - type: byte_pattern
        pattern: "( 4C 8B D1 B8 [0-96] 49 89 CA B8 | 49 89 CA B8 [0-96] 4C 8B D1 B8 )"

  # The builder gives every section a random name: a dot and 7 lower-case
  # letters, the first two included (normally .text and .data / .rdata). The
  # section count is not required: `strip` removes the MinGW debug sections
  # (this sample has 20+) but keeps the random names.
  - id: VK-BKD-NIGHTCLIENT-H-RANDOM-SECTIONS
    title: "Helper: first sections with random 7-letter names"
    severity: info
    private: true
    logic: all
    conditions:
      - type: pe_section
        index: 0
        name_regex: "^\\.[a-z]{7}$"
        flags_all: [code, execute]
      - type: pe_section
        index: 1
        name_regex: "^\\.[a-z]{7}$"

  # Manual-mapping loader (plugins run from memory): native APIs resolved by
  # name, the x64 unwind table registered by hand.
  - id: VK-BKD-NIGHTCLIENT-H-MANUAL-MAP
    title: "Helper: manual mapping and native memory APIs"
    severity: info
    private: true
    conditions:
      - type: string_set
        values: ["RtlAddFunctionTable", "NtAllocateVirtualMemory", "NtProtectVirtualMemory", "NtCreateThreadEx"]
        min: 4

  # Persistence (scheduled task at logon with highest rights, Run keys) and
  # self-deletion after a ping delay, written as UTF-16 command lines.
  - id: VK-BKD-NIGHTCLIENT-H-PERSIST-SELFDELETE
    title: "Helper: logon task, Run key and ping-delayed self-delete"
    severity: info
    private: true
    conditions:
      - type: string_set
        wide: true
        ascii: true
        nocase: true
        values:
          - "schtasks /create"
          - "/sc onlogon"
          - "/rl highest"
          - "Software\\Microsoft\\Windows\\CurrentVersion\\Run"
          - "ping 1.1.1.1 -n 1 -w"
          - "Del /f /q"
        min: 4

  # Names left in the symbol table and in strings (C++ mangled class names,
  # engine functions, the client's mutex). Gone when a build is stripped.
  - id: VK-BKD-NIGHTCLIENT-H-NAMES
    title: "Helper: NightClient / MMEngine names"
    severity: info
    private: true
    conditions:
      - type: string_set
        wide: true
        ascii: true
        values:
          - "11NightClient"
          - "8MMEngine"
          - "NightClientSendMutex"
          - "MemoryLoader_LoadImpl"
          - "FindSyscallGadget"
          - "ResolveSSNBySorting"
          - "_thunk_key_exchange"
          - "14Plhayır uginManifest"
          - "MutateEPStubs"
          - "TryLoadStompDll"
          - "SleepEncrypted"
        min: 3

  # The engine's own log lines (left in this build).
  - id: VK-BKD-NIGHTCLIENT-H-LOG-TAGS
    title: "Helper: [ML] / [SYSCALL] / [PERSIST] log lines"
    severity: info
    private: true
    conditions:
      - type: string_set
        values:
          - "[SYSCALL] gadget not found"
          - "[SYSCALL] ntdll not found"
          - "[ML] TLS callbacks invoked"
          - "[ML] RtlAddFunctionTable failed"
          - "[PERSIST] schtasks created"
          - "[PERSIST] HKCU Run set"
        min: 2

  # The encrypted build config (C2 host and port, password, install path) in its
  # own `.cfg` section: magic D2 1A E9 98, version, length 590 (0x24E), CRC32,
  # then the ChaCha20 nonce, key and constants, then the 590 encrypted bytes.
  - id: VK-BKD-NIGHTCLIENT-H-CONFIG
    title: "Helper: NightClient encrypted config block"
    severity: info
    private: true
    conditions:
      - type: byte_pattern
        pattern: "D2 1A E9 98 [4] 4E 02 00 00"
      - type: pe_section
        name: ".cfg"
        virtual_size: 0x2A0

  # The engine's own crypto, compiled in (no crypto library): ChaCha20 with its
  # constants as immediates ("expa" / "nd 3" loaded into registers close
  # together) and a hand-written RSA that checks the public exponent is 65537
  # (`cmp dword [rsp+X], 0x10001`). Each is common alone; both together, in code
  # that also does indirect syscalls, is this engine.
  - id: VK-BKD-NIGHTCLIENT-H-OWN-CRYPTO
    title: "Helper: inline ChaCha20 constants and an RSA exponent check"
    severity: info
    private: true
    logic: all
    conditions:
      - type: byte_pattern
        pattern: "( 65 78 70 61 [0-64] 6E 64 20 33 | 6E 64 20 33 [0-64] 65 78 70 61 )"
      - type: byte_pattern
        pattern: "81 7? 24 ?? 01 00 01 00"

  # The routine that reads that block checks its length: 590 (0x24E) at offset 8
  # (`cmp dword [reg+8], 0x24E`, with or without REX). Code, not data: a new
  # magic or section name leaves it; only another config layout changes it.
  - id: VK-BKD-NIGHTCLIENT-H-CONFIG-ROUTINE
    title: "Helper: config routine checks a 590-byte block length at offset 8"
    severity: info
    private: true
    conditions:
      - type: byte_pattern
        # The REX form (41 81 7? ...) contains this one.
        pattern: "81 7? 08 4E 02 00 00"
    # Config extractor (hydradragonunicorn UNPACK_FORMAT.md): runs the sample's
    # start-up, then its own config routine, and reads the values it decrypted
    # (C2 host, install path). On this helper, not on the config block, so it
    # still runs when the block's magic or section name changes. `func_start`
    # gives the start of the function the compare is in (x64 unwind table).
    unpack:
      - try:
          - - find: {pattern: "81 7? 08 4E 02 00 00", as: hit}
          - - find: {pattern: "41 81 7? 08 4E 02 00 00", as: hit}
      - set: {routine: image_base + func_start(off2rva(hit))}
      # Start-up first: it resolves the hidden imports, syscalls and JIT thunks
      # the routine needs.
      - run_until: {va: routine, max_instructions: 400000000, timeout_ms: 120000}
      - call:
          va: routine
          as: written
          max_instructions: 50000000
          timeout_ms: 60000
      - iocs: {in: written, required: true}

  # ------------------------------------------------------------ detections

  - id: VK-BKD-NIGHTCLIENT
    title: "NightClient RAT (MMEngine): 3 or more of its techniques"
    description: >-
      Indirect syscalls, syscall stub hook check, the config routine, random
      section layout, manual mapping, logon persistence with self-delete,
      NightClient / MMEngine names, engine log lines, the encrypted config
      block, the engine's own ChaCha20 / RSA: any three of them. Four of them
      are compiled code and reach it without any string or section name.
    severity: critical
    verdict: malware
    confidence: 95
    score: 100
    family: "Backdoor.Win64.NightClient.A"
    tags: [rat, backdoor, indirect-syscall, manual-map, persistence]
    references:
      - "sha256 fa1eda0d6c35d1cb226f9217429e05d3e4d2330e75d24e82e25d26089b9f19ce (purnogram.exe)"
    mitre:
      - { id: T1106, name: "Native API", tactic: "Execution" }
      - { id: T1620, name: "Reflective Code Loading", tactic: "Defense Evasion" }
      - { id: T1053.005, name: "Scheduled Task", tactic: "Persistence" }
      - { id: T1547.001, name: "Registry Run Keys / Startup Folder", tactic: "Persistence" }
      - { id: T1070.004, name: "File Deletion", tactic: "Defense Evasion" }
    conditions:
      - type: rule_match
        min: 3
        ids:
          - VK-BKD-NIGHTCLIENT-H-SYSCALL-GADGET-SCAN
          - VK-BKD-NIGHTCLIENT-H-SYSCALL-STUB-CHECK
          - VK-BKD-NIGHTCLIENT-H-RANDOM-SECTIONS
          - VK-BKD-NIGHTCLIENT-H-MANUAL-MAP
          - VK-BKD-NIGHTCLIENT-H-PERSIST-SELFDELETE
          - VK-BKD-NIGHTCLIENT-H-NAMES
          - VK-BKD-NIGHTCLIENT-H-LOG-TAGS
          - VK-BKD-NIGHTCLIENT-H-CONFIG
          - VK-BKD-NIGHTCLIENT-H-CONFIG-ROUTINE
          - VK-BKD-NIGHTCLIENT-H-OWN-CRYPTO

  # Any program that both scans for a syscall gadget and checks the stubs for
  # hooks evades user-mode monitoring on purpose: other builds and other
  # families with the same syscall code.
  - id: VK-SUSP-INDIRECT-SYSCALL
    title: "Indirect syscalls: gadget scan and syscall stub hook check"
    severity: high
    verdict: suspicious
    confidence: 80
    score: 60
    family: "HEUR:Trojan.Win64.IndirectSyscall"
    tags: [indirect-syscall, edr-evasion]
    references:
      - "sha256 fa1eda0d6c35d1cb226f9217429e05d3e4d2330e75d24e82e25d26089b9f19ce (NightClient, first sample)"
    mitre:
      - { id: T1106, name: "Native API", tactic: "Execution" }
      - { id: T1562.001, name: "Disable or Modify Tools", tactic: "Defense Evasion" }
    conditions:
      - type: rule_match
        ids:
          - VK-BKD-NIGHTCLIENT-H-SYSCALL-GADGET-SCAN
          - VK-BKD-NIGHTCLIENT-H-SYSCALL-STUB-CHECK
