- rule_id: HD-CRED-SAM-HIVE-EXPORT
  name: '[CREDENTIAL] SAM/SECURITY Hive Export'
  description: 'Detects attempts to export SAM or SECURITY registry hives, used for offline credential cracking.'
  enabled: true
  severity: 95
  level: critical
  tags:
    - credentials
    - registry
  mitre_attack:
    - T1003.002
  stages:
    - name: Export Hive
      conditions:
        - type: Api
          functions:
            - NtSaveKey
            - NtSaveKeyEx
    - name: Check Hive Path
      conditions:
        - type: MultiCondition
          op: or
          conditions:
            - type: Process
              op: contains
              pattern: '(?i)SAM'
