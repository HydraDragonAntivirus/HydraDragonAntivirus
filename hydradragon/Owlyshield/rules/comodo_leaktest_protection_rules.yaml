# TEST #25: Impersonation:Coat — Block COM impersonation attacks
- name: "HEUR:Win.Impersonation.COATProcImpersonate.gen"
  author: "HydraDragon"
  date: "2026-03-26"
  status: production
  level: high
  severity: 85
  description: |
    Detects CoCreateInstance/CoGetObject calls followed by privilege impersonation
    (ImpersonateLoggedOnUser). COAT (COM Object Activation Technique) leverages
    COM objects to elevate privileges or execute code in alternate security contexts.
    COMODO Test #25: Impersonation:Coat
    Blocks COM-based privilege impersonation.
  debug: false

  named_conditions:
    cocreateinstance_api:
      orderless: true
      apis:
        - "ole32.dll!CoCreateInstance"
        - "ole32.dll!CoGetObject"
      api_threshold: 1
      min_matches: 1

    impersonate_loggedon_user:
      orderless: true
      apis:
        - "advapi32.dll!ImpersonateLoggedOnUser"
        - "advapi32.dll!SetThreadToken"
        - "advapi32.dll!DuplicateTokenEx"
      api_threshold: 1
      min_matches: 1

  detection_logic:
    and:
      - condition: "cocreateinstance_api"
      - condition: "impersonate_loggedon_user"

  response:
    notify_user: true
    ask_user: true
    terminate_process: true
    record: true

  tags: ["impersonation", "com", "privilege-escalation"]
  mitre_attack: ["T1134", "T1559.001"]

