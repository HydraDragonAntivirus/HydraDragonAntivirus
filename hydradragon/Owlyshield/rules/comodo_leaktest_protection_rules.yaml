# TEST #1: RootkitInstallation:MissingDriverLoad — Prevent abandoned service path hijacking
- name: "HEUR:Win.Rootkit.MissingDriverHijack.gen"
  description: |
    Detects attempts to create a registry service entry pointing to a non-existent
    driver file, followed by a file drop of an unsigned binary into that path.
    COMODO Test #1: RootkitInstallation:MissingDriverLoad
  author: "HydraDragon"
  level: critical
  severity: 100
  named_conditions:
    driver_service_creation:
      registry_keys:
        - HKLM\SYSTEM\CurrentControlSet\Services
        - \REGISTRY\MACHINE\SYSTEM\CurrentControlSet\Services
      registry_values: ["ImagePath"]
      registry_operations: ["reg_set_value", "reg_create_key"]
      min_matches: 1
    unsigned_file_drop:
      file_paths: ["*.sys", "*.exe", "*.dll"]
      file_operations: ["create", "write"]
      is_signed: false
      min_matches: 1
  detection_logic:
    and:
      - condition: "driver_service_creation"
      - condition: "unsigned_file_drop"
  response:
    terminate_process: true
    status_access_denied: true
    record: true

