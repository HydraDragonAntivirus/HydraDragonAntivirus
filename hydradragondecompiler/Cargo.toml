[package]
name = "hydradragondecompiler"
version = "0.1.0"
edition = "2024"
description = "Decompiler-lite string extractor that pulls extra strings out of PE binaries to feed HydraDragon scanning"
license = "GPL-2.0-or-later"

[dependencies]
pefile-rs = { path = "../pefile-rs" }
iced-x86 = "1.21"
yaxpeax-arm = "0.5"
yaxpeax-arch = "0.3"
# Error handling, matching the sibling crates.
thiserror = "2"
# CLI argument parsing.
clap = { version = "4", features = ["derive"] }
# JSON output of extracted strings.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
