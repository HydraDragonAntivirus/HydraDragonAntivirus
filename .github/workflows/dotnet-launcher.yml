name: dotnet-hydradragonlauncher-ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
    - name: Enable long paths
      run: git config --global core.longpaths true

    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore HydraDragonLauncher/HydraDragonLauncher.sln

    - name: Build Launcher
      run: dotnet build HydraDragonLauncher/HydraDragonLauncher.sln --configuration Release --no-restore

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: launcher-release
        path: HydraDragonLauncher/HydraDragonLauncher/bin/Release/
