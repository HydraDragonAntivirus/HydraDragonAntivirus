- name: "HEUR:Win64.PSW.Stealer.BehavesLike.Exela.gen"
  description: "Detects info stealer behavior targeting browser data and credentials"
  debug: true

  # =============================================================================
  # FIXED PATTERNS - Using wildcards that actually work
  # =============================================================================

  named_conditions:
    # FIX #1: Simplified wildcard patterns for browser profile access
    browser_profile_access:
      file_paths:
        - "*google*chrome*user data*"
        - "*opera software*opera stable*"
        - "*opera software*opera gx*"
        - "*bravesoftware*brave-browser*user data*"
        - "*microsoft*edge*user data*"
        - "*mozilla*firefox*profiles*"
      file_operations: ["read", "browse"]
      # Removed min_matches for now - may not be implemented

    # FIX #2: Simplified Discord token paths
    discord_token_access:
      file_paths:
        - "*discord*local storage*"
        - "*discord*leveldb*"
      file_operations: ["read", "browse"]

    # FIX #3: Simplified credential file patterns
    credential_file_access:
      file_paths:
        - "*cookies*"
        - "*login data*"
        - "*web data*"
        - "*local state*"
        - "*key*.db"  # Firefox
      file_operations: ["read"]

    # FIX #4: Simplified crypto wallet patterns
    crypto_wallet_access:
      file_paths:
        - "*electrum*wallets*"
        - "*bitcoin*wallets*"
        - "*ethereum*keystore*"
        - "*metamask*"
        - "*exodus*"
      file_operations: ["read"]

    # FIX #5: Temp staging with wildcards
    temp_staging:
      file_paths:
        - "*\\temp\\*"
        - "*\\tmp\\*"
        - "*\\appdata\\local\\temp\\*"
      file_operations: ["write", "create"]

    # FIX #6: Decryption APIs (keep as-is, these should work)
    decryption_apis:
      apis:
        - "cryptunprotectdata"
        - "bcryptdecrypt"
        - "ncryptdecrypt"
        - "dpapi"
      api_threshold: 1

    # FIX #7: Archive creation - simplified
    archive_creation:
      file_actions:
        - "createzip"
        - "createrar"
      file_extensions:
        - ".zip"
        - ".rar"
        - ".7z"

    # FIX #8: Network exfiltration - keep simple
    network_exfiltration:
      has_network_activity: true

    # FIX #9: Suspicious origin - keep but optional
    suspicious_origin:
      parent_names:
        - "*powershell*"
        - "*cmd*"
        - "*wscript*"
        - "*cscript*"
        - "*mshta*"
        - "*python*"
        - "*node*"

    # FIX #10: Entropy - will work once patch is applied
    obfuscated_binary:
      entropy_threshold: 7.0

    # FIX #11: Browser termination - make optional
    browser_termination:
      terminated_processes:
        - "*edge*"
        - "*chrome*"
        - "*brave*"
        - "*opera*"
        - "*firefox*"

    # FIX #12: Persistence - simplified
    startup_persistence:
      registry_keys:
        - "*\\run\\*"
        - "*\\runonce\\*"
      registry_operations: ["set", "create"]

    # FIX #13: Exfiltration patterns
    exfiltration_pattern:
      file_paths:
        - "*credentials*"
        - "*passwords*"
        - "*tokens*"
        - "*autofill*"
      file_operations: ["read"]

  # =============================================================================
  # RELAXED DETECTION LOGIC - Easier to trigger for testing
  # =============================================================================

  detection_logic:
    # Simplified: Just need data access + suspicious behavior
    and:
      # Group 1: Access to sensitive data (ANY of these)
      - any_of:
          - "browser_profile_access"
          - "discord_token_access"
          - "credential_file_access"
          - "crypto_wallet_access"
          - "exfiltration_pattern"

      # Group 2: Exfiltration indicator (ANY of these)
      - any_of:
          - "temp_staging"
          - "network_exfiltration"
          - "archive_creation"

      # Group 3: At least ONE suspicious indicator (reduced from 2)
      - any_of:
          - "decryption_apis"
          - "suspicious_origin"
          - "obfuscated_binary"
          - "browser_termination"
          - "startup_persistence"

  # =============================================================================
  # RESPONSE, ALLOWLIST, & METADATA
  # =============================================================================

  response:
    terminate_process: true
    quarantine: true
    auto_revert: true

  allowlisted_apps:
    - pattern: "chrome"
      must_be_signed: true
      signers: ["google"]
    - pattern: "msedge"
      must_be_signed: true
      signers: ["microsoft"]
    - pattern: "brave"
      must_be_signed: true
      signers: ["brave software"]
    - pattern: "opera"
      must_be_signed: true
      signers: ["opera"]
    - pattern: "discord"
      must_be_signed: true
      signers: ["discord"]
    - pattern: "code"
      must_be_signed: true
      signers: ["microsoft"]
    - pattern: "devenv"
      must_be_signed: true
      signers: ["microsoft"]

  severity: 95
  level: critical
  status: stable
  author: "Emirhan Ucan"

  mitre_attack:
    - "T1555"  # Credentials from Password Stores
    - "T1539"  # Steal Web Session Cookie
    - "T1552.001"  # Credentials In Files
    - "T1005"  # Data from Local System
    - "T1140"  # Deobfuscate/Decode Files or Information
    - "T1560"  # Archive Collected Data
    - "T1041"  # Exfiltration Over C2 Channel
    - "T1547.001"  # Registry Run Keys / Startup Folder

  tags:
    - "credential_theft"
    - "browser_stealer"
    - "info_stealer"
    - "data_exfiltration"

  false_positives:
    - "Legitimate password managers"
    - "Browser sync utilities"
    - "Backup software"
    - "Development/debugging tools"
