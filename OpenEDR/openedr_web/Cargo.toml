[package]
name = "openedr_web"
version = "0.1.0"
edition = "2021"
description = "Web/WASM edition of the OpenEDR static engine: ML trees, PE string rules, URL scoring. No fs, no Win32, no native disassembler, no Hayabusa."

[lib]
name = "openedr_web"
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.11"
hex = "0.4"
regex = "1.12"
url = "2.5"
yara-x = "1.20"
# Pure-Rust DEFLATE (miniz_oxide backend) for APK ZIP entry inflation.
# wasm32-unknown-unknown compatible: no OS, no threads, no network.
flate2 = "1"

# Direct use of the hydradragonsig rule engine (string rules evaluated by
# ITS code, never reimplemented here). default-features off keeps the CLI
# (clap/colored/env_logger/indicatif) out of the wasm binary.
oxc_parser = "0.135"
oxc_ast = "0.135"
oxc_allocator = "0.135"
oxc_span = "0.135"
hydradragonsig = { path = "../../hydradragonsig", default-features = false }

# Root fix for the `__wbindgen_placeholder__` import in the shipped wasm:
# yara-x -> p256/p384 -> ecdsa -> rand -> getrandom/js pulls wasm-bindgen JS
# shims for randomness nothing in our scan/verify paths ever requests.
# This local stub satisfies the same 0.2 API but always fails closed
# (Error::UNSUPPORTED), so the binary links zero JS imports. Web-only:
# never apply to targets with a real OS RNG.
[patch.crates-io]
getrandom = { path = "stubs/getrandom" }
