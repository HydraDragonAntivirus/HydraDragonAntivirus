  description: Detects recovery inhibition via wevtutil clears logs pre-impact, including ransomware-prep variants beyond
    simple vssadmin execution.
  enabled: true
  should_trust_cloud: false
  severity_score: 96
  severity: 96
  level: critical
  status: experimental
  author: Emirhan Ucan
  date: '2026-05-15'
  tags:
  - category:critical
  - ransomware
  - shadow-copy
  - inhibit-recovery
  - process-tree
  mitre_attack:
  - T1490
  - T1486
  references:
  - https://attack.mitre.org/techniques/T1490/
  - https://www.elastic.co/docs/reference/security/prebuilt-rules/rules/windows/impact_volume_shadow_copy_deletion_or_resized_via_vssadmin
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-075a
  - https://www.microsoft.com/en-us/security/blog/2022/06/13/the-many-lives-of-blackcat-ransomware/
  false_positives:
  - Backup administration, disaster-recovery testing, and OS deployment tooling may perform similar actions during planned
    maintenance.
  stages:
  - name: Recovery sabotage process tree
    conditions:
    - type: ProcessTree
      parent_patterns:
      - '*\cmd.exe'
      - '*\powershell.exe'
      - '*\pwsh.exe'
      - '*\wscript.exe'
      - '*\services.exe'
      - '*\explorer.exe'
      child_patterns:
      - '*\wevtutil.exe'
      command_line_patterns:
      - pattern: (?i)(cl|clear-log)\s+(system|security|application|powershell)
        is_regex: true
  min_stages_satisfied: 1
  response:
    terminate_process: true
    quarantine: false
    status_access_denied: true
    notify_user: true
    record: true
