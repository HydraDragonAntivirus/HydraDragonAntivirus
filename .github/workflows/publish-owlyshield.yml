name: Publish Owlyshield

on:
  push:
    branches: ["**"]
    paths:
      - 'Owlyshield/**'
      - '.github/workflows/publish-owlyshield.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # Detect which Owlyshield components changed
  detect-changes:
    runs-on: windows-2022
    outputs:
      minifilter: ${{ steps.set-outputs.outputs.minifilter }}
      rust: ${{ steps.set-outputs.outputs.rust }}
      reddbg: ${{ steps.set-outputs.outputs.reddbg }}
      workflow_changed: ${{ steps.set-outputs.outputs.workflow_changed }}
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            minifilter:
              - 'Owlyshield/owlyshield_minifilter/**'
            rust:
              - 'Owlyshield/owlyshield_predict/**'
            reddbg:
              - 'Owlyshield/RedDbg/**'
            workflow:
              - '.github/workflows/publish-owlyshield.yml'
      - name: Set outputs (build all if workflow changed)
        id: set-outputs
        shell: pwsh
        run: |
          $workflowChanged = "${{ steps.filter.outputs.workflow }}"
          
          if ($workflowChanged -eq "true") {
            Write-Host "Workflow file changed - building all components"
            echo "minifilter=true" >> $env:GITHUB_OUTPUT
            echo "rust=true" >> $env:GITHUB_OUTPUT
            echo "reddbg=true" >> $env:GITHUB_OUTPUT
            echo "workflow_changed=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Using selective build based on changed files"
            echo "minifilter=${{ steps.filter.outputs.minifilter }}" >> $env:GITHUB_OUTPUT
            echo "rust=${{ steps.filter.outputs.rust }}" >> $env:GITHUB_OUTPUT
            echo "reddbg=${{ steps.filter.outputs.reddbg }}" >> $env:GITHUB_OUTPUT
            echo "workflow_changed=false" >> $env:GITHUB_OUTPUT
          }

  # Build Minifilter Driver (only if changed or workflow changed)
  build-minifilter:
    needs: detect-changes
    if: needs.detect-changes.outputs.minifilter == 'true'
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
      - name: Setup WDK
        shell: pwsh
        run: |
          $wdkSetupPath = "$Env:TEMP\wdksetup.exe"
          (New-Object Net.WebClient).DownloadFile('https://go.microsoft.com/fwlink/?linkid=2335869', $wdkSetupPath)
          Start-Process -FilePath $wdkSetupPath -ArgumentList "/quiet" -NoNewWindow -Wait
      - name: Build Minifilter
        run: msbuild Owlyshield/owlyshield_minifilter/RWatch.sln /p:Configuration=Release /p:Platform=x64
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: owlyshield-minifilter
          path: |
            Owlyshield/owlyshield_minifilter/x64/Release/*.sys
            Owlyshield/owlyshield_minifilter/x64/Release/*.inf
            Owlyshield/owlyshield_minifilter/x64/Release/*.cat

  # Build Rust Service (only if changed)
  build-rust:
    needs: detect-changes
    if: needs.detect-changes.outputs.rust == 'true'
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install nasm
        run: choco install nasm
      - name: Build Rust Core
        working-directory: Owlyshield/owlyshield_predict
        run: cargo build --release
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: owlyshield-rust
          path: Owlyshield/owlyshield_predict/target/release/owlyshield_ransom.exe

  # Build RedDbg Driver (only if changed)
  build-reddbg:
    needs: detect-changes
    if: needs.detect-changes.outputs.reddbg == 'true'
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build RedDbg
        run: msbuild Owlyshield/RedDbg/RedDbg/RedDbg.sln /p:Configuration=Release /p:Platform=x64
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: owlyshield-reddbg
          path: |
            Owlyshield/RedDbg/RedDbg/x64/ReleaseX64Kernel/*.sys
            Owlyshield/RedDbg/RedDbg/x64/ReleaseX64Kernel/*.inf
            Owlyshield/RedDbg/RedDbg/x64/ReleaseX64Kernel/*.cat

  # Stage and create PR (only with changed components)
  stage-and-pr:
    needs: 
      - detect-changes
      - build-minifilter
      - build-rust
      - build-reddbg
    if: always() && (needs.build-minifilter.result == 'success' || needs.build-rust.result == 'success' || needs.build-reddbg.result == 'success' || needs.build-minifilter.result == 'skipped' || needs.build-rust.result == 'skipped' || needs.build-reddbg.result == 'skipped')
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
        continue-on-error: true
      
      - name: Stage (Conditional)
        shell: pwsh
        run: |
          $distRoot = "hydradragon"
          $componentsBuilt = @()
          
          # Minifilter
          if (Test-Path "artifacts/owlyshield-minifilter") {
            Write-Host "✓ Processing Minifilter"
            $owlyRansom = "$distRoot/Owlyshield/OwlyshieldRansomFilter"
            New-Item -ItemType Directory -Force -Path $owlyRansom | Out-Null
            Copy-Item "artifacts/owlyshield-minifilter/*" "$owlyRansom/" -Force
            $componentsBuilt += "Minifilter Driver"
          } else {
            Write-Host "⊘ Skipping Minifilter (not built)"
          }
          
          # Rust Service
          if (Test-Path "artifacts/owlyshield-rust") {
            Write-Host "✓ Processing Rust Service"
            $owlyService = "$distRoot/Owlyshield/Owlyshield Service"
            New-Item -ItemType Directory -Force -Path $owlyService | Out-Null
            Copy-Item "artifacts/owlyshield-rust/owlyshield_ransom.exe" "$owlyService/" -Force
            $componentsBuilt += "Rust Service (owlyshield_ransom.exe)"
          } else {
            Write-Host "⊘ Skipping Rust Service (not built)"
          }
          
          # RedDbg
          if (Test-Path "artifacts/owlyshield-reddbg") {
            Write-Host "✓ Processing RedDbg"
            $redDbg = "$distRoot/Owlyshield/RedDbg"
            New-Item -ItemType Directory -Force -Path $redDbg | Out-Null
            Copy-Item "artifacts/owlyshield-reddbg/*" "$redDbg/" -Force
            $componentsBuilt += "RedDbg Driver"
          } else {
            Write-Host "⊘ Skipping RedDbg (not built)"
          }
          
          Write-Host "`n=== Components Built: $($componentsBuilt.Count) ==="
          $componentsBuilt | ForEach-Object { Write-Host "  - $_" }
      
      - name: Check for Changes
        id: check_changes
        shell: pwsh
        run: |
          git add -A
          $status = git status --porcelain
          if ($null -eq $status -or $status -eq "") {
            echo "changed=false" >> $env:GITHUB_OUTPUT
          } else {
            echo "changed=true" >> $env:GITHUB_OUTPUT
          }
      
      - name: Create PR
        if: steps.check_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(owlyshield): update binaries (selective build)"
          title: "🚀 Update Owlyshield Binaries"
          body: |
            Automated selective build for Owlyshield components.
            
            **Components Updated:**
            - Minifilter: ${{ needs.detect-changes.outputs.minifilter }}
            - Rust Service: ${{ needs.detect-changes.outputs.rust }}
            - RedDbg: ${{ needs.detect-changes.outputs.reddbg }}
            
            Only changed components were rebuilt.
          branch: "auto-update-owlyshield"
          base: ${{ github.ref_name }}
          delete-branch: true
          labels: binaries, automated-pr, selective-build
