[env]
CARGO_MAKE_EXTEND_WORKSPACE_MAKEFILE = true

[tasks.release]
description = "Build release version"
command = "cargo"
args = ["build", "--release"]

[tasks.build-client]
description = "Build the usermode client for Sanctum."
command = "cargo"
args = ["build", "-p", "um_engine"]

[tasks.build-client-release]
description = "Build the usermode client for Sanctum."
command = "cargo"
args = ["build", "--release", "-p", "um_engine"]

[tasks.stage-driver-makefile]
description = "Create a copy of rust-driver-makefile.toml from the wdk-build crate into driver/target/."
workspace = false
script_runner = "powershell"
script_runner_args = ["-NoProfile", "-ExecutionPolicy", "Bypass", "-File"]
script_extension = "ps1"
cwd = "driver"
script = '''
$ErrorActionPreference = "Stop"
$crate = (cargo metadata --format-version 1 | ConvertFrom-Json).packages |
    Where-Object { $_.name -eq "wdk-build" } |
    Select-Object -First 1 -ExpandProperty manifest_path
if (-not $crate) { throw "wdk-build crate not found in cargo metadata" }
$source = Join-Path (Split-Path $crate) "rust-driver-makefile.toml"
if (-not (Test-Path $source)) { throw "rust-driver-makefile.toml not found at $source" }
New-Item -ItemType Directory -Force -Path "target" | Out-Null
$dest = "target\rust-driver-makefile.toml"
if (Test-Path $dest) { Remove-Item $dest -Force }
Copy-Item -Path $source -Destination $dest -Force
Write-Host "staged driver/target/rust-driver-makefile.toml from $source"
'''

[tasks.build-driver]
description = "Build and package the Sanctum kernel driver."
workspace = false
cwd = "driver"
dependencies = ["stage-driver-makefile"]
env = { CARGO_MAKE_EXTEND_WORKSPACE_MAKEFILE = false, CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY = "${CARGO_MAKE_WORKING_DIRECTORY}/driver" }
command = "cargo"
args = ["make", "default"]

[tasks.build-driver-release]
description = "Build and package the Sanctum kernel driver in release mode."
workspace = false
cwd = "driver"
dependencies = ["stage-driver-makefile"]
env = { CARGO_MAKE_EXTEND_WORKSPACE_MAKEFILE = false, CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY = "${CARGO_MAKE_WORKING_DIRECTORY}/driver" }
command = "cargo"
args = ["make", "release"]

[tasks.clean-client]
description = "Clean the usermode client for Sanctum."
command = "cargo"
args = ["clean", "-p", "um_engine"]
