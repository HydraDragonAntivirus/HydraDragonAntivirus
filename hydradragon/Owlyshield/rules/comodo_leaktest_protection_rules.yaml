    service_reconfigure_api:
      orderless: true
      apis:
        - "*ChangeServiceConfig*"
        - "*ChangeServiceConfig2*"
        - "*OpenSCManager*"
        - "*OpenService*"
        - "*CreateService*"
        - "*RegCreateKey*"
        - "*RegCreateKeyEx*"
        - "*RegSetValue*"
        - "*RegSetValueEx*"
        - "*RegSetKeyValue*"
        - "*NtCreateKey*"
        - "*ZwCreateKey*"
        - "*NtSetValueKey*"
        - "*ZwSetValueKey*"
      api_threshold: 1
      min_matches: 1

    suspicious_service_dll_payload:
