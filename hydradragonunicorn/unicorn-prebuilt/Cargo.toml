[package]
name = "unicorn-engine"
version = "2.1.5"
edition = "2024"
license = "GPL-2.0"
description = "Prebuilt dynamic FFI bindings to HydraDragon's shipped unicorn.dll (no CMake/Ninja/bindgen C build)"

[features]
default = ["arch_all"]
dynamic_linkage = []
arch_all = [
	"arch_x86",
	"arch_arm",
	"arch_aarch64",
	"arch_riscv",
	"arch_mips",
	"arch_sparc",
	"arch_m68k",
	"arch_ppc",
	"arch_s390x",
	"arch_tricore",
]
arch_x86 = []
arch_arm = []
arch_aarch64 = ["arch_arm"]
arch_riscv = []
arch_mips = []
arch_sparc = []
arch_m68k = []
arch_ppc = []
arch_s390x = []
arch_tricore = []
