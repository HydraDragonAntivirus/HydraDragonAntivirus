<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
	<script src="nav.js"></script>

	<script>
		document.addEventListener("DOMContentLoaded", function() {
	
			const { invoke } = window.__TAURI__.core;
			const { listen } = window.__TAURI__.event;

			const common_scan_dir_box = document.getElementById('common_scan_dirs');
				const extensionSourceMode = document.getElementById('extension_source_mode');
				const minimalScanTimeout = document.getElementById('minimal_scan_timeout_ms');
				const deepScanTimeout = document.getElementById('deep_scan_timeout_ms');
				const lateChildScanGrace = document.getElementById('late_child_scan_grace_ms');
				const settingsStatus = document.getElementById('settings_status');
				// Suricata
				const suricataEnabled = document.getElementById('suricata_enabled');
				const suricataExePath = document.getElementById('suricata_exe_path');
				const suricataConfigPath = document.getElementById('suricata_config_path');
				const suricataLogDir = document.getElementById('suricata_log_dir');
				// Hayabusa
				const hayabusaEnabled = document.getElementById('hayabusa_enabled');
				const hayabusaExePath = document.getElementById('hayabusa_exe_path');
				const hayabusaScanInterval = document.getElementById('hayabusa_scan_interval_secs');
				const hayabusaMinLevel = document.getElementById('hayabusa_min_level');
				const hayabusaTimeOffset = document.getElementById('hayabusa_time_offset');
				const defaults = {
					extension_source_mode: 'feedback',
					minimal_scan_timeout_ms: 30000,
					deep_scan_timeout_ms: 180000,
					late_child_scan_grace_ms: 30000,
					suricata_enabled: true,
					suricata_exe_path: '',
					suricata_config_path: '',
					suricata_log_dir: '',
					hayabusa_enabled: true,
					hayabusa_exe_path: '',
					hayabusa_scan_interval_secs: 30,
					hayabusa_min_level: 'critical',
					hayabusa_time_offset: '60s'
				};

			//
			// Page initialisation
			//
			invoke('settings_load_page_state')
			.then((res) => {
				console.log("res: ", res);
				const jsonObject = JSON.parse(res);
				const common_scan_areas = 'common_scan_areas';

				if (Array.isArray(jsonObject[common_scan_areas])) {
					common_scan_dir_box.value = jsonObject[common_scan_areas].join('\n');
				} else {
					console.log(`Key "${common_scan_areas}" is not an array or does not exist.`);
				}

				extensionSourceMode.value = jsonObject.extension_source_mode || defaults.extension_source_mode;
					minimalScanTimeout.value = jsonObject.minimal_scan_timeout_ms || defaults.minimal_scan_timeout_ms;
					deepScanTimeout.value = jsonObject.deep_scan_timeout_ms || defaults.deep_scan_timeout_ms;
					lateChildScanGrace.value = jsonObject.late_child_scan_grace_ms || defaults.late_child_scan_grace_ms;
					// Suricata
					suricataEnabled.checked = jsonObject.suricata_enabled !== undefined ? jsonObject.suricata_enabled : defaults.suricata_enabled;
					suricataExePath.value = jsonObject.suricata_exe_path || defaults.suricata_exe_path;
					suricataConfigPath.value = jsonObject.suricata_config_path || defaults.suricata_config_path;
					suricataLogDir.value = jsonObject.suricata_log_dir || defaults.suricata_log_dir;
					// Hayabusa
					hayabusaEnabled.checked = jsonObject.hayabusa_enabled !== undefined ? jsonObject.hayabusa_enabled : defaults.hayabusa_enabled;
					hayabusaExePath.value = jsonObject.hayabusa_exe_path || defaults.hayabusa_exe_path;
					hayabusaScanInterval.value = jsonObject.hayabusa_scan_interval_secs || defaults.hayabusa_scan_interval_secs;
					hayabusaMinLevel.value = jsonObject.hayabusa_min_level || defaults.hayabusa_min_level;
					hayabusaTimeOffset.value = jsonObject.hayabusa_time_offset || defaults.hayabusa_time_offset;
			})
			.catch((error) => console.error("Invoke error:", error));


			//
			// Events
			//

			var update_app_settings = function(event) {
				event.preventDefault();

				const common_scan_dir_box_val = common_scan_dir_box.value;
				const lines = common_scan_dir_box_val.split('\n').map(line => line.trim()).filter(line => line.length > 0);
				const positiveInt = (field, fallback) => {
					const value = parseInt(field.value, 10);
					return Number.isFinite(value) && value > 0 ? value : fallback;
				};
				const settings = {
						common_scan_areas: lines,
						extension_source_mode: extensionSourceMode.value || defaults.extension_source_mode,
						minimal_scan_timeout_ms: positiveInt(minimalScanTimeout, defaults.minimal_scan_timeout_ms),
						deep_scan_timeout_ms: positiveInt(deepScanTimeout, defaults.deep_scan_timeout_ms),
						late_child_scan_grace_ms: positiveInt(lateChildScanGrace, defaults.late_child_scan_grace_ms),
						suricata_enabled: suricataEnabled.checked,
						suricata_exe_path: suricataExePath.value.trim(),
						suricata_config_path: suricataConfigPath.value.trim(),
						suricata_log_dir: suricataLogDir.value.trim(),
						hayabusa_enabled: hayabusaEnabled.checked,
						hayabusa_exe_path: hayabusaExePath.value.trim(),
						hayabusa_scan_interval_secs: positiveInt(hayabusaScanInterval, defaults.hayabusa_scan_interval_secs),
						hayabusa_min_level: hayabusaMinLevel.value || defaults.hayabusa_min_level,
						hayabusa_time_offset: hayabusaTimeOffset.value.trim() || defaults.hayabusa_time_offset
					};

				invoke('settings_update_settings', { settings: JSON.stringify(settings) })
				.then((response) => {
					console.log("response: ", response)
					settingsStatus.textContent = "Settings updated.";
				})
				.catch((error) => {
					settingsStatus.textContent = "Settings update failed.";
					console.error("Invoke error:", error);
				});
			};

			var update_app_settings_form = document.getElementById("app_settings_callout");
			update_app_settings_form.addEventListener('submit', update_app_settings, false);


		});
	</script>

  </head>
  <body>
    <header id="header"><p>Sanctum Home EDR</p></header>

	<div id="container">

		<main id="center" class="column">
			<article>
				<h1>Settings</h1>
				<p>The settings page.</p>
				<div id="app_settings_callout" class="full_callout">
					<b>Application settings</b>
					<p>Enter on new lines folders to scan which are included in the common scan. The defaults are provided for you and are recommended.</p>
					<form action="#" id="app_settings_form">
						<textarea id="common_scan_dirs" rows="10" cols="70" placeholder="Type something and press Enter..."></textarea>
						<label for="extension_source_mode">Extension source mode</label>
						<select id="extension_source_mode">
							<option value="feedback">Feedback mode</option>
							<option value="extensions_txt_only">extensions.txt only</option>
							<option value="extensions_rs_only">extensions.rs only</option>
						</select>
						<label for="minimal_scan_timeout_ms">Minimal scan timeout (ms)</label>
							<input id="minimal_scan_timeout_ms" type="number" min="1000" step="1000">
							<label for="deep_scan_timeout_ms">Deep scan timeout (ms)</label>
							<input id="deep_scan_timeout_ms" type="number" min="1000" step="1000">
							<label for="late_child_scan_grace_ms">Late child scan grace (ms)</label>
							<input id="late_child_scan_grace_ms" type="number" min="1000" step="1000">
	
							<hr>
							<b>Suricata NIDS</b>
							<label for="suricata_enabled">
								<input id="suricata_enabled" type="checkbox"> Enable Suricata monitoring
							</label>
							<label for="suricata_exe_path">Suricata executable path (leave blank for default)</label>
							<input id="suricata_exe_path" type="text" placeholder="C:\Program Files\Suricata\suricata.exe">
							<label for="suricata_config_path">Suricata config path (leave blank for default)</label>
							<input id="suricata_config_path" type="text" placeholder="...\hipsconfig\suricata.yaml">
							<label for="suricata_log_dir">Suricata log directory (leave blank for default)</label>
							<input id="suricata_log_dir" type="text" placeholder="C:\Program Files\Suricata\log">
	
							<hr>
							<b>Hayabusa Event Log Scanner</b>
							<label for="hayabusa_enabled">
								<input id="hayabusa_enabled" type="checkbox"> Enable Hayabusa scanning
							</label>
							<label for="hayabusa_exe_path">Hayabusa executable path (leave blank for auto-detect)</label>
							<input id="hayabusa_exe_path" type="text" placeholder="...\hayabusa\hayabusa-x.x.x-win-x64.exe">
							<label for="hayabusa_scan_interval_secs">Scan interval (seconds)</label>
							<input id="hayabusa_scan_interval_secs" type="number" min="10" step="5" value="30">
							<label for="hayabusa_min_level">Minimum alert level</label>
							<select id="hayabusa_min_level">
								<option value="critical">critical</option>
								<option value="high">high</option>
								<option value="medium">medium</option>
								<option value="low">low</option>
							</select>
							<label for="hayabusa_time_offset">Time offset (e.g. 60s, 5m)</label>
							<input id="hayabusa_time_offset" type="text" placeholder="60s" value="60s">
	
							<button type="submit" id="app_settings_submit">Update</button>
							<p id="settings_status" class="settings_status"></p>
					</form>
				</div>

			</article>								
		</main>

		<div id="nav-placeholder"></div>

		<!-- <div id="right" class="column">
            <p> </p>
		</div> -->

	</div>

	<!-- <div id="footer-wrapper">
		<footer id="footer"><p><a href="https://fluxsec.red">Learn more about Sanctum Home EDR...</a></p></footer>
	</div> -->
  </body>
</html>
