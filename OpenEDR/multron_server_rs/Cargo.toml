[package]
name = "multron_server_rs"
version = "0.1.0"
edition = "2024"
authors = ["Emirhan Ucan"]
description = "Native Rust scan server for Multron Win Cleaner with embedded dashboard and direct OpenEDR static engine integration"

[[bin]]
name = "multron_server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
tower-http = { version = "0.5", features = ["cors"] }

openedr_static = { path = "../openedr_static" }
lzma-rust2 = "0.21"
