  logic: all
  conditions:
  - type: native_signature
    expression: PE64
  - type: pe_section
    select: last
    flags_all:
    - write
    - execute
    has_entry: false
    entropy_min: 7.6
    raw_size_min: 262144
    directories_none:
    - export
