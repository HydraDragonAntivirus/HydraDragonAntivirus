# TEST #5: Invasion:Runner — Browser tamper followed by network use
- name: "HEUR:Win.Invasion.Runner.gen"
  author: "HydraDragon"
  date: "2026-04-01"
  status: production
  level: critical
  severity: 100
  description: |
    Detects tampering with a browser executable followed by network use from
    the same unsigned process context.
    COMODO Test #5: Invasion:Runner
    Best-effort alignment for browser-on-disk tamper plus Internet use.
  debug: false

  named_conditions:
    browser_binary_tamper:
      orderless: true
      file_paths:
        - "*\\Internet Explorer\\iexplore.exe"
        - "*\\Microsoft\\Edge\\Application\\msedge.exe"
        - "*\\Google\\Chrome\\Application\\chrome.exe"
        - "*\\Mozilla Firefox\\firefox.exe"
      file_operations: ["write", "rename", "delete", "setinfo"]
