name: hydradragonav

on:
  push:
    branches: ["**"]
    paths:
      - 'hydradragonav/**'
      - '.github/workflows/hydradragonav.yml'
  pull_request:
    branches: ["**"]
    paths:
      - 'hydradragonav/**'
      - '.github/workflows/hydradragonav.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: windows-2022
    steps:
      - name: Enable long paths
        run: git config --global core.longpaths true
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: cargo check
        run: cargo check --manifest-path hydradragonav/Cargo.toml

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/development-version' && !startsWith(github.ref_name, 'auto-update-')
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build Release
        run: cargo build --release --manifest-path hydradragonav/Cargo.toml
      - name: Stage
        shell: pwsh
        run: |
          $dist = "hydradragon/hydradragonav"
          New-Item -ItemType Directory -Force -Path $dist
          Copy-Item "hydradragonav/target/release/hydradragonav.exe" "$dist/" -Force
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: hydradragonav-publish-binaries
          path: hydradragon/hydradragonav/
          if-no-files-found: error
      - name: Check for publishable changes
        id: check_changes
        uses: ./.github/actions/check-publishable-changes
        with:
          paths: hydradragon/hydradragonav
      - name: Create PR
        if: steps.check_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(av): update binaries"
          title: "Update hydradragonav Binaries"
          add-paths: ${{ steps.check_changes.outputs.publishable_files }}
          branch: "auto-update-av"
          base: ${{ github.ref_name }}
          delete-branch: true
          labels: binaries, automated-pr, hydradragonav, development-version
