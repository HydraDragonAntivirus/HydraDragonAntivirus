- name: "HEUR:Win.AntiAnalysis.AnalysisToolTermination.gen"
  author: "Emirhan Ucan"
  date: "2026-03-25"
  status: test
  level: critical
  severity: 96
  description: |
    Detects attempts to terminate analysis and debugger processes listed in
    signatures.yaml. This is a strong anti-analysis signal and usually indicates
    malware actively trying to blind local investigation tooling.
  debug: false

  named_conditions:
    terminate_analysis_tools:
      orderless: true
      terminated_processes:
        - "x64dbg.exe"
        - "x32dbg.exe"
        - "ollydbg.exe"
        - "ida64.exe"
        - "ida.exe"
        - "windbg.exe"
        - "dnspy.exe"
        - "ilspy.exe"
        - "ghidra.exe"
        - "pestudio.exe"
        - "wireshark.exe"
        - "fiddler.exe"
        - "httpdebuggerui.exe"
        - "HTTP Toolkit.exe"
        - "procmon.exe"
        - "procmon64.exe"
        - "processhacker.exe"
        - "megadumper.exe"
        - "extremedumper.exe"
        - "ksdumper.exe"
        - "ksdumperclient.exe"
        - "joeboxcontrol.exe"
        - "joeboxserver.exe"
        - "petools.exe"
        - "hxd.exe"
        - "protection_id.exe"
        - "scyllahide.exe"
        - "de4dot.exe"
      min_matches: 1

  detection_logic:
    condition: "terminate_analysis_tools"

  response:
    notify_user: true
    terminate_process: true
    quarantine: true
    record: true

  tags: ["anti-analysis", "anti-debug", "analysis-tool-kill", "signature-artifacts"]
  mitre_attack: ["T1497", "T1562.001"]
  false_positives:
    - "Security test harnesses that intentionally close analysis tools"
