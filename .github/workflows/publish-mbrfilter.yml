name: Publish MBRFilter

on:
  push:
    branches: ["**"]
    paths:
      - 'MBRFilter/**'
permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-stage:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
      - name: Setup WDK
        shell: pwsh
        run: |
          $wdkSetupPath = "$Env:TEMP\wdksetup.exe"
          (New-Object Net.WebClient).DownloadFile('https://go.microsoft.com/fwlink/?linkid=2335869', $wdkSetupPath)
          Start-Process -FilePath $wdkSetupPath -ArgumentList "/quiet" -NoNewWindow -Wait
      - name: Build
        run: msbuild "MBRFilter/MBRFilter Driver.sln" /p:Configuration=Release /p:Platform=x64
      
      - name: Stage
        shell: pwsh
        run: |
          $dist = "hydradragon/MBRFilter"
          New-Item -ItemType Directory -Force -Path $dist
          Copy-Item "MBRFilter/x64/Release/MBRFilter.sys" "$dist/" -Force
          
      - name: Create PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(mbrfilter): update binaries"
          title: "🚀 Update MBRFilter Binaries"
          branch: "auto-update-mbrfilter"
          base: ${{ github.ref_name }}
          delete-branch: true
