name: Owlyshield Rust Windows

on:
  push:
    branches: [ "**" ]
    paths:
      - 'Owlyshield/owlyshield_predict/**'
      - 'Owlyshield/tools/**'
      - '.github/workflows/owlyshield-rust-windows.yml'
  pull_request:
    branches: [ "**" ]
    paths:
      - 'Owlyshield/owlyshield_predict/**'
      - 'Owlyshield/tools/**'
      - '.github/workflows/owlyshield-rust-windows.yml'
  workflow_dispatch:
    inputs:
      update_lockfile:
        description: "Update Owlyshield lockfile and open PR"
        required: false
        default: false
        type: boolean
    
env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.update_lockfile != 'true' }}

    runs-on: windows-latest
    defaults:
      run:
        working-directory: Owlyshield/owlyshield_predict

    steps:
    - name: Enable Git long paths
      run: git config --global core.longpaths true
      working-directory: .

    - uses: actions/checkout@v6
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Cache Cargo
      uses: Swatinem/rust-cache@v2
    - name: Cargo check
      run: cargo check
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

  update-lockfile:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.update_lockfile == 'true' }}
    runs-on: windows-latest
    permissions:
      contents: write
      actions: write
    defaults:
      run:
        working-directory: .
    steps:
    - name: Enable Git long paths
      run: git config --global core.longpaths true

    - uses: actions/checkout@v6
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Cache Cargo
      uses: Swatinem/rust-cache@v2
    - name: Update Owlyshield lockfile
      shell: pwsh
      run: cargo update --manifest-path Owlyshield/owlyshield_predict/Cargo.toml
    - name: Commit and push lockfile update
      id: commit_lockfile
      shell: pwsh
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add Owlyshield/owlyshield_predict/Cargo.lock
        if (git diff --cached --quiet) {
          Write-Host "No lockfile changes to commit."
          echo "changed=false" >> $env:GITHUB_OUTPUT
          exit 0
        }
        git commit -m "chore(deps): update owlyshield rust lockfile"
        git push origin "HEAD:${{ github.ref_name }}"
        echo "changed=true" >> $env:GITHUB_OUTPUT

    - name: Trigger follow-up Owlyshield workflows
      if: steps.commit_lockfile.outputs.changed == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh workflow run owlyshield-rust-windows.yml --ref "${{ github.ref_name }}"
        gh workflow run owlyshield-rust-linux.yml --ref "${{ github.ref_name }}"
        gh workflow run publish-owlyshield.yml --ref "${{ github.ref_name }}"
