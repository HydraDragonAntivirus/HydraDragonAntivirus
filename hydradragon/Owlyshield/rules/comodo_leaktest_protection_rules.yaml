      - condition: "browser_binary_tamper"
      - condition: "network_use"
      - condition: "unsigned_caller"

  response:
    notify_user: true
    ask_user: true
    terminate_process: true
    status_access_denied: true
    record: true

  tags:
    - invasion
    - runner
    - browser-tamper
    - firewall-bypass

