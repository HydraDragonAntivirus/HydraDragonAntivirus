[package]
name = "hydradragonfirewall"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }
embed-resource = "3.0.9"

[dependencies]
hydradragon-shared = { path = "../hydradragon-shared" }
tauri = { version = "2.11.1", features = ["tray-icon"] }
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
bs58 = "0.5"
base64 = "0.22"
hex = "0.4"
regex = "1.12"
lazy_static = "1.4"
glob = "0.3"
crossbeam-channel = "0.5"
http-mitm-proxy = { path = "../http-mitm-proxy" }
http-body-util = "0.1"
bytes = "1"
rcgen = "0.14.8"
moka = { version = "0.12", features = ["sync"] }
tokio = { version = "1", features = ["full"] }
url = "2.5.8"
sha2 = "0.11"
shared_no_std = { path = "../../Sanctum/shared_no_std" }
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
windivert = { path = "../windivert-rust-master/windivert", features = ["vendored"] }
winreg = "0.56.0"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug",
    "Win32_Security",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_System_ProcessStatus",
    "Win32_System_IO",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security_Cryptography",
] }

