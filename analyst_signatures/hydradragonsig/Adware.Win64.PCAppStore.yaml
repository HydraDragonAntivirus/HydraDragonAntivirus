rules:
- id: VK-ADW-PCAPPSTORE
  title: PC App Store client, service and watchdog
  description: PE components of PC App Store (Fast Corporation Ltd); shared-memory/mutex names, watchdog keeping the app in autostart, telemetry beacon
  severity: medium
  verdict: pua
  confidence: 90
  score: 60
  family: Adware.Win64.PCAppStore
  tags:
  - analyst
  - adware
  - appstore
  logic: all
  conditions:
  - type: file_type
    values:
    - pe
  - type: string_set
    min: 2
    nocase: true
    values:
    - Global\PcAppSharedMemory
    - Local\PCAppStoreWatchdog
    - PcAppStoreUpdater
    - pcappstore.com
    - PcAppStoreSRV
    - \PCAppStore.pdb
