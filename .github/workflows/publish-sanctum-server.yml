name: Publish Sanctum Server

on:
  push:
    branches: ["**"]
    paths:
      - 'Sanctum/server/**'
      - 'Sanctum/Cargo.toml'
      - 'Sanctum/Cargo.lock'
      - '.github/workflows/publish-sanctum-server.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-stage:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
      - name: Update Cargo.lock
        working-directory: Sanctum
        run: cargo update
      - name: Build server
        working-directory: Sanctum
        run: cargo build --release -p server
      - name: Stage
        shell: pwsh
        run: |
          $dist = "hydradragon/Sanctum"
          New-Item -ItemType Directory -Force -Path $dist
          Copy-Item "Sanctum/target/release/server.exe" "$dist/" -Force
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: sanctum-server
          path: hydradragon/Sanctum/server.exe
          if-no-files-found: error
      - name: Create PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(sanctum): update server binary"
          title: "Update Sanctum Server Binary"
          add-paths: |
            hydradragon/Sanctum/server.exe
            Sanctum/Cargo.lock
          branch: "auto-update-sanctum-server"
          base: ${{ github.ref_name }}
          delete-branch: true
          labels: binaries, automated-pr, sanctum, server
