name: Publish HydraDragonLauncher

on:
  push:
    branches: ["**"]
    paths:
      - 'HydraDragonLauncher/**'
      - '!HydraDragonLauncher/README.md'
      - '.github/workflows/publish-hydradragonlauncher.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-stage:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      
      - uses: actions/checkout@v6
      
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Build Launcher
        working-directory: HydraDragonLauncher
        run: cargo build --release
      
      - name: Stage
        shell: pwsh
        run: |
          $distLauncher = "hydradragon/HydraDragonLauncher"

          # Sync the whole folder first
          if (Test-Path $distLauncher) { Remove-Item $distLauncher -Recurse -Force }
          New-Item -ItemType Directory -Path $distLauncher -Force | Out-Null
          Copy-Item -Path "HydraDragonLauncher/target/release/hydradragonlauncher.exe" -Destination $distLauncher -Force
          
          # Also copy to source tree
          New-Item -ItemType Directory -Force -Path "HydraDragonLauncher/target/release"
          Copy-Item -Path "HydraDragonLauncher/target/release/hydradragonlauncher.exe" -Destination "HydraDragonLauncher/target/release/" -Force
          
      - name: Check for publishable changes
        id: check_changes
        uses: ./.github/actions/check-publishable-changes
        with:
          paths: |
            hydradragon/HydraDragonLauncher
            HydraDragonLauncher/target/release
      
      - name: Create PR
        if: steps.check_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(launcher): update binaries"
          title: "Update HydraDragonLauncher Binaries"
          add-paths: |
            ${{ steps.check_changes.outputs.publishable_files }}
          branch: "auto-update-launcher"
          base: ${{ github.ref_name }}
          delete-branch: true
          labels: binaries, automated-pr, launcher
