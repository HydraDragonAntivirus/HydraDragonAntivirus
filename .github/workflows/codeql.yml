name: "CodeQL Advanced"

on:
  push:
    branches: [ "development-version" ]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.gif'
      - '**/*.ico'
      - '**/*.svg'
      - '**/*.exe'
      - '**/*.dll'
      - '**/*.bin'
      - '**/*.yar'
      - '**/*.yara'
      - '**/docs/**'
      - 'OpenMalwareScannerPortable/**'
      - 'inspired_rules/**'
      - 'hayabusa/rules/**'
  pull_request:
    branches: [ "development-version" ]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.gif'
      - '**/*.ico'
      - '**/*.svg'
      - '**/*.exe'
      - '**/*.dll'
      - '**/*.bin'
      - '**/*.yar'
      - '**/*.yara'
      - '**/docs/**'
      - 'OpenMalwareScannerPortable/**'
      - 'inspired_rules/**'
      - 'hayabusa/rules/**'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Find changed files
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      any: ${{ steps.detect.outputs.any }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        sparse-checkout: |
          /*
          !**/doc/html/**
          !**/doc/pdf/**
        sparse-checkout-cone-mode: false

    - name: Detect changed source files
      id: detect
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        BEFORE: ${{ github.event.before }}
        BASE: ${{ github.event.pull_request.base.sha }}
        HEAD: ${{ github.sha }}
      run: |
        if [ "$EVENT" = "pull_request" ]; then
          range="$BASE...$HEAD"
        elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
          range="$BEFORE..$HEAD"
        else
          range="$HEAD~1..$HEAD"
        fi
        git diff --name-only --diff-filter=ACMR "$range" \
          | grep -v -E '^(hayabusa|hydradragonunicorn|unicorn-engine-sys|OpenMalwareScannerPortable|inspired_rules)/' > changed.txt || true
        python3 - <<'EOF'
        import json, os
        languages = {
            "actions": lambda f: f.startswith(".github/workflows/") and f.endswith((".yml", ".yaml")),
            "python": lambda f: f.endswith(".py"),
            "javascript-typescript": lambda f: f.endswith((".js", ".jsx", ".mjs", ".cjs", ".ts", ".tsx", ".vue", ".html")),
            "csharp": lambda f: f.endswith(".cs"),
            "rust": lambda f: f.endswith(".rs"),
            "ruby": lambda f: f.endswith(".rb"),
            "java-kotlin": lambda f: f.endswith(".java"),
        }
        files = [l.strip() for l in open("changed.txt", encoding="utf-8") if l.strip()]
        include = []
        for language, match in languages.items():
            picked = [f for f in files if match(f)]
            if picked:
                include.append({"language": language, "paths": "\n".join("  - '" + f.replace("'", "''") + "'" for f in picked)})
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
            out.write("matrix=" + json.dumps({"include": include}) + "\n")
            out.write("any=" + ("true" if include else "false") + "\n")
        print(f"{len(files)} changed file(s); languages to analyze: {[i['language'] for i in include] or 'none'}")
        EOF

  analyze-changed:
    name: Analyze changed (${{ matrix.language }})
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: windows-2022
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
    - name: Enable Git long paths
      run: git config --global core.longpaths true

    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        sparse-checkout: |
          /*
          !**/doc/html/**
          !**/doc/pdf/**
        sparse-checkout-cone-mode: false

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: none
        config: |
          paths:
          ${{ matrix.paths }}

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{ matrix.language }}/changed"

  analyze:
    name: Analyze (${{ matrix.language }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: c-cpp
          build-mode: autobuild
        - language: csharp
          build-mode: none
        - language: go
          build-mode: autobuild
        - language: java-kotlin
          build-mode: none
        - language: javascript-typescript
          build-mode: none
        - language: python
          build-mode: none
        - language: ruby
          build-mode: none
        - language: rust
          build-mode: none
    steps:
    - name: Enable Git long paths
      run: git config --global core.longpaths true

    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        sparse-checkout: |
          /*
          !**/doc/html/**
          !**/doc/pdf/**
        sparse-checkout-cone-mode: false

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        config: |
          paths-ignore:
            - hayabusa
            - hydradragonunicorn
            - unicorn-engine-sys
            - OpenMalwareScannerPortable
            - inspired_rules

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{ matrix.language }}"
