extend = "target/rust-driver-makefile.toml"

# target/rust-driver-makefile.toml must be a symlink to the copy inside the wdk-build crate
# so that `path = "."` dependencies inside that makefile resolve to the wdk-build crate.
# We create the symlink via PowerShell to avoid invoking rust-script, which compiles heavy
# dependencies and triggers MSVC 'LNK1104: cannot open file' in CI environments.
[config]
load_script = [
    "powershell -NoProfile -ExecutionPolicy Bypass -Command \"if (-not (Test-Path 'target\\rust-driver-makefile.toml')) { $crate = (cargo metadata --format-version 1 | ConvertFrom-Json).packages | Where-Object { $_.name -eq 'wdk-build' } | Select-Object -First 1 -ExpandProperty manifest_path; if ($crate) { $src = Join-Path (Split-Path $crate) 'rust-driver-makefile.toml'; New-Item -ItemType Directory -Force -Path 'target' | Out-Null; $dest = 'target\\rust-driver-makefile.toml'; if (Test-Path -PathType Leaf $dest) { Remove-Item $dest -Force }; New-Item -ItemType SymbolicLink -Path $dest -Target $src -Force; Write-Host 'Symlinked $dest -> $src' } }\""
]

[tasks.stage-driver-makefile]
description = "Create a symlink to rust-driver-makefile.toml from the wdk-build crate into target/."
script_runner = "@powershell"
script = '''
$ErrorActionPreference = "Stop"
$crate = (cargo metadata --format-version 1 | ConvertFrom-Json).packages |
    Where-Object { $_.name -eq "wdk-build" } |
    Select-Object -First 1 -ExpandProperty manifest_path
if (-not $crate) { throw "wdk-build crate not found in cargo metadata" }
$source = Join-Path (Split-Path $crate) "rust-driver-makefile.toml"
if (-not (Test-Path $source)) { throw "rust-driver-makefile.toml not found at $source" }
New-Item -ItemType Directory -Force -Path "target" | Out-Null
$dest = "target\rust-driver-makefile.toml"
if (Test-Path -PathType Leaf $dest) { Remove-Item $dest -Force }
New-Item -ItemType SymbolicLink -Path $dest -Target $source -Force
Write-Host "staged target\rust-driver-makefile.toml from $source"
'''

[tasks.release]
description = "Build and package the Sanctum kernel driver in release mode."
command = "cargo"
args = ["make", "default", "--release"]
