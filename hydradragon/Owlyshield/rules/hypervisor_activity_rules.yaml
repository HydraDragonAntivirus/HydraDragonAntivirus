- name: "INFO:Win.Hypervisor.CallbackActivity"
  author: "HydraDragon"
  date: "2026-04-02"
  status: production
  level: high
  severity: 72
  description: |
    Detects real VMM/HyperDbg-origin callback activity reported by the kernel
    bridge. This rule is intended to surface hypervisor telemetry that was
    previously only logged internally, so it can be reviewed in OwlyShield
    reports and firewall-side alert views.
  debug: false

  named_conditions:
    real_hypervisor_callback:
      orderless: true
      hypervisor_event_labels:
        - "*:PRE"
        - "*:POST"
        - "*:ALL"
        - "VMMCALL"
        - "NMI_BROADCAST"
        - "QUERY_TERMINATE_PROTECTED_RESOURCE"
        - "UNHANDLED_EPT_VIOLATION"
        - "RESTORE_EPT_STATE"
        - "DEBUG_BREAKPOINT_EXCEPTION"
        - "DEBUG_DEBUG_BREAKPOINT_EXCEPTION"
        - "DEBUG_THREAD_INTERCEPTION"
        - "CR3_PROCESS_CHANGE"
        - "REAPPLY_BREAKPOINT"
        - "KD_NMI_CALLBACK"
        - "REGISTERED_MTF_HANDLER"
        - "DEBUGGER_PROCESS_OR_THREAD_CHANGE"
        - "KD_QUERY_THREAD_OR_PROCESS_TRACING"
        - "TRANSPARENT_HIDE_DEBUGGER"
        - "TRANSPARENT_UNHIDE_DEBUGGER"
        - "TRANSPARENT_CPUID"
        - "TRANSPARENT_TRAP_FLAG_AFTER_VMEXIT"
        - "TRANSPARENT_MSR_READ"
        - "TRANSPARENT_MSR_WRITE"
        - "TRANSPARENT_SYSCALL_HOOK"
        - "TRANSPARENT_AFTER_SYSCALL"
        - "DISASM_SHOW_INSTR_NONROOT"
        - "DISASM_ONE_INSTR_NONROOT"
        - "DISASM_ONE_INSTR_ROOT"
        - "DISASM_LENGTH_ENGINE"
        - "DISASM_LENGTH_ENGINE_ROOT_TARGET"
        - "DISASM_LENGTH_ENGINE_BY_PID"
      hypervisor_event_threshold: 1
      min_matches: 1

  detection_logic:
    condition: "real_hypervisor_callback"

  response:
    notify_user: true
    ask_user: false
    terminate_process: false
    quarantine: false
    record: true

  tags:
    - hypervisor
    - hyperdbg
    - vmm
    - telemetry
  false_positives:
    - "Expected when HyperDbg-backed kernel telemetry is intentionally enabled for analysis"
