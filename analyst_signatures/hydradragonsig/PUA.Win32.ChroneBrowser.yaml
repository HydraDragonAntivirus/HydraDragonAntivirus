rules:
- id: VK-PUA-CHRONE-BROWSER
  title: Chrone Browser (rebranded Cent Browser installed by bundler)
  description: Cent Browser binaries dropped into C:\Chrone by DriverPack offers
  severity: medium
  verdict: pua
  confidence: 80
  score: 60
  family: PUA.Win32.ChroneBrowser
  tags:
  - analyst
  - pua
  - browser
  - driverpack
  logic: all
  conditions:
  - type: file_type
    values:
    - pe
  - type: path_regex
    pattern: (?i)^[a-z]:\\Chrone\\
  - type: string_set
    min: 1
    nocase: true
    values:
    - centbrowser
    - cb-system-install
    - --cb-safemode
    - chrome.dll
