rules:
- id: VK-SUSP-DISABLE-WINUPDATE-PS
  title: PowerShell script that disables Windows Update
  description: Seen as DRPSu\Alice\application\utils\disable-windows-update.ps1
  severity: low
  verdict: suspicious
  confidence: 70
  score: 40
  family: Riskware.PowerShell.DisableWU
  tags:
  - analyst
  - powershell
  - tamper
  logic: all
  conditions:
  - type: file_type
    values:
    - powershell
  - type: string_set
    min: 2
    nocase: true
    values:
    - Microsoft.Update.AutoUpdate
    - NotificationLevel = 1
    - sc.exe stop wuauserv
    - config wuauserv start= disabled
