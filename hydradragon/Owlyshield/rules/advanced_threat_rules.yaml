- rule_id: HD-EVASION-LOLBAS-CERTUTIL-DL
  name: '[EVASION] LOLBAS - Certutil Remote Download'
  description: 'Detects usage of certutil.exe to download files from the internet, a common malware technique to bypass firewall rules.'
  enabled: true
  severity: 80
  level: high
  tags:
    - evasion
    - lolbas
    - network
  mitre_attack:
    - T1105
  stages:
    - name: Detect Certutil Download
      conditions:
        - type: MultiCondition
          op: and
          conditions:
            - type: Process
              op: contains
              pattern: '(?i)certutil\.exe'
            - type: CommandLineMatch
              patterns:
                - pattern: '(?i)(-urlcache|-split)'
            - type: MultiCondition
              op: and
              conditions:
                - type: Network
                  op: connect
                  dest_pattern: '.*'
                - type: File
                  op: create
                  path_pattern: '(?i).*\.(exe|dll|vbs|ps1|bat)'
  response:
    ask_user: true
    notify_user: true
    record: true

- rule_id: HD-STEALTH-PROCESS-HOLLOWING-MAP
  name: '[STEALTH] Process Hollowing - Map and Resume'
  description: 'Detects process hollowing by monitoring for a process created in a suspended state followed by memory mapping and thread resumption.'
  enabled: true
  severity: 95
  level: critical
  tags:
    - injection
    - hollowing
  mitre_attack:
    - T1055.012
  stages:
    - name: Process Create Suspended
      conditions:
        - type: Process
          op: contains
          pattern: 'suspended'
    - name: Map Section
      conditions:
        - type: Api
          functions:
            - NtCreateSection
            - NtMapViewOfSection
    - name: Resume Thread
      conditions:
        - type: Api
          functions:
            - NtResumeThread
  response:
    terminate_process: true
    notify_user: true
    record: true

- rule_id: HD-INJECTION-THREAD-CTX-HIJACK
  name: '[INJECTION] Thread Execution Hijacking'
  description: 'Detects hijacking of a thread execution context to redirect it to malicious code.'
  enabled: true
  severity: 90
  level: critical
  tags:
    - injection
    - hijacking
  mitre_attack:
