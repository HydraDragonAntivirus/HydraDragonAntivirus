extend = "target/rust-driver-makefile.toml"

[config]
# Do not remove this load_script.
#
# It is not a plain file copy: load_rust_driver_makefile() creates a *symlink*
# from target/rust-driver-makefile.toml to the copy that ships in the wdk-build
# crate. That symlink is load bearing. Every script in the linked makefile
# declares its dependency as
#
#     wdk-build = { path = ".", version = "0.5.1" }
#
# so `path = "."` only resolves to the wdk-build crate while the makefile is a
# symlink into it. Stage the file with a plain copy - which is what this file
# used to be preceded by in CI - and the build fails with
#
#     error: no matching package named `wdk-build` found
#     location searched: ...\Sanctum\driver\target
#
# The function also repairs a bad or stale target/rust-driver-makefile.toml:
# if the destination exists but is not a symlink to the right file, it removes
# the destination and relinks it.
load_script = '''
#!@rust
//! ```cargo
//! [dependencies]
//! wdk-build = "0.5.1"
//! ```
#![allow(unused_doc_comments)]

wdk_build::cargo_make::load_rust_driver_makefile()?
'''

[tasks.release]
description = "Build and package the Sanctum kernel driver in release mode."
command = "cargo"
args = ["make", "default", "--release"]
