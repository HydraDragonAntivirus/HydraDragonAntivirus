name: Python Lint

on:
  push:
    branches: ["**"]
    paths:
      - 'hydradragon/**'
      - '.github/workflows/python-lint.yml'
  pull_request:
    branches: ["**"]
    paths:
      - 'hydradragon/**'
      - '.github/workflows/python-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flake8:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8 fatal checks
        run: |
          flake8 hydradragon/ --count --statistics --select=F --max-line-length=240 \
            --exclude=.git,.tox,.venv,venv,node_modules,build,dist,site-packages,__pycache__

      - name: Show flake8 style hints
        run: |
          flake8 hydradragon/ --count --statistics --select=E,W --exit-zero --max-line-length=240 \
            --exclude=.git,.tox,.venv,venv,node_modules,build,dist,site-packages,__pycache__
