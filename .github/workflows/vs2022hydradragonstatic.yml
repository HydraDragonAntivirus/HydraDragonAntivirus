name: vs2022hydradragonstatic-ci

on:
  push:
    branches: [ "**" ]
    paths:
      - 'Owlyshield/hydradragonstatic/**'
      - '.github/workflows/vs2022hydradragonstatic.yml'
  pull_request:
    branches: [ "**" ]
    paths:
      - 'Owlyshield/hydradragonstatic/**'
      - '.github/workflows/vs2022hydradragonstatic.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  pull-requests: write

jobs:
  win-build:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: Owlyshield/hydradragonstatic

    steps:
    - name: Enable Git long paths
      run: git config --global core.longpaths true
      working-directory: .

    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Cargo
      uses: Swatinem/rust-cache@v2
      with:
        key: vs2022-hydradragonstatic

    - name: Format Rust sources
      run: |
        rustup component add rustfmt
        cargo fmt --all

    - name: Cargo check
      run: cargo check --verbose

    - name: Build release binary
      run: cargo build --release --verbose

    - name: Run tests
      run: cargo test --verbose

    - name: Check for formatting changes
      id: check_format_changes
      if: github.event_name == 'push' && !startsWith(github.ref_name, 'auto-update-')
      uses: ./.github/actions/check-publishable-changes
      with:
        paths: |
          Owlyshield/hydradragonstatic/src

    - name: Create formatting PR
      if: github.event_name == 'push' && !startsWith(github.ref_name, 'auto-update-') && steps.check_format_changes.outputs.changed == 'true'
      uses: peter-evans/create-pull-request@v8
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "style(hydradragonstatic): format Rust sources"
        title: "Format HydraDragonStatic Rust sources"
        add-paths: |
          ${{ steps.check_format_changes.outputs.publishable_files }}
        branch: "auto-update-hydradragonstatic-format"
        base: ${{ github.ref_name }}
        delete-branch: true
        labels: automated-pr, rustfmt, hydradragonstatic

    - name: Upload build directory
      uses: actions/upload-artifact@v7
      with:
        name: hydradragonstatic_release_binaries
        path: |
          Owlyshield/hydradragonstatic/target/release/hydradragonstatic.exe
