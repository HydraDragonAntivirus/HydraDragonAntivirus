rules:
- id: VK-PUA-DRIVERPACK-PE
  title: DriverPack Solution launcher
  description: 'DriverPackAssistant.exe / DriverPackSolution.exe: launches mshta + Tools\init.cmd'
  severity: medium
  verdict: pua
  confidence: 90
  score: 60
  family: PUA.Win32.DriverPack
  tags:
  - analyst
  - pua
  - bundler
  - driverpack
  logic: all
  conditions:
  - type: file_type
    values:
    - pe
  - type: string_set
    min: 3
    values:
    - DriverPack Solution
    - DriverPackSolution.exe
    - Installs and updates drivers
    - Tools\init.cmd
    - mshtaPath
