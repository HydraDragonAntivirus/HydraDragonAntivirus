- id: VK-VIRUS-APPENDER-DIR-64
  title: Small host table followed by an encrypted body in the last section (64-bit)
  description: 'The last section starts with a small table of the host (relocations, exception data or imports) and the rest is an encrypted body: the infector appended itself to that section. Resources
    are not counted: a legitimate .rsrc can hold a small resource tree plus large compressed data (Spybot Anti-Beacon). The security directory is not counted either (signed installers keep their signature
    there). Retrohunt 0 of ~34000 clean PE.'
  severity: critical
  verdict: malware
  confidence: 85
  score: 100
  family: Virus.Win64.Appender.DIR
  tags:
  - analyst
  - virus
  - infector
  - polymorphic
  - generic
  logic: all
  conditions:
  - type: native_signature
    expression: PE64
  - type: pe_section
    select: last
    flags_none:
    - code
    entropy_min: 7.8
    raw_size_min: 262144
    directories_any:
    - basereloc
    - exception
    - import
    directory_share_max: 0.12
    directories_none:
    - export
    - resource
