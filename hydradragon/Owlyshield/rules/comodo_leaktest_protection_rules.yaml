# TEST #4: RootkitInstallation:ChangeDrvPath — Prevent driver path modification
- name: "HEUR:Win.Rootkit.DriverPathRemapping.gen"
  author: "HydraDragon"
  date: "2026-03-26"
  status: production
  level: critical
  severity: 100
  description: |
    Detects attempts to remap or modify kernel driver ImagePath registry
    entries to point to alternate locations. Threat actors use this to load
    rootkits from User-writable directories that bypass kernel driver signing
    validation.
    COMODO Test #4: RootkitInstallation:ChangeDrvPath
    Blocks driver path substitution attacks.
  debug: false

  allowlisted_apps:
    - pattern: "C:/Windows/System32/msiexec.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "C:/Windows/System32/svchost.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "C:/Windows/System32/services.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "%SystemRoot%/servicing/TrustedInstaller.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "%SystemRoot%/WinSxS/*/TiWorker.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "%SystemRoot%/UUS/*/MoUsoCoreWorker.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "%SystemRoot%/WinSxS/*/MoUsoCoreWorker.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "%SystemRoot%/System32/poqexec.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "%SystemRoot%/System32/wusa.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "%SystemRoot%/System32/Dism/DismHost.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]

  named_conditions:
    driver_path_modification:
      orderless: true
      registry_keys:
        - "HKLM\\SYSTEM\\CurrentControlSet\\Services"
        - "HKLM\\SYSTEM\\ControlSet001\\Services"
        - "HKLM\\SYSTEM\\ControlSet002\\Services"
      registry_values:
        - "ImagePath"
        - "ServiceDll"
        - "Type"
        - "Start"
      registry_operations: ["set", "create", "delete"]
      min_matches: 1

    service_reconfigure_api:
      orderless: true
      apis:
        - "*ChangeServiceConfig*"
        - "*ChangeServiceConfig2*"
        - "*OpenSCManager*"
        - "*OpenService*"
        - "*CreateService*"
        - "*RegCreateKey*"
        - "*RegCreateKeyEx*"
        - "*RegSetValue*"
        - "*RegSetValueEx*"
        - "*RegSetKeyValue*"
        - "*NtLoadDriver*"
        - "*ZwLoadDriver*"
        - "*NtCreateKey*"
        - "*ZwCreateKey*"
        - "*NtSetValueKey*"
        - "*ZwSetValueKey*"
      api_threshold: 1
      min_matches: 1

    suspicious_driver_payload:
      orderless: true
      registry_value_data_patterns:
        - "*.sys*"
        - "*\\users\\*"
        - "*\\appdata\\*"
        - "*\\temp\\*"
        - "*\\public\\*"
        - "*\\downloads\\*"
      min_matches: 1

  detection_logic:
    or:
      - condition: "driver_path_modification"
      - condition: "service_reconfigure_api"
      - condition: "suspicious_driver_payload"

  response:
    notify_user: true
    ask_user: false
    terminate_process: true
    status_access_denied: true
    record: true

  tags: ["rootkit", "driver", "registry", "privilege-escalation"]
  mitre_attack: ["T1014", "T1547.006"]

