name: Publish Sanctum GUI

on:
  push:
    branches: ["**"]
    paths:
      - 'Sanctum/gui/**'
      - 'Sanctum/shared_std/**'
      - 'Sanctum/shared_no_std/**'
      - 'Sanctum/Cargo.toml'
      - 'Sanctum/Cargo.lock'
      - '.github/workflows/publish-sanctum-gui.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-stage:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
      - name: Build GUI
        working-directory: Sanctum
        run: cargo build --release -p app
      - name: Stage
        shell: pwsh
        run: |
          $dist = "hydradragon/Sanctum"
          New-Item -ItemType Directory -Force -Path $dist
          Copy-Item "Sanctum/target/release/app.exe" "$dist/" -Force
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: sanctum-gui
          path: hydradragon/Sanctum/app.exe
          if-no-files-found: error
      - name: Create PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(sanctum): update gui binary"
          title: "Update Sanctum GUI Binary"
          add-paths: |
            hydradragon/Sanctum/app.exe
          branch: "auto-update-sanctum-gui"
          base: ${{ github.ref_name }}
          delete-branch: true
          labels: binaries, automated-pr, sanctum, gui
