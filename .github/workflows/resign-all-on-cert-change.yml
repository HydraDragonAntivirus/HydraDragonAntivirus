name: Re-sign All Binaries on Certificate Change

on:
  push:
    branches: ["**"]
    paths:
      - 'Sanctum/driver/sanctum.pfx'
      - '.github/workflows/resign-all-on-cert-change.yml'
      - 'Sanctum/sign_ppl_runner.bat'
      - 'Sanctum/sign_firewall.bat'
      - 'Sanctum/sign_owlyshield_predict.bat'
      - 'Sanctum/sign_etw_consumer.bat'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  resign-all:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
        
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Set up MSVC Developer Command Prompt
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
          
      - name: Re-sign All Binaries
        shell: pwsh
        run: |
          Write-Host "=== Re-signing all binaries with updated certificate ==="
          
          # Re-sign PPL Runner
          if (Test-Path "hydradragon\Sanctum\AppData\sanctum_ppl_runner.exe") {
            Write-Host "`n[1/4] Re-signing PPL Runner..."
            Push-Location Sanctum
            .\sign_ppl_runner.bat
            Pop-Location
          } else {
            Write-Host "`n[1/4] SKIP: PPL Runner binary not found at hydradragon\Sanctum\AppData\sanctum_ppl_runner.exe"
          }
          
          # Re-sign Firewall
          if (Test-Path "hydradragon\HydraDragonFirewall\hydradragonfirewall.exe") {
            Write-Host "`n[2/4] Re-signing Firewall..."
            Push-Location Sanctum
            .\sign_firewall.bat
            Pop-Location
          } else {
            Write-Host "`n[2/4] SKIP: Firewall binary not found at hydradragon\HydraDragonFirewall\hydradragonfirewall.exe"
          }
          
          # Re-sign Owlyshield Predict
          if (Test-Path "hydradragon\Owlyshield\Owlyshield Service\owlyshield_ransom.exe") {
            Write-Host "`n[3/4] Re-signing Owlyshield Predict..."
            Push-Location Sanctum
            .\sign_owlyshield_predict.bat
            Pop-Location
          } else {
            Write-Host "`n[3/4] SKIP: Owlyshield Predict binary not found at hydradragon\Owlyshield\Owlyshield Service\owlyshield_ransom.exe"
          }
          
          # Re-sign ETW Consumer (if exists)
          if (Test-Path "hydradragon\Sanctum\etw_consumer.exe") {
            Write-Host "`n[4/4] Re-signing ETW Consumer..."
            Push-Location Sanctum
            .\sign_etw_consumer.bat
            Pop-Location
          } else {
            Write-Host "`n[4/4] SKIP: ETW Consumer binary not found at hydradragon\Sanctum\etw_consumer.exe"
          }
          
          Write-Host "`n=== All available binaries re-signed with new certificate ==="

      - name: Stage re-signed binaries
        shell: pwsh
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A hydradragon/
          Write-Host "=== git status ==="
          git status
          Write-Host "=== staged diff stat ==="
          git diff --cached --stat

      - name: Get Certificate Hash
        id: cert_hash
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $certInfo = & signtool verify /pa /v "hydradragon\Sanctum\AppData\sanctum_ppl_runner.exe" 2>&1
          $hashLine = $certInfo | Select-String "SHA1 hash:"
          if ($hashLine) {
            $hash = ($hashLine -split "SHA1 hash:")[1].Trim()
            echo "hash=$hash" >> $env:GITHUB_OUTPUT
            Write-Host "Certificate SHA1: $hash"
          } else {
            echo "hash=Unknown" >> $env:GITHUB_OUTPUT
            Write-Host "Could not extract certificate hash"
          }
          exit 0

      - name: Create PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(sanctum): re-sign all binaries with updated certificate"
          title: "Re-sign All Binaries with Updated Certificate"
          body: |
            Automated re-signing of all binaries after certificate change.

            This ensures all components (driver, PPL runner, firewall, owlyshield) are signed with the same certificate to prevent error 577 (driver signature invalid).

            Certificate SHA1: ${{ steps.cert_hash.outputs.hash }}
          add-paths: |
            hydradragon/Sanctum/AppData/*
            hydradragon/HydraDragonFirewall/*
            hydradragon/Owlyshield/Owlyshield Service/*
          branch: "auto-resign-binaries"
          base: ${{ github.ref_name }}
          delete-branch: true
          labels: binaries, automated-pr, sanctum, signing
          author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
