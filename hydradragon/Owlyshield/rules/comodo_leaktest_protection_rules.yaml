# TEST #31: Hijacking:StartupPrograms — Block suspicious startup registry modification
- name: "HEUR:Win.Hijacking.StartupProgramsModification.gen"
  author: "HydraDragon"
  date: "2026-03-26"
  status: production
  level: high
  severity: 90
  description: |
    Detects modification of Windows startup registry locations to point to
    unsigned or non-Microsoft executables. Common startup hijacking points:
    - Run/RunOnce (HKCU, HKLM)
    - Startup folders
    - Image File Execution Options
    COMODO Test #31: Hijacking:StartupPrograms
    Blocks suspicious startup program registration.
  debug: false

  named_conditions:
    startup_registry_modification:
      orderless: true
      apis:
        - "*RegCreateKey*"
        - "*RegCreateKeyEx*"
        - "*RegSetValue*"
        - "*RegSetValueEx*"
        - "*RegSetKeyValue*"
        - "*NtCreateKey*"
        - "*ZwCreateKey*"
        - "*NtSetValueKey*"
        - "*ZwSetValueKey*"
      registry_keys:
        - "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run"
        - "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\RunOnce"
        - "HKLM\\Software\\Microsoft\\Windows\\CurrentVersion\\Run"
        - "HKLM\\Software\\Microsoft\\Windows\\CurrentVersion\\RunOnce"
        - "HKLM\\Software\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Run"
        - "HKLM\\Software\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\RunOnce"
        - "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\RunServices"
        - "HKLM\\Software\\Microsoft\\Windows\\CurrentVersion\\RunServices"
        - "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\RunServicesOnce"
        - "HKLM\\Software\\Microsoft\\Windows\\CurrentVersion\\RunServicesOnce"
        - "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer\\Run"
        - "HKLM\\Software\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer\\Run"
        - "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\StartupApproved\\Run"
        - "HKLM\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\StartupApproved\\Run"
      registry_operations: ["set", "create"]
      min_matches: 1

    startup_folder_write:
      orderless: true
      apis:
        - "*CreateFile*"
        - "*WriteFile*"
        - "*CopyFile*"
        - "*CopyFileEx*"
        - "*MoveFile*"
        - "*MoveFileEx*"
        - "*ReplaceFile*"
      file_paths:
        - "*\\Startup\\*"
        - "\\Start Menu\\Programs\\Startup\\"
        - "\\Programs\\Startup\\"
        - "\\Microsoft\\Windows\\Start Menu\\Programs\\Startup\\"
        - "\\ProgramData\\Microsoft\\Windows\\Start Menu\\Programs\\Startup\\"
        - "\\AppData\\Roaming\\Microsoft\\Windows\\Start Menu\\Programs\\Startup\\"
        - "*.lnk"
        - "*.url"
        - "*.hta"
        - "*.js"
        - "*.vbs"
        - "*.cmd"
        - "*.bat"
      file_operations: ["create", "write", "setinfo"]
      min_matches: 1

    startup_value_payload:
      orderless: true
      registry_keys:
        - "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run"
        - "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\RunOnce"
        - "HKLM\\Software\\Microsoft\\Windows\\CurrentVersion\\Run"
        - "HKLM\\Software\\Microsoft\\Windows\\CurrentVersion\\RunOnce"
        - "HKLM\\Software\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Run"
        - "HKLM\\Software\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\RunOnce"
      registry_value_data_patterns:
        - "*.exe*"
        - "*.dll*"
        - "*.lnk*"
        - "*.hta*"
        - "*.js*"
        - "*.vbs*"
        - "*.cmd*"
        - "*.bat*"
        - "*rundll32*"
        - "*regsvr32*"
        - "*powershell*"
        - "*cmd.exe*"
        - "*\\users\\*"
        - "*\\appdata\\*"
        - "*\\temp\\*"
        - "*\\public\\*"
      registry_operations: ["set", "create"]
      min_matches: 1

    caller_unsigned:
      orderless: true
      is_signed: false
      min_matches: 1

  detection_logic:
    or:
      - condition: "startup_registry_modification"
      - condition: "startup_folder_write"
      - condition: "startup_value_payload"

  response:
    notify_user: true
    ask_user: false
    terminate_process: true
    status_access_denied: true
    record: true
    auto_revert: true

  tags: ["hijacking", "startup", "persistence"]
  mitre_attack: ["T1547.001", "T1547.008"]

