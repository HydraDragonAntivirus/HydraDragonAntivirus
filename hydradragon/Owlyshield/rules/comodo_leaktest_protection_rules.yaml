# TEST #5: Invasion:Runner — Block executable execution from raw device
- name: "HEUR:Win.Invasion.RawDeviceExecution.gen"
  author: "HydraDragon"
  date: "2026-03-26"
  status: production
  level: critical
  severity: 100
  description: |
    Detects execution of binaries directly from raw device or volume objects
    ($DEVICE$ handles). Threat actors use this to chain rootkit installation
    with fileless execution bypassing file-system ACLs.
    COMODO Test #5: Invasion:Runner
    Blocks raw device execution.
  debug: false

  named_conditions:
    raw_device_handle_open:
      orderless: true
      apis:
        - "ZwOpenFile"
        - "NtOpenFile"
        - "IoCreateFile"
      file_paths:
        - "\\Device\\HarddiskVolume"
        - "\\Device\\HarddiskVolumeShadowCopy"
        - "\\Device\\Harddisk"
      api_threshold: 1
      min_matches: 1

    process_create_after_raw_handle:
      orderless: true
      created_processes:
        - "*"
      min_matches: 1

  detection_logic:
    and:
      - condition: "raw_device_handle_open"
      - condition: "process_create_after_raw_handle"

  response:
    notify_user: true
    ask_user: true
    terminate_process: true
    status_access_denied: true
    record: true

  tags: ["invasion", "raw-device", "fileless", "execution"]
  mitre_attack: ["T1218", "T1202"]

