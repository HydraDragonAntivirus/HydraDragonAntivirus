- rule_id: HD-ADV-0009
  name: '[EXFILTRATION] Suspicious Large Data Outbound'
  description: 'Detects large data transfers to external IP addresses from non-browser processes.'
  enabled: true
  severity: 80
  level: high
  tags:
    - exfiltration
    - network
  mitre_attack:
    - T1041
  stages:
    - name: Large Outbound Transfer
      conditions:
        - type: NetworkCondition
          op: and
          conditions:
            - type: ByteThreshold
              operation: write
              threshold: 10485760 # 10MB
              window_ms: 60000
            - type: Localhost
              value: false
    - name: Exclude Browsers
      conditions:
        - type: Process
          op: not_contains
          pattern: '(?i)(chrome|msedge|firefox|brave)\.exe'
  response:
    ask_user: true
    notify_user: true
    record: true

- rule_id: HD-ADV-0010
  name: '[CREDENTIAL] SAM/SECURITY Hive Export'
  description: 'Detects attempts to export SAM or SECURITY registry hives, used for offline credential cracking.'
  enabled: true
  severity: 95
  level: critical
  tags:
    - credentials
    - registry
  mitre_attack:
    - T1003.002
  stages:
    - name: Export Hive
      conditions:
        - type: Api
          functions:
            - NtSaveKey
            - NtSaveKeyEx
    - name: Check Hive Path
      conditions:
        - type: MultiCondition
          op: or
          conditions:
            - type: Process
              op: contains
              pattern: '(?i)SAM'
            - type: Process
              op: contains
              pattern: '(?i)SECURITY'
  response:
    ask_user: true
    terminate_process: false
    suspend_while_ask: true
    notify_user: true
    record: true

- rule_id: HD-ADV-0011
  name: '[PRIVACY] Unauthorized Screen Capture Detection'
  description: 'Detects unauthorized screenshot and screen recording activity by monitoring GDI (BitBlt) and DXGI (Desktop Duplication) capture behaviors from non-whitelisted processes.'
  enabled: true
  severity: 85
  level: high
  tags:
    - privacy
    - screenshot
    - exfiltration
  mitre_attack:
    - T1113
  stages:
    - name: DXGI Desktop Duplication Init
      conditions:
        - type: MultiCondition
          op: and
          conditions:
            - type: Process
              op: contains
              pattern: '.exe'
            - type: ExtensionPattern
              patterns:
                - '.bmp'
                - '.jpg'
                - '.png'
              op_type: write
    - name: Exfiltration Pattern
      conditions:
        - type: MultiCondition
          op: and
          conditions:
            - type: OperationCount
              op_type: BitBlt
              comparison: gte
              threshold: 5
            - type: Network
              op: connect
              dest_pattern: '.*'
  response:
    ask_user: true
    notify_user: true
    record: true
    status_access_denied: true

- rule_id: HD-ADV-0012
  name: '[EVASION] AppLocker Bypass - InstallUtil/Regasm Abuse'
  description: 'Detects execution of signed Microsoft binaries like InstallUtil.exe or Regasm.exe to run unauthorized code.'
  enabled: true
  severity: 85
  level: high
  tags:
    - evasion
    - lolbas
    - applocker-bypass
  mitre_attack:
    - T1218.004
    - T1218.009
  stages:
    - name: Detect Signed Binary Abuse
      conditions:
        - type: MultiCondition
          op: and
          conditions:
            - type: Process
              op: contains
              pattern: '(?i)(InstallUtil|Regasm|Regsvcs|MSBuild|Csc)\.exe'
            - type: CommandLineMatch
              patterns:
                - '(?i)(\.exe|\.dll|\.csproj|\.txt)'
            - type: MultiCondition
              op: or
              conditions:
                - type: ProcessTree
                  parent_patterns: ['(?i)(powershell|cmd|wscript|cscript)\.exe']
                - type: File
                  op: write
                  path_pattern: '(?i)\\Users\\Public\\.*'
                - type: Network
                  op: connect
                  dest_pattern: '.*'
  response:
    ask_user: true
    notify_user: true
    record: true

- rule_id: HD-ADV-0013
  name: '[EVASION] UAC Bypass - Fodhelper/ComputerDefaults'
  description: 'Detects registry modifications associated with common UAC bypass techniques using fodhelper.exe or computerdefaults.exe.'
  enabled: true
  severity: 90
  level: high
  tags:
    - privilege-escalation
    - uac-bypass
  mitre_attack:
    - T1548.002
  stages:
    - name: Registry Hijack
      conditions:
        - type: Api
          functions:
            - NtSetValueKey
    - name: Target UAC Path
      conditions:
        - type: MultiCondition
          op: or
          conditions:
            - type: Process
              op: contains
              pattern: '(?i)Software\Classes\ms-settings\shell\open\command'
  response:
    terminate_process: true
    notify_user: true
    record: true

- rule_id: HD-ADV-0014
  name: '[PERSISTENCE] Suspicious RunKey Modification'
  description: 'Detects unauthorized additions to Startup Run keys in the registry from non-installer processes.'
  enabled: true
  severity: 75
  level: high
  tags:
    - persistence
    - registry
  mitre_attack:
    - T1547.001
  stages:
    - name: Registry Write to RunKey
      conditions:
        - type: Api
          functions:
            - NtSetValueKey
    - name: Target RunKey Path
      conditions:
        - type: MultiCondition
          op: or
          conditions:
            - type: Process
              op: contains
              pattern: '(?i)SOFTWARE\Microsoft\Windows\CurrentVersion\Run'
            - type: Process
              op: contains
              pattern: '(?i)SOFTWARE\Microsoft\Windows\CurrentVersion\RunOnce'
    - name: Exclude Trusted Installers
      conditions:
        - type: Process
          op: not_contains
          pattern: '(?i)(msiexec|setup|install)\.exe'
  response:
    ask_user: true
    notify_user: true
    record: true

- rule_id: HD-ADV-0015
  name: '[STEALTH] Reflective DLL Loading Pattern'
  description: 'Detects memory allocation and thread creation patterns typical of reflective DLL injection.'
  enabled: true
  severity: 95
  level: critical
  tags:
    - injection
    - stealth
  mitre_attack:
    - T1620
  stages:
    - name: Allocate RWX Memory
      conditions:
        - type: Api
          functions:
            - NtAllocateVirtualMemory
          arguments:
            - name: protection
              value: '0x40'
    - name: Write to Allocated Memory
      conditions:
        - type: Api
          functions:
            - NtWriteVirtualMemory
    - name: Execute via StartRoutine
      conditions:
        - type: Api
          functions:
            - NtCreateThreadEx
  response:
    terminate_process: true
    notify_user: true
    record: true

- rule_id: HD-ADV-0016
  name: '[EXFILTRATION] DNS Tunneling Pattern'
  description: 'Detects high-frequency DNS queries for unusual subdomains, potentially indicating DNS tunneling.'
  enabled: true
  severity: 80
  level: high
  tags:
    - network
    - exfiltration
    - dns
  mitre_attack:
    - T1071.004
  stages:
    - name: High Frequency DNS
      conditions:
        - type: OperationCount
          op_type: dns_query
          comparison: gte
          threshold: 50
    - name: Target Domain Entropy
      conditions:
        - type: EntropyThreshold
          metric: dns_domain
          comparison: gte
          threshold: 4.5
  response:
    notify_user: true
    record: true
    ask_user: true

- rule_id: HD-ADV-0017
  name: '[CREDENTIAL] LSASS Dump via comsvcs.dll'
  description: 'Detects attempts to dump LSASS memory using the native comsvcs.dll MiniDump export.'
  enabled: true
  severity: 100
  level: critical
  tags:
    - credential-access
    - lsass
  mitre_attack:
    - T1003.001
  stages:
    - name: Detect Rundll32 LSASS Dump
      conditions:
        - type: MultiCondition
          op: and
          conditions:
            - type: Process
              op: contains
              pattern: '(?i)rundll32\.exe'
            - type: CommandLineMatch
              patterns:
                - '(?i)comsvcs\.dll.*MiniDump.*lsass'
  response:
    terminate_process: true
    notify_user: true
    record: true

- rule_id: HD-ADV-0018
  name: '[EVASION] LOLBAS - Certutil Remote Download'
  description: 'Detects usage of certutil.exe to download files from the internet, a common malware technique to bypass firewall rules.'
  enabled: true
  severity: 80
  level: high
  tags:
    - evasion
    - lolbas
    - network
  mitre_attack:
    - T1105
  stages:
    - name: Detect Certutil Download
      conditions:
        - type: MultiCondition
          op: and
          conditions:
            - type: Process
              op: contains
              pattern: '(?i)certutil\.exe'
            - type: CommandLineMatch
              patterns:
                - '(?i)(-urlcache|-split)'
            - type: MultiCondition
              op: and
              conditions:
                - type: Network
                  op: connect
                  dest_pattern: '.*'
                - type: File
                  op: create
                  path_pattern: '(?i).*\.(exe|dll|vbs|ps1|bat)'
  response:
    ask_user: true
    notify_user: true
    record: true

- rule_id: HD-ADV-0019
  name: '[STEALTH] Process Hollowing - Map and Resume'
  description: 'Detects process hollowing by monitoring for a process created in a suspended state followed by memory mapping and thread resumption.'
  enabled: true
  severity: 95
  level: critical
  tags:
    - injection
    - hollowing
  mitre_attack:
    - T1055.012
  stages:
    - name: Process Create Suspended
      conditions:
        - type: Process
          op: contains
          pattern: 'suspended'
    - name: Map Section
      conditions:
        - type: Api
          functions:
            - NtCreateSection
            - NtMapViewOfSection
    - name: Resume Thread
      conditions:
        - type: Api
          functions:
            - NtResumeThread
  response:
    terminate_process: true
    notify_user: true
    record: true

- rule_id: HD-ADV-0020
  name: '[INJECTION] Thread Execution Hijacking'
  description: 'Detects hijacking of a threads execution context to redirect it to malicious code.'
  enabled: true
  severity: 90
  level: critical
  tags:
    - injection
    - hijacking
  mitre_attack:
    - T1055.003
  stages:
    - name: Get Thread Context
      conditions:
        - type: Api
          functions:
            - NtGetContextThread
    - name: Set Thread Context
      conditions:
        - type: Api
          functions:
            - NtSetContextThread
    - name: Resume Thread
      conditions:
        - type: Api
          functions:
            - NtResumeThread
  response:
    terminate_process: true
    notify_user: true
    record: true

- rule_id: HD-ADV-0021
  name: '[ANTI-TAMPER] Hook notification handle close/protect tamper'
  description: >
    Detects attempts to close, duplicate, or weaken the HydraDragon/Owlyshield
    user-mode hook notification transport handle. This rule uses hook-error
    telemetry only and keeps benign failure filtering enabled so ACG/WebView
    mitigation noise is not promoted into a behavioral detection.
  enabled: true
  severity: 92
  level: critical
  tags:
    - anti-tamper
    - hook-transport
    - usermode-hook
    - edr-evasion
    - defense-evasion
  mitre_attack:
    - T1562.001
    - T1562
  false_positives:
    - Legitimate security tooling may probe or duplicate process handles during diagnostics.
    - ACG/WebView/browser mitigation failures must remain ignored by the benign hook failure check.
  named_conditions:
    hook_notify_handle_tamper_status:
      hook_error_statuses:
        - 3221226037 # 0xC0000235 STATUS_HANDLE_NOT_CLOSABLE
        - 3221225506 # 0xC0000022 STATUS_ACCESS_DENIED
      hook_error_api_patterns:
        - '(?i)(^|!)(Nt|Zw)(Close|SetInformationObject|DuplicateObject)$'
      hook_error_min_count: 1
      hook_error_exclude_benign: true
  detection_logic:
    condition: hook_notify_handle_tamper_status
  response:
    ask_user: true
    deny_while_ask: true
    terminate_process: false
    quarantine: false
    status_access_denied: true
    notify_user: true
    record: true
