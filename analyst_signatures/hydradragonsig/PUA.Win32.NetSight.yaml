rules:
- id: VK-PUA-NETSIGHT-METER
  title: Nielsen NetSight / NetRatings meter
  description: 'Browser-usage meter: Detours-based hooking (MSDetour64Help.dll) and Chrome extension installer (com.nielsen.chrometracker)'
  severity: medium
  verdict: pua
  confidence: 85
  score: 60
  family: PUA.Win32.NetSight
  tags:
  - analyst
  - pua
  - monitoring
  - tracker
  logic: all
  conditions:
  - type: file_type
    values:
    - pe
  - type: string_set
    min: 2
    nocase: true
    values:
    - NetRatingsNetSight
    - Software\NetRatingsNetSight\NetSight
    - com.nielsen.chrometracker
    - NielsenOnline.exe
    - nsmmgr.dll
