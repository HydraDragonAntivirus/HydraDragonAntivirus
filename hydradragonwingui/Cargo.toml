[package]
name = "hydradragonwingui"
version = "0.1.0"
edition = "2024"
description = "Native Win32 GUI for the HydraDragon portable antivirus"
license = "GPL-2.0-or-later"

[[bin]]
name = "hydradragonwingui"
path = "src/main.rs"

[dependencies]
# The scanning engine (pipeline, verdicts, quarantine, dedup cache).
hydradragonav = { path = "../hydradragonav" }

# MD5 of detected files for the saved report (same crate/version the engine uses,
# so the hash matches the engine's dedup key). Report only — not shown in the GUI.
md-5 = "0.11.0"

# Native Win32/COM GUI — controls, message loop, shell file dialog, custom GDI paint.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
] }

[build-dependencies]
# Embeds the HydraDragon icon into the executable.
winres = "0.1"
