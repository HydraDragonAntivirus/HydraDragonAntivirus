name: Publish Service

on:
  push:
    branches: ["**"]
    paths:
      - 'HydraDragonService/**'
      - '.github/workflows/publish-infrastructure.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-stage:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Publish Service
        run: dotnet publish HydraDragonService/HydraDragonService/HydraDragonService.csproj -c Release -r win-x64 --self-contained false -o artifacts/service/
        
      - name: Stage
        shell: pwsh
        run: |
          $distService = "hydradragon/HydraDragonService"

          function Sync-PublishTree {
            param(
              [Parameter(Mandatory = $true)][string]$Source,
              [Parameter(Mandatory = $true)][string]$Destination
            )

            if (-not (Test-Path -LiteralPath $Source -PathType Container)) {
              throw "Missing publish source: $Source"
            }

            if (Test-Path -LiteralPath $Destination) {
              Remove-Item -LiteralPath $Destination -Recurse -Force
            }

            New-Item -ItemType Directory -Force -Path $Destination | Out-Null
            Get-ChildItem -LiteralPath $Source -Force -Exclude "*.pdb" |
              Copy-Item -Destination $Destination -Recurse -Force
          }

          Sync-PublishTree -Source "artifacts/service" -Destination $distService
          
      - name: Check for publishable changes
        id: check_changes
        uses: ./.github/actions/check-publishable-changes
        with:
          paths: |
            hydradragon/HydraDragonService
      - name: Create PR
        if: steps.check_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(service): update binaries"
          title: "Update Service Binaries"
          add-paths: |
            ${{ steps.check_changes.outputs.publishable_files }}
          branch: "auto-update-service"
          base: ${{ github.ref_name }}
          delete-branch: true
          labels: binaries, automated-pr, service
