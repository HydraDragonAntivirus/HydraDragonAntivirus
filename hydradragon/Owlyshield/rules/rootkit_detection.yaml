# =============================================================================
# HydraDragon Rootkit Detection Rules
# File: rootkit_detection.yml
# Place in: C:\Program Files\HydraDragonAntivirus\hydradragon\
#           HydraDragon_Protection_Rules\Owlyshield\BehaviorRules\
# =============================================================================

---

# ---------------------------------------------------------------------------
# Rule 1: SSDT Hook — any SSDT entry redirected outside ntoskrnl
# Severity: critical. Terminate immediately, no quarantine needed.
# ---------------------------------------------------------------------------
- name: "HEUR:Win64.Rootkit.SsdtHook"
  description: >
    SSDT service table entry points outside ntoskrnl address range.
    Classic rootkit technique to intercept system calls at kernel level.
  author: "HydraDragon"
  severity: 5
  tags:
    - rootkit
    - ssdt
    - kernel
  mitre_attack:
    - "T1014"   # Rootkit
    - "T1562"   # Impair Defenses

  named_conditions:
    ssdt_hooked:
      rootkit_event_types: ["ssdt_hook"]
      rootkit_event_min_count: 1

  detection_logic:
    condition: "ssdt_hooked"

  response:
    ask_user: false
    terminate_process: false
    notify_user: true
    record: true

  allowlisted_apps:
    - pattern: "C:/Windows/System32/svchost.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "C:/Windows/System32/services.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "C:/Windows/System32/lsass.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "C:/Windows/System32/wininit.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "C:/Windows/System32/smss.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "C:/Windows/System32/csrss.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "C:/Windows/System32/winlogon.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "C:/Windows/explorer.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]

---

# ---------------------------------------------------------------------------
# Rule 8: Unsupported file-object callback filtering
# Detects object-manager tampering used to intercept or deny file-handle opens.
# This can be used to shield malicious files or block security tooling.
# ---------------------------------------------------------------------------
- name: "HEUR:Win64.Rootkit.FileObjectCallbackTamper"
  description: >
    File-object callback support or active callback registrations were detected
    on a kernel object type that normally does not expose file-handle callback
    filtering. This requires undocumented object-manager tampering and can be
    used to protect malicious files or deny antivirus access.
  author: "HydraDragon"
  severity: 5
  tags:
    - rootkit
    - object_type
    - callback_tamper
    - file_protection
    - kernel
  mitre_attack:
    - "T1014"
    - "T1562"

  named_conditions:
    file_object_callback_tamper:
      rootkit_event_types: ["generic"]
      rootkit_description_contains:
        - "file object callbacks enabled"
        - "file object callback list populated"

  detection_logic:
    condition: "file_object_callback_tamper"

  response:
    terminate_process: false
    notify_user: true
    record: true

