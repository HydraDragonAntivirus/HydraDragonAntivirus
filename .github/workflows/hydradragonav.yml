name: HydraDragonAV

on:
  push:
    branches: ["**"]
    paths:
      - 'HydraDragonAV/**'
      - '.github/workflows/hydradragonav.yml'
  pull_request:
    branches: ["**"]
    paths:
      - 'HydraDragonAV/**'
      - '.github/workflows/hydradragonav.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  SOLUTION_FILE_PATH: "HydraDragonAV/HydraDragonAV.sln"
  BUILD_BIN_DIR: "./HydraDragonAV/x64/"

jobs:
  ci:
    runs-on: windows-2022
    strategy:
      matrix:
        BUILD_CONFIGURATION: [Release, Debug]
        PLATFORM: [x64]
    steps:
      - name: Enable long paths
        run: git config --global core.longpaths true
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
      - name: Build HydraDragonAV
        run: msbuild /m /p:Configuration=${{matrix.BUILD_CONFIGURATION}} /p:Platform=${{matrix.PLATFORM}} "${{env.SOLUTION_FILE_PATH}}"
      - name: Upload build directory 
        if: matrix.BUILD_CONFIGURATION == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: hydradragonav_release_binaries_${{matrix.PLATFORM}}
          path: |
            ${{ env.BUILD_BIN_DIR }}${{matrix.BUILD_CONFIGURATION}}/**
            !${{ env.BUILD_BIN_DIR }}${{matrix.BUILD_CONFIGURATION}}/**/*.cer

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/development-version' && !startsWith(github.ref_name, 'auto-update-')
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
      - name: Build
        run: msbuild HydraDragonAV/HydraDragonAV.sln /p:Configuration=Release /p:Platform=x64
      - name: Stage
        shell: pwsh
        run: |
          $dist = "hydradragon/HydraDragonAV"
          New-Item -ItemType Directory -Force -Path $dist
          Copy-Item "HydraDragonAV/x64/Release/HydraDragonAV.exe" "$dist/" -Force
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: hydradragonav-publish-binaries
          path: hydradragon/HydraDragonAV/
          if-no-files-found: error
      - name: Check for publishable changes
        id: check_changes
        uses: ./.github/actions/check-publishable-changes
        with:
          paths: hydradragon/HydraDragonAV
      - name: Create PR
        if: steps.check_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(av): update binaries"
          title: "Update HydraDragonAV Binaries"
          add-paths: ${{ steps.check_changes.outputs.publishable_files }}
          branch: "auto-update-av"
          base: ${{ github.ref_name }}
          delete-branch: true
          labels: binaries, automated-pr, hydradragonav, development-version
