# Generic Trojan.Win32.Generic: what a backdoor / downloader / loader has to do, no family strings.
# Signals are split into strong ones (download-and-run cradles, C2 endpoints, security tampering,
# reverse shell plumbing, keylogger output) and weak ones (persistence, injection, self-deletion,
# recon) that installers, debuggers and admin tools also have. An unsigned PE needs two strong
# signals, or one strong and two weak ones. Helpers are private; the verdict rule is the last one.
# Score stays below Stealer / Ransom generic so their more specific name wins on the same file.
rules:
- id: VK-TRJ-CRADLE
  title: 'Helper: download-and-run cradle (PowerShell / LOLBin)'
  severity: info
  private: true
  logic: any
  conditions:
  - type: string_set
    min: 1
    nocase: true
    ascii: true
    wide: true
    decoded: true
    values:
    - .DownloadString(
    - Net.WebClient).DownloadFile(
    - Net.WebClient).DownloadData(
    - IEX(New-Object
    - IEX (New-Object
    - iex(iwr
    - iex (iwr
    - Invoke-Expression (New-Object
    - Invoke-Expression(Invoke-WebRequest
    - Start-BitsTransfer -Source http
    - certutil -urlcache
    - certutil.exe -urlcache
    - -urlcache -split -f
    - bitsadmin /transfer
    - bitsadmin.exe /transfer
    - mshta http
    - mshta.exe http
    - 'mshta vbscript:'
    - 'mshta javascript:'
    - 'rundll32.exe javascript:'
    - regsvr32 /s /n /u /i:http
    - /i:http
  - type: string_set
    min: 1
    regex: true
    decoded: true
    values:
    - '(?i)powershell(\.exe)?["'' ]+.*-(e|ec|en|enc|enco|encodedcommand)\s+[A-Za-z0-9+/=]{40,}'
  family: Trojan.Win32.Generic
  tags:
  - analyst
  - helper
- id: VK-TRJ-C2
  title: 'Helper: C2 / drop endpoint (raw public IP URL, dynamic DNS, tunnel, onion, bot API, paste)'
  severity: info
  private: true
  logic: any
  conditions:
  - type: string_set
    min: 1
    nocase: true
    ascii: true
    wide: true
    decoded: true
    values:
    - .duckdns.org
    - .ddns.net
    - .no-ip.org
    - .no-ip.biz
    - .no-ip.info
    - .noip.me
    - .hopto.org
    - .zapto.org
    - .sytes.net
    - .serveftp.com
    - .servebeer.com
    - .servehttp.com
    - .myftp.biz
    - .myftp.org
    - .redirectme.net
    - .bounceme.net
    - .ddnsking.com
    - .gotdns.ch
    - .3utilities.com
    - .linkpc.net
    - .kozow.com
    - .dynu.net
    - .ngrok.io
    - .ngrok-free.app
    - .ngrok.app
    - .trycloudflare.com
    - .portmap.io
    - .portmap.host
    - .ply.gg
    - .playit.gg
    - serveo.net
    - .loca.lt
    - api.telegram.org/bot
    - discord.com/api/webhooks
    - discordapp.com/api/webhooks
    - pastebin.com/raw/
    - paste.ee/r/
    - hastebin.com/raw/
    - rentry.co/raw/
    - transfer.sh/
    - temp.sh/
    - store1.gofile.io
  - type: string_set
    min: 1
    regex: true
    decoded: true
    values:
    # Public IPv4 only: 0/8, 10/8, 127/8, 169/8, 172/8, 192/8 and 224+ (local, private, link-local,
    # multicast; 169/172/192 left out whole) are not in the first-octet alternation.
    - '(?i)https?://([1-9]|1[1-9]|[2-9][0-9]|1[01][0-9]|12[0-6]|12[89]|1[3-5][0-9]|16[0-8]|17[01]|17[3-9]|18[0-9]|19[01]|19[3-9]|2[01][0-9]|22[0-3])\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}(:[0-9]{2,5})?/'
    - '\b[a-z2-7]{56}\.onion\b'
  family: Trojan.Win32.Generic
  tags:
  - analyst
  - helper
- id: VK-TRJ-EVASION
  title: 'Helper: security tampering (Defender exclusions / off, firewall off, UAC bypass keys, sandbox DLL checks)'
  severity: info
  private: true
  logic: any
  conditions:
  - type: string_set
    min: 1
    nocase: true
    ascii: true
    wide: true
    decoded: true
    values:
    - Add-MpPreference -ExclusionPath
    - Add-MpPreference -ExclusionProcess
    - Add-MpPreference -ExclusionExtension
    - Set-MpPreference -DisableRealtimeMonitoring
    - Set-MpPreference -DisableIOAVProtection
    - Set-MpPreference -DisableBehaviorMonitoring
    - netsh advfirewall set allprofiles state off
    - netsh firewall set opmode disable
    - sc stop WinDefend
    - sc config WinDefend start= disabled
    # UAC bypass handlers written under HKCU\Software\Classes: mmc.exe itself holds the
    # bare `mscfile\shell\open\command` (FP sweep 2026-11-04).
    - Classes\ms-settings\Shell\Open\command
    - Classes\mscfile\shell\open\command
    - Classes\exefile\shell\runas\command\isolatedCommand
    - Classes\Folder\shell\open\command
  - type: string_set
    min: 2
    nocase: true
    ascii: true
    wide: true
    decoded: true
    values:
    - SbieDll.dll
    - cuckoomon.dll
    - cmdvrt32.dll
    - cmdvrt64.dll
    - dir_watch.dll
    - api_log.dll
    - wpespy.dll
    - vmcheck.dll
    - pstorec.dll
    - SxIn.dll
    - Sf2.dll
    - snxhk.dll
    - avghookx.dll
    - avghooka.dll
  family: Trojan.Win32.Generic
  tags:
  - analyst
  - helper
- id: VK-TRJ-REVSHELL-NATIVE
  title: 'Helper: native reverse shell (piped cmd.exe over a socket)'
  severity: info
  private: true
  logic: all
  conditions:
  # Browsers, VPN and remote desktop clients have the same pipe / process / socket
  # imports (msedge.dll, OpenVPNConnect.exe, librustdesk.dll): a shell stub is small.
  - type: feature_lte
    name: pe_import_count
    value: 150
  - type: import_all
    names:
    - '!CreatePipe'
    - '!PeekNamedPipe'
  - type: import_any
    names:
    - '!CreateProcessA'
    - '!CreateProcessW'
  - type: import_any
    names:
    - ws2_32.dll!connect
    - ws2_32.dll!WSAConnect
    - ws2_32.dll!WSASocketA
    - ws2_32.dll!WSASocketW
    - ws2_32.dll!ord4
  - type: string_set
    min: 1
    nocase: true
    ascii: true
    wide: true
    values:
    - cmd.exe
    - powershell.exe
  family: Trojan.Win32.Generic
  tags:
  - analyst
  - helper
- id: VK-TRJ-REVSHELL-DOTNET
  title: 'Helper: .NET reverse shell (redirected cmd.exe over a TcpClient stream)'
  severity: info
  private: true
  logic: all
  conditions:
  - type: file_type
    values:
    - dotnet
  - type: string_set
    nocase: true
    ascii: true
    wide: true
    values:
    - TcpClient
    - GetStream
    - RedirectStandardInput
    - cmd.exe
  family: Trojan.Win32.Generic
  tags:
  - analyst
  - helper
- id: VK-TRJ-REVSHELL
  title: 'Helper: reverse shell'
  severity: info
  private: true
  conditions:
  - type: rule_match
    min: 1
    ids:
    - VK-TRJ-REVSHELL-NATIVE
    - VK-TRJ-REVSHELL-DOTNET
  family: Trojan.Win32.Generic
  tags:
  - analyst
  - helper
- id: VK-TRJ-KEYLOG
  title: 'Helper: keylogger output tokens with key-state / hook imports'
  severity: info
  private: true
  logic: all
  conditions:
  - type: string_set
    min: 4
    nocase: true
    ascii: true
    wide: true
    values:
    - '[ENTER]'
    - '[BACKSPACE]'
    - '[BACK]'
    - '[TAB]'
    - '[CAPSLOCK]'
    - '[CAPS LOCK]'
    - '[SHIFT]'
    - '[CTRL]'
    - '[ALT]'
    - '[ESC]'
    - '[DEL]'
    - '[DELETE]'
    - '[SPACE]'
    - '[WIN]'
    - '[PRINTSCREEN]'
    - '[NUMLOCK]'
  - type: import_any
    names:
    - '!GetAsyncKeyState'
    - '!GetKeyState'
    - '!GetKeyboardState'
    - '!SetWindowsHookExA'
    - '!SetWindowsHookExW'
    - '!RegisterRawInputDevices'
  family: Trojan.Win32.Generic
  tags:
  - analyst
  - helper
- id: VK-TRJ-PERSIST
  title: 'Helper: persistence (Run keys, scheduled task, startup folder, Winlogon, WMI subscription, IFEO)'
  severity: info
  private: true
  conditions:
  - type: string_set
    min: 1
    nocase: true
    ascii: true
    wide: true
    decoded: true
    values:
    - Software\Microsoft\Windows\CurrentVersion\Run
    - Software\Microsoft\Windows\CurrentVersion\Policies\Explorer\Run
    - schtasks /create
    - schtasks.exe /create
    - \Start Menu\Programs\Startup
    - Microsoft\Windows NT\CurrentVersion\Winlogon
    - CommandLineEventConsumer
    - ActiveScriptEventConsumer
    - Image File Execution Options
    - AppInit_DLLs
  family: Trojan.Win32.Generic
  tags:
  - analyst
  - helper
- id: VK-TRJ-INJECT
  title: 'Helper: remote process write + execution (injection / hollowing)'
  severity: info
  private: true
  logic: all
  conditions:
  - type: string_set
    min: 2
    nocase: true
    ascii: true
    wide: true
    values:
    - WriteProcessMemory
    - NtWriteVirtualMemory
    - ZwWriteVirtualMemory
    - VirtualAllocEx
    - NtAllocateVirtualMemory
    - NtMapViewOfSection
  - type: string_set
    min: 1
    nocase: true
    ascii: true
    wide: true
    values:
    - CreateRemoteThread
    - NtCreateThreadEx
    - RtlCreateUserThread
    - QueueUserAPC
    - NtQueueApcThread
    - SetThreadContext
    - NtUnmapViewOfSection
    - ZwUnmapViewOfSection
  family: Trojan.Win32.Generic
  tags:
  - analyst
  - helper
- id: VK-TRJ-SELFDEL
  title: 'Helper: self-deletion / hidden-file command lines'
  severity: info
  private: true
  logic: any
  conditions:
  - type: string_set
    min: 1
    regex: true
    decoded: true
    values:
    - '(?i)ping(\.exe)?\s+(-n\s+\d+\s+)?127\.0\.0\.1.{0,40}&\s*del\s'
    - '(?i)choice\s+/c\s+y\s+/n\s+/d\s+y\s+/t\s+\d+.{0,40}del\s'
    - '(?i)timeout(\.exe)?\s+/t\s+\d+.{0,40}&\s*del\s'
    - '(?i)attrib(\.exe)?\s+\+[hs]\s+\+[hs]\s'
  family: Trojan.Win32.Generic
  tags:
  - analyst
  - helper
- id: VK-TRJ-RECON
  title: 'Helper: host recon (installed AV query, system / user / network discovery commands)'
  severity: info
  private: true
  conditions:
  - type: string_set
    min: 2
    nocase: true
    ascii: true
    wide: true
    decoded: true
    values:
    # Command lines with their switches: bare `systeminfo` / `net user` are substrings of
    # GetSystemInfo / "Internet user".
    - root\SecurityCenter2
    - FROM AntiVirusProduct
    - FROM FirewallProduct
    - whoami /all
    - whoami /priv
    - ipconfig /all
    - net localgroup administrators
    - netstat -ano
    - tasklist /v
    - ip-api.com/json
    - api.ipify.org
    - ipinfo.io/json
    - icanhazip.com
    - checkip.amazonaws.com
  family: Trojan.Win32.Generic
  tags:
  - analyst
  - helper
- id: VK-TRJ-STRONG2
  title: 'Helper: two strong trojan signals'
  severity: info
  private: true
  conditions:
  - type: rule_match
    min: 2
    ids:
    - VK-TRJ-CRADLE
    - VK-TRJ-C2
    - VK-TRJ-EVASION
    - VK-TRJ-REVSHELL
    - VK-TRJ-KEYLOG
  family: Trojan.Win32.Generic
  tags:
  - analyst
  - helper
- id: VK-TRJ-STRONG1-WEAK2
  title: 'Helper: one strong and two weak trojan signals'
  severity: info
  private: true
  logic: all
  conditions:
  - type: rule_match
    min: 1
    ids:
    - VK-TRJ-CRADLE
    - VK-TRJ-C2
    - VK-TRJ-EVASION
    - VK-TRJ-REVSHELL
    - VK-TRJ-KEYLOG
  - type: rule_match
    min: 2
    ids:
    - VK-TRJ-PERSIST
    - VK-TRJ-INJECT
    - VK-TRJ-SELFDEL
    - VK-TRJ-RECON
  family: Trojan.Win32.Generic
  tags:
  - analyst
  - helper
- id: VK-TROJAN-GENERIC
  title: Generic trojan (backdoor / downloader / loader behaviour chain in an unsigned PE)
  severity: high
  verdict: malware
  confidence: 85
  score: 70
  family: Trojan.Win32.Generic
  tags:
  - analyst
  - trojan
  - backdoor
  - downloader
  mitre:
  - id: T1105
    name: Ingress Tool Transfer
    tactic: Command and Control
  - id: T1071
    name: Application Layer Protocol
    tactic: Command and Control
  - id: T1562.001
    name: 'Impair Defenses: Disable or Modify Tools'
    tactic: Defense Evasion
  - id: T1547.001
    name: 'Boot or Logon Autostart Execution: Registry Run Keys / Startup Folder'
    tactic: Persistence
  logic: all
  conditions:
  - type: file_type
    values:
    - pe
  - type: authenticode
    signed: false
  # Resource-only PEs (.mui) carry help text such as the netsh firewall commands.
  - type: feature_gte
    name: pe_import_count
    value: 1
  - type: rule_match
    min: 1
    ids:
    - VK-TRJ-STRONG2
    - VK-TRJ-STRONG1-WEAK2
