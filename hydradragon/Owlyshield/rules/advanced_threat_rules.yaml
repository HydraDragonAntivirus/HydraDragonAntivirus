- rule_id: HD-EXFIL-DNS-TUNNELING-PATTERN
  name: '[EXFILTRATION] DNS Tunneling Pattern'
  description: 'Detects high-frequency DNS queries for unusual subdomains, potentially indicating DNS tunneling.'
  enabled: true
  severity: 80
  level: high
  tags:
    - network
    - exfiltration
    - dns
  mitre_attack:
    - T1071.004
  stages:
    - name: High Frequency DNS
      conditions:
        - type: OperationCount
          op_type: dns_query
          comparison: gte
          threshold: 50
    - name: Target Domain Entropy
      conditions:
        - type: EntropyThreshold
          metric: dns_domain
          comparison: gte
          threshold: 4.5
  response:
    notify_user: true
    record: true
    ask_user: true

- rule_id: HD-CRED-LSASS-DUMP-COMSVCS
  name: '[CREDENTIAL] LSASS Dump via comsvcs.dll'
  description: 'Detects attempts to dump LSASS memory using the native comsvcs.dll MiniDump export.'
  enabled: true
  severity: 100
  level: critical
  tags:
    - credential-access
    - lsass
  mitre_attack:
    - T1003.001
  stages:
    - name: Detect Rundll32 LSASS Dump
      conditions:
        - type: MultiCondition
          op: and
          conditions:
            - type: Process
              op: contains
              pattern: '(?i)rundll32\.exe'
            - type: CommandLineMatch
              patterns:
                - pattern: '(?i)comsvcs\.dll.*MiniDump.*lsass'
  response:
    terminate_process: true
    notify_user: true
