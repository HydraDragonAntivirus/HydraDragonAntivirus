name: dotnet-hydradragonlauncher-ci

on:
  push:
    branches: ["**"]
    paths:
      - 'HydraDragonLauncher/**'
      - '.github/workflows/dotnet-launcher.yml'
  pull_request:
    branches: ["**"]
    paths:
      - 'HydraDragonLauncher/**'
      - '.github/workflows/dotnet-launcher.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
    - name: Enable long paths
      run: git config --global core.longpaths true

    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore HydraDragonLauncher/HydraDragonLauncher.sln

    - name: Publish Launcher
      run: dotnet publish HydraDragonLauncher/HydraDragonLauncher/HydraDragonLauncher.csproj -c Release -r win-x64 --self-contained false

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: launcher-release
        path: HydraDragonLauncher/HydraDragonLauncher/bin/Release/net8.0-windows/publish/
