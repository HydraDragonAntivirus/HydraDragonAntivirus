<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Threat Response Settings</title>
	<script src="nav.js"></script>

	<script>
		document.addEventListener("DOMContentLoaded", function() {
	
			const { invoke } = window.__TAURI__.core;
			const { listen } = window.__TAURI__.event;

			const threatSettingsStatus = document.getElementById('threat_settings_status');
			let currentSettings = null;

			const engines = [
				{ key: 'clamav', name: 'ClamAV' },
				{ key: 'yara', name: 'YARA' },
				{ key: 'yarax', name: 'YARA-X' },
				{ key: 'hydradragonstatic', name: 'HydraDragon Static' },
				{ key: 'behavioral', name: 'Behavioral Analysis' },
				{ key: 'pua', name: 'PUA Detection' }
			];

			const actions = [
				{ value: 'do_nothing', label: 'Do Nothing' },
				{ value: 'notify_only', label: 'Notify Only' },
				{ value: 'suspend', label: 'Suspend Process' },
				{ value: 'deny_access', label: 'Deny Access' },
				{ value: 'quarantine', label: 'Quarantine File' },
				{ value: 'kill', label: 'Kill Process' },
				{ value: 'kill_and_quarantine', label: 'Kill & Quarantine' },
				{ value: 'kill_and_remove', label: 'Kill & Remove' },
				{ value: 'ask_user', label: 'Ask User' }
			];

			//
			// Page initialisation
			//
			invoke('settings_load_page_state')
			.then((res) => {
				console.log("res: ", res);
				const jsonObject = JSON.parse(res);
				currentSettings = jsonObject;
				
				// Load threat response settings
				if (jsonObject.threat_response && jsonObject.threat_response.engine_configs) {
					const configs = jsonObject.threat_response.engine_configs;
					
					engines.forEach(engine => {
						const config = configs[engine.key] || { trust_level: 100, action: 'kill_and_quarantine' };
						
						const trustSlider = document.getElementById(`trust_${engine.key}`);
						const trustValue = document.getElementById(`trust_value_${engine.key}`);
						const actionSelect = document.getElementById(`action_${engine.key}`);
						
						if (trustSlider && trustValue) {
							trustSlider.value = config.trust_level;
							trustValue.textContent = config.trust_level + '%';
						}
						
						if (actionSelect) {
							actionSelect.value = config.action;
						}
					});
				}
			})
			.catch((error) => console.error("Invoke error:", error));

			// Trust level slider updates
			engines.forEach(engine => {
				const slider = document.getElementById(`trust_${engine.key}`);
				const valueDisplay = document.getElementById(`trust_value_${engine.key}`);
				
				if (slider && valueDisplay) {
					slider.addEventListener('input', function() {
						valueDisplay.textContent = this.value + '%';
					});
				}
			});

			//
			// Events
			//
			var update_threat_settings = function(event) {
				event.preventDefault();

				if (!currentSettings) {
					threatSettingsStatus.textContent = "Settings not loaded yet.";
					return;
				}

				// Build engine configs
				const engine_configs = {};
				engines.forEach(engine => {
					const trustSlider = document.getElementById(`trust_${engine.key}`);
					const actionSelect = document.getElementById(`action_${engine.key}`);
					
					engine_configs[engine.key] = {
						trust_level: parseInt(trustSlider.value, 10),
						action: actionSelect.value
					};
				});

				// Update current settings with new threat response
				currentSettings.threat_response = {
					engine_configs: engine_configs
				};

				invoke('settings_update_settings', { settings: JSON.stringify(currentSettings) })
				.then((response) => {
					console.log("response: ", response)
					threatSettingsStatus.textContent = "Threat settings updated successfully.";
					threatSettingsStatus.style.color = "#4CAF50";
				})
				.catch((error) => {
					threatSettingsStatus.textContent = "Threat settings update failed.";
					threatSettingsStatus.style.color = "#f44336";
					console.error("Invoke error:", error);
				});
			};

			var reset_to_defaults = function(event) {
				event.preventDefault();
				
				engines.forEach(engine => {
					const trustSlider = document.getElementById(`trust_${engine.key}`);
					const trustValue = document.getElementById(`trust_value_${engine.key}`);
					const actionSelect = document.getElementById(`action_${engine.key}`);
					
					if (trustSlider && trustValue) {
						trustSlider.value = 100;
						trustValue.textContent = '100%';
					}
					
					if (actionSelect) {
						actionSelect.value = 'kill_and_quarantine';
					}
				});
				
				threatSettingsStatus.textContent = "Reset to defaults (not saved yet).";
				threatSettingsStatus.style.color = "#ff9800";
			};

			var threat_settings_form = document.getElementById("threat_settings_form");
			threat_settings_form.addEventListener('submit', update_threat_settings, false);

			var reset_button = document.getElementById("reset_defaults_btn");
			reset_button.addEventListener('click', reset_to_defaults, false);

		});
	</script>

	<style>
		.engine-config {

			border-radius: 5px;
			border-left: 3px solid #4CAF50;
		}
		
		.engine-config h3 {
			margin-top: 0;
			color: #4CAF50;
		}
		
		.config-row {

			gap: 20px;
			align-items: center;
			margin: 10px 0;
		}
		
		.config-item {
			flex: 1;
		}
		
		.config-item label {
			display: block;
			margin-bottom: 5px;
			color: #ccc;
		}
		
		.trust-slider {
			width: 100%;
			height: 8px;
			border-radius: 5px;
			background: #444;
			outline: none;
			-webkit-appearance: none;
		}
		
		.trust-slider::-webkit-slider-thumb {
			-webkit-appearance: none;
			appearance: none;
			width: 20px;
			height: 20px;
			border-radius: 50%;
			background: #4CAF50;
			cursor: pointer;
		}
		
		.trust-slider::-moz-range-thumb {
			width: 20px;
			height: 20px;
			border-radius: 50%;
			background: #4CAF50;
			cursor: pointer;
			border: none;
		}
		
		.trust-value {
			display: inline-block;
			min-width: 45px;
			text-align: right;
			font-weight: bold;
			color: #4CAF50;
		}
		
		select {
			width: 100%;
			padding: 8px;
			background: #333;
			color: #fff;
			border: 1px solid #555;
			border-radius: 4px;
		}
		
		.button-group {
			display: flex;
			gap: 10px;
			margin-top: 20px;
		}
		
		.button-group button {
			flex: 1;
		}
		
		#reset_defaults_btn {
			background: #ff9800;
		}
		
		#reset_defaults_btn:hover {
			background: #e68900;
		}
	</style>
