- rule_id: HD-PRIVACY-UNAUTHORIZED-SCREENCAP
  name: '[PRIVACY] Unauthorized Screen Capture Detection'
  description: 'Detects unauthorized screenshot and screen recording activity by monitoring GDI (BitBlt) and DXGI (Desktop Duplication) capture behaviors from non-whitelisted processes.'
  enabled: true
  severity: 85
  level: high
  tags:
    - privacy
    - screenshot
    - exfiltration
  mitre_attack:
    - T1113
  stages:
    - name: DXGI Desktop Duplication Init
      conditions:
        - type: MultiCondition
          op: and
          conditions:
            - type: Process
              op: contains
              pattern: '.exe'
            - type: ExtensionPattern
              patterns:
                - '.bmp'
                - '.jpg'
                - '.png'
              op_type: write
    - name: Exfiltration Pattern
      conditions:
        - type: MultiCondition
          op: and
          conditions:
            - type: OperationCount
              op_type: BitBlt
              comparison: gte
              threshold: 5
            - type: Network
              op: connect
              dest_pattern: '.*'
  response:
    ask_user: true
    notify_user: true
    record: true
    status_access_denied: true

- rule_id: HD-EVASION-APPLOCKER-BYPASS-LOLBAS
  name: '[EVASION] AppLocker Bypass - InstallUtil/Regasm Abuse'
  description: 'Detects execution of signed Microsoft binaries like InstallUtil.exe or Regasm.exe to run unauthorized code.'
  enabled: true
  severity: 85
  level: high
  tags:
    - evasion
    - lolbas
    - applocker-bypass
  mitre_attack:
    - T1218.004
    - T1218.009
  stages:
    - name: Detect Signed Binary Abuse
      conditions:
        - type: MultiCondition
          op: and
          conditions:
            - type: Process
              op: contains
              pattern: '(?i)(InstallUtil|Regasm|Regsvcs|MSBuild|Csc)\.exe'
            - type: CommandLineMatch
              patterns:
                - pattern: '(?i)(\.exe|\.dll|\.csproj|\.txt)'
            - type: MultiCondition
              op: or
              conditions:
                - type: ProcessTree
                  parent_patterns: ['(?i)(powershell|cmd|wscript|cscript)\.exe']
                - type: File
                  op: write
                  path_pattern: '(?i)\\Users\\Public\\.*'
                - type: Network
                  op: connect
                  dest_pattern: '.*'
  response:
    ask_user: true
    notify_user: true
    record: true

- rule_id: HD-PRIVESC-UAC-BYPASS-FODHELPER
