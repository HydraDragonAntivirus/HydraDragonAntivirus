    - pattern: "%SystemRoot%/WinSxS/*/TiWorker.exe"
      must_be_signed: true
      is_absolute: true
      signers: ["*Microsoft*"]
    - pattern: "%SystemRoot%/UUS/*/MoUsoCoreWorker.exe"
      must_be_signed: true
      is_absolute: true
