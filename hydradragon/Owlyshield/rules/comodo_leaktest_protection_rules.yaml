    hook_dll_injection:
      orderless: true
      apis:
        - "user32.dll!SetWinEventHook"
      api_args_contain:
        - ".dll"
        - "AppData"
        - "Temp"
      min_matches: 1

    target_process_elevation:
      orderless: true
      target_process_privilege_level: ["system", "administrator"]
      min_matches: 1

  detection_logic:
    and:
      - condition: "setwineventhook_call"
      - condition: "hook_dll_injection"

  response:
    notify_user: true
    ask_user: true
    terminate_process: true
    record: true

  tags: ["injection", "hook", "code-injection"]
  mitre_attack: ["T1547.015", "T1179"]

