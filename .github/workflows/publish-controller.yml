name: Publish Controller

on:
  push:
    branches: [development-version]
    paths:
      - 'hydradragoncontroller/**'
      - '.github/workflows/publish-launcher.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-stage:
    if: |
      !startsWith(github.ref_name, 'auto-update-') &&
      !contains(github.event.head_commit.message, 'chore(controller): update binaries and lockfile') &&
      github.event.head_commit.author.name != 'github-actions[bot]'
    runs-on: windows-2022
    
    steps:
    - name: Enable Git long paths
      run: git config --global core.longpaths true
      
    - uses: actions/checkout@v6
    
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc, wasm32-unknown-unknown
        
    - name: Set up MSVC Developer Command Prompt
      uses: TheMrMilchmann/setup-msvc-dev@v4
      with:
        arch: x64

    - name: Install Trunk
      uses: taiki-e/install-action@v2
      with:
        tool: trunk
    
    - name: Update Controller lockfile
      shell: pwsh
      run: |
        cargo generate-lockfile --manifest-path hydradragoncontroller/Cargo.toml
        cargo update --manifest-path hydradragoncontroller/Cargo.toml
        cargo update --manifest-path hydradragoncontroller/ui/Cargo.toml

    - name: Format Rust sources
      shell: pwsh
      run: |
        rustup component add rustfmt
        cargo fmt --manifest-path hydradragoncontroller/Cargo.toml --all
        cargo fmt --manifest-path hydradragoncontroller/ui/Cargo.toml --all
    
    - name: Build UI
      working-directory: hydradragoncontroller/ui
      run: trunk build --release -d ../dist
    
    - name: Build Release
      working-directory: HydraDragonController
      run: cargo build --release --verbose
    
    - name: Run tests
      working-directory: HydraDragonController
      run: cargo test --release --verbose
    
    - name: Stage
      shell: pwsh
      run: |
        $dist = "hydradragon/HydraDragonController"
        New-Item -ItemType Directory -Force -Path $dist
        Copy-Item "hydradragoncontroller/target/release/hydradragoncontroller.exe" "$dist/" -Force
    
    - name: Check for publishable changes
      id: check_changes
      uses: ./.github/actions/check-publishable-changes
      with:
        paths: |
          hydradragon/HydraDragonController
          hydradragoncontroller/Cargo.lock
          hydradragoncontroller/build.rs
          hydradragoncontroller/src
          hydradragoncontroller/ui/src
    
    - name: Create PR
      if: steps.check_changes.outputs.changed == 'true'
      uses: peter-evans/create-pull-request@v8
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "chore(controller): update binaries and lockfile"
        title: "Update Controller Binaries and Lockfile"
        add-paths: |
          ${{ steps.check_changes.outputs.publishable_files }}
        branch: "auto-update-controller"
        base: ${{ github.ref_name }}
        delete-branch: true
        labels: binaries, automated-pr, controller, development-version
