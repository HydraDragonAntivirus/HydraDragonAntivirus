# TEST #21: InfoSend:DNS Test — Detect DNS exfiltration and C2 beaconing
- name: "HEUR:Win.InfoSend.DNSExfiltration.gen"
  author: "HydraDragon"
  date: "2026-03-26"
  status: production
  level: high
  severity: 85
  description: |
    Detects rapid or high-frequency DNS queries from processes, indicating:
    - DNS-based C2 communication
    - Data exfiltration encoding
    - DNS tunneling attacks
    COMODO Test #21: InfoSend:DNS Test
    Alerts on suspicious DNS patterns.
  debug: false

  named_conditions:
    dns_high_frequency:
      orderless: true
      network_operations: ["dns_query"]
      query_rate_threshold: 50  # queries per minute
      query_window_seconds: 60
      min_matches: 1

    dns_suspicious_entropy:
      orderless: true
      network_operations: ["dns_query"]
      domain_entropy_score: ">= 3.5"  # High entropy = obfuscated/encoded
      min_matches: 5

    dns_rapid_succession:
      orderless: true
      network_operations: ["dns_query"]
      time_delta_between_queries_ms: "< 100"  # Unnaturally fast
      consecutive_queries: ">= 10"
      min_matches: 1

    process_no_network_need:
      orderless: true
      process_name_exclude:
        - "chrome.exe"
        - "firefox.exe"
        - "msedge.exe"
        - "explorer.exe"
        - "outlook.exe"
        - "svchost.exe"
      min_matches: 1

  detection_logic:
    and:
      - or:
          - condition: "dns_high_frequency"
          - condition: "dns_suspicious_entropy"
          - condition: "dns_rapid_succession"
      - condition: "process_no_network_need"

  response:
    notify_user: true
    ask_user: false
    record: true
    block_dns: false
    alert_level: "warning"

  tags: ["exfiltration", "dns", "c2", "network"]
  mitre_attack: ["T1041", "T1071.004"]

