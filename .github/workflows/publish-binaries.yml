name: Publish Binaries (Multi-Job)

on:
  push:
    branches: ["**"]
    paths:
      - '.github/workflows/publish-binaries.yml'
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to create/update PR on"
        required: true
        default: "update-binaries"

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  WDK_URL: https://go.microsoft.com/fwlink/?linkid=2335869

jobs:
  # --- GROUP 1: MSBuild Projects (Separated) ---
  
  build-tinyantivirus:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up MSVC Developer Command Prompt
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: Build TinyAntivirus
        run: msbuild TinyAntivirus/TinyAntivirus.sln /p:Configuration=Release /p:Platform=x64
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: bin-tinyantivirus
          path: TinyAntivirus/x64/Release/TinyAvConsole.exe

  build-hydradragonav:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Set up MSVC Developer Command Prompt
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: Build HydraDragonAV
        run: msbuild HydraDragonAV/HydraDragonAV.sln /p:Configuration=Release /p:Platform=x64
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: bin-hydradragonav
          path: HydraDragonAV/x64/Release/HydraDragonAV.exe

  build-mbrfilter:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Set up MSVC Developer Command Prompt
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: Setup WDK
        shell: pwsh
        run: |
          $wdkSetupPath = "$Env:TEMP\wdksetup.exe"
          (New-Object Net.WebClient).DownloadFile('${{env.WDK_URL}}', $wdkSetupPath)
          Start-Process -FilePath $wdkSetupPath -ArgumentList "/quiet" -NoNewWindow -Wait
      - name: Build MBRFilter
        run: msbuild "MBRFilter/MBRFilter Driver.sln" /p:Configuration=Release /p:Platform=x64
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: bin-mbrfilter
          path: |
            MBRFilter/x64/Win8Release/*.sys
            MBRFilter/x64/Win8Release/*.inf
            MBRFilter/x64/Win8Release/*.cat

  build-pyasprotection:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Set up MSVC Developer Command Prompt
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: Setup WDK
        shell: pwsh
        run: |
          $wdkSetupPath = "$Env:TEMP\wdksetup.exe"
          (New-Object Net.WebClient).DownloadFile('${{env.WDK_URL}}', $wdkSetupPath)
          Start-Process -FilePath $wdkSetupPath -ArgumentList "/quiet" -NoNewWindow -Wait
      - name: Build PYAS Protection
        run: msbuild PYAS_Protection/SimplePYASProtection.sln /p:Configuration=Release /p:Platform=x64
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: bin-pyasprotection
          path: |
            PYAS_Protection/x64/Release/SimplePYASProtection.sys
            PYAS_Protection/x64/Release/SimplePYASProtection.inf
            PYAS_Protection/x64/Release/SimplePYASProtection.cat

  build-owlyshield-minifilter:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Set up MSVC Developer Command Prompt
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: Setup WDK
        shell: pwsh
        run: |
          $wdkSetupPath = "$Env:TEMP\wdksetup.exe"
          (New-Object Net.WebClient).DownloadFile('${{env.WDK_URL}}', $wdkSetupPath)
          Start-Process -FilePath $wdkSetupPath -ArgumentList "/quiet" -NoNewWindow -Wait
      - name: Build Owlyshield Minifilter
        run: msbuild Owlyshield/owlyshield_minifilter/RWatch.sln /p:Configuration=Release /p:Platform=x64
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: bin-owlyshield-minifilter
          path: |
            Owlyshield/owlyshield_minifilter/x64/Release/*.sys
            Owlyshield/owlyshield_minifilter/x64/Release/*.inf
            Owlyshield/owlyshield_minifilter/x64/Release/*.cat

  build-reddbg:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Set up MSVC Developer Command Prompt
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: Build RedDbg
        run: msbuild Owlyshield/RedDbg/RedDbg/RedDbg.sln /p:Configuration=Release /p:Platform=x64
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: bin-reddbg
          path: |
            Owlyshield/RedDbg/RedDbg/x64/ReleaseX64Kernel/*.sys
            Owlyshield/RedDbg/RedDbg/x64/ReleaseX64Kernel/*.inf
            Owlyshield/RedDbg/RedDbg/x64/ReleaseX64Kernel/*.cat

  # --- GROUP 2: Dotnet Projects (Separated) ---

  build-megadumper:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Publish MegaDumper
        run: dotnet publish MegaDumper/MegaDumper/MegaDumper.csproj -c Release -r win-x64 --self-contained false -o artifacts/
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: bin-megadumper
          path: artifacts/

  build-launcher:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Publish Launcher
        run: dotnet publish HydraDragonLauncher/HydraDragonLauncher/HydraDragonLauncher.csproj -c Release -r win-x64 --self-contained false -o artifacts/
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: bin-launcher
          path: artifacts/

  build-service:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Publish Service
        run: dotnet publish HydraDragonService/HydraDragonService/HydraDragonService.csproj -c Release -r win-x64 --self-contained false -o artifacts/
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: bin-service
          path: artifacts/

  # --- GROUP 3: Rust Projects (Separated) ---

  build-owlyshield-rust:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install yasm
        run: choco install nasm
      - name: Build Owlyshield Rust
        working-directory: Owlyshield/owlyshield_predict
        run: cargo build --release
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: bin-owlyshield-rust
          path: Owlyshield/owlyshield_predict/target/release/owlyshield_ransom.exe

  build-firewall-rust:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install Assembly Tools (yasm)
        run: choco install nasm
      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Build UI (Leptos)
        working-directory: HydraDragonFirewall/hydradragonfirewall/ui
        run: trunk build --release -d ../dist
      - name: Build Firewall Rust
        working-directory: HydraDragonFirewall/hydradragonfirewall
        run: cargo build --release
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: bin-firewall-rust
          path: |
            HydraDragonFirewall/hydradragonfirewall/target/release/hydradragonfirewall.exe
            HydraDragonFirewall/hydradragonfirewall/target/release/hydradragonfirewall.dll

  build-sanctum:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Set up MSVC Developer Command Prompt
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
      - name: Update Sanctum Cargo.lock
        working-directory: Sanctum
        run: cargo update
      - name: Update Sanctum driver Cargo.lock
        working-directory: Sanctum/driver
        run: cargo update
      - name: Install Cargo Make
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-make
      - name: Install rust-script
        run: cargo install rust-script --version 0.30.0
      - name: Setup WDK
        shell: pwsh
        run: |
          $wdkSetupPath = "$Env:TEMP\wdksetup.exe"
          (New-Object Net.WebClient).DownloadFile('${{env.WDK_URL}}', $wdkSetupPath)
          Start-Process -FilePath $wdkSetupPath -ArgumentList "/quiet" -NoNewWindow -Wait
      - name: Prepare Driver Build Environment
        working-directory: Sanctum/driver
        shell: pwsh
        run: |
          # Create target directory if it doesn't exist
          New-Item -ItemType Directory -Force -Path "target" | Out-Null
          
          # Fetch dependencies to ensure wdk-build is available
          cargo fetch
          
          # Copy rust-driver-makefile.toml from wdk-build crate to target directory
          $wdkBuildPath = (cargo metadata --format-version 1 | ConvertFrom-Json).packages | Where-Object { $_.name -eq "wdk-build" } | Select-Object -First 1 -ExpandProperty manifest_path | Split-Path
          $sourceFile = Join-Path $wdkBuildPath "rust-driver-makefile.toml"
          $destFile = "target\rust-driver-makefile.toml"
          
          if (Test-Path $sourceFile) {
            Write-Host "Copying $sourceFile to $destFile"
            Copy-Item $sourceFile $destFile -Force
          } else {
            Write-Host "Warning: Could not find rust-driver-makefile.toml at $sourceFile"
          }
      - name: Setup Windows SDK (for signtool)
        shell: pwsh
        run: |
          $sdkSetupPath = "$Env:TEMP\sdksetup.exe"
          Write-Host "Downloading Windows SDK..."
          (New-Object Net.WebClient).DownloadFile('https://go.microsoft.com/fwlink/?linkid=2272610', $sdkSetupPath)
          Write-Host "Installing Windows SDK..."
          Start-Process -FilePath $sdkSetupPath -ArgumentList "/quiet", "/norestart", "/features", "OptionId.SigningTools" -NoNewWindow -Wait
          Write-Host "Windows SDK installed successfully"
      - name: Build Sanctum (with ELAM hash auto-update)
        working-directory: Sanctum
        shell: pwsh
        run: |
          # === DRIVER BUILD WITH ELAM HASH AUTO-UPDATE ===
          cd driver
          $driverBuildProfile = "release"
          $driverPackagePath = "target\$driverBuildProfile\sanctum_package\sanctum.sys"

          function Invoke-Native {
            param(
              [Parameter(Mandatory = $true)][string]$Command,
              [string[]]$Arguments = @()
            )

            & $Command @Arguments
            if ($LASTEXITCODE -ne 0) {
              $argText = $Arguments -join " "
              throw "Command failed with exit code ${LASTEXITCODE}: $Command $argText"
            }
          }

          function Restore-WdkMakefile {
            New-Item -ItemType Directory -Force -Path "target" | Out-Null
            Invoke-Native "cargo" @("fetch")

            $metadataJson = & cargo metadata --format-version 1
            if ($LASTEXITCODE -ne 0) {
              throw "Command failed with exit code ${LASTEXITCODE}: cargo metadata --format-version 1"
            }

            $metadata = $metadataJson | ConvertFrom-Json
            $wdkBuildManifest = $metadata.packages | Where-Object { $_.name -eq "wdk-build" } | Select-Object -First 1 -ExpandProperty manifest_path
            if (-not $wdkBuildManifest) {
              throw "Could not find wdk-build in cargo metadata."
            }

            $sourceFile = Join-Path (Split-Path $wdkBuildManifest) "rust-driver-makefile.toml"
            $destFile = "target\rust-driver-makefile.toml"
            if (-not (Test-Path $sourceFile)) {
              throw "Could not find rust-driver-makefile.toml at $sourceFile"
            }

            Write-Host "Copying $sourceFile to $destFile"
            Copy-Item $sourceFile $destFile -Force
          }

          function Assert-DriverPackage {
            param([Parameter(Mandatory = $true)][string]$Stage)

            if (-not (Test-Path -LiteralPath $driverPackagePath -PathType Leaf)) {
              throw "Driver package not found after $Stage`: $driverPackagePath"
            }
          }

          Restore-WdkMakefile
          
          # Step 1: Generate ELAM certificate
          Write-Host "=== Step 1: Generating ELAM certificate ==="
          .\cert.ps1
          
          # Step 2: Initial build
          Write-Host "`n=== Step 2: Initial driver build ($driverBuildProfile) ==="
          Invoke-Native "cargo" @("make", $driverBuildProfile)
          Assert-DriverPackage "initial build"
          
          # Step 3: Sign the driver
          Write-Host "`n=== Step 3: Signing driver with sign.bat $driverBuildProfile ==="
          Invoke-Native ".\sign.bat" @($driverBuildProfile)
          Assert-DriverPackage "initial signing"
          
          # Step 4: Extract the To-Be-Signed Hash
          Write-Host "`n=== Step 4: Extracting To-Be-Signed Hash ==="
          $certOutput = & certmgr.exe -v $driverPackagePath
          if ($LASTEXITCODE -ne 0) {
            throw "Command failed with exit code ${LASTEXITCODE}: certmgr.exe -v $driverPackagePath"
          }
          $hashLines = $certOutput | Select-String -Pattern "Content Hash \(To-Be-Signed Hash\)::" -Context 0,3
          
          if ($hashLines) {
              $hashText = $hashLines[0].Context.PostContext -join ""
              $hash = $hashText -replace '\s+', '' -replace '0x', ''
              Write-Host "Extracted hash: $hash"
              
              # Step 5: Update build.rs with the new hash
              Write-Host "`n=== Step 5: Updating build.rs with extracted hash ==="
              $buildRsPath = "build.rs"
              $buildRsContent = Get-Content $buildRsPath -Raw
              $buildRsContent = $buildRsContent -replace 'L"[0-9A-F]+\\0"', "L`"$hash\0`""
              Set-Content $buildRsPath $buildRsContent
              Write-Host "Updated build.rs with hash: $hash"
              
              # Step 6: Clean and rebuild with correct hash
              Write-Host "`n=== Step 6: Rebuilding with correct hash ($driverBuildProfile) ==="
              Invoke-Native "cargo" @("clean")
              Restore-WdkMakefile
              Invoke-Native "cargo" @("make", $driverBuildProfile)
              Assert-DriverPackage "hash rebuild"
              
              # Step 7: Sign again
              Write-Host "`n=== Step 7: Final signing with sign.bat $driverBuildProfile ==="
              Invoke-Native ".\sign.bat" @($driverBuildProfile)
              Assert-DriverPackage "final signing"
              Set-Content -Path "sanctum_elam_hash.txt" -Value $hash -NoNewline

              Write-Host "`n=== SUCCESS: Driver built and signed with matching hash ==="
          } else {
              Write-Host "ERROR: Could not extract hash from certificate"
              exit 1
          }
          
          cd ..
          
          # === USERMODE COMPONENTS ===
          Write-Host "`n=== Building usermode components ==="
          Invoke-Native "cargo" @("make", "release")
          
          Write-Host "`n=== Signing PPL runner ==="
          Invoke-Native ".\sign_ppl_runner.bat"
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: bin-sanctum
          path: |
            Sanctum/driver/target/release/sanctum_package/*.sys
            Sanctum/driver/sanctum_elam_hash.txt
            Sanctum/target/release/sanctum_ppl_runner.exe
            Sanctum/target/release/elam_installer.exe
            Sanctum/target/release/um_engine.exe
            Sanctum/target/release/malware.exe
            Sanctum/target/release/server.exe
            Sanctum/target/release/app.exe
            Sanctum/target/release/sanctum.dll
            Sanctum/Cargo.lock
            Sanctum/driver/Cargo.lock

  # --- FINAL STAGE: Collect and PR ---

  stage-and-pr:
    needs: 
      - build-tinyantivirus
      - build-hydradragonav
      - build-mbrfilter
      - build-pyasprotection
      - build-owlyshield-minifilter
      - build-reddbg
      - build-megadumper
      - build-launcher
      - build-service
      - build-owlyshield-rust
      - build-firewall-rust
      - build-sanctum
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: .

      - name: Organize Binaries
        id: organize
        shell: pwsh
        run: |
          $distRoot = "hydradragon"
          $elamHash = "not found"
          
          # Ensure distribution root and subfolders exist
          $folders = @(
            "$distRoot/TinyAntivirus",
            "$distRoot/HydraDragonAV",
            "$distRoot/MBRFilter",
            "$distRoot/SimplePYASProtection",
            "$distRoot/Owlyshield/OwlyshieldRansomFilter",
            "$distRoot/Owlyshield/Owlyshield Service",
            "$distRoot/Owlyshield/RedDbg",
            "$distRoot/HydraDragonDumper",
            "$distRoot/HydraDragonLauncher",
            "$distRoot/HydraDragonService",
            "$distRoot/Sanctum/AppData",
            "$distRoot/Sanctum/System32",
            "$distRoot/sanctum_test_malware"
          )
          foreach ($folder in $folders) {
            if (-not (Test-Path $folder)) {
              New-Item -ItemType Directory -Force -Path $folder
            }
          }

          function Get-PublishRoot {
            param(
              [Parameter(Mandatory = $true)][string]$ArtifactDir,
              [Parameter(Mandatory = $true)][string]$RequiredFile
            )

            if (-not (Test-Path -LiteralPath $ArtifactDir -PathType Container)) {
              throw "Missing artifact directory: $ArtifactDir"
            }

            $directFile = Join-Path $ArtifactDir $RequiredFile
            if (Test-Path -LiteralPath $directFile -PathType Leaf) {
              return (Resolve-Path -LiteralPath $ArtifactDir).Path
            }

            $nestedFile = Get-ChildItem -LiteralPath $ArtifactDir -Filter $RequiredFile -Recurse -File | Select-Object -First 1
            if (-not $nestedFile) {
              throw "Could not find $RequiredFile under $ArtifactDir"
            }

            return $nestedFile.Directory.FullName
          }

          function Sync-PublishTree {
            param(
              [Parameter(Mandatory = $true)][string]$Source,
              [Parameter(Mandatory = $true)][string]$Destination
            )

            if (-not (Test-Path -LiteralPath $Source -PathType Container)) {
              throw "Missing publish source: $Source"
            }

            if (Test-Path -LiteralPath $Destination) {
              Remove-Item -LiteralPath $Destination -Recurse -Force
            }

            New-Item -ItemType Directory -Force -Path $Destination | Out-Null
            Get-ChildItem -LiteralPath $Source -Force |
              Copy-Item -Destination $Destination -Recurse -Force
          }

          # --- TinyAntivirus ---
          $tinyAV = Get-ChildItem "bin-tinyantivirus/" -Filter "TinyAvConsole.exe" -Recurse
          $tinyAV | Copy-Item -Destination "$distRoot/TinyAntivirus/" -Force
          New-Item -ItemType Directory -Force -Path "TinyAntivirus/x64/Release"
          $tinyAV | Copy-Item -Destination "TinyAntivirus/x64/Release/" -Force

          # --- HydraDragonAV ---
          $av = Get-ChildItem "bin-hydradragonav/" -Filter "HydraDragonAV.exe" -Recurse
          $av | Copy-Item -Destination "$distRoot/HydraDragonAV/" -Force
          New-Item -ItemType Directory -Force -Path "HydraDragonAV/x64/Release"
          $av | Copy-Item -Destination "HydraDragonAV/x64/Release/" -Force

          # --- MBRFilter ---
          $mbr = Get-ChildItem "bin-mbrfilter/" -Filter "*" -Recurse
          $mbr | Copy-Item -Destination "$distRoot/MBRFilter/" -Force
          New-Item -ItemType Directory -Force -Path "MBRFilter/x64/Release"
          $mbr | Copy-Item -Destination "MBRFilter/x64/Release/" -Force

          # --- SimplePYASProtection ---
          $pyas = Get-ChildItem "bin-pyasprotection/" -Filter "*" -Recurse
          $pyas | Copy-Item -Destination "$distRoot/SimplePYASProtection/" -Force
          New-Item -ItemType Directory -Force -Path "PYAS_Protection/x64/Release"
          $pyas | Copy-Item -Destination "PYAS_Protection/x64/Release/" -Force

          # --- Owlyshield ---
          $owlyMinifilter = Get-ChildItem "bin-owlyshield-minifilter/" -Filter "*" -Recurse
          $owlyMinifilter | Copy-Item -Destination "$distRoot/Owlyshield/OwlyshieldRansomFilter/" -Force
          New-Item -ItemType Directory -Force -Path "Owlyshield/owlyshield_minifilter/x64/Release"
          $owlyMinifilter | Copy-Item -Destination "Owlyshield/owlyshield_minifilter/x64/Release/" -Force
          
          $owlyRust = Get-ChildItem "bin-owlyshield-rust/" -Filter "owlyshield_ransom.exe" -Recurse
          $owlyRust | Copy-Item -Destination "$distRoot/Owlyshield/Owlyshield Service/" -Force
          New-Item -ItemType Directory -Force -Path "Owlyshield/owlyshield_predict/target/release"
          $owlyRust | Copy-Item -Destination "Owlyshield/owlyshield_predict/target/release/" -Force

          # --- RedDbg ---
          $reddbgDrv = Get-ChildItem "bin-reddbg/" -Filter "RedDbgDrv.*" -Recurse
          $reddbgDrv | Copy-Item -Destination "$distRoot/Owlyshield/RedDbg/" -Force
          
          New-Item -ItemType Directory -Force -Path "Owlyshield/RedDbg/RedDbg/x64/ReleaseX64Kernel"
          $reddbgDrv | Copy-Item -Destination "Owlyshield/RedDbg/RedDbg/x64/ReleaseX64Kernel/" -Force

          # --- Dumper ---
          $dumper = Get-ChildItem "bin-megadumper/" -Filter "*" -Recurse
          $dumper | Copy-Item -Destination "$distRoot/HydraDragonDumper/" -Force
          New-Item -ItemType Directory -Force -Path "MegaDumper/MegaDumper/bin/Release/net8.0"
          $dumper | Copy-Item -Destination "MegaDumper/MegaDumper/bin/Release/net8.0/" -Force
          if (Test-Path "$distRoot/HydraDragonDumper/MegaDumper.exe") {
            Move-Item "$distRoot/HydraDragonDumper/MegaDumper.exe" "$distRoot/HydraDragonDumper/HydraDragonDumper.exe" -Force
          }

          # --- Firewall ---
          $fwRust = Get-ChildItem "bin-firewall-rust/" -Filter "hydradragonfirewall.*" -Recurse
          $fwRust | Copy-Item -Destination "$distRoot/HydraDragonFirewall/" -Force
          New-Item -ItemType Directory -Force -Path "HydraDragonFirewall/hydradragonfirewall/target/release"
          $fwRust | Copy-Item -Destination "HydraDragonFirewall/hydradragonfirewall/target/release/" -Force

          # --- Infrastructure ---
          $launcherRoot = Get-PublishRoot -ArtifactDir "bin-launcher" -RequiredFile "HydraDragonLauncher.exe"
          Sync-PublishTree -Source $launcherRoot -Destination "$distRoot/HydraDragonLauncher"
          Sync-PublishTree -Source $launcherRoot -Destination "HydraDragonLauncher/HydraDragonLauncher/bin/Release/net8.0"

          $serviceRoot = Get-PublishRoot -ArtifactDir "bin-service" -RequiredFile "HydraDragonService.exe"
          Sync-PublishTree -Source $serviceRoot -Destination "$distRoot/HydraDragonService"
          Sync-PublishTree -Source $serviceRoot -Destination "HydraDragonService/HydraDragonService/bin/Release/net8.0"

          # --- Sanctum Stack ---
          # System/Kernel Files (to AppData)
          Get-ChildItem "bin-sanctum/" -Filter "sanctum.sys" -Recurse | Select-Object -First 1 | Copy-Item -Destination "$distRoot/Sanctum/AppData/" -Force
          Get-ChildItem "bin-sanctum/" -Filter "sanctum_ppl_runner.exe" -Recurse | Select-Object -First 1 | Copy-Item -Destination "$distRoot/Sanctum/AppData/" -Force
          
          # DLLs (to System32)
          Get-ChildItem "bin-sanctum/" -Filter "sanctum.dll" -Recurse | Select-Object -First 1 | Copy-Item -Destination "$distRoot/Sanctum/System32/" -Force
          
          # Root Modules
          Get-ChildItem "bin-sanctum/" -Filter "elam_installer.exe" -Recurse | Select-Object -First 1 | Copy-Item -Destination "$distRoot/Sanctum/" -Force
          Get-ChildItem "bin-sanctum/" -Filter "um_engine.exe" -Recurse | Select-Object -First 1 | Copy-Item -Destination "$distRoot/Sanctum/" -Force
          Get-ChildItem "bin-sanctum/" -Filter "server.exe" -Recurse | Select-Object -First 1 | Copy-Item -Destination "$distRoot/Sanctum/" -Force
          Get-ChildItem "bin-sanctum/" -Filter "app.exe" -Recurse | Select-Object -First 1 | Copy-Item -Destination "$distRoot/Sanctum/" -Force
          
          # Source Tree Sync (Full Workspace)
          New-Item -ItemType Directory -Force -Path "Sanctum/target/release"
          Get-ChildItem "bin-sanctum/" -Filter "*" -Include "*.exe", "*.dll" -Recurse | Copy-Item -Destination "Sanctum/target/release/" -Force
          New-Item -ItemType Directory -Force -Path "Sanctum/driver/target/release"
          Get-ChildItem "bin-sanctum/" -Filter "sanctum.sys" -Recurse | Copy-Item -Destination "Sanctum/driver/target/release/" -Force

          # Malware Simulation (Test folder)
          $sanctumMalware = Get-ChildItem "bin-sanctum/" -Filter "malware.exe" -Recurse
          $sanctumMalware | Copy-Item -Destination "$distRoot/sanctum_test_malware/" -Force

          $elamHashFile = Get-ChildItem "bin-sanctum/" -Filter "sanctum_elam_hash.txt" -Recurse | Select-Object -First 1
          if ($elamHashFile) {
            $elamHash = (Get-Content $elamHashFile.FullName -Raw).Trim()
            Write-Host "Sanctum ELAM hash: $elamHash"
          }

          $sanctumLocks = Get-ChildItem "bin-sanctum/" -Filter "Cargo.lock" -Recurse
          $sanctumRootLock = $sanctumLocks | Where-Object { $_.FullName -notmatch '[\\/]driver[\\/]' } | Select-Object -First 1
          if ($sanctumRootLock) {
            Copy-Item $sanctumRootLock.FullName -Destination "Sanctum/Cargo.lock" -Force
          }

          $sanctumDriverLock = $sanctumLocks | Where-Object { $_.FullName -match '[\\/]driver[\\/]' } | Select-Object -First 1
          if ($sanctumDriverLock) {
            Copy-Item $sanctumDriverLock.FullName -Destination "Sanctum/driver/Cargo.lock" -Force
          }
          echo "elam_hash=$elamHash" >> $env:GITHUB_OUTPUT

          # Clean up artifact directories
          Write-Host "`n=== Cleaning up artifact directories ==="
          $artifactDirs = @(
            "bin-firewall-rust",
            "bin-hydradragonav",
            "bin-launcher",
            "bin-mbrfilter",
            "bin-megadumper",
            "bin-owlyshield-minifilter",
            "bin-owlyshield-rust",
            "bin-pyasprotection",
            "bin-reddbg",
            "bin-service",
            "bin-tinyantivirus",
            "bin-sanctum"
          )
          foreach ($dir in $artifactDirs) {
            if (Test-Path $dir) {
              Remove-Item -Path $dir -Recurse -Force
              Write-Host "Removed directory: $dir"
            }
          }

      - name: Check for publishable changes
        id: check_changes
        uses: ./.github/actions/check-publishable-changes
        with:
          paths: |
            hydradragon
            TinyAntivirus/x64/Release
            HydraDragonAV/x64/Release
            MBRFilter/x64/Release
            PYAS_Protection/x64/Release
            Owlyshield/owlyshield_minifilter/x64/Release
            Owlyshield/owlyshield_predict/target/release
            Owlyshield/RedDbg/RedDbg/x64/ReleaseX64Kernel
            MegaDumper/MegaDumper/bin/Release/net8.0
            HydraDragonFirewall/hydradragonfirewall/target/release
            HydraDragonLauncher/HydraDragonLauncher/bin/Release/net8.0
            HydraDragonService/HydraDragonService/bin/Release/net8.0
            Sanctum/target/release
            Sanctum/driver/target/release
            Sanctum/Cargo.lock
            Sanctum/driver/Cargo.lock

      - name: Clean up artifact branches
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $branches = @(
            "bin-firewall-rust",
            "bin-hydradragonav",
            "bin-launcher",
            "bin-mbrfilter",
            "bin-megadumper",
            "bin-owlyshield-minifilter",
            "bin-owlyshield-rust",
            "bin-pyasprotection",
            "bin-reddbg",
            "bin-service",
            "bin-tinyantivirus",
            "bin-sanctum"
          )
          foreach ($branch in $branches) {
            git push origin --delete $branch 2>$null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Deleted branch: $branch"
            }
          }

      - name: Create Pull Request
        if: steps.check_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(binaries): automated binary update"
          title: "Update Distribution Binaries"
          body: |
            Automated binary update from modular build pipeline.

            **Sanctum ELAM Hash:**
            - Driver To-Be-Signed Hash: `${{ steps.organize.outputs.elam_hash }}`
          add-paths: |
            ${{ steps.check_changes.outputs.publishable_files }}
          branch: ${{ github.event.inputs.branch || 'auto-update-binaries' }}
          base: ${{ github.ref_name }}
          delete-branch: true
          labels: binaries, automated-pr
