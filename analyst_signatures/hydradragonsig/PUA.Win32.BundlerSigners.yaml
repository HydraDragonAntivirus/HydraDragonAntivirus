rules:
- id: VK-PUA-TELAMON
  title: TelamonCleaner installer (Zone ADS SIA)
  description: Cleaner/optimizer installer signed by an ad-distribution company. Signer matched in the Authenticode certificate (ASN.1 string), not in arbitrary text.
  severity: medium
  verdict: pua
  confidence: 85
  score: 60
  family: PUA.Win32.TelamonCleaner
  tags:
  - analyst
  - pua
  logic: all
  conditions:
  - type: byte_pattern
    pattern: ( 0C | 13 ) 0C 5A 6F 6E 65 20 41 44 53 20 53 49 41
  - type: string_set
    values:
    - Inno Setup
    wide: true
