name: Publish Binaries (Multi-Job)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to create/update PR on"
        required: true
        default: "update-binaries"

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  WDK_URL: https://go.microsoft.com/fwlink/?linkid=2335869

jobs:
  # --- GROUP 1: MSBuild Projects (Separated) ---
  
  build-tinyantivirus:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
      - name: Build TinyAntivirus
        run: msbuild TinyAntivirus/TinyAntivirus.sln /p:Configuration=Release /p:Platform=x64
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: bin-tinyantivirus
          path: TinyAntivirus/x64/Release/TinyAvConsole.exe

  build-hydradragonav:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
      - name: Build HydraDragonAV
        run: msbuild HydraDragonAV/HydraDragonAV.sln /p:Configuration=Release /p:Platform=x64
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: bin-hydradragonav
          path: HydraDragonAV/x64/Release/HydraDragonAV.exe

  build-mbrfilter:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
      - name: Setup WDK
        shell: pwsh
        run: |
          $wdkSetupPath = "$Env:TEMP\wdksetup.exe"
          (New-Object Net.WebClient).DownloadFile('${{env.WDK_URL}}', $wdkSetupPath)
          Start-Process -FilePath $wdkSetupPath -ArgumentList "/quiet" -NoNewWindow -Wait
      - name: Build MBRFilter
        run: msbuild MBRFilter/MBRFilter.sln /p:Configuration=Release /p:Platform=x64
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: bin-mbrfilter
          path: MBRFilter/x64/Release/MBRFilter.sys

  build-pyasprotection:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
      - name: Setup WDK
        shell: pwsh
        run: |
          $wdkSetupPath = "$Env:TEMP\wdksetup.exe"
          (New-Object Net.WebClient).DownloadFile('${{env.WDK_URL}}', $wdkSetupPath)
          Start-Process -FilePath $wdkSetupPath -ArgumentList "/quiet" -NoNewWindow -Wait
      - name: Build PYAS Protection
        run: msbuild PYAS_Protection/PYAS_Protection.sln /p:Configuration=Release /p:Platform=x64
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: bin-pyasprotection
          path: |
            PYAS_Protection/x64/Release/SimplePYASProtection.sys
            PYAS_Protection/x64/Release/SimplePYASProtection.inf

  build-owlyshield-minifilter:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
      - name: Setup WDK
        shell: pwsh
        run: |
          $wdkSetupPath = "$Env:TEMP\wdksetup.exe"
          (New-Object Net.WebClient).DownloadFile('${{env.WDK_URL}}', $wdkSetupPath)
          Start-Process -FilePath $wdkSetupPath -ArgumentList "/quiet" -NoNewWindow -Wait
      - name: Build Owlyshield Minifilter
        run: msbuild Owlyshield/owlyshield_minifilter/owlyshield_minifilter.sln /p:Configuration=Release /p:Platform=x64
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: bin-owlyshield-minifilter
          path: Owlyshield/owlyshield_minifilter/x64/Release/RWatch.sys

  build-reddbg:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
      - name: Build RedDbg
        run: msbuild Owlyshield/RedDbg/RedDbg/RedDbg.sln /p:Configuration=Release /p:Platform=x64
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: bin-reddbg
          path: Owlyshield/RedDbg/RedDbg/x64/Release/RedDbg.exe

  # --- GROUP 2: Dotnet Projects (Separated) ---

  build-megadumper:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Publish MegaDumper
        run: dotnet publish MegaDumper/MegaDumper/MegaDumper.csproj -c Release -r win-x64 --self-contained false -o artifacts/
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: bin-megadumper
          path: artifacts/

  build-firewall-client:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Publish Firewall Client
        run: dotnet publish HydraDragonFirewall/HydraDragonClient/HydraDragonClient/HydraDragonClient.csproj -c Release -r win-x64 --self-contained false -o artifacts/
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: bin-firewall-client
          path: artifacts/

  build-launcher:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Publish Launcher
        run: dotnet publish HydraDragonLauncher/HydraDragonLauncher/HydraDragonLauncher.csproj -c Release -r win-x64 --self-contained false -o artifacts/
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: bin-launcher
          path: artifacts/

  build-service:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Publish Service
        run: dotnet publish HydraDragonService/HydraDragonService/HydraDragonService.csproj -c Release -r win-x64 --self-contained false -o artifacts/
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: bin-service
          path: artifacts/

  # --- GROUP 3: Rust Projects (Separated) ---

  build-owlyshield-rust:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install yasm
        run: choco install nasm yasm
      - name: Build Owlyshield Rust
        working-directory: Owlyshield/owlyshield_predict
        run: cargo build --release
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: bin-owlyshield-rust
          path: Owlyshield/owlyshield_predict/target/release/owlyshield_ransom.dll

  build-firewall-rust:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install Assembly Tools (yasm)
        run: choco install nasm yasm
      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Build UI (Leptos)
        working-directory: HydraDragonFirewall/hydradragonfirewall/ui
        run: trunk build --release -d ../dist
      - name: Build Firewall Rust
        working-directory: HydraDragonFirewall/hydradragonfirewall
        run: cargo build --release
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: bin-firewall-rust
          path: |
            HydraDragonFirewall/hydradragonfirewall/target/release/hydradragonfirewall.exe
            HydraDragonFirewall/hydradragonfirewall/target/release/hydradragonfirewall.dll
            HydraDragonFirewall/hydradragonfirewall/rules/rules.yaml

  build-sanctum:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
      - name: Install Cargo Make
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-make
      - name: Setup WDK
        shell: pwsh
        run: |
          $wdkSetupPath = "$Env:TEMP\wdksetup.exe"
          (New-Object Net.WebClient).DownloadFile('${{env.WDK_URL}}', $wdkSetupPath)
          Start-Process -FilePath $wdkSetupPath -ArgumentList "/quiet" -NoNewWindow -Wait
      - name: Build Sanctum
        working-directory: Sanctum
        run: |
          cd driver
          .\cert.ps1
          cargo make release
          .\sign.bat release
          cd ..
          cargo build --release -p sanctum_ppl_runner
          .\sign_ppl_runner.bat
          cargo make release
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: bin-sanctum
          path: |
            Sanctum/driver/target/release/sanctum_package/sanctum.sys
            Sanctum/target/release/sanctum_ppl_runner.exe
            Sanctum/target/release/elam_installer.exe
            Sanctum/target/release/um_engine.exe
            Sanctum/target/release/sanctum.dll

  # --- FINAL STAGE: Collect and PR ---

  stage-and-pr:
    needs: 
      - build-tinyantivirus
      - build-hydradragonav
      - build-mbrfilter
      - build-pyasprotection
      - build-owlyshield-minifilter
      - build-reddbg
      - build-megadumper
      - build-firewall-client
      - build-launcher
      - build-service
      - build-owlyshield-rust
      - build-firewall-rust
      - build-sanctum
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      
      - name: Download Artifacts
        uses: actions/download-artifact@v7
        with:
          path: downloaded-artifacts

      - name: Organize Binaries
        shell: pwsh
        run: |
          $distRoot = "hydradragon"
          New-Item -ItemType Directory -Force -Path "$distRoot/TinyAntivirus"
          New-Item -ItemType Directory -Force -Path "$distRoot/HydraDragonAV"
          New-Item -ItemType Directory -Force -Path "$distRoot/MBRFilter"
          New-Item -ItemType Directory -Force -Path "$distRoot/SimplePYASProtection"
          New-Item -ItemType Directory -Force -Path "$distRoot/Owlyshield"
          New-Item -ItemType Directory -Force -Path "$distRoot/Sanctum"
          New-Item -ItemType Directory -Force -Path "$distRoot/HydraDragonFirewall"
          New-Item -ItemType Directory -Force -Path "$distRoot/HydraDragonDumper"
          New-Item -ItemType Directory -Force -Path "$distRoot/HydraDragonLauncher"
          New-Item -ItemType Directory -Force -Path "$distRoot/HydraDragonService"
          New-Item -ItemType Directory -Force -Path "$distRoot/RedDbg"

          # Copy operations
          Copy-Item "downloaded-artifacts/bin-tinyantivirus/TinyAvConsole.exe" "$distRoot/TinyAntivirus/" -Force
          Copy-Item "downloaded-artifacts/bin-hydradragonav/HydraDragonAV.exe" "$distRoot/HydraDragonAV/" -Force
          Copy-Item "downloaded-artifacts/bin-mbrfilter/MBRFilter.sys" "$distRoot/MBRFilter/" -Force
          Copy-Item "downloaded-artifacts/bin-pyasprotection/*" "$distRoot/SimplePYASProtection/" -Force
          Copy-Item "downloaded-artifacts/bin-owlyshield-minifilter/RWatch.sys" "$distRoot/Owlyshield/" -Force
          Copy-Item "downloaded-artifacts/bin-reddbg/RedDbg.exe" "$distRoot/RedDbg/" -Force
          
          Copy-Item "downloaded-artifacts/bin-megadumper/*" "$distRoot/HydraDragonDumper/" -Recurse -Force
          if (Test-Path "$distRoot/HydraDragonDumper/MegaDumper.exe") {
            Move-Item "$distRoot/HydraDragonDumper/MegaDumper.exe" "$distRoot/HydraDragonDumper/HydraDragonDumper.exe" -Force
          }
          
          Copy-Item "downloaded-artifacts/bin-firewall-client/*" "$distRoot/HydraDragonFirewall/" -Recurse -Force
          Copy-Item "downloaded-artifacts/bin-launcher/*" "$distRoot/HydraDragonLauncher/" -Recurse -Force
          Copy-Item "downloaded-artifacts/bin-service/*" "$distRoot/HydraDragonService/" -Recurse -Force
          
          Copy-Item "downloaded-artifacts/bin-owlyshield-rust/owlyshield_ransom.dll" "$distRoot/Owlyshield/" -Force
          Copy-Item "downloaded-artifacts/bin-firewall-rust/*" "$distRoot/HydraDragonFirewall/" -Force
          Copy-Item "downloaded-artifacts/bin-sanctum/*" "$distRoot/Sanctum/" -Force

      - name: Check for Changes
        id: check_changes
        shell: pwsh
        run: |
          git add -A hydradragon/
          $status = git status --porcelain
          if ($null -eq $status -or $status -eq "") {
            echo "changed=false" >> $env:GITHUB_OUTPUT
            Write-Host "No changes detected."
          } else {
            echo "changed=true" >> $env:GITHUB_OUTPUT
            Write-Host "Changes detected."
          }

      - name: Create Pull Request
        if: steps.check_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(binaries): automated binary update"
          title: "🚀 Update Distribution Binaries"
          body: "Automated binary update from modular build pipeline."
          branch: ${{ github.event.inputs.branch || 'auto-update-binaries' }}
          base: ${{ github.ref_name }}
          delete-branch: true
          labels: binaries, automated-pr
