# HydraDragonFirewall SDK Rules
# This file uses YAML format with # comments allowed (Feature 17)

rules:
  # Block Telegram Bot Exfiltration
  - name: "Block Telegram Bots"
    description: "Prevents data exfiltration via Telegram bots when JSON is sent"
    enabled: true
    protocol: https
    action: ask
    condition_logic: and
    domain:
      domains:
        - "api.telegram.org"
      case_insensitive: true
    url:
      patterns:
        - "*/bot*/sendMessage*"
        - "*/bot*/sendDocument*"
    json_match:
      key: "chat_id"
      # Empty value intentionally means any value for this key in the current SDK matcher.
      value: ""

  # Block Discord Webhook Exfiltration (Features 12, 13, 19, 29, 30)
  - name: "Block Discord Webhooks"
    description: "Prevents data exfiltration via Discord webhooks when JSON is sent"
    enabled: true
    protocol: https
    action: ask
    condition_logic: and
    domain:
      domains:
        - "discord.com"
        - "*.discord.com"
        - "discordapp.com"
        - "*.discordapp.com"
      case_insensitive: true
    url:
      patterns:
        - "*/api/webhooks/*"
    json_match:
      key: "content"
      # Empty value intentionally means any value for this key in the current SDK matcher.
      value: ""



  # Monitor Local Network Traffic (Features 8, 21, 25, 26)
  - name: "Ask Local Network Access"
    description: "Prompts user when accessing local network"
    enabled: true
    protocol: tcp
    action: ask
    localhost_type: all
    dst_port:
      ports: [80, 443, 8080, 22, 3389]

  # Ask About Local Traffic Interception
  - name: "Ask About Local Traffic Interception"
    description: "Prompts when traffic appears to be redirected through a local inspection or interception proxy. This can be intentional security software or another local interceptor."
    enabled: true
    protocol: tcp
    action: ask
    condition_logic: and
    localhost_type: loopback
    dst_port:
      ports: [8080, 8081, 8118, 8443, 8888, 8889, 8899, 3128, 8000, 8001, 8090, 9090]

  # Detect Base64 Encoded PowerShell (Features 2, 6, 15, 18)
  - name: "Detect Encoded PowerShell"
    description: "Detects base64-encoded PowerShell commands in traffic"
    enabled: true
    protocol: any
    action: traffic_attack
    encoding: base64
    regex:
      pattern: "powershell.*-enc"
      case_insensitive: true

  # Block Suspicious File Downloads (Features 14, 19)
  - name: "Block EXE Downloads"
    description: "Blocks downloading of executable files"
    enabled: false
    protocol: any
    action: block
    file_type:
      file_types:
        - "exe"
        - "dll"
        - "scr"
        - "bat"
        - "cmd"

  # Monitor Traffic Routine (Feature 27)
  - name: "Monitor Gateway Traffic"
    description: "Watch traffic going through the gateway"
    enabled: true
    protocol: any
    action: allow
    routine:
      from_ip: "any"
      to_ip: "192.168.1.1"
      to_port: 53

  # Hex Content Detection (Feature 4)
  - name: "Detect Hex Encoded Payload"
    description: "Detects hex-encoded payloads in HTTP traffic"
    enabled: false
    protocol: http
    action: traffic_attack
    encoding: hex
    conditions:
      - pattern: "malware_signature"
        encoding: hex


  # Ask To Block High Entropy Exfiltration (Feature 32)
  - name: "Ask To Block Encrypted Exfiltration"
    description: "Ask to block high-entropy outbound traffic which often indicates encrypted stealing/C2 activity"
    enabled: false
    protocol: any
    action: ask
    entropy_threshold: 7.95
