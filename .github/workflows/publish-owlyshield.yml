name: Publish Owlyshield

on:
  push:
    branches: ["**"]
    paths:
      - 'Owlyshield/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-stage:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      
      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        
      - name: Setup WDK
        shell: pwsh
        run: |
          $wdkSetupPath = "$Env:TEMP\wdksetup.exe"
          (New-Object Net.WebClient).DownloadFile('https://go.microsoft.com/fwlink/?linkid=2335869', $wdkSetupPath)
          Start-Process -FilePath $wdkSetupPath -ArgumentList "/quiet" -NoNewWindow -Wait
          
      - name: Build Minifilter
        run: msbuild Owlyshield/owlyshield_minifilter/RWatch.sln /p:Configuration=Release /p:Platform=x64
        
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install nasm
        run: choco install nasm
      - name: Build Rust Core
        working-directory: Owlyshield/owlyshield_predict
        run: cargo build --release
        
      - name: Build RedDbg (Driver Only)
        run: msbuild Owlyshield/RedDbg/RedDbg/RedDbg.sln /p:Configuration=Release /p:Platform=x64
        
      - name: Stage
        shell: pwsh
        run: |
          $distRoot = "hydradragon"
          $owlyRansom = "$distRoot/Owlyshield/OwlyshieldRansomFilter"
          $owlyService = "$distRoot/Owlyshield/Owlyshield Service"
          $redDbg = "$distRoot/Owlyshield/RedDbg"
          
          # Create folders
          New-Item -ItemType Directory -Force -Path $owlyRansom
          New-Item -ItemType Directory -Force -Path $owlyService
          New-Item -ItemType Directory -Force -Path $redDbg
          
          # Copy Minifilter (Driver)
          Copy-Item "Owlyshield/owlyshield_minifilter/x64/Release/*.sys" "$owlyRansom/" -Force
          Copy-Item "Owlyshield/owlyshield_minifilter/x64/Release/*.inf" "$owlyRansom/" -Force
          Copy-Item "Owlyshield/owlyshield_minifilter/x64/Release/*.cat" "$owlyRansom/" -Force
          
          # Copy Rust Service
          Copy-Item "Owlyshield/owlyshield_predict/target/release/owlyshield_ransom.exe" "$owlyService/" -Force
          
          # Copy RedDbg (Driver Only)
          Copy-Item "Owlyshield/RedDbg/RedDbg/x64/ReleaseX64Kernel/*.sys" "$redDbg/" -Force
          Copy-Item "Owlyshield/RedDbg/RedDbg/x64/ReleaseX64Kernel/*.inf" "$redDbg/" -Force
          Copy-Item "Owlyshield/RedDbg/RedDbg/x64/ReleaseX64Kernel/*.cat" "$redDbg/" -Force
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: owlyshield-release-binaries
          path: hydradragon/Owlyshield/
          if-no-files-found: error

      - name: Create PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(binaries): automated owlyshield binary update"
          title: "🚀 Update Owlyshield Binaries"
          body: "Automated update for Owlyshield Ransom Filter, Service, and RedDbg drivers."
          branch: "auto-update-owlyshield"
          base: ${{ github.ref_name }}
          delete-branch: true
          labels: binaries, automated-pr
