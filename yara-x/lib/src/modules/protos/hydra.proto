syntax = "proto2";

import "yara.proto";

package yara.hydra;

option (yara.module_options) = {
  name: "hydra"
  root_message: "Hydra"
  rust_module: "hydra"
  cargo_feature: "hydra-module"
};

// Per-section raw telemetry
message Section {
  optional string name = 1;
  optional double entropy = 2;
  optional uint32 raw_size = 3;
  optional uint32 virtual_size = 4;
  optional uint32 characteristics = 5;
}

// PE ML feature vector — ALL raw values, zero decisions
message PeMl {
  // Optional Header (raw passthrough)
  optional uint32 size_of_optional_header = 1;
  optional uint32 major_linker_version = 2;
  optional uint32 minor_linker_version = 3;
  optional uint32 size_of_code = 4;
  optional uint32 size_of_initialized_data = 5;
  optional uint32 size_of_uninitialized_data = 6;
  optional uint32 address_of_entry_point = 7;
  optional uint32 base_of_code = 8;
  optional uint32 base_of_data = 9;
  optional uint64 image_base = 10;
  optional uint32 section_alignment = 11;
  optional uint32 file_alignment = 12;
  optional uint32 major_operating_system_version = 13;
  optional uint32 minor_operating_system_version = 14;
  optional uint32 major_image_version = 15;
  optional uint32 minor_image_version = 16;
  optional uint32 major_subsystem_version = 17;
  optional uint32 minor_subsystem_version = 18;
  optional uint32 size_of_image = 19;
  optional uint32 size_of_headers = 20;
  optional uint32 check_sum = 21;
  optional uint32 subsystem = 22;
  optional uint32 dll_characteristics = 23;
  optional uint64 size_of_stack_reserve = 24;
  optional uint64 size_of_stack_commit = 25;
  optional uint64 size_of_heap_reserve = 26;
  optional uint64 size_of_heap_commit = 27;
  optional uint32 loader_flags = 28;
  optional uint32 number_of_rva_and_sizes = 29;

  // Derived properties (raw computed values)
  optional double entropy = 30;
  optional uint32 overlay_size = 31;
  optional double overlay_entropy = 32;
  
  // Raw counts
  optional uint32 imports_count = 33;
  optional uint32 exports_count = 34;
  optional uint32 resources_count = 35;
  optional uint32 debug_count = 36;
  optional uint32 sections_count = 37;
  optional uint32 tls_callbacks_count = 38;
  optional uint32 delay_imports_count = 39;
  optional uint32 bound_imports_count = 40;
  optional uint32 certificates_count = 41;

  // Entry Point disassembly raw counts
  optional uint32 ep_instructions_count = 42;
  optional uint32 ep_jump_count = 43;
  optional uint32 ep_call_count = 44;
  optional uint32 ep_ret_count = 45;
  optional uint32 ep_nop_count = 46;
  optional uint32 ep_cpuid_count = 47;
  optional uint32 ep_rdtsc_count = 48;

  // Last section raw characteristics
  optional uint32 last_section_characteristics = 49;

  // CFG raw counters (all code sections)
  optional uint32 cfg_total_instructions = 50;
  optional uint32 cfg_jump_count = 51;
  optional uint32 cfg_call_count = 52;
  optional uint32 cfg_ret_count = 53;

  // Rich Header raw data
  optional uint32 rich_header_entries_count = 54;
  optional uint32 rich_header_xor_key = 55;
}

// Emulation telemetry — raw output from Unicorn
message EmulationTelemetry {
  optional uint32 executed_instructions = 1;
  optional uint32 eax_final = 2;
  optional uint32 ebx_final = 3;
  optional uint32 ecx_final = 4;
  optional uint32 edx_final = 5;
}

// PE container
message Pe {
  repeated Section sections = 1;
  optional PeMl ml = 2;
  optional EmulationTelemetry emulation = 3;
  repeated string import_dlls = 4;
  repeated string import_functions = 5;
}

// JS ML feature vector — ALL raw counts, zero decisions
message JsMl {
  optional uint32 file_size = 1;
  optional double entropy = 2;
  
  // Token counts
  optional uint32 function_count = 3;
  optional uint32 variable_declarations = 4;
  optional uint32 eval_count = 5;
  optional uint32 try_catch_count = 6;
  optional uint32 loop_count = 7;
  optional uint32 conditional_count = 8;
  
  // Encoding counts
  optional uint32 hex_escape_count = 9;
  optional uint32 unicode_escape_count = 10;
  optional uint32 base64_candidate_count = 11;
  optional uint32 fromcharcode_count = 12;
  
  // API counts
  optional uint32 eval_call_count = 13;
  optional uint32 wscript_shell_count = 14;
  optional uint32 activex_count = 15;
  optional uint32 adodb_stream_count = 16;
  optional uint32 http_reference_count = 17;
  optional uint32 xmlhttprequest_count = 18;
  optional uint32 fetch_count = 19;
  
  // Identifier analysis (raw)
  optional uint32 high_entropy_identifiers_count = 20;
  optional double avg_identifier_entropy = 21;
  optional uint32 total_lines = 22;
}

// JS container
message Js {
  optional JsMl ml = 1;
}

// Root
message Hydra {
  optional Pe pe = 1;
  optional Js js = 2;
}
